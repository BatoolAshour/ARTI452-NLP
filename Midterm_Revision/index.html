  essays: [
    E('Define & explain', `Define a neural unit and explain how it computes its output. Work through the lecture's example and explain the unit's relationship to logistic regression.`, `عرّف الوحدة العصبية واشرح كيف تحسب مخرجها، واحسب مثال المحاضرة، واشرح علاقتها بالانحدار اللوجستي.`, 8,
      `<p><b>Definition.</b> A neural unit computes a weighted sum of its inputs, adds a bias, and applies an activation function.</p><ol><li><b>Weighted sum:</b> multiply each input xᵢ by its weight wᵢ, add the products and the bias b to get the score z = wᵀx + b.</li><li><b>Non-linear transform:</b> an activation function, such as the sigmoid σ(z) = 1/(1 + e⁻ᶻ), maps z to the output a.</li><li><b>Output:</b> a is passed to the next layer or used as the final prediction.</li></ol><p><b>Example.</b> x = [2, 1]ᵀ, w = [0.5, −1]ᵀ, b = 0.1. z = 0.5(2) + (−1)(1) + 0.1 = 0.1. a = 1/(1 + e⁻⁰·¹) ≈ 0.5250.</p><p><b>Relationship to logistic regression.</b> A single unit with a sigmoid activation is exactly the logistic regression model from Week 4. Neural networks use much of the same mathematics but combine many units into layers, which makes them more powerful classifiers and lets them learn their own features instead of relying on hand-designed ones. A hidden activation is a learned feature; its value alone is not a class probability.</p>`,
      `<p><b>التعريف.</b> الوحدة العصبية تحسب مجموعًا موزونًا لمدخلاتها وتضيف انحيازًا وتطبق دالة تنشيط.</p><ol><li><b>المجموع الموزون:</b> z = wᵀx + b.</li><li><b>التحويل غير الخطي:</b> دالة تنشيط مثل السينية تحوّل z إلى a.</li><li><b>المخرج:</b> يُمرَّر للطبقة التالية أو يكون التنبؤ النهائي.</li></ol><p><b>المثال.</b> z = 1 − 1 + 0.1 = 0.1، وa ≈ 0.5250.</p><p><b>العلاقة بالانحدار اللوجستي.</b> وحدة واحدة بتنشيط سيني هي الانحدار اللوجستي نفسه. والشبكات تجمع وحدات كثيفة في طبقات فتصبح أقوى وتتعلم خصائصها بنفسها. والتنشيط المخفي خاصية متعلَّمة وليس احتمال فئة.</p>`,
      [[`Weighted sum + bias + activation`, `المجموع والانحياز والتنشيط`], [`z = 0.1, a ≈ 0.5250`, `القيم الصحيحة`], [`One sigmoid unit = logistic regression`, `وحدة سينية = انحدار لوجستي`], [`Networks learn features`, `الشبكات تتعلم الخصائص`]],
      `Definition 3 · Example 3 · Relation 2`),
    E('Compare & contrast', `Why do neural networks need non-linear activation functions? Compare sigmoid, tanh and ReLU.`, `لماذا تحتاج الشبكات العصبية دوال تنشيط غير خطية؟ قارن بين sigmoid وtanh وReLU.`, 8,
      `<p><b>Why.</b> An activation function is a non-linear function applied to a unit's score z. Without it, a layer computes only a weighted sum plus a bias, an affine transformation, and stacked affine layers still reduce to a single affine transformation. So a deep network without activations is no more powerful than one linear layer. The activation adds the nonlinearity that lets a network model complex patterns, such as XOR.</p><table><tr><th>Function</th><th>Definition</th><th>Range</th><th>Common role</th></tr><tr><td>Sigmoid</td><td>1/(1 + e⁻ᶻ)</td><td>(0, 1)</td><td>Binary output or an LSTM gate</td></tr><tr><td>tanh</td><td>(eᶻ − e⁻ᶻ)/(eᶻ + e⁻ᶻ)</td><td>(−1, 1)</td><td>RNN state or LSTM candidate</td></tr><tr><td>ReLU</td><td>max(0, z)</td><td>[0, ∞)</td><td>Feedforward hidden layer</td></tr></table><p><b>Behaviour.</b> Sigmoid and tanh can <b>saturate</b> for large absolute inputs: outputs get extremely close to their limits and derivatives get close to 0, which can make error signals vanish during backpropagation (the textbook excerpt on slide 11 calls this the vanishing gradient problem). ReLU returns 0 for negative inputs and the input itself for positive inputs; its derivative is 1 for large z, so it does not saturate there.</p>`,
      `<p><b>السبب.</b> دون تنشيط تحسب الطبقة تحويلًا تآلفيًّا، والطبقات التآلفية المتراكبة تبقى تحويلًا واحدًا، فالشبكة العميقة دون تنشيط لا تفوق طبقة خطية واحدة. التنشيط يضيف اللاخطية لنمذجة أنماط معقدة مثل XOR.</p><table><tr><th>الدالة</th><th>التعريف</th><th>المدى</th><th>الدور</th></tr><tr><td>Sigmoid</td><td>1/(1 + e⁻ᶻ)</td><td>(0, 1)</td><td>مخرج ثنائي أو بوابة</td></tr><tr><td>tanh</td><td>—</td><td>(−1, 1)</td><td>حالة RNN أو مرشح LSTM</td></tr><tr><td>ReLU</td><td>max(0, z)</td><td>[0, ∞)</td><td>طبقة مخفية أمامية</td></tr></table><p><b>السلوك.</b> السينية وtanh قد تتشبعان عند القيم الكبيرة فتقترب مشتقاتهما من صفر وتتلاشى إشارة الخطأ، أما ReLU فيعيد 0 للسالب والقيمة نفسها للموجب ومشتقته 1 للقيم الكبيرة.</p>`,
      [[`Affine layers collapse without activation`, `انهيار الطبقات التآلفية`], [`Three definitions and ranges`, `التعريفات الثلاثة والمدى`], [`Typical roles`, `الأدوار المعتادة`], [`Saturation vs ReLU`, `التشبع مقابل ReLU`]],
      `Why 3 · Table 3 · Saturation 2`),
    E('Explain how & why', `Explain why a single perceptron cannot compute XOR and how a hidden layer solves the problem.`, `اشرح لماذا لا تستطيع وحدة perceptron واحدة حساب XOR وكيف تحل الطبقة المخفية المشكلة.`, 10,
      `<p><b>Perceptron.</b> A very simple neural unit with a binary output (0/1) and no non-linear activation. With weights 1 and 1 and bias −1, it computes AND (only (1,1) gives 1 + 1 − 1 &gt; 0). With bias 0, the same unit computes OR.</p><p><b>Linear classifier.</b> For two inputs, w₁x₁ + w₂x₂ + b = 0 is the equation of a line: a decision boundary. Inputs on one side give 0, on the other side give 1.</p><p><b>XOR.</b> XOR is 1 when exactly one input is 1: (0,1) and (1,0) → 1; (0,0) and (1,1) → 0. The positive points lie on opposite corners, so no single straight line separates them: XOR is not linearly separable. Therefore one perceptron cannot compute it (Minsky and Papert, 1969).</p><p><b>Hidden-layer solution.</b> Let s = x₁ + x₂, h₁ = ReLU(s), h₂ = ReLU(s − 1), y = h₁ − 2h₂.</p><table><tr><th>x₁</th><th>x₂</th><th>s</th><th>h₁</th><th>h₂</th><th>y</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>2</td><td>2</td><td>1</td><td>0</td></tr></table><p>The hidden units re-represent the input so the output becomes a simple combination. This shows that a non-linear hidden layer can model interactions that one linear boundary cannot. It is a hand-built demonstration, not a trained probabilistic classifier.</p>`,
      `<p><b>Perceptron.</b> وحدة بسيطة مخرجها ثنائي ودون تنشيط غير خطي. بأوزان 1 و1 وانحياز −1 تحسب AND، وبانحياز 0 تحسب OR.</p><p><b>مصنف خطي.</b> المعادلة لمدخلين خط مستقيم هو حد القرار.</p><p><b>XOR.</b> يساوي 1 عندما يكون مدخل واحد فقط 1، والنقاط الموجبة في زاويتين متقابلتين فلا يفصلها خط واحد: غير قابل للفصل خطيًّا.</p><p><b>الحل.</b> s = x₁ + x₂ وh₁ = ReLU(s) وh₂ = ReLU(s − 1) وy = h₁ − 2h₂ يعطي 0، 1، 1، 0. الوحدات المخفية تعيد تمثيل المدخل، فالطبقة غير الخطية تنمذج ما لا يستطيعه حد خطي واحد. وهو مثال مبني يدويًّا لا مصنف مدرَّب.</p>`,
      [[`Perceptron definition; AND/OR weights`, `تعريف perceptron وAND/OR`], [`Line = decision boundary (linear)`, `الخط حد القرار`], [`XOR not linearly separable`, `XOR غير قابل للفصل خطيًّا`], [`Hidden-layer construction table`, `جدول البناء المخفي`], [`Conclusion about nonlinearity`, `الخلاصة`]],
      `Perceptron 2 · Linearity 2 · XOR 2 · Hidden layer 3 · Conclusion 1`),
    E('Explain how & why', `Explain how words become inputs to a neural network. Describe the embedding layer and compare mean pooling with concatenation for building the context vector.`, `اشرح كيف تصبح الكلمات مدخلات للشبكة العصبية، وصف طبقة التضمين، وقارن بين المتوسط والضم في بناء متجه السياق.`, 8,
      `<p><b>Embedding layer.</b> A trainable table E with V rows and d columns. Each token ID selects one row, and that row (transposed to a column vector e) is the token's vector. IDs are categorical addresses: ID 12 is not semantically twice ID 6. Multiplying Eᵀ by a one-hot vector gives the same result as direct lookup: with E rows I = [1,0], like = [0,1], NLP = [1,1], Eᵀq_like = [0, 1]ᵀ. Training can update the selected vectors along with the network; E can be randomly initialised, pretrained and fine-tuned, or pretrained and frozen.</p><p><b>Context vector.</b> The context vector x joins the embeddings of the context tokens into one fixed-size input.</p><ul><li><b>Mean pooling:</b> mean(e_I, e_like) = [0.5, 0.5]ᵀ. It gives a fixed-size vector but ignores order: "like I" gives the same vector.</li><li><b>Concatenation:</b> [e_I; e_like] = [1, 0, 0, 1]ᵀ. It preserves the positions in a fixed context window: reversing the tokens gives [0, 1, 1, 0]ᵀ.</li></ul><p>The feedforward neural LM uses concatenation, so x has size kd (here 4 × 1), and the same embedding table serves every context position.</p>`,
      `<p><b>طبقة التضمين.</b> جدول قابل للتدريب E بحجم V × d، وكل رقم يختار صفًّا هو متجه الرمز. الأرقام عناوين فئوية (12 ليس ضعف 6). وضرب Eᵀ في متجه one-hot يعطي نتيجة البحث المباشر نفسها: Eᵀq_like = [0, 1]. ويمكن تحديث المتجهات أثناء التدريب، أو تهيئتها مسبقًا وضبطها، أو تجميدها.</p><p><b>متجه السياق.</b> يجمع تضمينات السياق في مدخل ثابت الحجم.</p><ul><li><b>المتوسط:</b> [0.5, 0.5] ثابت الحجم لكنه يتجاهل الترتيب.</li><li><b>الضم:</b> [1, 0, 0, 1] يحفظ المواضع، وعكس الرموز يعطي [0, 1, 1, 0].</li></ul><p>النموذج الأمامي يستخدم الضم فيكون حجم x = kd.</p>`,
      [[`E is V × d; ID selects a row`, `E وحجمه واختيار الصف`], [`IDs are categorical`, `الأرقام فئوية`], [`One-hot × E = lookup`, `one-hot × E = بحث`], [`Mean pooling ignores order`, `المتوسط يتجاهل الترتيب`], [`Concatenation keeps positions`, `الضم يحفظ المواضع`]],
      `Embedding layer 4 · Pooling vs concatenation 4`),
    E('Describe & discuss', `Explain why next-token prediction is a classification task and why training is self-supervised. Describe the architecture and dimensions of a fixed-window feedforward neural language model.`, `اشرح لماذا يُعد التنبؤ بالرمز التالي مهمة تصنيف ولماذا يكون التدريب ذاتي الإشراف، وصف بنية وأبعاد نموذج اللغة العصبي الأمامي ذي النافذة الثابتة.`, 10,
      `<p><b>Classification.</b> Next-token prediction is multiclass classification: the input is the context (e.g. "I like") and the classes are all V words of the vocabulary; the model outputs one probability per word. Unlike n-gram models that estimate these from counts, a neural LM learns them with a classifier, so V sets the size of its output layer.</p><p><b>Self-supervised.</b> The text supplies its own targets. From "I like NLP": context (&lt;BOS&gt;, &lt;BOS&gt;) → I; (&lt;BOS&gt;, I) → like; (I, like) → NLP; (like, NLP) → &lt;EOS&gt;. No human labels are needed. Padding is excluded from the scored loss.</p><p><b>Architecture.</b> A feedforward neural LM predicts the next token from the concatenated embeddings of the previous k tokens: (1) retrieve each context embedding from E; (2) concatenate into x; (3) hidden layer h = ReLU(Wx + b_h); (4) logits z = Uh + b_o; (5) p = softmax(z).</p><p><b>Dimensions</b> (V = 3, d = 2, k = 2, H = 2): E is V × d (3 × 2); x is kd × 1 (4 × 1); W is H × kd (2 × 4) and b_h is H × 1; h is H × 1; U is V × H (3 × 2) and b_o is V × 1; z and p are V × 1 (3 × 1).</p><p><b>Limitation.</b> It cannot use evidence outside the k-token window; widening the window enlarges x and W.</p>`,
      `<p><b>التصنيف.</b> التنبؤ بالرمز التالي تصنيف متعدد: المدخل السياق والفئات كلمات المفردات V، ويعطي احتمالًا لكل كلمة، فيحدد V حجم طبقة المخرجات.</p><p><b>ذاتي الإشراف.</b> النص يوفر أهدافه: (&lt;BOS&gt;, &lt;BOS&gt;) ← I، ثم like، ثم NLP، ثم &lt;EOS&gt;، دون وسوم بشرية، ويُستبعد الحشو.</p><p><b>البنية.</b> (1) استرجاع التضمينات، (2) الضم في x، (3) h = ReLU(Wx + b_h)، (4) z = Uh + b_o، (5) p = softmax(z).</p><p><b>الأبعاد</b>: E بحجم 3×2، وx بحجم 4×1، وW بحجم 2×4، وh بحجم 2×1، وU بحجم 3×2، وz وp بحجم 3×1.</p><p><b>القيد.</b> لا يستخدم أدلة خارج النافذة، وتوسيعها يكبّر x وW.</p>`,
      [[`Classes = vocabulary; V sets output size`, `الفئات = المفردات`], [`Self-supervised target table`, `جدول الأهداف الذاتية`], [`Five-step architecture with formulas`, `البنية بالصيغ`], [`Correct shapes`, `الأبعاد الصحيحة`], [`Window limitation`, `قيد النافذة`]],
      `Classification 2 · Self-supervision 2 · Architecture 3 · Dimensions 2 · Limitation 1`),
    E('Explain how & why', `Using the lecture's parameters (x = [1,0,0,1]ᵀ, W = [[1,0,0,1],[0,1,1,0]], b_h = [−1, 1]ᵀ, U = [[0,0],[1,0],[1,1]], b_o = 0, vocabulary [I, like, NLP]), perform the forward pass, find the predicted token and compute the cross-entropy loss for the target NLP.`, `باستخدام معاملات المحاضرة، نفّذ التمرير الأمامي وحدد الرمز المتوقع واحسب خسارة الإنتروبيا المتقاطعة للهدف NLP.`, 12,
      `<p><b>Step 1: hidden layer.</b> Wx: row 1 = 1·1 + 0 + 0 + 1·1 = 2; row 2 = 0 + 0 + 0 + 0 = 0. Add b_h: [2 − 1, 0 + 1] = [1, 1]. ReLU keeps positive values: h = [1, 1]ᵀ.</p><p><b>Step 2: logits.</b> z = Uh + b_o: row 1 [0, 0]·[1, 1] = 0; row 2 [1, 0]·[1, 1] = 1; row 3 [1, 1]·[1, 1] = 2. z = [0, 1, 2]ᵀ. Logits are unnormalised scores; they may be negative and need not sum to 1.</p><p><b>Step 3: softmax.</b> e⁰ = 1, e¹ = 2.7183, e² = 7.3891; shared denominator 11.1073. p ≈ [0.0900, 0.2447, 0.6652] for [I, like, NLP]. The prediction is <b>NLP</b> (highest probability ≈ 0.6652). The unrounded probabilities sum to 1.</p><p><b>Step 4: cross-entropy.</b> y is one-hot at NLP, so L = −Σ yᵢ ln pᵢ = −ln(0.6652) ≈ <b>0.4076 nats</b>. If the target were I, the loss would be −ln(0.0900) ≈ 2.4076 nats: a lower probability for the true token gives a larger loss.</p><p><b>Next step (training).</b> The logit gradient is p − y = [0.0900, 0.2447, −0.3348]; with η = 0.1 the output bias becomes ≈ [−0.0090, −0.0245, 0.0335], raising the correct token's score.</p>`,
      `<p><b>الخطوة 1.</b> Wx = [2, 0]، ومع الانحياز [1, 1]، وReLU يعطي h = [1, 1].</p><p><b>الخطوة 2.</b> z = Uh = [0, 1, 2]، وهي نتائج غير مطبّعة.</p><p><b>الخطوة 3.</b> e⁰ + e¹ + e² = 11.1073، فـ p ≈ [0.0900, 0.2447, 0.6652]، والتنبؤ <b>NLP</b>.</p><p><b>الخطوة 4.</b> L = −ln(0.6652) ≈ <b>0.4076</b> نات، ولو كان الهدف I لكانت ≈ 2.4076.</p><p><b>الخطوة التالية.</b> تدرج logit = p − y = [0.0900, 0.2447, −0.3348]، ومع η = 0.1 يصبح انحياز المخرج ≈ [−0.0090, −0.0245, 0.0335].</p>`,
      [[`Wx + b_h = [1,1]; ReLU`, `الطبقة المخفية`], [`z = [0, 1, 2]`, `logits`], [`Softmax values with denominator`, `قيم softmax`], [`Prediction NLP`, `التنبؤ NLP`], [`Loss 0.4076 (and 2.4076 for I)`, `الخسارة`]],
      `Hidden 3 · Logits 2 · Softmax 3 · Prediction 1 · Loss 3`),
    E('Define & explain', `Define cross-entropy loss. Explain why it uses the negative log, and how it connects to maximum likelihood.`, `عرّف خسارة الإنتروبيا المتقاطعة، واشرح لماذا تستخدم سالب اللوغاريتم، وكيف ترتبط بأقصى احتمالية.`, 6,
      `<p><b>Definition.</b> Cross-entropy loss is the negative log of the probability the model assigns to the observed next token: L = −Σᵢ yᵢ ln pᵢ. Because the target y is one-hot (1 at the observed token, 0 elsewhere), the other terms vanish and L = −ln p_target.</p><p><b>Why the negative log.</b></p><ul><li>Probabilities lie between 0 and 1, so ln p ≤ 0; the minus sign makes the loss non-negative.</li><li>L = 0 when p = 1 (perfect confidence in the right token).</li><li>L grows without limit as p → 0, so a confident wrong prediction is heavily penalised: p = 0.9 → 0.105; 0.6 → 0.511; 0.3 → 1.204; 0.05 → 2.996.</li></ul><p><b>Units.</b> With ln, the loss is in nats; with log₂, in bits.</p><p><b>Maximum likelihood.</b> The likelihood of the training data is the product of the true-token probabilities. Taking −log turns the product into a sum of losses, so maximising the likelihood is the same as minimising the cross-entropy loss. Averaging the loss over a sequence gives mean cross-entropy, whose exponential is perplexity.</p>`,
      `<p><b>التعريف.</b> سالب لوغاريتم الاحتمال المعطى للرمز المرصود: L = −Σ yᵢ ln pᵢ = −ln p_target لأن y أحادي الساخن.</p><p><b>سبب سالب اللوغاريتم.</b></p><ul><li>الاحتمالات بين 0 و1 فلوغاريتمها ≤ 0، والسالب يجعل الخسارة موجبة.</li><li>L = 0 عندما p = 1.</li><li>L تكبر بلا حد عندما p ← 0، فيُعاقب التنبؤ الخاطئ الواثق: 0.9 ← 0.105، 0.05 ← 2.996.</li></ul><p><b>الوحدات.</b> نات مع ln وبت مع log₂.</p><p><b>أقصى احتمالية.</b> الاحتمالية حاصل ضرب احتمالات الرموز الصحيحة، و−log يحوّل الضرب إلى جمع خسائر، فتعظيم الاحتمالية = تقليل الخسارة، ومتوسطها أُسّه الحيرة.</p>`,
      [[`Definition; one-hot simplifies to −ln p`, `التعريف`], [`0 at p = 1, ∞ as p → 0 (table)`, `السلوك والجدول`], [`Nats vs bits`, `الوحدات`], [`Max likelihood = min loss`, `أقصى احتمالية`]],
      `Definition 2 · Negative log 2 · Units 0.5 · Likelihood 1.5`),
    E('Explain how & why', `Explain how a neural language model is trained: forward pass, loss, backpropagation (chain rule) and gradient descent. Include the output-gradient update from the worked example.`, `اشرح كيف يُدرَّب نموذج اللغة العصبي: التمرير الأمامي، والخسارة، والانتشار العكسي (قاعدة السلسلة)، والانحدار التدريجي، مع تحديث تدرج المخرج من المثال.`, 10,
      `<ol><li><b>Forward pass:</b> look up E, form x, compute h and the logits, then probabilities p.</li><li><b>Loss:</b> compare p with the observed next token using cross-entropy.</li><li><b>Backpropagation:</b> a neural network is a composition of functions, so derivatives use the chain rule. The loss is computed only at the output, so backpropagation applies the chain rule backwards through the network to obtain the derivative of the loss for every weight in every layer (Rumelhart, Hinton and Williams, 1986). For one sigmoid unit: dL/dwᵢ = (dL/da)(da/dz)(dz/dwᵢ). For logistic regression this gives ∂L/∂wⱼ = [σ(w·x + b) − y]xⱼ.</li><li><b>Gradient descent (optimiser step):</b> w(t+1) = w(t) − η dL/dw: move each weight opposite to its gradient, scaled by the learning rate η. Update E, W, U and the biases, then repeat on more training text.</li></ol><p><b>Worked update.</b> For softmax with one-hot cross-entropy, ∂L/∂zⱼ = pⱼ − yⱼ. With p = [0.0900, 0.2447, 0.6652] and target NLP: ∇_z L = [0.0900, 0.2447, −0.3348]. Updating only the output bias with η = 0.1: b_o = [0,0,0] − 0.1 × [0.0900, 0.2447, −0.3348] ≈ [−0.0090, −0.0245, 0.0335]. The correct token's bias increases by about 0.0335 and the others decrease, so next time NLP gets a higher probability.</p><p><b>Notes.</b> Frozen embeddings remain fixed; shared embeddings and weights receive learning signals from every example that uses them.</p>`,
      `<ol><li><b>التمرير الأمامي:</b> البحث في E، وتكوين x، وحساب h وlogits ثم p.</li><li><b>الخسارة:</b> مقارنة p بالرمز المرصود بالإنتروبيا المتقاطعة.</li><li><b>الانتشار العكسي:</b> الشبكة تركيب دوال فتُستخدم قاعدة السلسلة، وتُطبَّق للخلف من المخرج للحصول على مشتقة كل وزن. وللانحدار اللوجستي: [σ(w·x + b) − y]xⱼ.</li><li><b>الانحدار التدريجي:</b> w(t+1) = w(t) − η dL/dw، لكل من E وW وU والانحيازات، ثم التكرار.</li></ol><p><b>التحديث.</b> ∂L/∂zⱼ = pⱼ − yⱼ = [0.0900, 0.2447, −0.3348]، ومع η = 0.1 يصبح b_o ≈ [−0.0090, −0.0245, 0.0335]، فيزيد انحياز الرمز الصحيح.</p><p><b>ملاحظات.</b> التضمينات المجمدة لا تتغير، والمعاملات المشتركة تتلقى إشارة من كل مثال.</p>`,
      [[`Four stages in order`, `المراحل الأربع`], [`Chain rule / backprop explanation`, `قاعدة السلسلة`], [`Update rule with η`, `قاعدة التحديث`], [`p − y gradient and new bias`, `التدرج والانحياز الجديد`], [`Frozen vs shared parameters`, `المجمّد مقابل المشترك`]],
      `Stages 2 · Backprop 3 · Gradient descent 2 · Worked update 2 · Notes 1`),
    E('Explain how & why', `Explain how mean cross-entropy and perplexity evaluate a whole sequence. Compute them for true-token probabilities 0.5, 0.25, 0.125, and for 0.8, 0.2. Explain why the arithmetic mean of probabilities is not used.`, `اشرح كيف يقيّم متوسط الإنتروبيا المتقاطعة والحيرة سلسلة كاملة، واحسبهما للاحتمالات 0.5 و0.25 و0.125 ثم 0.8 و0.2، واشرح لماذا لا نستخدم المتوسط الحسابي للاحتمالات.`, 10,
      `<p><b>Mean cross-entropy</b> summarises all scored targets: H = (1/N) Σₜ −ln pₜ, where pₜ is the model's probability of the true token at position t and N the number of scored targets.</p><p><b>Perplexity</b> is the exponential of the mean cross-entropy: PPL = exp(H) = (Πₜ pₜ)^(−1/N), because the log of a product is the sum of logs. It equals the inverse of the geometric mean of the true-token probabilities. (With base-2 loss, PPL = 2ᴴ.)</p><p><b>Example 1.</b> −ln 0.5 = 0.6931, −ln 0.25 = 1.3863, −ln 0.125 = 2.0794. H = 4.1588/3 = 1.3863. PPL = e^1.3863 = <b>4</b>. Route 2: (0.5 × 0.25 × 0.125)^(−1/3) = 0.015625^(−1/3) = 4. Geometric mean probability = 1/4.</p><p><b>Example 2.</b> −ln 0.8 = 0.2231, −ln 0.2 = 1.6094. H = 0.9163. PPL = e^0.9163 = <b>2.5</b>; check √(0.8 × 0.2) = 0.4, 1/0.4 = 2.5.</p><p><b>Why not the arithmetic mean.</b> (0.8 + 0.2)/2 = 0.5, whose reciprocal is 2, not 2.5. Perplexity is defined through the product of probabilities (geometric mean), so we must average the token losses first and then exponentiate.</p><p><b>Interpretation.</b> Lower PPL is better; PPL ≥ 1; a uniform predictor over V tokens has PPL = V. Compare only on the same data, tokenisation, vocabulary and scoring convention; corpus PPL uses total loss ÷ total tokens, not an average of sentence perplexities. Low PPL does not guarantee factual accuracy or usefulness.</p>`,
      `<p><b>متوسط الإنتروبيا المتقاطعة</b>: H = (1/N) Σ −ln pₜ.</p><p><b>الحيرة</b> = exp(H) = (Π pₜ)^(−1/N)، أي مقلوب المتوسط الهندسي لاحتمالات الرموز الصحيحة.</p><p><b>المثال 1.</b> H = 1.3863 وPPL = <b>4</b>، وبالطريق الثاني 0.015625^(−1/3) = 4.</p><p><b>المثال 2.</b> H = 0.9163 وPPL = <b>2.5</b>، والتحقق: √0.16 = 0.4 و1/0.4 = 2.5.</p><p><b>لماذا لا نستخدم المتوسط الحسابي.</b> (0.8 + 0.2)/2 = 0.5 ومقلوبه 2 وليس 2.5؛ الحيرة معرّفة بحاصل الضرب (المتوسط الهندسي)، فنأخذ متوسط الخسائر ثم الأُس.</p><p><b>التفسير.</b> الأقل أفضل، والحد الأدنى 1، والمتنبئ المنتظم على V رموز حيرته V. وتُقارن فقط على البيانات والترميز نفسيهما، وحيرة المدونة = مجموع الخسائر ÷ عدد الرموز. والحيرة المنخفضة لا تضمن الدقة الحقائقية.</p>`,
      [[`Mean CE formula`, `صيغة متوسط الخسارة`], [`PPL = exp(H) = inverse geometric mean`, `الحيرة والمتوسط الهندسي`], [`Example 1 → 4 (both routes)`, `المثال 1`], [`Example 2 → 2.5`, `المثال 2`], [`Why not arithmetic mean`, `سبب رفض المتوسط الحسابي`], [`Interpretation and fair comparison`, `التفسير والمقارنة العادلة`]],
      `Formulas 2 · Example 1 2 · Example 2 2 · Arithmetic mean 2 · Interpretation 2`),
    E('Compare & contrast', `Compare how count n-gram models, fixed-window neural LMs, simple RNNs and LSTMs represent context. Explain why embeddings help neural models generalise.`, `قارن كيف تمثل نماذج n-gram والنماذج العصبية ذات النافذة الثابتة وRNN البسيطة وLSTM السياق، واشرح لماذا تساعد التضمينات النماذج العصبية على التعميم.`, 10,
      `<table><tr><th>Model</th><th>Context representation</th><th>Learning and main limitation</th></tr><tr><td>Count n-gram</td><td>Counts indexed by a short token history</td><td>Sparse contexts need smoothing or backoff</td></tr><tr><td>Fixed-window neural LM</td><td>Concatenated embeddings of k tokens</td><td>Shares learned representations, but cannot use evidence outside the window; widening the window enlarges x and W</td></tr><tr><td>Simple RNN</td><td>A recurrent hidden state hₜ = tanh(Wₓeₜ + Wₕhₜ₋₁ + b), same weights at every step</td><td>Can carry earlier information, but long dependencies are hard to learn (signals shrink or grow); fixed-size state</td></tr><tr><td>LSTM</td><td>Hidden state hₜ plus gated cell state cₜ</td><td>Controls memory flow with forget/input/output gates, at the cost of more parameters and computation per step</td></tr></table><p>All four keep the same next-token objective; they differ in how they represent the available context.</p><p><b>Why embeddings help.</b> If training contains "the cat gets fed" and the test context is "the dog gets ___", an n-gram model sees an unseen context and must rely on smoothing or backoff. A neural model maps cat and dog to related embedding vectors, which produce related hidden representations through shared parameters, so it can still predict "fed". Similarity helps generalisation but does not guarantee the correct prediction.</p><p><b>Example of the need for longer context.</b> In "The flights the airline was cancelling were full", <i>were</i> agrees with the distant plural <i>flights</i>, which a small window may miss.</p>`,
      `<table><tr><th>النموذج</th><th>تمثيل السياق</th><th>القيد</th></tr><tr><td>n-gram</td><td>أعداد مفهرسة بتاريخ قصير</td><td>التناثر يحتاج تنعيمًا</td></tr><tr><td>عصبي بنافذة ثابتة</td><td>تضمينات k رموز مضمومة</td><td>يشارك التمثيلات لكنه لا يرى خارج النافذة</td></tr><tr><td>RNN بسيطة</td><td>حالة مخفية تكرارية بالأوزان نفسها</td><td>تحمل معلومات سابقة لكن الاعتماديات البعيدة صعبة</td></tr><tr><td>LSTM</td><td>حالة مخفية وحالة خلية ببوابات</td><td>تتحكم بتدفق الذاكرة مع معاملات وحساب أكثر</td></tr></table><p>جميعها بالهدف نفسه.</p><p><b>فائدة التضمينات.</b> إذا رأى التدريب "the cat gets fed" وجاء في الاختبار "the dog gets ___"، فنموذج n-gram يرى سياقًا جديدًا ويعتمد على التنعيم، أما العصبي فيعطي cat وdog متجهات مترابطة فيتنبأ بـ fed، مع أن ذلك لا يضمن الصحة.</p><p><b>مثال السياق البعيد.</b> "The flights the airline was cancelling were full".</p>`,
      [[`Four rows correct`, `الصفوف الأربعة`], [`Same objective, different context`, `هدف واحد وسياق مختلف`], [`cat/dog generalisation example`, `مثال cat/dog`], [`Similarity does not guarantee correctness`, `التشابه لا يضمن الصحة`]],
      `Comparison 6 · Embeddings 3 · Example 1`),
    E('Explain how & why', `(Additional Depth) Explain why LSTMs were introduced and what each gate does. Compute the new cell and hidden states for eₜ = 1, hₜ₋₁ = 0.2, cₜ₋₁ = 0.4 with f = σ(0.2), i = σ(1), g = tanh(0.8), o = σ(0.5).`, `(تعمّق إضافي) اشرح لماذا قُدّمت LSTM وما وظيفة كل بوابة، واحسب حالتي الخلية والمخفية الجديدتين للقيم المعطاة.`, 10,
      `<p><b>Motivation.</b> A simple RNN carries a hidden state, but learning signals pass through repeated state updates and can shrink or grow, so distant evidence is hard to learn (Pascanu et al., 2013). Example: in "The flights the airline was cancelling were full", <i>were</i> depends on the distant <i>flights</i>. LSTMs add a gated memory path that helps with long dependencies, though they do not guarantee perfect memory.</p><p><b>Gates.</b> A gate is a vector of values between 0 and 1 produced by a sigmoid; it multiplies another vector element-wise (⊙): near 1 passes, near 0 blocks.</p><ul><li><b>Forget gate fₜ</b>: scales the old cell state (keep or remove each component).</li><li><b>Input (add) gate iₜ</b>: controls how much of the candidate enters the cell.</li><li><b>Candidate gₜ</b>: proposes signed new content using tanh.</li><li><b>Output gate oₜ</b>: controls how much of tanh(cₜ) becomes the hidden state hₜ.</li></ul><p>cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ; hₜ = oₜ ⊙ tanh(cₜ). The cell state cₜ is the explicit memory; hₜ is the exposed state used by the next step and the output layer.</p><p><b>Calculation.</b> f = σ(0.2) ≈ 0.549834; i = σ(1) ≈ 0.731059; g = tanh(0.8) ≈ 0.664037; o = σ(0.5) ≈ 0.622459.</p><p>Kept memory = f·cₜ₋₁ = 0.549834 × 0.4 = 0.219934. Written memory = i·g = 0.731059 × 0.664037 = 0.485450. <b>cₜ ≈ 0.7054</b>. hₜ = o·tanh(0.705383) = 0.622459 × 0.6077 ≈ <b>0.3783</b>. cₜ and hₜ are different quantities.</p>`,
      `<p><b>الدافع.</b> RNN البسيطة تحمل حالة لكن الإشارات تتقلص أو تتضخم عبر التحديثات، فيصعب تعلّم الأدلة البعيدة، كما في "The flights … were full". وLSTM تضيف مسار ذاكرة ببوابات يساعد دون ضمان ذاكرة كاملة.</p><p><b>البوابات.</b> متجه قيم بين 0 و1 من دالة سينية يضرب عنصريًّا.</p><ul><li><b>النسيان fₜ</b>: يحدد ما يُبقى من الذاكرة القديمة.</li><li><b>الإدخال iₜ</b>: يحدد كم يدخل من المحتوى المرشح.</li><li><b>المرشح gₜ</b>: محتوى جديد بإشارة باستخدام tanh.</li><li><b>المخرج oₜ</b>: يحدد كم يظهر من tanh(cₜ) في hₜ.</li></ul><p>cₜ = f ⊙ cₜ₋₁ + i ⊙ g وhₜ = o ⊙ tanh(cₜ).</p><p><b>الحساب.</b> الذاكرة المحفوظة 0.219934، والمكتوبة 0.485450، فـ <b>cₜ ≈ 0.7054</b> و<b>hₜ ≈ 0.3783</b>.</p>`,
      [[`Long-dependency motivation + flights example`, `الدافع ومثال flights`], [`Gate definition (sigmoid, ⊙)`, `تعريف البوابة`], [`Role of f, i, g, o`, `دور كل بوابة`], [`c and h equations`, `المعادلتان`], [`c ≈ 0.7054, h ≈ 0.3783`, `النتائج`]],
      `Motivation 2 · Gates 4 · Equations 1 · Calculation 3`),
    E('Scenario', `You are training a neural sentiment model on only 2,000 labelled reviews, and pretrained GloVe vectors are available. Which embedding strategy would you choose (random, fine-tuned or frozen), and how does this affect the number of trainable parameters for an embedding table with 1,000 rows and 20 columns?`, `تدرّب نموذج مشاعر عصبيًّا على 2000 مراجعة موسومة فقط، ومتجهات GloVe المدربة مسبقًا متاحة. أي استراتيجية تضمين تختار (عشوائي، ضبط دقيق، مجمّد)، وكيف يؤثر ذلك في عدد المعاملات القابلة للتدريب لجدول تضمين بحجم 1000 × 20؟`, 6,
      `<p><b>Options (lecture).</b> (1) <b>Random initialisation:</b> learn E from the task's own data; more data may be needed to learn useful vectors. (2) <b>Pretrained, then fine-tuned:</b> start from learned vectors and let the task loss update them. (3) <b>Pretrained and frozen:</b> keep E fixed while training later layers; this reduces trainable parameters.</p><p><b>Choice.</b> With only 2,000 reviews, random initialisation is risky because there may not be enough data to learn good vectors. Starting from GloVe brings knowledge of word similarity learned from a large corpus. A <b>frozen</b> table is a safe start because it reduces the parameters that must be learned from little data; if development-set results allow, <b>fine-tuning</b> can adapt the vectors to sentiment. The choice should be validated on the development set.</p><p><b>Parameters.</b> E has 1,000 × 20 = <b>20,000</b> stored values. If E is frozen, none of them is trainable; if E is random or fine-tuned, all 20,000 are trainable in addition to W, U and the biases.</p><p><b>Caution.</b> Static GloVe vectors give one vector per word (bank) and may carry social bias, so inspect them for sensitive use.</p>`,
      `<p><b>الخيارات.</b> (1) <b>تهيئة عشوائية:</b> تعلّم E من بيانات المهمة وقد تحتاج بيانات أكثر. (2) <b>مدرب مسبقًا ثم مضبوط:</b> نبدأ من متجهات متعلَّمة وتحدّثها الخسارة. (3) <b>مدرب مسبقًا ومجمّد:</b> E ثابت أثناء تدريب الطبقات اللاحقة، فتقل المعاملات.</p><p><b>الاختيار.</b> مع 2000 مراجعة فقط التهيئة العشوائية خطرة. GloVe يجلب معرفة بالتشابه من مدونة كبيرة. البدء بجدول <b>مجمّد</b> آمن لقلة البيانات، ثم <b>الضبط الدقيق</b> إن سمحت نتائج مجموعة التطوير.</p><p><b>المعاملات.</b> 1000 × 20 = <b>20,000</b> قيمة؛ لا شيء منها قابل للتدريب إن جُمّد، وكلها قابلة للتدريب إن كان عشوائيًّا أو مضبوطًا.</p><p><b>تنبيه.</b> متجهات GloVe ثابتة وقد تحمل تحيزًا.</p>`,
      [[`Three strategies described`, `الاستراتيجيات الثلاث`], [`Justified choice for small data`, `اختيار مبرر للبيانات القليلة`], [`20,000 parameters; trainable only if unfrozen`, `20,000 معامل`], [`Validate on dev set / static caution`, `التحقق والتنبيه`]],
      `Options 2 · Choice 2 · Parameters 1 · Caution 1`),
    E('Explain how & why', `Explain which information a fixed-window feedforward language model can use, why increasing the window has a cost, and how recurrent models address the limitation.`, `اشرح ما المعلومات التي يستطيع نموذج اللغة الأمامي ذو النافذة الثابتة استخدامها، ولماذا توسيع النافذة مكلف، وكيف تعالج النماذج التكرارية هذا القيد.`, 8,
      `<p><b>What the model can use.</b> A fixed-window neural LM predicts the next token from the concatenated embeddings of the previous k tokens only (x = [e₁; …; e_k], size kd × 1). Evidence outside those k tokens cannot affect the prediction. Example: in "The flights the airline was cancelling were full", the plural <i>flights</i> that explains <i>were</i> may lie outside a small window.</p><p><b>Why a wider window costs more.</b> Each extra context token adds d values to x, so x grows to kd and the hidden weight matrix W (H × kd) grows with it: more parameters to learn and store, more computation per prediction, and more data needed to train them. The window is still finite, so some evidence is always left out.</p><p><b>What the model gains.</b> Unlike count n-grams, it shares learned representations: related words (cat, dog) have related embeddings, which helps generalisation to unseen contexts.</p><p><b>Recurrent alternative (Additional Depth).</b> Instead of widening x, an RNN carries a hidden state forward as tokens arrive: hₜ = tanh(Wₓeₜ + Wₕhₜ₋₁ + b), with the same weights at every step, so earlier tokens can influence later predictions. Because learning signals through many steps can shrink or grow, simple RNNs struggle with long dependencies; LSTMs add a gated cell state (forget, input, output gates) to control what is kept, at the cost of more parameters and computation per step.</p>`,
      `<p><b>ما يستطيع النموذج استخدامه.</b> يتنبأ النموذج من تضمينات آخر k رموز مضمومة فقط (x بحجم kd)، فالأدلة خارجها لا تؤثر. مثال: في "The flights the airline was cancelling were full" قد يقع flights خارج النافذة الصغيرة.</p><p><b>لماذا التوسيع مكلف.</b> كل رمز إضافي يضيف d قيم إلى x، فتكبر x وتكبر مصفوفة W (H × kd): معاملات أكثر وحساب أكثر وبيانات أكثر للتدريب، وتبقى النافذة محدودة.</p><p><b>ما يكسبه.</b> بخلاف n-gram يشارك تمثيلات متعلَّمة، فالكلمات المترابطة لها تضمينات مترابطة.</p><p><b>البديل التكراري (تعمّق إضافي).</b> بدلًا من توسيع x تحمل RNN حالة مخفية إلى الأمام بالأوزان نفسها في كل خطوة، لكنها تعاني مع الاعتماديات البعيدة، فتضيف LSTM حالة خلية ببوابات تتحكم بما يُحفظ مقابل معاملات وحساب أكثر.</p>`,
      [[`Only the previous k tokens; concatenated x`, `آخر k رموز فقط`], [`Wider window: x and W grow; still finite`, `التوسيع يكبّر x وW`], [`Shared embeddings help generalisation`, `التضمينات المشتركة تساعد التعميم`], [`RNN state carries earlier information`, `حالة RNN تحمل المعلومات`], [`LSTM gates for long dependencies`, `بوابات LSTM`]],

  essays: [
    E('Define & explain', `Define a language model and a large language model. Describe the training stages of an LLM and how masked language models differ.`, `عرّف النموذج اللغوي والنموذج اللغوي الكبير، وصف مراحل تدريب النموذج الكبير، وكيف تختلف النماذج المقنّعة.`, 8,
      `<p><b>Language model.</b> Given a prefix, a language model assigns a probability to every possible next token. After "So long and thanks for", <i>all</i> and <i>the</i> are likely while <i>of</i> is unlikely.</p><p><b>Large language model.</b> A large neural network trained on very large text collections to make this prediction. For example, GPT-3 has 96 layers and 175B parameters.</p><p><b>Training stages.</b> (1) Pretraining on large text with a self-supervised objective; (2) instruction tuning; (3) preference alignment; (4) reinforcement learning for reasoning (Week 13).</p><p><b>Masked language models.</b> Encoder models such as BERT predict a hidden (masked) token using context on both sides, rather than the next token. They form the encoder family.</p><p><b>Link to Week 6.</b> The probability and cross-entropy mathematics stay the same; what changes is the context representation: tokens plus positional information, and attention over permitted positions instead of a fixed window or recurrent state.</p>`,
      `<p><b>النموذج اللغوي.</b> بمعلومية بادئة يُسند احتمالًا لكل رمز تالٍ ممكن.</p><p><b>النموذج اللغوي الكبير.</b> شبكة عصبية كبيرة مدربة على نصوص ضخمة للقيام بهذا التنبؤ، مثل GPT-3 بـ 96 طبقة و175 مليار معامل.</p><p><b>مراحل التدريب.</b> (1) التدريب المسبق بهدف ذاتي الإشراف، (2) ضبط التعليمات، (3) مواءمة التفضيلات، (4) التعلم المعزز للاستدلال.</p><p><b>النماذج المقنّعة.</b> مرمِّزات مثل BERT تتنبأ برمز مخفي من الجانبين لا بالرمز التالي.</p><p><b>الصلة بالأسبوع 6.</b> رياضيات الاحتمال والخسارة واحدة، ويتغير تمثيل السياق: رموز مع معلومات الموضع وانتباه على المواضع المسموحة.</p>`,
      [[`LM definition + example`, `تعريف LM ومثال`], [`LLM definition + GPT-3`, `تعريف LLM وGPT-3`], [`Four training stages`, `المراحل الأربع`], [`MLM uses both sides`, `MLM يستخدم الجانبين`]],
      `LM 2 · LLM 2 · Stages 2 · MLM 2`),
    E('Compare & contrast', `Compare encoder-only, decoder-only and encoder-decoder Transformer models in terms of attention, output, typical use and examples.`, `قارن بين نماذج المرمِّز فقط والمفكِّك فقط والمرمِّز-المفكِّك من حيث الانتباه والمخرج والاستخدام والأمثلة.`, 12,
      `<table><tr><th></th><th>Encoder-only</th><th>Decoder-only</th><th>Encoder-decoder</th></tr><tr><td>Attention / context</td><td>Bidirectional over the supplied input: each token uses both sides</td><td>Causal: each position reads only earlier tokens</td><td>Encoder: all source positions. Decoder self-attention: earlier target tokens. Cross-attention: encoder outputs for the full source</td></tr><tr><td>Standard output</td><td>One contextual vector per token, then a head for labels or vocabulary predictions</td><td>A vocabulary distribution at each position; a continuation of the prefix</td><td>A generated target sequence</td></tr><tr><td>Typical use</td><td>Sequence classification, token labelling, extractive QA</td><td>Continuing a prefix, open-ended generation</td><td>Conditional generation: translation, summarization</td></tr><tr><td>Examples</td><td>BERT, RoBERTa</td><td>GPT-style causal models</td><td>T5, BART</td></tr><tr><td>Pretraining objective</td><td>Masked language modelling</td><td>Causal language modelling</td><td>Denoising (missing spans)</td></tr></table><p><b>Key points.</b> All three share common Transformer components but differ in information flow (textbook Figure 9.1). A standard BERT model does not use the left-to-right generation loop. In the encoder-decoder, cross-attention lets every decoder position read the encoder outputs for the whole source (e.g. summarising "The lecture moved from 10:00 to 11:00." as "Lecture starts at 11:00."). These are architectural tendencies: fine-tuning and prompting can adapt a family to several tasks.</p>`,
      `<table><tr><th></th><th>المرمِّز فقط</th><th>المفكِّك فقط</th><th>المرمِّز-المفكِّك</th></tr><tr><td>الانتباه</td><td>ثنائي الاتجاه</td><td>سببي: الرموز السابقة فقط</td><td>المرمِّز: كل المصدر؛ المفكِّك: رموز الهدف السابقة؛ الانتباه المتقاطع: مخرجات المرمِّز</td></tr><tr><td>المخرج</td><td>متجه سياقي لكل رمز ثم رأس للوسوم</td><td>توزيع على المفردات وتكملة البادئة</td><td>سلسلة هدف مولَّدة</td></tr><tr><td>الاستخدام</td><td>تصنيف السلاسل ووسم الرموز والإجابة الاستخراجية</td><td>تكملة البادئة والتوليد المفتوح</td><td>الترجمة والتلخيص</td></tr><tr><td>أمثلة</td><td>BERT, RoBERTa</td><td>نماذج GPT</td><td>T5, BART</td></tr><tr><td>هدف التدريب</td><td>MLM</td><td>سببي</td><td>إزالة التشويش</td></tr></table><p><b>نقاط أساسية.</b> تشترك العائلات في المكونات وتختلف في تدفق المعلومات. BERT لا يستخدم حلقة التوليد، والانتباه المتقاطع يسمح للمفكِّك بقراءة المصدر كاملًا. وهذه ميول بنيوية يمكن تكييفها بالضبط والتلقين.</p>`,
      [[`Correct attention for each`, `الانتباه الصحيح لكل منها`], [`Correct output for each`, `المخرج الصحيح`], [`Typical uses`, `الاستخدامات`], [`Examples (BERT/GPT/T5)`, `الأمثلة`], [`Cross-attention + "tendencies" note`, `الانتباه المتقاطع والملاحظة`]],
      `3 marks per family · Key points 3`),
    E('Explain how & why', `Explain causal and bidirectional self-attention using a visibility matrix. Why can an encoder read right context while a causal decoder must block future targets?`, `اشرح الانتباه الذاتي السببي وثنائي الاتجاه باستخدام مصفوفة الرؤية. لماذا يقرأ المرمِّز السياق الأيمن بينما يجب على المفكِّك السببي حجب الأهداف المستقبلية؟`, 8,
      `<p><b>Self-attention.</b> Each position builds its new representation from the positions it is allowed to read. (The query/key/value computation is Week 11.)</p><p><b>Causal attention</b> lets position t read positions 1…t. <b>Bidirectional attention</b> lets every position read all positions. For position 3 in a 5-token input, causal uses 1–3 and bidirectional uses 1–5.</p><table><tr><th>Query</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr><tr><td>2</td><td>1</td><td>1</td><td>0</td><td>0</td></tr><tr><td>3</td><td>1</td><td>1</td><td>1</td><td>0</td></tr><tr><td>4</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table><p>Causal matrix (1 = allowed). In the bidirectional matrix every cell is 1. The diagonal is allowed in the causal case because position t predicts token t + 1, not token t. Implementations mask blocked scores with −∞ before softmax; padding may need a separate mask.</p><p><b>Why the difference.</b> A causal decoder is trained to predict the next token; if it could read future positions, the target would already be visible and the model would learn nothing useful, and at generation time future tokens do not yet exist. An encoder is given a complete input (for classification or tagging), so reading both sides gives better token representations. Its training objective (MLM) hides the answer by masking the selected positions instead.</p>`,
      `<p><b>الانتباه الذاتي.</b> كل موضع يبني تمثيله من المواضع المسموح بقراءتها.</p><p><b>السببي</b> يسمح للموضع t بقراءة 1…t، و<b>الثنائي</b> يسمح بقراءة الكل. للموضع 3 من 5: السببي 1–3 والثنائي 1–5.</p><p>مصفوفة السببي مثلثية سفلية (1 = مسموح)، وفي الثنائي كل الخلايا 1. والقطر مسموح لأن الموضع t يتنبأ بالرمز t+1. وتُقنّع الدرجات المحجوبة بـ −∞ قبل softmax.</p><p><b>سبب الاختلاف.</b> المفكِّك يتدرب على التنبؤ بالرمز التالي، فلو رأى المستقبل لكان الهدف مرئيًّا، كما أن الرموز المستقبلية غير موجودة أثناء التوليد. أما المرمِّز فيأخذ مدخلًا كاملًا فقراءة الجانبين تعطي تمثيلات أفضل، ويخفي هدفه بالإقناع بدلًا من ذلك.</p>`,
      [[`Self-attention definition`, `تعريف الانتباه الذاتي`], [`Causal vs bidirectional ranges`, `المدى في كل منهما`], [`Correct lower-triangular matrix + diagonal reason`, `المصفوفة وسبب القطر`], [`−∞ masking`, `الإقناع بـ −∞`], [`Why decoder blocks future / encoder reads both`, `سبب الاختلاف`]],
      `Definitions 2 · Matrix 2 · Masking 1 · Reasoning 3`),
    E('Describe & discuss', `Describe where LLM pretraining data comes from and how it is processed. Explain the difference between pretraining data and the pretraining objective.`, `صف مصادر بيانات التدريب المسبق للنماذج الكبيرة وكيف تُعالج، واشرح الفرق بين بيانات التدريب المسبق وهدفه.`, 8,
      `<p><b>Pipeline.</b></p><ol><li><b>Sources:</b> large web crawls plus curated text, such as Common Crawl snapshots, Wikipedia, books and code.</li><li><b>Quality filtering:</b> remove duplicates, boilerplate and adult content (deduplication drops repeated pages).</li><li><b>Safety filtering:</b> remove toxic text with a classifier; such classifiers can wrongly flag minority dialects.</li><li><b>Tokenisation:</b> turn the cleaned text into token sequences that feed the objective.</li></ol><p><b>Example mix (LLaMA).</b> Common Crawl 67%, C4 15%, GitHub, Wikipedia and Books 4.5% each, ArXiv 2.5%, StackExchange 2%.</p><p><b>Data vs objective.</b> The data decides what evidence the model sees; the objective decides what it predicts from that evidence. The same text can be used with a causal objective (predict the next token), a masked objective (recover selected tokens) or a denoising objective (reconstruct missing spans). Pretraining is self-supervised: the targets come from the data itself, but optimization still uses an explicit loss (cross-entropy).</p>`,
      `<p><b>المسار.</b></p><ol><li><b>المصادر:</b> زحف الويب ونصوص منتقاة: Common Crawl وويكيبيديا والكتب والشيفرات.</li><li><b>تصفية الجودة:</b> إزالة التكرار والنصوص المتكررة والمحتوى غير اللائق.</li><li><b>تصفية الأمان:</b> إزالة النص المسيء بمصنف قد يخطئ مع لهجات الأقليات.</li><li><b>الترميز:</b> تحويل النص إلى سلاسل رموز.</li></ol><p><b>مثال LLaMA.</b> Common Crawl 67%، C4 15%، GitHub وويكيبيديا والكتب 4.5%، ArXiv 2.5%، StackExchange 2%.</p><p><b>البيانات مقابل الهدف.</b> البيانات تحدد الدليل الذي يراه النموذج، والهدف يحدد ما يتنبأ به منه. النص نفسه قد يُستخدم بهدف سببي أو مقنّع أو إزالة تشويش. والتدريب ذاتي الإشراف لكنه يستخدم خسارة صريحة.</p>`,
      [[`Four pipeline steps`, `الخطوات الأربع`], [`Dialect-flagging risk`, `خطر تصنيف اللهجات`], [`LLaMA mix`, `مزيج LLaMA`], [`Data = evidence; objective = what is predicted`, `البيانات مقابل الهدف`]],
      `Pipeline 4 · Example 1 · Data vs objective 3`),
    E('Compare & contrast', `Compare the three self-supervised pretraining objectives: causal language modelling, masked language modelling and encoder-decoder denoising. For each, state the input, the target and which positions are scored.`, `قارن بين أهداف التدريب المسبق الثلاثة: النمذجة السببية، والنمذجة المقنّعة، وإزالة التشويش. اذكر لكل منها المدخل والهدف والمواضع التي تُقيَّم.`, 10,
      `<table><tr><th>Objective</th><th>Input / conditioning</th><th>Target</th><th>Scored positions</th><th>Family</th></tr><tr><td>Causal LM</td><td>A prefix: earlier tokens only</td><td>The next original token</td><td>Every eligible non-padding next-token target</td><td>Decoder-only</td></tr><tr><td>Masked LM</td><td>The full input with selected tokens manipulated ([MASK] or a random token)</td><td>The original tokens at the selected positions</td><td>Only the selected positions</td><td>Encoder-only</td></tr><tr><td>Denoising</td><td>A corrupted source + earlier target tokens</td><td>A clean sequence or its missing spans</td><td>Tokens in the chosen reconstruction target</td><td>Encoder-decoder</td></tr></table><p><b>Examples.</b> Causal: "&lt;BOS&gt; I like NLP" → targets I, like, NLP, &lt;EOS&gt; (shifted by one). MLM: "The lecture [MASK] at 11:00" → target "starts". Denoising (T5-style): "The lecture [missing span] in room [missing span]." → "starts at 11:00 | 1090"; one marker can hide several tokens, so input and target lengths can differ.</p><p><b>Common ground.</b> All are self-supervised (targets come from raw text) and use cross-entropy. Exclude padding and define the target set before averaging. In MLM the denominator is the number of selected positions (e.g. 6 for a 40-token sentence with 6 selected), not all tokens.</p>`,
      `<table><tr><th>الهدف</th><th>المدخل</th><th>الهدف المتنبأ</th><th>المواضع المقيّمة</th><th>العائلة</th></tr><tr><td>سببي</td><td>بادئة</td><td>الرمز التالي</td><td>كل هدف غير حشو</td><td>المفكِّك</td></tr><tr><td>مقنّع</td><td>المدخل مع رموز مختارة معدلة</td><td>الرموز الأصلية في المواضع المختارة</td><td>المختارة فقط</td><td>المرمِّز</td></tr><tr><td>إزالة التشويش</td><td>مصدر مشوّه + رموز الهدف السابقة</td><td>السلسلة النظيفة أو المقاطع المفقودة</td><td>رموز هدف إعادة البناء</td><td>المرمِّز-المفكِّك</td></tr></table><p><b>أمثلة.</b> السببي: الأهداف مزاحة بموضع. المقنّع: "[MASK]" ← starts. إزالة التشويش: "starts at 11:00 | 1090" وقد يختلف الطول.</p><p><b>المشترك.</b> كلها ذاتية الإشراف وتستخدم الإنتروبيا المتقاطعة، مع استبعاد الحشو وتحديد مجموعة الأهداف قبل المتوسط، ففي MLM المقام عدد المواضع المختارة.</p>`,
      [[`Correct input for each`, `المدخل لكل منها`], [`Correct target for each`, `الهدف لكل منها`], [`Correct scored positions`, `المواضع المقيّمة`], [`Examples`, `أمثلة`], [`Shared CE; denominator rule`, `الخسارة المشتركة وقاعدة المقام`]],
      `3 marks per objective · Common ground 1`),
    E('Explain how & why', `Explain causal pretraining with shifted targets and teacher forcing. Compute the mean causal loss when the targets I, like, NLP, <EOS> receive probabilities 0.5, 0.8, 0.4 and 0.9.`, `اشرح التدريب المسبق السببي بالأهداف المزاحة وteacher forcing، واحسب متوسط الخسارة السببية للاحتمالات 0.5 و0.8 و0.4 و0.9.`, 8,
      `<p><b>Shifted targets.</b> In causal language modelling, the target at each position is the next original token, so targets are the input shifted by one: input &lt;BOS&gt; → target I; input I → like; input like → NLP; input NLP → &lt;EOS&gt;. The causal mask blocks later input positions, so each position sees only its allowed prefix. Every eligible non-padding target contributes a loss.</p><p><b>Teacher forcing.</b> During training, the model is fed the correct earlier tokens as the prefix (not its own guesses). During generation, it is fed its own earlier choices.</p><p><b>Loss.</b> Using Week 6 cross-entropy, each target contributes −ln p:</p><ul><li>I: −ln 0.5 = 0.6931</li><li>like: −ln 0.8 = 0.2231</li><li>NLP: −ln 0.4 = 0.9163</li><li>&lt;EOS&gt;: −ln 0.9 = 0.1054</li></ul><p>Mean loss = (0.6931 + 0.2231 + 0.9163 + 0.1054)/4 = 1.9379/4 ≈ <b>0.4845 nats per target</b>. NLP contributes the largest loss because the observed token received the lowest probability.</p>`,
      `<p><b>الأهداف المزاحة.</b> الهدف في كل موضع هو الرمز الأصلي التالي، فالأهداف هي المدخل مزاحًا بموضع: &lt;BOS&gt; ← I، I ← like، like ← NLP، NLP ← &lt;EOS&gt;. والقناع السببي يحجب المواضع اللاحقة، وكل هدف غير حشو يساهم في الخسارة.</p><p><b>Teacher forcing.</b> أثناء التدريب تُعطى الرموز الصحيحة السابقة كبادئة، وأثناء التوليد تُعطى اختيارات النموذج.</p><p><b>الخسارة.</b> 0.6931 و0.2231 و0.9163 و0.1054، والمتوسط ≈ <b>0.4845</b> نات لكل هدف، وNLP الأكبر لأن احتماله الأقل.</p>`,
      [[`Shifted-target table`, `جدول الأهداف المزاحة`], [`Causal mask role`, `دور القناع السببي`], [`Teacher forcing vs generation`, `teacher forcing مقابل التوليد`], [`Four −ln values and mean 0.4845`, `القيم والمتوسط`]],
      `Shifted targets 2 · Mask 1 · Teacher forcing 2 · Loss 3`),
    E('Explain how & why', `Explain why masked language modelling is needed for bidirectional encoders. Using the "So long and thanks for all the fish" example, identify the scored positions and compute the MLM loss for probabilities 0.8 (long), 0.25 (thanks) and 0.5 (the). Why do unselected tokens still matter?`, `اشرح لماذا نحتاج النمذجة المقنّعة للمرمِّزات ثنائية الاتجاه. وباستخدام مثال "So long and thanks for all the fish" حدد المواضع المقيّمة واحسب خسارة MLM. لماذا تبقى الرموز غير المختارة مهمة؟`, 10,
      `<p><b>Why MLM.</b> A bidirectional encoder lets every position read the whole input. If we trained it with unrestricted next-token prediction, e.g. predicting "starts" while attending to the complete unchanged sentence "The lecture starts at 11:00", the target would already be visible and the task would be trivial. MLM solves this by corrupting the input: "The lecture [MASK] at 11:00" with target "starts". The model must use the remaining context. The original targets are kept before corrupting the input.</p><p><b>Example.</b> In "So long and thanks for all the fish", three positions are selected: <i>long</i> and <i>thanks</i> are replaced by [mask], and <i>the</i> is replaced by a random token ("apricot"). The bidirectional encoder produces outputs at all 8 positions, but an LM head with softmax and a loss are applied only at the 3 selected positions; the original tokens remain the targets.</p><p><b>Loss.</b> −ln 0.8 = 0.2231; −ln 0.25 = 1.3863; −ln 0.5 = 0.6931. MLM loss = (0.2231 + 1.3863 + 0.6931)/3 ≈ <b>0.7675 nats per selected target</b>. The denominator is 3 selected targets, not all 8 input tokens.</p><p><b>Unselected tokens.</b> They receive no direct loss, but they still matter because they are the context the encoder reads, from both sides, to predict the selected positions.</p>`,
      `<p><b>لماذا MLM.</b> المرمِّز ثنائي الاتجاه يقرأ المدخل كاملًا، فلو تنبأنا بـ "starts" والجملة كاملة مرئية لكان الهدف ظاهرًا. لذا نشوّه المدخل: "The lecture [MASK] at 11:00" والهدف starts، مع الاحتفاظ بالأهداف الأصلية.</p><p><b>المثال.</b> ثلاثة مواضع مختارة: long وthanks مقنّعتان، وthe مستبدلة بـ apricot. يعطي المرمِّز مخرجات للمواضع الثمانية لكن الخسارة على الثلاثة المختارة فقط.</p><p><b>الخسارة.</b> 0.2231 و1.3863 و0.6931، والمتوسط ≈ <b>0.7675</b>، والمقام 3 لا 8.</p><p><b>الرموز غير المختارة.</b> بلا خسارة مباشرة لكنها السياق الذي يقرؤه المرمِّز من الجانبين.</p>`,
      [[`Target-visible problem explained`, `مشكلة ظهور الهدف`], [`Masking + random replacement; keep originals`, `الإقناع والاستبدال`], [`Three scored positions`, `المواضع الثلاثة`], [`0.7675 with denominator 3`, `0.7675 والمقام 3`], [`Unselected tokens provide context`, `دور الرموز غير المختارة`]],
      `Why 3 · Example 2 · Loss 3 · Unselected 2`),
    E('Compare & contrast', `Compare greedy decoding and beam search. Using the two-step example (tea/coffee/water = 0.50/0.30/0.20; after tea: please 0.52, now 0.48; after coffee: please 0.90, now 0.10), show what each returns.`, `قارن بين فك الترميز الجشع والبحث الحزمي، ووضّح باستخدام المثال ذي الخطوتين ما يعيده كل منهما.`, 10,
      `<p><b>Greedy decoding</b> chooses the most probable token at each step, appends it, and repeats. It is simple and deterministic (for fixed scores and tie-breaking), but output is predictable and often repetitive, and the best local token need not begin the most probable sequence.</p><p><b>Beam search</b> keeps the best few partial sentences at each step (the beam width), not just one, and at the end chooses the best complete sentence.</p><p><b>Example (2-token continuations, &lt;EOS&gt; then has probability 1).</b></p><ul><li><b>Greedy:</b> step 1 picks tea (0.50); step 2 picks please (0.52). Result "tea please" with probability 0.50 × 0.52 = <b>0.26</b>.</li><li><b>Beam (width 2):</b> step 1 keeps tea (0.50) and coffee (0.30), prunes water (0.20). Step 2 scores: coffee please 0.30 × 0.90 = 0.270; tea please 0.260; tea now 0.240; coffee now 0.030. Keep the best 2; best complete sequence = "coffee please" (<b>0.27</b>).</li></ul><p><b>Conclusion.</b> Greedy committed to tea too early; beam search kept coffee long enough to find the more probable sequence. Beam search is common in constrained tasks such as machine translation; open-ended LLM generation usually uses sampling.</p>`,
      `<p><b>الجشع</b> يختار الرمز الأعلى احتمالًا في كل خطوة. بسيط وحتمي لكنه متوقع ومتكرر، وأفضل رمز محلي قد لا يبدأ أفضل سلسلة.</p><p><b>البحث الحزمي</b> يحتفظ بأفضل عدة جمل جزئية (عرض الحزمة) ويختار أفضل جملة كاملة في النهاية.</p><p><b>المثال.</b></p><ul><li><b>الجشع:</b> tea ثم please ← 0.50 × 0.52 = <b>0.26</b>.</li><li><b>الحزمي (عرض 2):</b> يبقي tea وcoffee ويحذف water، ثم: coffee please 0.270، tea please 0.260، tea now 0.240، coffee now 0.030، فالأفضل "coffee please" (<b>0.27</b>).</li></ul><p><b>الخلاصة.</b> الجشع التزم بـ tea مبكرًا، والحزمي أبقى coffee فوجد السلسلة الأفضل. والحزمي شائع في الترجمة، والتوليد المفتوح يستخدم المعاينة.</p>`,
      [[`Greedy definition + strengths/limits`, `تعريف الجشع ومزاياه وقيوده`], [`Beam definition + width`, `تعريف الحزمي والعرض`], [`Greedy → tea please 0.26`, `نتيجة الجشع`], [`Beam scores and coffee please 0.27`, `نتيجة الحزمي`], [`MT vs open-ended note`, `ملاحظة الاستخدام`]],
      `Definitions 3 · Greedy calc 2 · Beam calc 4 · Note 1`),
    E('Explain how & why', `Explain sampling, temperature, top-k and top-p. For the distribution tea 0.40, coffee 0.25, water 0.20, juice 0.10, milk 0.05, compute: tea's probability at T = 0.5, the top-k = 2 distribution, and the top-p = 0.80 distribution.`, `اشرح المعاينة والحرارة وtop-k وtop-p، واحسب للتوزيع المعطى: احتمال tea عند T = 0.5، وتوزيع top-k = 2، وتوزيع top-p = 0.80.`, 14,
      `<p><b>Sampling</b> chooses the next token at random with each token's chance equal to its probability (cumulative intervals: tea [0, 0.40), coffee [0.40, 0.65), water [0.65, 0.85), juice [0.85, 0.95), milk [0.95, 1); a draw u = 0.70 selects water). Problem: a real vocabulary has a long tail of unlikely tokens that together get picked often enough to produce odd text.</p><p><b>Temperature</b> rescales logits before softmax: pᵢ(T) = exp(zᵢ/T) / Σⱼ exp(zⱼ/T), T &gt; 0. T &lt; 1 concentrates probability on top candidates; T = 1 keeps the distribution; T &gt; 1 spreads it. Ranking is preserved, so the greedy argmax does not change. With only probabilities: raise each to 1/T and normalise. <b>T = 0.5:</b> squares 0.16, 0.0625, 0.04, 0.01, 0.0025 (total 0.275); tea = 0.16/0.275 ≈ <b>0.5818</b> (up from 0.40; argmax still tea). At T = 2 tea falls to 0.2984.</p><p><b>Top-k</b> keeps the k most probable candidates and renormalizes. <b>k = 2:</b> tea and coffee, mass 0.65 → tea 0.40/0.65 ≈ <b>0.6154</b>, coffee ≈ <b>0.3846</b>. k = 1 is greedy.</p><p><b>Top-p (nucleus)</b> keeps the smallest sorted prefix whose cumulative probability reaches p, including the token that crosses the threshold, then renormalizes. <b>p = 0.80:</b> cumulative 0.40, 0.65, 0.85 → keep tea, coffee, water (mass 0.85) → <b>[0.4706, 0.2941, 0.2353]</b>.</p><p><b>Fixed vs adaptive.</b> Top-k fixes the count; top-p fixes the mass, so it adapts: for a peaked distribution [0.90, 0.04, …] top-p = 0.8 keeps 1 token, for a flat one [0.22, 0.21, 0.20, 0.19, 0.18] it keeps 4. They can be combined (top-k first, then top-p). These settings change token selection at inference only and do not guarantee factual correctness.</p>`,
      `<p><b>المعاينة</b> تختار الرمز عشوائيًّا بفرصة تساوي احتماله (u = 0.70 ← water). المشكلة: الذيل الطويل من الرموز غير المحتملة.</p><p><b>الحرارة</b> تعيد قياس logits قبل softmax؛ T أقل من 1 تحدّ التوزيع وأكبر من 1 تنشره، والترتيب لا يتغير. بالاحتمالات فقط: نرفع للأس 1/T ونطبّع. <b>T = 0.5:</b> المربعات مجموعها 0.275، فـ tea ≈ <b>0.5818</b>، والأعلى ما زال tea.</p><p><b>Top-k</b> يبقي أعلى k ويطبّع. <b>k = 2:</b> tea ≈ <b>0.6154</b> وcoffee ≈ <b>0.3846</b>.</p><p><b>Top-p</b> يبقي أصغر مجموعة مرتبة تصل إلى p مع الرمز المتجاوز. <b>p = 0.80:</b> tea وcoffee وwater (0.85) ← <b>[0.4706, 0.2941, 0.2353]</b>.</p><p><b>ثابت مقابل متكيف.</b> top-k يثبّت العدد وtop-p يثبّت الكتلة فيتكيف: يبقي رمزًا واحدًا في التوزيع الحاد و4 في المسطح. ولا تغيّر هذه الإعدادات التدريب ولا تضمن الصحة.</p>`,
      [[`Sampling + long-tail problem`, `المعاينة ومشكلة الذيل`], [`Temperature formula and effects`, `صيغة الحرارة وأثرها`], [`T = 0.5 → 0.5818, argmax unchanged`, `حساب الحرارة`], [`Top-k = 2 → 0.6154 / 0.3846`, `حساب top-k`], [`Top-p = 0.8 → 3 tokens, renormalized`, `حساب top-p`], [`Fixed vs adaptive comparison`, `المقارنة`]],
      `Sampling 2 · Temperature 4 · Top-k 3 · Top-p 3 · Comparison 2`),
    E('Describe & discuss', `Describe the autoregressive generation loop. Does every NLP task need a decoding strategy? Explain with examples.`, `صف حلقة التوليد التلقائي الانحدار. هل تحتاج كل مهمة NLP إلى استراتيجية فك ترميز؟ اشرح مع أمثلة.`, 6,
      `<p><b>Loop.</b> At every step the model (1) computes logits, (2) forms probabilities with softmax, (3) selects a token with a decoding rule, (4) appends it to the prefix, and (5) checks the stopping rule (e.g. &lt;EOS&gt;). Example: "I would like" → tea → please → &lt;EOS&gt;. The selected token becomes part of the next context, so the next distribution depends on the selected prefix, and generation usually proceeds sequentially. The model supplies the probabilities; the decoding rule decides what happens next.</p><p><b>Not every task needs decoding.</b> The output decides:</p><ul><li><b>A label</b> (e.g. classifying student feedback as positive/negative/neutral): an encoder with a classification head and an argmax over the labels; no generation loop.</li><li><b>A tag per token</b> (e.g. tagging every word of a sentence): an encoder-only model; no decoding.</li><li><b>New text</b> (a source-conditioned summary with an encoder-decoder, or continuing a prefix with a decoder-only model): needs a decoding rule such as greedy, beam search or sampling.</li></ul>`,
      `<p><b>الحلقة.</b> في كل خطوة: (1) حساب logits، (2) تكوين الاحتمالات، (3) اختيار رمز بقاعدة فك ترميز، (4) إضافته للبادئة، (5) التحقق من التوقف. مثال: "I would like" ← tea ← please ← &lt;EOS&gt;. الرمز المختار يدخل السياق التالي فالتوليد تسلسلي.</p><p><b>ليست كل مهمة تحتاج فك ترميز.</b> المخرج يحدد:</p><ul><li><b>وسم</b> (تصنيف آراء الطلاب): مرمِّز ورأس تصنيف وargmax دون توليد.</li><li><b>وسم لكل رمز</b>: مرمِّز فقط دون فك ترميز.</li><li><b>نص جديد</b> (تلخيص أو تكملة): يحتاج قاعدة مثل الجشع أو الحزمي أو المعاينة.</li></ul>`,
      [[`Five-step loop`, `الحلقة الخماسية`], [`Selected token feeds next step`, `الرمز المختار يغذي الخطوة التالية`], [`Label/tag tasks: no decoding`, `المهام الوسمية دون فك ترميز`], [`Generation tasks need decoding`, `مهام التوليد تحتاجه`]],
      `Loop 3 · Task distinction 3`),
    E('Scenario', `For each task, choose a natural model family, an adaptation approach and an output strategy, and justify your choice: (A) classify complete student feedback as positive, negative or neutral; (B) produce a concise summary of a supplied report; (C) produce several different story openings from the same prompt.`, `لكل مهمة اختر عائلة نموذج وطريقة تكييف واستراتيجية مخرج مع التبرير: (أ) تصنيف آراء الطلاب؛ (ب) تلخيص تقرير معطى؛ (ج) إنتاج عدة بدايات قصص مختلفة من التلقين نفسه.`, 10,
      `<p><b>(A) Feedback labels.</b> <b>Encoder (e.g. BERT-style) + supervised classification head.</b> The complete feedback is available, so bidirectional attention helps every token representation. The output is one of 3 labels: take the argmax; <b>no text-generation loop</b> is needed. Evaluate with precision/recall/F1 per class.</p><p><b>(B) Report summary.</b> <b>Encoder-decoder (T5/BART-style) fine-tuned on source–summary pairs.</b> The encoder reads the full report; the decoder generates the summary while repeatedly consulting the source through cross-attention. Output strategy: compare <b>greedy and beam search</b> (constrained, faithful output is wanted), checking faithfulness to the source.</p><p><b>(C) Varied story openings.</b> <b>Causal decoder (GPT-style), adapted or prompted for the task.</b> Continuing a prompt matches causal next-token prediction. Because we want different outputs, use <b>sampling</b> with a stated temperature (e.g. T &gt; 1 for more diversity) and filtering (top-k and/or top-p) to avoid the long tail, then evaluate the outputs. Greedy or beam would give the same, often repetitive, opening each time.</p><p><b>General note.</b> These are starting points, not rules; other families can also work. Validate on held-out task data for quality, cost and failure cases. Decoding settings do not retrain the model and do not guarantee factual correctness.</p>`,
      `<p><b>(أ) آراء الطلاب.</b> <b>مرمِّز ورأس تصنيف موجَّه.</b> النص كامل فالانتباه الثنائي مفيد، والمخرج أحد 3 وسوم بـ argmax <b>دون حلقة توليد</b>.</p><p><b>(ب) تلخيص التقرير.</b> <b>مرمِّز-مفكِّك مضبوط على أزواج مصدر-ملخص.</b> المرمِّز يقرأ التقرير والمفكِّك يولّد الملخص مستعينًا بالمصدر عبر الانتباه المتقاطع. نقارن <b>الجشع والحزمي</b> مع التحقق من الأمانة للمصدر.</p><p><b>(ج) بدايات القصص.</b> <b>مفكِّك سببي مكيّف أو ملقَّن.</b> لأننا نريد تنوعًا نستخدم <b>المعاينة</b> بحرارة محددة وتصفية top-k/top-p ثم نقيّم المخرجات، فالجشع والحزمي يعطيان البداية نفسها.</p><p><b>ملاحظة.</b> هذه نقاط بداية لا قواعد، ويجب التحقق على بيانات محجوزة. وإعدادات فك الترميز لا تعيد التدريب ولا تضمن الصحة.</p>`,
      [[`(A) encoder + head, argmax, no generation`, `(أ) مرمِّز ورأس دون توليد`], [`(B) encoder-decoder, greedy/beam, faithfulness`, `(ب) مرمِّز-مفكِّك والحزمي`], [`(C) decoder, sampling + temperature + filtering`, `(ج) مفكِّك ومعاينة`], [`Justifications linked to attention/task`, `التبرير`], [`Starting point, validate on held-out data`, `التحقق على بيانات محجوزة`]],
      `3 marks per task · General note 1`),
    E('Explain how & why', `Answer the lecture's five exit questions in 1–2 sentences each: (1) Why can an encoder read right context, while a causal decoder must block future targets? (2) What is the difference between the pretraining data and the pretraining objective? (3) In MLM, which targets receive a direct loss, and why can unselected tokens still matter? (4) Does every NLP task need a decoding strategy? Give one task that does not. (5) What decides the retained set in top-k, and what decides it in top-p?`, `أجب عن أسئلة الخروج الخمسة في المحاضرة في جملة أو جملتين لكل منها: (1) لماذا يقرأ المرمِّز السياق الأيمن بينما يحجب المفكِّك السببي الأهداف المستقبلية؟ (2) ما الفرق بين بيانات التدريب المسبق وهدفه؟ (3) في MLM أي الأهداف تتلقى خسارة مباشرة، ولماذا تبقى الرموز غير المختارة مهمة؟ (4) هل تحتاج كل مهمة إلى استراتيجية فك ترميز؟ أعطِ مثالًا لمهمة لا تحتاجها. (5) ما الذي يحدد المجموعة المحتفظ بها في top-k وفي top-p؟`, 10,
      `<ol><li><b>Architecture.</b> An encoder is given the complete input and its MLM objective hides the answer by masking, so reading both sides only improves each token's representation. A causal decoder is trained to predict the next token; if it could read future positions the target would already be visible, and at generation time future tokens do not exist yet. So the causal mask blocks them.</li><li><b>Data vs objective.</b> The data (web crawls, curated text, filtered and tokenised) decides what evidence the model sees; the objective (next token, masked token, denoising) decides what it must predict from that evidence.</li><li><b>MLM targets.</b> Only the selected positions (masked or randomly replaced) receive a direct loss, averaged over the number of selected positions. Unselected tokens still matter because they are the context the encoder reads, from both sides, to predict the selected ones.</li><li><b>Decoding.</b> No. Only tasks that generate text need a decoding strategy. Classifying student feedback as positive/negative/neutral stops at a label (argmax over classes); tagging every word also needs no decoding.</li><li><b>Retained set.</b> In top-k the fixed count k decides the set (the k most probable tokens). In top-p the cumulative probability mass decides it (the smallest sorted set whose mass reaches p, including the token that crosses p), so its size adapts to how peaked the distribution is.</li></ol>`,

/* ---------- apply metadata to the chapter data ---------- */
(function applyMeta() {
  const problems = [];
  CH.forEach(ch => {
    const m = META[ch.id]; if (!m) { problems.push('no META for ' + ch.id); return; }
    ch.note = m.note || null;
    const byId = {};
    ch.sections.forEach(s => {
      byId[s.id] = s;
      const e = m.sec[s.id]; if (!e) { problems.push('no meta for section ' + s.id); return; }
      s.sl = e[0]; s.pri = e[1]; s.why = e[2]; s.mem = e[3] || null; s.flag = e[4] || null;
      if (s.pri === 'must' && !s.mem) problems.push('must without memorize text: ' + s.id);
    });
    Object.keys(m.sec).forEach(id => { if (!byId[id]) problems.push('meta for unknown section ' + id); });
    const prefix = ch.id.replace('ch', 'c') + 's';
    const link = (list, items, kind) => {
      if (!list) return;
      if (list.length !== items.length) problems.push(`${ch.id} ${kind}: ${list.length} links for ${items.length} items`);
      items.forEach((it, i) => {
        const ids = (list[i] || []).map(n => prefix + n);
        ids.forEach(id => { if (!byId[id]) problems.push(`${ch.id} ${kind}[${i}] links unknown section ${id}`); });
        it.secs = ids.filter(id => byId[id]);
      });
    };
    link(m.essays, ch.essays, 'essays'); link(m.rev, ch.revision, 'rev'); link(m.fc, ch.flashcards, 'fc');
    link(m.sa, ch.short, 'sa'); link(m.quiz, ch.quiz, 'quiz');
    (m.maps || []).forEach((sl, i) => { if (ch.maps[i]) ch.maps[i].sl = sl; });
    ch.secById = byId;
  });
  if (problems.length) console.warn('Metadata problems:\n' + problems.join('\n'));
  window.META_PROBLEMS = problems;
})();

LESSONS.c1s1 = {
  big: [`NLP is how we get computers to work with <b>human language</b>: the flexible, messy language people speak and write, not program code. The slide defines it as a subfield where three fields meet: <b>linguistics</b>, <b>computer science</b> and <b>information engineering</b>.`, `معالجة اللغة الطبيعية هي كيف نجعل الحواسيب تتعامل مع <b>اللغة البشرية</b>: اللغة المرنة التي يتكلم ويكتب بها الناس، لا الشيفرة البرمجية. وتعرّفها الشريحة كمجال فرعي يلتقي فيه ثلاثة مجالات: <b>علم اللغة</b> و<b>علوم الحاسب</b> و<b>هندسة المعلومات</b>.`],
  why: [`Every later lecture (tokenization, language models, classifiers, LLMs) is a tool for one goal from this definition: <b>processing and analyzing large amounts of natural-language data</b>.`, `كل محاضرة لاحقة (الترميز، النماذج اللغوية، المصنفات، النماذج الكبيرة) أداة لهدف واحد من هذا التعريف: <b>معالجة وتحليل كميات كبيرة من بيانات اللغة الطبيعية</b>.`],
  think: [`Why would a computer program that processes language need <i>linguistics</i>, not only computer science?`, `لماذا يحتاج برنامج يعالج اللغة إلى <i>علم اللغة</i> وليس علوم الحاسب فقط؟`, `To process language, the program needs knowledge of how language is built: sounds, word structure, sentence structure, meaning and context. Computer science supplies the algorithms, and information engineering handles storing and processing large amounts of data.`, `لأن البرنامج يحتاج معرفة ببنية اللغة: الأصوات وبنية الكلمة وبنية الجملة والمعنى والسياق. علوم الحاسب تقدم الخوارزميات، وهندسة المعلومات تتعامل مع تخزين البيانات الكبيرة ومعالجتها.`],
  steps: [
    [`<b>The object:</b> natural (human) language, such as English or Arabic.`, `<b>الموضوع:</b> اللغة الطبيعية (البشرية) مثل الإنجليزية أو العربية.`],
    [`<b>The interaction:</b> computers and human languages working together, which is what NLP is "concerned with".`, `<b>التفاعل:</b> عمل الحواسيب مع اللغات البشرية، وهذا ما "تهتم به" NLP.`],
    [`<b>The three fields:</b> linguistics (how language works), computer science (programs and algorithms), information engineering (handling large data).`, `<b>المجالات الثلاثة:</b> علم اللغة (كيف تعمل اللغة)، علوم الحاسب (البرامج والخوارزميات)، هندسة المعلومات (التعامل مع البيانات الكبيرة).`],
    [`<b>The goal:</b> program computers to <b>process and analyze large amounts</b> of natural-language data.`, `<b>الهدف:</b> برمجة الحواسيب لـ<b>معالجة وتحليل كميات كبيرة</b> من بيانات اللغة الطبيعية.`]
  ],
  analogy: [`NLP is like an interpreter standing between two people who don't share a language: people speak in flexible sentences full of context, while computers only follow exact instructions on numbers. NLP is the interpreter's skill set.`, `NLP مثل مترجم يقف بين شخصين لا يتكلمان لغة واحدة: البشر يتكلمون بجمل مرنة مليئة بالسياق، والحاسوب يتبع تعليمات دقيقة على الأرقام فقط. NLP هي مهارات هذا المترجم.`],

  steps: [
    [`<b>Vocabulary:</b> a set of words wᵢ, for example {the, cat, sat}.`, `<b>المفردات:</b> مجموعة كلمات wᵢ، مثل {the, cat, sat}.`],
    [`<b>Text:</b> a sequence of words from the vocabulary, for example "the cat sat". Order matters: it is a sequence, not a set.`, `<b>النص:</b> سلسلة كلمات من المفردات، مثل "the cat sat". الترتيب مهم: إنها سلسلة لا مجموعة.`],
    [`<b>Language:</b> the set of <i>all possible</i> texts that can be built.`, `<b>اللغة:</b> مجموعة <i>كل</i> النصوص الممكنة.`],
    [`<b>Natural vs artificial:</b> natural languages are used by people; artificial languages (like code) are designed for a purpose. NLP focuses on natural language.`, `<b>الطبيعية مقابل الاصطناعية:</b> اللغات الطبيعية يستخدمها البشر، والاصطناعية (مثل الشيفرة) مصممة لغرض معين. وتركز NLP على اللغة الطبيعية.`]
  ],
  analogy: [`Think of LEGO: the vocabulary is the box of bricks, a text is one model you build by placing bricks in order, and the language is every model that could ever be built from that box.`, `فكّر في مكعبات الليغو: المفردات هي صندوق القطع، والنص نموذج واحد تبنيه بترتيب القطع، واللغة كل النماذج الممكنة من هذا الصندوق.`],
  confuse: { a: [`Vocabulary`, `A set of <b>words</b>.`, `مجموعة من <b>الكلمات</b>.`], b: [`Language`, `A set of <b>texts</b> (all possible ones).`, `مجموعة من <b>النصوص</b> (كل النصوص الممكنة).`], why: [`Students often say "a language is a set of words". That is the vocabulary. The language is one level higher: all the texts you can make from those words.`, `يقول الطلاب كثيرًا "اللغة مجموعة كلمات"، وهذا تعريف المفردات. اللغة مستوى أعلى: كل النصوص الممكن تكوينها من هذه الكلمات.`] },
  check: [`"The cat sat" is best described as:`, `أفضل وصف لـ "The cat sat":`, [`a vocabulary`, `a text`, `a language`, `an artificial language`], 1, `It is one sequence of words from a vocabulary, so it is a text.`, `إنها سلسلة واحدة من الكلمات، فهي نص.`],
  remember: [`Words → texts → language: vocabulary = set of words, text = sequence of words, language = set of all possible texts.`, `كلمات ← نصوص ← لغة: المفردات مجموعة كلمات، والنص سلسلة كلمات، واللغة كل النصوص الممكنة.`],
  teach: [`Explain the three layers of a language and the difference between natural and artificial language.`, `اشرح طبقات اللغة الثلاث والفرق بين اللغة الطبيعية والاصطناعية.`, `A vocabulary is a set of words; a text is a sequence of words from that vocabulary; a language is the set of all possible texts. Natural languages are human languages like English and Arabic; artificial languages, such as programming languages, are designed for a specific purpose. NLP works on natural language.`, `المفردات مجموعة كلمات، والنص سلسلة كلمات منها، واللغة كل النصوص الممكنة. اللغات الطبيعية بشرية كالإنجليزية والعربية، والاصطناعية كلغات البرمجة مصممة لغرض محدد. وتعمل NLP على اللغة الطبيعية.`]
};

LESSONS.c1s3 = {
  big: [`The lecture lists <b>12 applications</b>. Instead of memorizing a random list, ask one question for each: <b>what goes in, and what comes out?</b> That single question tells most of them apart.`, `تسرد المحاضرة <b>12 تطبيقًا</b>. بدلًا من حفظ قائمة عشوائية اسأل سؤالًا واحدًا لكل منها: <b>ما المدخل وما المخرج؟</b> هذا السؤال يميّز معظمها.`],
  steps: [
    [`<b>Fix or predict text</b> (memory aid, not from the slides): <i>spell and grammar checking</i> finds errors and suggests alternatives; <i>word prediction</i> predicts the next word the user is likely to type.`, `<b>إصلاح النص أو التنبؤ به</b> (وسيلة للحفظ): <i>التدقيق الإملائي والنحوي</i> يجد الأخطاء ويقترح بدائل، و<i>التنبؤ بالكلمة</i> يتوقع الكلمة التالية.`],
    [`<b>Find information:</b> <i>information retrieval</i> finds information relevant to a query; <i>question answering</i> gives a short answer; <i>information extraction</i> fills template slots with concepts from text and includes <i>named-entity recognition</i>.`, `<b>إيجاد المعلومات:</b> <i>الاسترجاع</i> يجد معلومات ذات صلة بالاستعلام، و<i>الإجابة عن الأسئلة</i> تعطي إجابة قصيرة، و<i>الاستخراج</i> يملأ خانات قالب ويشمل <i>التعرّف على الكيانات المسماة</i>.`],
    [`<b>Label a whole text:</b> <i>text categorization</i> assigns a category (uClassify: Sports 92.8%); <i>sentiment analysis</i> identifies sentiments and opinions.`, `<b>وسم نص كامل:</b> <i>تصنيف النصوص</i> يسند فئة، و<i>تحليل المشاعر</i> يحدد المشاعر والآراء.`],
    [`<b>Produce new text:</b> <i>summarization</i> generates a short summary of one or more documents (sometimes for a query); <i>machine translation</i> translates between languages.`, `<b>إنتاج نص جديد:</b> <i>التلخيص</i> يولّد ملخصًا قصيرًا، و<i>الترجمة الآلية</i> تترجم بين اللغات.`],
    [`<b>Convert between forms:</b> <i>OCR</i> turns printed or handwritten text into computer-readable text; <i>speech recognition</i> turns speech into text; <i>speech synthesis</i> turns text into speech.`, `<b>التحويل بين الأشكال:</b> <i>OCR</i> يحوّل النص المطبوع أو المكتوب يدويًّا إلى نص رقمي، و<i>التعرّف على الكلام</i> يحوّل الكلام إلى نص، و<i>توليد الكلام</i> يحوّل النص إلى كلام.`]
  ],
  confuse: { a: [`Information retrieval`, `Returns <b>relevant documents or information</b>; you still read them.`, `يعيد <b>مستندات أو معلومات ذات صلة</b> وعليك قراءتها.`], b: [`Question answering`, `Returns <b>a short answer</b> directly (e.g. "Amifostine").`, `يعيد <b>إجابة قصيرة</b> مباشرة.`], why: [`Both start from a user's need for information. The difference is the output: a list to read vs the answer itself. Information extraction is different again: it turns free text into filled template slots.`, `كلاهما يبدأ من حاجة المستخدم للمعلومة، والفرق في المخرج: قائمة للقراءة مقابل الإجابة نفسها. أما الاستخراج فيحوّل النص الحر إلى خانات قالب مملوءة.`] },
  check: [`A phone app photographs a printed menu and turns it into editable text. Which application is this?`, `تطبيق يصوّر قائمة طعام مطبوعة ويحولها إلى نص قابل للتحرير. أي تطبيق هذا؟`, [`Speech recognition`, `Optical character recognition`, `Information extraction`, `Machine translation`], 1, `OCR recognizes printed or handwritten text and converts it to computer-readable text.`, `OCR يتعرف على النص المطبوع أو المكتوب يدويًّا ويحوّله إلى نص رقمي.`],
  remember: [`For each of the 12 applications, know its input → output, and that IE includes NER.`, `لكل تطبيق من الاثني عشر اعرف المدخل ← المخرج، وأن الاستخراج يشمل NER.`],
  teach: [`Explain information extraction using the lecture's medical example.`, `اشرح استخراج المعلومات باستخدام المثال الطبي في المحاضرة.`, `Information extraction pulls important concepts out of text and assigns them to slots in a template. The Lancet system reads clinical notes and labels the medication, dosage, manner, frequency, duration and reason, for example "ciprofloxacin 700 mg p.o. b.i.d. for 12 days for a presumed urinary tract infection". Recognizing named entities is part of IE.`, `استخراج المعلومات يستخرج المفاهيم المهمة من النص ويضعها في خانات قالب. نظام Lancet يقرأ الملاحظات الطبية ويحدد الدواء والجرعة والطريقة والتكرار والمدة والسبب. والتعرّف على الكيانات المسماة جزء منه.`]
};

LESSONS.c1s4 = {
