LESSONS.c7s1 = {
  big: [`An LLM is the same idea as Week 3's language model, predicting the next token, but done by a <b>very large neural network trained on very large text collections</b>. GPT-3, for example, has 96 layers and 175 billion parameters.`, `النموذج اللغوي الكبير هو فكرة الأسبوع 3 نفسها، التنبؤ بالرمز التالي، لكن بـ<b>شبكة عصبية كبيرة جدًّا مدربة على نصوص ضخمة جدًّا</b>. GPT-3 مثلًا فيه 96 طبقة و175 مليار معامل.`],
  links: ['c3s2', 'c6s9'],
  steps: [
    [`<b>Language model:</b> given a prefix, assign a probability to every possible next token. After "So long and thanks for", <i>all</i> and <i>the</i> are likely; <i>of</i> is not.`, `<b>النموذج اللغوي:</b> يُسند احتمالًا لكل رمز تالٍ بعد البادئة.`],
    [`<b>Training stages:</b> pretraining (this week) → instruction tuning → preference alignment → RL for reasoning (Week 13).`, `<b>مراحل التدريب:</b> تدريب مسبق ← ضبط التعليمات ← مواءمة التفضيلات ← تعلم معزز للاستدلال.`],
    [`<b>Masked language models</b> (encoders such as BERT) predict a <i>hidden</i> token using both sides, not the next token.`, `<b>النماذج المقنّعة</b> تتنبأ برمز مخفي من الجانبين.`]
  ],
  check: [`Which is the first training stage of an LLM?`, `ما أول مرحلة في تدريب النموذج الكبير؟`, [`Instruction tuning`, `Preference alignment`, `Pretraining`, `RL for reasoning`], 2, `Pretraining → instruction tuning → preference alignment → RL for reasoning.`, `التدريب المسبق أولًا.`],
  remember: [`LLM = large network trained on huge text to predict the next token (GPT-3: 96 layers, 175B). Stages: pretraining → instruction tuning → preference alignment → RL.`, `النموذج الكبير ومراحله الأربع.`]
};

LESSONS.c7s2 = {
  big: [`The lecture is organised around <b>five questions</b>: 1) Architecture: what can each position see? 2) Data: what text does it learn from? 3) Objective: what does it predict in training? 4) Task: do we need a label, a tag per token, or new text? 5) Generation: how do we choose the next token?`, `تُبنى المحاضرة حول <b>خمسة أسئلة</b>: البنية، البيانات، الهدف، المهمة، والتوليد.`],
  links: ['c6s1'],
  steps: [
    [`From Week 6, the <b>probability and loss maths stay the same</b>: logits, softmax, −log of the target probability.`, `من الأسبوع 6 <b>تبقى رياضيات الاحتمال والخسارة كما هي</b>.`],
    [`What changes is the <b>context</b>: tokens plus positional information, and <b>attention</b> over the permitted positions instead of a fixed window or a recurrent state.`, `ما يتغير هو <b>السياق</b>: رموز مع معلومات الموضع، و<b>انتباه</b> على المواضع المسموحة.`],
    [`Decoding settings such as top-p change token selection at inference; they <b>do not retrain</b> the model.`, `إعدادات فك الترميز تغيّر الاختيار عند الاستدلال و<b>لا تعيد التدريب</b>.`]
  ],
  remember: [`Five questions: architecture, data, objective, task, generation. Same maths as Week 6; new context: attention.`, `الأسئلة الخمسة، ونفس الرياضيات مع سياق جديد هو الانتباه.`]
};

LESSONS.c7s3 = {
  big: [`In a Transformer, each position builds its new representation by <b>attending</b> to the positions it is allowed to read. The whole difference between model families comes down to one rule: <b>which positions can each token see?</b>`, `في المحوّل يبني كل موضع تمثيله الجديد <b>بالانتباه</b> إلى المواضع المسموح له بقراءتها، والفرق كله بين العائلات يعود إلى قاعدة واحدة: <b>أي المواضع يراها كل رمز؟</b>`],
  action: { w: 'attention', cfg: { tokens: ['The', 'lecture', 'starts', 'at', '11:00'] }, cap: [`Click a row to choose a query position, then switch between causal and bidirectional. Position 3 reads 1–3 (causal) or 1–5 (bidirectional), as on slide 8.`, `انقر صفًّا لاختيار موضع ثم بدّل بين السببي والثنائي.`] },
  steps: [
    [`<b>Causal</b> (decoder): position t can read positions 1…t only. The visibility table is lower-triangular.`, `<b>السببي:</b> الموضع t يقرأ 1…t فقط.`],
    [`<b>Bidirectional</b> (encoder): every position reads every position.`, `<b>الثنائي:</b> كل موضع يقرأ الكل.`],
    [`Why is the diagonal allowed in causal attention? Because position t is trained to predict token <b>t + 1</b>, so seeing itself is fine; seeing t + 1 would be cheating.`, `لماذا القطر مسموح؟ لأن الموضع t يتنبأ بالرمز <b>t + 1</b>.`],
    [`Implementation: blocked scores are set to <b>−∞ before softmax</b>, so they get probability 0. Padding may need a separate mask. (How attention weights are computed with query, key and value is Week 11.)`, `الدرجات المحجوبة تُجعل <b>−∞ قبل softmax</b>.`]
  ],
  analogy: [`Causal attention is like writing an exam essay line by line: you can reread what you've written but not lines you haven't written yet. Bidirectional attention is like proofreading a finished essay: you can look anywhere.`, `السببي مثل كتابة مقال سطرًا سطرًا: تعيد قراءة ما كتبت لا ما لم تكتب، والثنائي مثل مراجعة مقال مكتمل.`],
  check: [`In causal self-attention, which positions can position 3 read?`, `في الانتباه السببي، أي المواضع يقرؤها الموضع 3؟`, [`3 only`, `1, 2, 3`, `1 to 5`, `3, 4, 5`], 1, `Positions up to and including itself.`, `حتى نفسه.`],
  remember: [`Causal: t reads 1…t (lower triangle, −∞ mask). Bidirectional: all positions.`, `السببي: 1…t، والثنائي: الكل.`],
  teach: [`Explain why an encoder may read right context while a causal decoder must block future targets (exit question 1).`, `اشرح لماذا يقرأ المرمِّز السياق الأيمن بينما يحجب المفكِّك المستقبل.`, `A causal decoder is trained to predict the next token, so if position t could read position t + 1, the answer would already be visible and the model would learn nothing useful; also, during generation future tokens do not exist yet. So the causal mask blocks them with −∞ before softmax. An encoder is given the whole input (to classify or tag it) and its masked-LM objective hides the answer by masking, so reading both sides simply gives each token a better representation.`, `المفكِّك يتنبأ بالرمز التالي، فلو رأى t + 1 لكانت الإجابة ظاهرة، والرموز المستقبلية غير موجودة أثناء التوليد. أما المرمِّز فيأخذ المدخل كاملًا ويخفي الإجابة بالإقناع، فقراءة الجانبين تحسّن التمثيل.`]
};

LESSONS.c7s4 = {
  big: [`Three Transformer families share the same building blocks but route information differently. <b>Encoder-only</b> reads everything and outputs a vector per token. <b>Decoder-only</b> reads left-to-right and continues text. <b>Encoder-decoder</b> reads a full source, then writes a new target sequence.`, `ثلاث عائلات تشترك في المكونات وتختلف في تدفق المعلومات: <b>المرمِّز فقط</b> يقرأ الكل ويخرج متجهًا لكل رمز، و<b>المفكِّك فقط</b> يقرأ من اليسار ويكمل النص، و<b>المرمِّز-المفكِّك</b> يقرأ المصدر كاملًا ثم يكتب هدفًا جديدًا.`],
  links: ['c7s3'],
  steps: [
    [`<b>Encoder-only (BERT, RoBERTa):</b> bidirectional; one contextual vector per token; a head maps vectors to labels. Use: sequence classification, token labelling, extractive QA. Standard BERT has no left-to-right generation loop.`, `<b>المرمِّز فقط:</b> ثنائي ومتجه لكل رمز، للتصنيف والوسم.`],
    [`<b>Decoder-only (GPT-style):</b> causal; a vocabulary distribution at every position; generation extends the prefix: &lt;BOS&gt; → I → like → NLP → &lt;EOS&gt;.`, `<b>المفكِّك فقط:</b> سببي ويكمل البادئة.`],
    [`<b>Encoder-decoder (T5, BART):</b> the encoder reads the full source; decoder self-attention reads earlier target tokens; <b>cross-attention</b> lets every decoder position read the encoder's outputs. Use: translation, summarization ("The lecture moved from 10:00 to 11:00." → "Lecture starts at 11:00.").`, `<b>المرمِّز-المفكِّك:</b> المرمِّز يقرأ المصدر، والانتباه المتقاطع يسمح للمفكِّك بقراءة مخرجاته، للترجمة والتلخيص.`],
    [`These are tendencies, not rules: fine-tuning and prompting can adapt any family to several tasks.`, `هذه ميول لا قواعد.`]
  ],
  confuse: { a: [`Decoder self-attention`, `Reads <b>earlier target tokens</b> (what it has written so far).`, `يقرأ <b>رموز الهدف السابقة</b>.`], b: [`Cross-attention`, `Reads the <b>encoder outputs for the full source</b>.`, `يقرأ <b>مخرجات المرمِّز للمصدر كاملًا</b>.`], why: [`Both live in the decoder of an encoder-decoder model. Self-attention looks at its own output so far; cross-attention looks over at the source. Neither may see future target tokens.`, `كلاهما في المفكِّك: الذاتي ينظر لما كتبه، والمتقاطع ينظر للمصدر، ولا يرى أي منهما رموز الهدف المستقبلية.`] },
  check: [`Which family is a natural starting point for tagging every word in a complete sentence?`, `أي عائلة مناسبة لوسم كل كلمة في جملة كاملة؟`, [`Decoder-only`, `Encoder-only`, `Encoder-decoder`, `None`], 1, `Both directions help each token's representation, and no text needs to be generated.`, `الاتجاهان يفيدان تمثيل كل رمز ولا حاجة للتوليد.`],
  remember: [`Encoder-only (BERT): both sides → vectors → labels. Decoder-only (GPT): left → continuation. Encoder-decoder (T5, BART): full source + cross-attention → new sequence.`, `المرمِّز للوسوم، والمفكِّك للتكملة، والمرمِّز-المفكِّك للتوليد المشروط.`]
};

LESSONS.c7s5 = {
  big: [`A model can only learn from the evidence it sees, so <b>pretraining data</b> matters. It starts as huge web crawls plus curated text, goes through quality and safety filters, and is tokenised into sequences. Keep two ideas apart: <b>data decides what evidence the model sees; the objective decides what it predicts from that evidence.</b>`, `النموذج لا يتعلم إلا من الدليل الذي يراه، لذا <b>بيانات التدريب المسبق</b> مهمة: زحف ويب ونصوص منتقاة، ثم تصفية للجودة والأمان، ثم ترميز. وافصل بين فكرتين: <b>البيانات تحدد الدليل، والهدف يحدد ما يُتنبأ به.</b>`],
  steps: [
    [`<b>Sources:</b> Common Crawl snapshots, Wikipedia, books, code.`, `<b>المصادر:</b> Common Crawl وويكيبيديا والكتب والشيفرات.`],
    [`<b>Quality filtering:</b> remove duplicates, boilerplate and adult content.`, `<b>تصفية الجودة:</b> إزالة التكرار والنصوص المتكررة والمحتوى غير اللائق.`],
    [`<b>Safety filtering:</b> a classifier removes toxic text, but such classifiers can wrongly flag minority dialects.`, `<b>تصفية الأمان:</b> مصنف يزيل النص المسيء وقد يخطئ مع لهجات الأقليات.`],
    [`<b>Tokenisation:</b> cleaned text becomes token sequences for the objective. Example mix (LLaMA): Common Crawl 67%, C4 15%, GitHub/Wikipedia/Books 4.5% each, ArXiv 2.5%, StackExchange 2%.`, `<b>الترميز:</b> يتحول النص إلى سلاسل، ومزيج LLaMA مثال.`]
  ],
  check: [`What is the difference between pretraining data and the pretraining objective?`, `ما الفرق بين بيانات التدريب المسبق وهدفه؟`, [`They are the same thing`, `Data = the evidence seen; objective = what is predicted from it`, `Data is for fine-tuning only`, `The objective chooses the data sources`], 1, `This is exit question 2 on slide 46.`, `هذا سؤال الخروج 2.`],
  remember: [`Sources → quality filter → safety filter (dialect risk) → tokenise. Data = evidence; objective = prediction.`, `المصادر ← الجودة ← الأمان ← الترميز. البيانات دليل والهدف تنبؤ.`]
};

LESSONS.c7s6 = {
  big: [`Pretraining is <b>self-supervised</b>: the text itself provides the answers. There are three ways to turn raw text into a prediction task, one for each family.`, `التدريب المسبق <b>ذاتي الإشراف</b>: النص يوفر الإجابات، وهناك ثلاث طرق لتحويله إلى مهمة تنبؤ، واحدة لكل عائلة.`],
  steps: [
    [`<b>Causal LM</b> (decoder): input = a prefix; target = the next original token.`, `<b>السببي:</b> المدخل بادئة والهدف الرمز التالي.`],
    [`<b>Masked LM</b> (encoder): input = text with selected tokens manipulated; target = the original tokens at those positions.`, `<b>المقنّع:</b> المدخل نص فيه رموز معدلة والهدف الرموز الأصلية.`],
    [`<b>Denoising</b> (encoder-decoder): input = a corrupted source; target = the clean sequence or its missing spans.`, `<b>إزالة التشويش:</b> المدخل مصدر مشوّه والهدف النص النظيف أو المقاطع.`],
    [`"Self-supervised" means the targets come from the data; training still uses an explicit loss (cross-entropy).`, `الأهداف من البيانات مع خسارة صريحة.`]
  ],
  remember: [`Causal: prefix → next token. MLM: corrupted input → original selected tokens. Denoising: corrupted source → clean text/spans.`, `السببي والمقنّع وإزالة التشويش.`]
};

LESSONS.c7s7 = {
  big: [`For a causal model, the targets are simply the input <b>shifted by one</b>: the position that reads "like" must predict "NLP". During training the model is always fed the <b>correct</b> earlier tokens (teacher forcing), even if it would have guessed wrong.`, `في النموذج السببي الأهداف هي المدخل <b>مزاحًا بموضع</b>: الموضع الذي يقرأ like يتنبأ بـ NLP. وأثناء التدريب يُعطى النموذج الرموز السابقة <b>الصحيحة</b> دائمًا (teacher forcing).`],
  links: ['c6s9', 'c6s13'],
  steps: [
    [`Input &lt;BOS&gt; → target I; input I → like; input like → NLP; input NLP → &lt;EOS&gt;.`, `&lt;BOS&gt; ← I، I ← like، like ← NLP، NLP ← &lt;EOS&gt;.`],
    [`The causal mask blocks later positions; every non-padding target contributes a loss.`, `القناع يحجب اللاحق، وكل هدف غير حشو يساهم.`],
    [`<b>Teacher forcing:</b> training feeds the correct earlier tokens; generation feeds the model's own earlier choices.`, `<b>Teacher forcing:</b> التدريب بالرموز الصحيحة والتوليد باختيارات النموذج.`],
    [`<b>Loss by hand:</b> target probabilities 0.5, 0.8, 0.4, 0.9 → −ln: 0.6931, 0.2231, 0.9163, 0.1054 → mean ≈ <b>0.4845 nats</b>. "NLP" adds the most loss because it got the lowest probability.`, `<b>الخسارة:</b> المتوسط ≈ 0.4845، وNLP الأكبر.`]
  ],
  analogy: [`Teacher forcing is like practising a song with the recording playing: even if you hit a wrong note, the next bar starts from the correct one. On stage (generation) you have to continue from whatever you actually played.`, `مثل التدرب على أغنية مع التسجيل: حتى لو أخطأت تبدأ الجملة التالية من الصحيح، أما على المسرح (التوليد) فتكمل مما عزفته فعلًا.`],
  check: [`Causal LM on "&lt;BOS&gt; I like NLP": what is the target at the position whose input is "like"?`, `ما الهدف في الموضع الذي مدخله like؟`, [`I`, `like`, `NLP`, `&lt;EOS&gt;`], 2, `Slide 25: the position reading "like" predicts the next original token, NLP.`, `الشريحة 25: NLP.`],
  remember: [`Targets = input shifted by one; teacher forcing in training; mean loss example 0.4845 nats.`, `الأهداف مزاحة، وteacher forcing، والمثال 0.4845.`]
};

LESSONS.c7s8 = {
  big: [`An encoder sees the whole sentence, so asking it to predict "starts" in "The lecture starts at 11:00" would be pointless: the answer is right there. <b>Masked language modelling</b> hides it first: "The lecture [MASK] at 11:00", and the model must recover "starts" from the remaining context.`, `المرمِّز يرى الجملة كاملة، فطلب التنبؤ بـ starts منها عديم الفائدة لأن الإجابة ظاهرة. <b>النمذجة المقنّعة</b> تخفيها أولًا: "The lecture [MASK] at 11:00" فيستعيدها النموذج من السياق.`],
  links: ['c7s3'],
  action: { w: 'mlm', cfg: { tokens: ['So', 'long', 'and', 'thanks', 'for', 'all', 'the', 'fish'], sel: [1, 3, 6] }, cap: [`Slide 20's sentence with long, thanks and the selected. Click words to change the selection and watch the loss denominator.`, `جملة الشريحة 20 مع اختيار long وthanks وthe. غيّر الاختيار وراقب المقام.`] },
  steps: [
    [`Keep the original tokens as targets before corrupting the input.`, `احفظ الرموز الأصلية قبل التشويش.`],
    [`In the figure, two selected positions are masked (long, thanks) and one is replaced by a random token ("apricot" instead of "the").`, `موضعان مقنّعان وموضع مستبدل بـ apricot.`],
    [`<b>Only selected positions get a loss.</b> −ln 0.8 = 0.2231 (long), −ln 0.25 = 1.3863 (thanks), −ln 0.5 = 0.6931 (the) → mean = <b>0.7675</b>, dividing by <b>3</b>, not 8.`, `<b>الخسارة على المختار فقط:</b> 0.7675 والمقام 3 لا 8.`],
    [`Unselected tokens get no direct loss, but they still matter: they are the context the encoder reads from both sides.`, `غير المختارة بلا خسارة لكنها السياق.`]
  ],
  check: [`A 40-token sentence has exactly 6 selected MLM positions. The loss denominator is:`, `جملة من 40 رمزًا فيها 6 مواضع مختارة. المقام:`, [`40`, `34`, `6`, `1`], 2, `Average over the 6 selected targets (slide 25).`, `متوسط على 6 أهداف.`],
  remember: [`MLM: hide selected tokens ([MASK] or random), predict the originals, average loss over selected positions only (example 0.7675 ÷ 3).`, `MLM: الخسارة على المواضع المختارة فقط، والمثال 0.7675.`],
  teach: [`Explain which MLM targets receive a direct loss and why unselected tokens still matter (exit question 3).`, `اشرح أي أهداف MLM تتلقى خسارة ولماذا تبقى غير المختارة مهمة.`, `Only the selected positions, whether replaced by [MASK] or by a random token, receive a direct loss: the model must predict the original token there, and the loss is averaged over the number of selected positions (3 in the lecture example, giving 0.7675 nats). The unselected tokens have no loss of their own, but they still matter because they are the context the bidirectional encoder reads, from both sides, to make those predictions.`, `المواضع المختارة فقط تتلقى خسارة ويُحسب المتوسط عليها. وغير المختارة مهمة لأنها السياق الذي يقرؤه المرمِّز من الجانبين.`]
};

LESSONS.c7s9 = {
  big: [`Encoder-decoder models like T5 learn by <b>denoising</b>: cut spans out of a sentence, give the damaged version to the encoder, and train the decoder to write the missing spans back.`, `نماذج مثل T5 تتعلم <b>بإزالة التشويش</b>: نقطع مقاطع من الجملة ونعطي النسخة التالفة للمرمِّز وندرّب المفكِّك على كتابة المقاطع المفقودة.`],
  steps: [
    [`Original: "The lecture starts at 11:00 in room 1090."`, `الأصل: "The lecture starts at 11:00 in room 1090."`],
    [`Encoder input: "The lecture [missing span] in room [missing span]."`, `مدخل المرمِّز: مع مقطعين مفقودين.`],
    [`Decoder target: "starts at 11:00 | 1090". One marker can hide several tokens, so input and target lengths can differ. (Real T5 uses a distinct sentinel token for each span.)`, `هدف المفكِّك: "starts at 11:00 | 1090"، وقد يختلف الطول.`],
    [`The decoder uses the corrupted source (through cross-attention) and its own earlier target tokens.`, `يستخدم المفكِّك المصدر المشوّه ورموزه السابقة.`]
  ],
  confuse: { a: [`MLM (encoder)`, `Predicts <b>single selected tokens</b> in place; output length = input length.`, `يتنبأ <b>برموز مختارة</b> في مكانها.`], b: [`Span denoising (encoder-decoder)`, `<b>Generates the missing spans</b> as a new sequence; lengths can differ.`, `<b>يولّد المقاطع المفقودة</b> كسلسلة جديدة.`], why: [`Both hide parts of the input. The difference is who answers and how: the encoder fills positions in place; the decoder writes the answer out as text.`, `كلاهما يخفي أجزاء، والفرق: المرمِّز يملأ المواضع والمفكِّك يكتب الإجابة نصًّا.`] },
  check: [`In conditional generation, can the decoder read the full source? Future target tokens?`, `في التوليد المشروط، هل يقرأ المفكِّك المصدر كاملًا؟ والأهداف المستقبلية؟`, [`Yes / yes`, `Yes / no`, `No / yes`, `No / no`], 1, `Full source and earlier targets: yes. Future targets: blocked.`, `المصدر نعم، والمستقبل محجوب.`],
  remember: [`T5-style denoising: spans hidden in the encoder input; the decoder generates them. Every objective uses cross-entropy over its chosen targets; exclude padding.`, `إزالة التشويش: المفكِّك يولّد المقاطع، وكل الأهداف بالإنتروبيا المتقاطعة.`]
};

LESSONS.c7s10 = {
  big: [`Before choosing a model, ask <b>what output the task needs</b>: a label for the whole text, a tag for each token, or new text. Only new text needs a decoding strategy.`, `قبل اختيار النموذج اسأل <b>ما المخرج المطلوب</b>: وسم للنص، أم وسم لكل رمز، أم نص جديد؟ والنص الجديد وحده يحتاج فك ترميز.`],
  links: ['c7s4'],
  steps: [
    [`<b>Tag every word of a complete sentence</b> → encoder-only (both directions help each token). No generation.`, `<b>وسم كل كلمة</b> ← المرمِّز فقط، بلا توليد.`],
    [`<b>Summary that keeps consulting the source</b> → encoder-decoder (separate source encoding and target generation). Generates text.`, `<b>ملخص يرجع للمصدر</b> ← المرمِّز-المفكِّك، يولّد نصًّا.`],
    [`<b>Continue a supplied prefix</b> → decoder-only (causal prediction matches the output process). Generates text.`, `<b>تكملة بادئة</b> ← المفكِّك فقط، يولّد نصًّا.`]
  ],
  check: [`Which task does NOT need a decoding strategy?`, `أي مهمة لا تحتاج فك ترميز؟`, [`Summarizing a report`, `Continuing a story`, `Classifying feedback as positive/negative/neutral`, `Translating a sentence`], 2, `It stops at a label: argmax over three classes (exit question 4).`, `يتوقف عند وسم (سؤال الخروج 4).`],
  remember: [`Label / tag per token → encoder, no decoding. Source-conditioned text → encoder-decoder. Continuation → decoder.`, `الوسم ← مرمِّز، والنص المشروط ← مرمِّز-مفكِّك، والتكملة ← مفكِّك.`]
};

LESSONS.c7s11 = {
  big: [`Generation is a loop: the model gives probabilities for the next token, a <b>decoding rule</b> picks one, the pick is appended to the prefix, and the loop repeats until a stop token. The model supplies the probabilities; the decoding rule decides what happens.`, `التوليد حلقة: النموذج يعطي الاحتمالات، و<b>قاعدة فك الترميز</b> تختار رمزًا، ويُضاف للبادئة، ويتكرر ذلك حتى رمز التوقف.`],
  links: ['c3s21'],
  steps: [
    [`Compute logits → form probabilities → select a token → append it → check the stopping rule.`, `logits ← احتمالات ← اختيار ← إضافة ← فحص التوقف.`],
    [`"I would like" → tea → please → &lt;EOS&gt;.`, `"I would like" ← tea ← please ← &lt;EOS&gt;.`],
    [`The running example distribution after "I would like": tea 0.40, coffee 0.25, water 0.20, juice 0.10, milk 0.05 (supplied teaching values).`, `التوزيع المثال: tea 0.40، coffee 0.25، water 0.20، juice 0.10، milk 0.05.`]
  ],
  remember: [`Logits → probabilities → select → append → stop? The next distribution depends on what was selected.`, `حلقة التوليد، والتوزيع التالي يعتمد على الاختيار.`]
};

LESSONS.c7s12 = {
  big: [`<b>Greedy decoding</b> always takes the single best next token. It is simple and deterministic, but short-sighted: the best first step doesn't always start the best sentence. <b>Beam search</b> keeps several partial sentences alive, so it can find a better overall path.`, `<b>فك الترميز الجشع</b> يأخذ دائمًا الرمز الأفضل؛ بسيط وحتمي لكنه قصير النظر. أما <b>البحث الحزمي</b> فيبقي عدة جمل جزئية حية فيجد مسارًا أفضل إجمالًا.`],
  think: [`After "I would like": tea 0.50, coffee 0.30, water 0.20. After tea: please 0.52, now 0.48. After coffee: please 0.90, now 0.10. Which two-word continuation is most probable overall?`, `أي تكملة من كلمتين هي الأعلى احتمالًا إجمالًا؟`, `coffee please: 0.30 × 0.90 = 0.27, which beats tea please: 0.50 × 0.52 = 0.26. Greedy grabs tea first and never finds it.`, `coffee please = 0.27 وهي أكبر من tea please = 0.26، والجشع يأخذ tea أولًا فلا يجدها.`],
  action: { steps: [[`<b>Greedy, step 1:</b> pick the best first token: tea (0.50).`, `<b>الجشع 1:</b> tea.`], [`<b>Greedy, step 2:</b> after tea pick please (0.52). Result "tea please" = 0.50 × 0.52 = <b>0.26</b>.`, `<b>الجشع 2:</b> tea please = 0.26.`], [`<b>Beam (width 2), step 1:</b> keep the best two: tea (0.50) and coffee (0.30); prune water (0.20).`, `<b>الحزمي 1:</b> يبقي tea وcoffee.`], [`<b>Beam, step 2:</b> score all four continuations: coffee please 0.270, tea please 0.260, tea now 0.240, coffee now 0.030. Keep the best two.`, `<b>الحزمي 2:</b> النتائج الأربع.`], [`<b>Result:</b> the best complete sequence is "coffee please" (<b>0.27</b>). Beam search kept coffee alive long enough to find it.`, `<b>النتيجة:</b> coffee please = 0.27.`]], cap: [`Slides 32–33, one move at a time.`, `الشريحتان 32–33 خطوة بخطوة.`] },
  analogy: [`Greedy is a hiker who always takes the steepest-looking path up; beam search sends a few scouts down the most promising paths and compares where they end up.`, `الجشع متسلق يأخذ دائمًا أكثر طريق يبدو صاعدًا، والبحث الحزمي يرسل بضعة مستكشفين في أكثر الطرق وعدًا ويقارن أين وصلوا.`],
  check: [`What does beam search (width 2) return in the lecture example?`, `ماذا يعيد البحث الحزمي (عرض 2) في المثال؟`, [`tea please`, `coffee please`, `tea now`, `water please`], 1, `0.30 × 0.90 = 0.27 > 0.26.`, `0.27 أكبر من 0.26.`],
  remember: [`Greedy: best token each step (tea please 0.26). Beam width 2 keeps 2 partials → coffee please 0.27. Beam suits MT; open-ended LLMs usually sample.`, `الجشع 0.26 والحزمي 0.27.`]
};

LESSONS.c7s13 = {
  big: [`For creative, varied text we <b>sample</b>: draw the next token at random, with each token's chance equal to its probability. <b>Temperature</b> reshapes the distribution first: below 1 sharpens it toward the top token, above 1 flattens it.`, `للنص المتنوع <b>نعاين</b>: نسحب الرمز عشوائيًّا بفرصة تساوي احتماله. و<b>الحرارة</b> تعيد تشكيل التوزيع أولًا: أقل من 1 تحدّه نحو الأعلى وأكبر من 1 تسطّحه.`],
  action: { w: 'decode', cfg: { labels: ['tea', 'coffee', 'water', 'juice', 'milk'], p: [0.40, 0.25, 0.20, 0.10, 0.05] }, cap: [`Set T = 0.5: tea should rise to 0.5818 (slide 37). Set T = 2: tea falls to 0.2984. Press "Sample a token" several times and watch the variety change.`, `اجعل T = 0.5 فيرتفع tea إلى 0.5818، وT = 2 فينخفض إلى 0.2984، واضغط "Sample" عدة مرات.`] },
  steps: [
    [`<b>Sampling intervals:</b> tea [0, 0.40), coffee [0.40, 0.65), water [0.65, 0.85), juice [0.85, 0.95), milk [0.95, 1). A draw u = 0.70 picks water.`, `<b>فترات المعاينة:</b> u = 0.70 يختار water.`],
    [`<b>Problem:</b> a real vocabulary has a long tail of unlikely tokens; together they get picked often enough to produce odd text.`, `<b>المشكلة:</b> الذيل الطويل من الرموز غير المحتملة.`],
    [`<b>Temperature:</b> pᵢ(T) = exp(zᵢ/T) / Σⱼ exp(zⱼ/T), T &gt; 0.`, `<b>الحرارة:</b> pᵢ(T) = exp(zᵢ/T) / Σ exp(zⱼ/T).`],
    [`With only probabilities: raise each to the power 1/T and renormalise. T = 0.5 → square: 0.16, 0.0625, 0.04, 0.01, 0.0025 (total 0.275) → tea 0.16/0.275 = <b>0.5818</b>.`, `بالاحتمالات فقط: ارفع للأس 1/T وطبّع، فيصبح tea = 0.5818.`],
    [`Temperature never changes the ranking, so the greedy (argmax) choice stays tea.`, `الحرارة لا تغيّر الترتيب فيبقى اختيار الجشع tea.`]
  ],
  confuse: { a: [`T &lt; 1`, `<b>Sharper</b>: top token gains (tea 0.40 → 0.58). Safer, less varied.`, `<b>أحدّ</b>: الأعلى يزداد.`], b: [`T &gt; 1`, `<b>Flatter</b>: rare tokens gain (tea 0.40 → 0.30). More varied, riskier.`, `<b>أسطح</b>: النادرة تزداد.`], why: [`Neither changes which token is most likely. Temperature changes how much the others get a chance.`, `لا يغيّر أي منهما الرمز الأعلى، بل فرصة البقية.`] },
  check: [`At T = 0.5, does tea's sampling probability rise or fall, and does the argmax change?`, `عند T = 0.5 هل يرتفع احتمال tea، وهل يتغير الأعلى؟`, [`Rises; argmax changes`, `Rises; argmax stays tea`, `Falls; argmax stays tea`, `Falls; argmax changes`], 1, `0.40 → 0.5818; ranking is preserved.`, `يرتفع إلى 0.5818 ويبقى tea.`],
  remember: [`Sampling: chance = probability (u = 0.70 → water). Temperature: T &lt; 1 sharpen (tea 0.58), T &gt; 1 flatten (tea 0.30); argmax unchanged.`, `الحرارة تحد أو تسطّح ولا تغيّر الأعلى.`]
};

LESSONS.c7s14 = {
  big: [`To stop the long tail producing odd words, we <b>filter</b> before sampling. <b>Top-k</b> keeps a fixed number of best tokens. <b>Top-p (nucleus)</b> keeps the smallest set of best tokens whose probabilities add up to p. Then we renormalise and sample from what is left.`, `لمنع الذيل الطويل من إنتاج كلمات غريبة <b>نرشّح</b> قبل المعاينة: <b>top-k</b> يبقي عددًا ثابتًا من الأفضل، و<b>top-p</b> يبقي أصغر مجموعة يبلغ مجموعها p، ثم نعيد التطبيع ونعاين.`],
  links: ['c7s13'],
  action: { w: 'decode', cfg: { labels: ['tea', 'coffee', 'water', 'juice', 'milk'], p: [0.40, 0.25, 0.20, 0.10, 0.05] }, cap: [`Slide 41's practice: set top-k = 2 (expect 0.6154 / 0.3846), then reset and set top-p = 0.8 (expect tea, coffee, water: 0.4706 / 0.2941 / 0.2353).`, `تمرين الشريحة 41: top-k = 2 ثم top-p = 0.8 وقارن النتائج.`] },
  steps: [
    [`<b>Top-k = 2:</b> keep tea and coffee (mass 0.65) → 0.40/0.65 = 0.6154 and 0.25/0.65 = 0.3846. k = 1 is just greedy.`, `<b>top-k = 2:</b> tea وcoffee ← 0.6154 و0.3846.`],
    [`<b>Top-p = 0.80:</b> cumulative 0.40, 0.65, 0.85. The first three reach 0.80, and we keep the token that crosses the threshold (water) → [0.4706, 0.2941, 0.2353].`, `<b>top-p = 0.80:</b> أول ثلاثة تتجاوز العتبة ← [0.4706, 0.2941, 0.2353].`],
    [`<b>Adaptive vs fixed:</b> for [0.90, 0.04, 0.03, 0.02, 0.01], top-p = 0.8 keeps 1 token, top-k = 2 keeps 2. For [0.22, 0.21, 0.20, 0.19, 0.18], top-p keeps 4, top-k still 2.`, `<b>متكيف مقابل ثابت:</b> التوزيع الحاد يُبقي فيه top-p رمزًا واحدًا، والمسطح أربعة.`],
    [`They can be combined: top-k first as a hard filter, then top-p. Neither guarantees factual correctness.`, `يمكن دمجهما: top-k ثم top-p، ولا يضمن أي منهما الصحة.`]
  ],
  confuse: { a: [`Top-k`, `The <b>count k</b> decides the retained set (always k tokens).`, `<b>العدد k</b> يحدد المجموعة.`], b: [`Top-p`, `The <b>cumulative probability mass p</b> decides it (the size adapts).`, `<b>الكتلة التراكمية p</b> تحددها (الحجم متكيف).`], why: [`Exit question 5 asks exactly this. Also remember to include the token that crosses p, and always renormalise.`, `سؤال الخروج 5 يسأل هذا تمامًا، وتذكّر الرمز المتجاوز وإعادة التطبيع.`] },
  check: [`For [0.40, 0.25, 0.20, 0.10, 0.05], top-p = 0.80 keeps how many tokens?`, `top-p = 0.80 يبقي كم رمزًا؟`, [`1`, `2`, `3`, `5`], 2, `0.40 + 0.25 = 0.65 < 0.80; adding water gives 0.85 ≥ 0.80.`, `0.65 أقل من 0.80، وبإضافة water تصبح 0.85.`],
  remember: [`Top-k = fixed count (k = 2 → 0.6154 / 0.3846). Top-p = smallest set reaching p (0.8 → 3 tokens, 0.4706 / 0.2941 / 0.2353). Renormalise, then sample.`, `top-k عدد ثابت وtop-p كتلة، ثم إعادة التطبيع.`],
  teach: [`Explain the difference between top-k and top-p with the lecture's numbers.`, `اشرح الفرق بين top-k وtop-p بأرقام المحاضرة.`, `Both filter the distribution before sampling and then renormalise the kept probabilities. Top-k keeps a fixed number of the most probable tokens: with k = 2 we keep tea (0.40) and coffee (0.25), giving 0.6154 and 0.3846. Top-p keeps the smallest sorted set whose cumulative probability reaches p, including the token that crosses it: with p = 0.80 we keep tea, coffee and water (0.85), giving 0.4706, 0.2941 and 0.2353. So the count decides top-k's set, while the probability mass decides top-p's, which adapts to peaked or flat distributions.`, `كلاهما يرشّح ثم يعيد التطبيع. top-k يبقي عددًا ثابتًا (tea وcoffee ← 0.6154 و0.3846)، وtop-p يبقي أصغر مجموعة تبلغ p (ثلاثة رموز ← 0.4706 و0.2941 و0.2353)، فالعدد يحدد الأول والكتلة تحدد الثاني ويتكيف حجمه.`]
};

/* ================= interactive learning widgets =================
   Each widget is mounted into <div class="widget" data-w="name" data-cfg='{"...":...}'>.
   Widgets compute their results live, so the numbers always follow the lecture's formulas.
*/
const WIDGETS = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f = (x, d = 4) => (Number.isFinite(x) ? (Math.abs(x) >= 1e-3 || x === 0 ? (+x.toFixed(d)).toString() : x.toExponential(2)) : '—');
  const q = (el, s) => el.querySelector(s);
  const qa = (el, s) => Array.from(el.querySelectorAll(s));
  const bar = (v, max = 1, cls = '') => `<span class="w-bar ${cls}"><i style="width:${Math.max(0, Math.min(100, 100 * v / (max || 1)))}%"></i></span>`;
  const W = {};

  /* ---------- Lecture 1: sort applications by difficulty (slide 21) ---------- */
  W.sorter = (el, cfg) => {
    const cats = cfg.cats, items = cfg.items; const pick = {};
    el.innerHTML = `<div class="w-rows">${items.map((it, i) => `<div class="w-sort-row" data-i="${i}"><span class="w-sort-name">${esc(it[0])}</span><span class="w-seg">${cats.map((c, j) => `<button type="button" data-j="${j}">${esc(c)}</button>`).join('')}</span><span class="w-mark"></span></div>`).join('')}</div>
      <div class="w-controls"><button type="button" class="btn small primary" data-x="check">Check my sorting</button><button type="button" class="btn small" data-x="reset">Reset</button><span class="w-msg" aria-live="polite"></span></div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.j != null) { const row = b.closest('.w-sort-row'); pick[row.dataset.i] = +b.dataset.j; qa(row, '.w-seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); row.classList.remove('ok', 'bad'); q(row, '.w-mark').textContent = ''; }
      if (b.dataset.x === 'reset') { for (const k in pick) delete pick[k]; qa(el, '.w-seg button').forEach(x => x.setAttribute('aria-pressed', 'false')); qa(el, '.w-sort-row').forEach(r => { r.classList.remove('ok', 'bad'); q(r, '.w-mark').textContent = ''; }); q(el, '.w-msg').textContent = ''; }
      if (b.dataset.x === 'check') {
        let ok = 0, done = 0;
        qa(el, '.w-sort-row').forEach(r => { const i = r.dataset.i, p = pick[i]; if (p == null) return; done++; const good = p === items[i][1]; ok += good; r.classList.toggle('ok', good); r.classList.toggle('bad', !good); q(r, '.w-mark').textContent = good ? '✓' : '→ ' + cats[items[i][1]]; });
        q(el, '.w-msg').textContent = done < items.length ? `Sorted ${done}/${items.length}. ${ok} correct so far.` : `${ok}/${items.length} correct.${ok === items.length ? ' Perfect.' : ''}`;
      }
    });
  };

  /* ---------- Lecture 2: count instances and types (slides 8–9) ---------- */
  W.counter = (el, cfg) => {
    el.innerHTML = `<label class="w-lab">Sentence<textarea rows="2" data-k="t">${esc(cfg.text)}</textarea></label>
      <div class="w-controls"><label><input type="checkbox" data-k="mw"> Treat "San Francisco" / "New York" as one token</label><label><input type="checkbox" data-k="lc"> Lowercase</label><label><input type="checkbox" data-k="lem"> Lemmatise plural "stars" → "star"</label></div><div class="w-out"></div>`;
    const run = () => {
      let t = q(el, '[data-k=t]').value.trim(); if (q(el, '[data-k=lc]').checked) t = t.toLowerCase();
      if (q(el, '[data-k=mw]').checked) t = t.replace(/San Francisco/gi, m => m.replace(' ', '_')).replace(/New York/gi, m => m.replace(' ', '_'));
      let toks = t.split(/\s+/).filter(Boolean); if (q(el, '[data-k=lem]').checked) toks = toks.map(w => w === 'stars' ? 'star' : w);
      const cnt = {}; toks.forEach(w => cnt[w] = (cnt[w] || 0) + 1); const rep = Object.entries(cnt).filter(([, n]) => n > 1);
      q(el, '.w-out').innerHTML = `<div class="w-chips">${toks.map(w => `<span class="w-chip ${cnt[w] > 1 ? 'rep' : ''}">${esc(w.replace('_', ' '))}</span>`).join('')}</div>
        <div class="w-stats"><div><b>${toks.length}</b><span>N (instances)</span></div><div><b>${Object.keys(cnt).length}</b><span>|V| (types)</span></div></div>
        <p class="w-note">${rep.length ? 'Repeated types (highlighted): ' + rep.map(([w, n]) => `<b>${esc(w.replace('_', ' '))}</b> ×${n}`).join(', ') + `. Each repeat adds to N but not to |V|.` : 'No repeated types.'}</p>`;
    };
    el.addEventListener('input', run); run();
  };

  /* ---------- Lecture 2: Heaps' law (slides 10–11) ---------- */
  W.heaps = el => {
    el.innerHTML = `<div class="w-controls"><label>Corpus size N: <b data-o="n"></b><input type="range" min="3" max="12" step="0.1" value="6" data-k="n"></label><label>β = <b data-o="b"></b><input type="range" min="0.3" max="0.8" step="0.01" value="0.5" data-k="b"></label><label>k = <b data-o="k"></b><input type="range" min="5" max="100" step="1" value="30" data-k="k"></label></div><div class="w-out"></div>`;
    const run = () => {
      const N = Math.pow(10, +q(el, '[data-k=n]').value), b = +q(el, '[data-k=b]').value, k = +q(el, '[data-k=k]').value, V = k * Math.pow(N, b);
      q(el, '[data-o=n]').textContent = Math.round(N).toLocaleString(); q(el, '[data-o=b]').textContent = b.toFixed(2); q(el, '[data-o=k]').textContent = k;
      q(el, '.w-out').innerHTML = `<div class="w-stats"><div><b>${Math.round(V).toLocaleString()}</b><span>|V| = k·N^β word types</span></div><div><b>${(100 * V / N).toPrecision(2)}%</b><span>types per instance</span></div></div>
        <p class="w-note">Multiply the text by 100 → the vocabulary grows by 100^${b.toFixed(2)} = <b>×${f(Math.pow(100, b), 2)}</b>. Vocabulary never stops growing, but it grows much more slowly than the text.</p>`;
    };
    el.addEventListener('input', run); run();
  };

  /* ---------- Lecture 2: regex tester with precision / recall (slides 12–17) ---------- */
  W.regex = (el, cfg) => {
    el.innerHTML = `<div class="w-controls"><label class="grow">Pattern <input type="text" data-k="p" value="${esc(cfg.p)}" spellcheck="false" autocapitalize="off"></label></div>
      <div class="w-controls">${cfg.presets.map(p => `<button type="button" class="btn small" data-preset="${esc(p)}"><code>${esc(p)}</code></button>`).join('')}</div>
      <label class="w-lab">Text<textarea rows="2" data-k="t">${esc(cfg.text)}</textarea></label><div class="w-out"></div>`;
    const run = () => {
      const p = q(el, '[data-k=p]').value, t = q(el, '[data-k=t]').value, out = q(el, '.w-out'); let re;
      try { re = new RegExp(p, 'g'); } catch (e) { out.innerHTML = `<p class="w-note bad">That pattern is not valid regex: ${esc(e.message)}</p>`; return; }
      const ms = []; if (p) { let m; while ((m = re.exec(t)) && ms.length < 200) { ms.push([m.index, m.index + m[0].length]); if (m[0].length === 0) re.lastIndex++; } }
      const truth = []; const tr = /\b[tT]he\b/g; let m2; while ((m2 = tr.exec(t))) truth.push([m2.index, m2.index + 3]);
      const covers = (a, b) => a[0] <= b[0] && a[1] >= b[1];
      const tp = ms.filter(x => truth.some(y => covers(x, y))).length, fp = ms.length - tp, fn = truth.filter(y => !ms.some(x => covers(x, y))).length;
      let html = '', i = 0; ms.forEach(([a, b]) => { html += esc(t.slice(i, a)) + `<mark class="${truth.some(y => covers([a, b], y)) ? 'tp' : 'fp'}">${esc(t.slice(a, b))}</mark>`; i = b; }); html += esc(t.slice(i));
      out.innerHTML = `<div class="w-text">${html}</div><div class="w-stats"><div><b>${ms.length}</b><span>matches</span></div><div><b class="good">${tp}</b><span>correct "the"</span></div><div><b class="bad">${fp}</b><span>false positives</span></div><div><b class="bad">${fn}</b><span>false negatives (missed)</span></div><div><b>${ms.length ? f(tp / ms.length, 2) : '—'}</b><span>precision</span></div><div><b>${truth.length ? f(tp / truth.length, 2) : '—'}</b><span>recall</span></div></div>
        <p class="w-note">Goal: find every whole word "the"/"The" (${truth.length} in the text). Green = correct match, red = matched something that is not the word "the".</p>`;
    };
    el.addEventListener('input', run);
    el.addEventListener('click', e => { const b = e.target.closest('[data-preset]'); if (b) { q(el, '[data-k=p]').value = b.dataset.preset; run(); } });
    run();
  };

  /* ---------- Lecture 2: normalization – what gets lost (slides 18–23) ---------- */
  W.normalize = (el, cfg) => {
    const STOP = ['the', 'a', 'an', 'of', 'and', 'to', 'it', "it's", 'is', 'not', 'no', 'this', 'that', 'in', 'on', 'said'];
    el.innerHTML = `<label class="w-lab">Raw text<textarea rows="2" data-k="t">${esc(cfg.text)}</textarea></label>
      <div class="w-controls"><label><input type="checkbox" data-k="url"> Replace URLs with &lt;URL&gt;</label><label><input type="checkbox" data-k="rep"> Shorten repeated letters</label><label><input type="checkbox" data-k="lc"> Case folding (lowercase)</label><label><input type="checkbox" data-k="punct"> Remove all non-letters</label><label><input type="checkbox" data-k="stop"> Remove stop words</label></div><div class="w-out"></div>`;
    const run = () => {
      const raw = q(el, '[data-k=t]').value; let t = raw; const lost = [], kept = [];
      const on = k => q(el, `[data-k=${k}]`).checked;
      if (on('url')) { if (/https?:\/\/\S+/.test(t)) kept.push('The link is now a placeholder: the fact that a link was present is kept, the address is dropped.'); t = t.replace(/https?:\/\/\S+/g, '<URL>'); }
      if (on('rep')) { if (/(\w)\1{2,}/.test(t)) kept.push('"sooooo" → "soo": still marks emphasis (reducing to "so" would remove it).'); t = t.replace(/(\w)\1{2,}/g, '$1$1'); }
      if (on('lc')) { if (/\bUS\b/.test(t)) lost.push('"US" (the country) became "us" (the pronoun).'); else if (/[A-Z]/.test(t)) lost.push('Capital letters that may mark names are gone.'); t = t.toLowerCase(); }
      if (on('punct')) { if (/[:;][()]/.test(raw)) lost.push('The emoticon ":(" was the only sign of sarcasm, and it is gone.'); if (/!/.test(raw)) lost.push('"!!!" emphasis is gone.'); t = t.replace(/<URL>/g, 'URLTOKEN').replace(/[^A-Za-z\s']/g, ' ').replace(/URLTOKEN/g, '<URL>').replace(/\s+/g, ' ').trim(); }
      if (on('stop')) { if (/\bnot\b/i.test(t)) lost.push('"not good" became "good": stop-word removal flipped the meaning.'); t = t.split(/\s+/).filter(w => !STOP.includes(w.toLowerCase().replace(/[^a-z']/g, ''))).join(' '); }
      q(el, '.w-out').innerHTML = `<div class="w-text">${esc(t) || '<span class="muted">(empty)</span>'}</div>${kept.map(x => `<p class="w-note good">Kept: ${esc(x)}</p>`).join('')}${lost.map(x => `<p class="w-note bad">Lost: ${esc(x)}</p>`).join('')}${!lost.length && !kept.length ? '<p class="w-note">Turn on a step to see what it changes.</p>' : ''}`;
    };
    el.addEventListener('input', run); run();
  };

  /* ---------- Lecture 2: BPE learner + segmenter (slides 33–42) ---------- */
  W.bpe = (el, cfg) => {
    el.innerHTML = `<div class="w-controls"><label class="grow">Training corpus <input type="text" data-k="c" value="${esc(cfg.corpus)}"></label></div>
      <div class="w-controls"><button type="button" class="btn small primary" data-x="next">Next merge</button><button type="button" class="btn small" data-x="all">Run ${cfg.k} merges</button><button type="button" class="btn small" data-x="reset">Reset</button><span class="w-msg" aria-live="polite"></span></div>
      <div class="w-out"></div>
      <div class="w-controls"><label>Segment a new word <input type="text" data-k="w" value="${esc(cfg.word)}" size="12"></label><button type="button" class="btn small" data-x="seg">Apply learned merges</button></div><div class="w-seg-out"></div>`;
    let words, merges, V0;
    const init = () => {
      const toks = q(el, '[data-k=c]').value.trim().split(/\s+/).filter(Boolean); const freq = new Map();
      toks.forEach(w => freq.set(w, (freq.get(w) || 0) + 1));
      words = [...freq.entries()].map(([w, n], i) => ({ n, i, sym: ['▁', ...w] })).sort((a, b) => b.n - a.n || a.i - b.i);
      merges = []; V0 = new Set(words.flatMap(w => w.sym)).size; render(null);
    };
    const pairCounts = () => { const m = new Map(); words.forEach(w => { for (let i = 0; i < w.sym.length - 1; i++) { const k = w.sym[i] + '\u0001' + w.sym[i + 1]; m.set(k, (m.get(k) || 0) + w.n); } }); return m; };
    const step = () => {
      const pc = pairCounts(); if (!pc.size) return null; let best = null, bv = 0; for (const [k, v] of pc) if (v > bv) { best = k; bv = v; }
      const [a, b] = best.split('\u0001'); words.forEach(w => { const s = []; for (let i = 0; i < w.sym.length; i++) { if (i < w.sym.length - 1 && w.sym[i] === a && w.sym[i + 1] === b) { s.push(a + b); i++; } else s.push(w.sym[i]); } w.sym = s; });
      merges.push([a, b, bv]); return { pc, best, bv };
    };
    const render = info => {
      const pc = info ? info.pc : pairCounts(); const top = [...pc.entries()].sort((x, y) => y[1] - x[1]).slice(0, 6);
      const len = words.reduce((s, w) => s + w.n * w.sym.length, 0);
      q(el, '.w-out').innerHTML = `<div class="w-grid2"><div><div class="w-h">Corpus now</div>${words.map(w => `<div class="w-corp"><span class="muted">${w.n} ×</span> ${w.sym.map(s => `<span class="w-sym">${esc(s)}</span>`).join('')}</div>`).join('')}<p class="w-note">|V| = ${V0} + ${merges.length} = <b>${V0 + merges.length}</b> · corpus length ${len} symbols</p></div>
        <div><div class="w-h">${info ? 'Pair counts before this merge' : 'Pair counts (next merge picks the top one)'}</div><table class="w-table"><tbody>${top.map(([k, v]) => `<tr class="${info && k === info.best ? 'hit' : ''}"><td>${esc(k.replace('\u0001', ' + '))}</td><td>${v}</td></tr>`).join('')}</tbody></table>
        <div class="w-h">Learned merges (in order)</div><ol class="w-ol">${merges.map(([a, b, v]) => `<li>${esc(a)} + ${esc(b)} → <b>${esc(a + b)}</b> <span class="muted">(${v})</span></li>`).join('') || '<li class="muted">none yet</li>'}</ol></div></div>`;
      q(el, '.w-msg').textContent = info ? `Merged ${info.best.replace('\u0001', ' + ')} (count ${info.bv}). Ties go to the pair that appears first in the corpus listing.` : '';
    };
    el.addEventListener('click', e => {
      const x = e.target.closest('[data-x]'); if (!x) return; const a = x.dataset.x;
      if (a === 'next') { const r = step(); if (r) render(r); }
      if (a === 'all') { let r; while (merges.length < cfg.k && (r = step())); render(r || null); }

        let s = ['▁', ...q(el, '[data-k=w]').value.trim()]; const log = [`Start: ${s.join(' ')}`];
        merges.forEach(([a1, b1], mi) => { let ch = false; const o = []; for (let i = 0; i < s.length; i++) { if (i < s.length - 1 && s[i] === a1 && s[i + 1] === b1) { o.push(a1 + b1); i++; ch = true; } else o.push(s[i]); } if (ch) { s = o; log.push(`Rule ${mi + 1} (${a1} + ${b1}): ${s.join(' ')}`); } });
        q(el, '.w-seg-out').innerHTML = merges.length ? `<ol class="w-ol">${log.map(l => `<li>${esc(l)}</li>`).join('')}</ol><p class="w-note">Result: <b>${s.map(esc).join(' + ')}</b>. The segmenter only replays merges in order; it never recounts.</p>` : '<p class="w-note">Learn some merges first.</p>';
      }
    });
    q(el, '[data-k=c]').addEventListener('change', init); init();
  };

  /* ---------- Lecture 2: UTF-8 bytes (slides 44–45) ---------- */
  W.utf8 = (el, cfg) => {
    el.innerHTML = `<div class="w-controls"><label>Characters <input type="text" data-k="t" value="${esc(cfg.text)}" size="10"></label>${['a', 'ñ', 'ب', '进', '😀'].map(c => `<button type="button" class="btn small" data-c="${c}">${c}</button>`).join('')}</div><div class="w-out"></div>`;
    const run = () => {
      const chars = Array.from(q(el, '[data-k=t]').value).slice(0, 4);
      q(el, '.w-out').innerHTML = chars.length ? `<table class="w-table"><thead><tr><th>Char</th><th>Code point</th><th>Bytes</th><th>UTF-8 (binary)</th><th>Hex</th></tr></thead><tbody>${chars.map(c => {
        const cp = c.codePointAt(0), bytes = Array.from(new TextEncoder().encode(c));
        const bin = bytes.map((b, i) => { const s = b.toString(2).padStart(8, '0'); const n = i === 0 ? (bytes.length === 1 ? 1 : bytes.length + 1) : 2; return `<span class="w-bits"><i>${s.slice(0, n)}</i>${s.slice(n)}</span>`; }).join(' ');
        return `<tr><td class="w-big">${esc(c)}</td><td>U+${cp.toString(16).toUpperCase().padStart(4, '0')}</td><td>${bytes.length}</td><td>${bin}</td><td><b>${bytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ')}</b></td></tr>`; }).join('')}</tbody></table>
        <p class="w-note">Highlighted bits are the fixed prefixes: <code>0</code> = 1-byte character, <code>110</code>/<code>1110</code>/<code>11110</code> = start of a 2/3/4-byte sequence, <code>10</code> = continuation byte. The other bits carry the code point.</p>` : '';
    };
    el.addEventListener('input', run); el.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { q(el, '[data-k=t]').value = b.dataset.c; run(); } }); run();
  };

  /* ---------- Lecture 2: minimum edit distance matrix + WER (slides 51–58) ---------- */

  /* ---------- formula sheet ---------- */
  function renderFormulas() {

  /* ---------- mind map ---------- */
  function wrapText(t, max) {
    const words = strip(t).split(' '), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur); return lines;
  }
  function relax(movers, fixed, Wd, Ht, iters = 600) {
    const all = movers.concat(fixed);
    for (let it = 0; it < iters; it++) {
      let moved = false;
      for (let i = 0; i < movers.length; i++) {
        const a = movers[i];
        for (let j = 0; j < all.length; j++) {
          const b = all[j]; if (a === b) continue;
          const ox = (a.w + b.w) / 2 + 10 - Math.abs(a.x - b.x), oy = (a.h + b.h) / 2 + 8 - Math.abs(a.y - b.y);
          if (ox > 0 && oy > 0) {
            moved = true; const share = fixed.includes(b) ? 1 : .5;
            if (ox < oy) { const s = a.x < b.x ? -1 : 1; a.x += s * ox * share; if (share < 1) b.x -= s * ox * share; }
            else { const s = a.y < b.y ? -1 : 1; a.y += s * oy * share; if (share < 1) b.y -= s * oy * share; }
          }
        }
        a.x = Math.min(Math.max(a.x, a.w / 2 + 6), Wd - a.w / 2 - 6); a.y = Math.min(Math.max(a.y, a.h / 2 + 6), Ht - a.h / 2 - 6);
      }
      if (!moved) break;
    }
  }
  function boxText(n, cls, lh, attrs = '') {
    const y0 = n.y - (n.lines.length - 1) * lh / 2;
    return `<g class="${cls}" ${attrs}><rect x="${(n.x - n.w / 2).toFixed(1)}" y="${(n.y - n.h / 2).toFixed(1)}" width="${n.w.toFixed(1)}" height="${n.h.toFixed(1)}" rx="${cls === 'n-c' ? 14 : 8}"/>${n.lines.map((l, i) => `<text x="${n.x.toFixed(1)}" y="${(y0 + i * lh).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${esc(l)}</text>`).join('')}</g>`;
  }
  function mindmap(m, mid) {
    const Wd = 1200, Ht = 860, cx = Wd / 2, cy = Ht / 2, n = m.b.length;
    const center = { x: cx, y: cy, lines: wrapText(m.c, 16) }; center.w = Math.max(...center.lines.map(l => l.length)) * 12.4 + 36; center.h = center.lines.length * 25 + 24;
    const br = m.b.map((b, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n, lines = wrapText(b.n, 18);
      return { i, a, b, x: cx + 285 * Math.cos(a), y: cy + 215 * Math.sin(a), lines, w: Math.max(...lines.map(l => l.length)) * 9.6 + 28, h: lines.length * 20 + 18, c: `var(--m${i % 6 + 1})` };
    });
    const kids = [];
    br.forEach(B => {
      const k = B.b.k.length, span = Math.min(2 * Math.PI / n * .78, .4 * (k - 1));
      B.b.k.forEach((t, j) => {
        const a = B.a + (k > 1 ? (j / (k - 1) - .5) * span : 0), rr = (k >= 3 && j % 2) ? 1.1 : 1, lines = wrapText(t, 19);
        kids.push({ t, B, x: cx + 470 * rr * Math.cos(a), y: cy + 340 * rr * Math.sin(a), lines, w: Math.max(...lines.map(l => l.length)) * 8.1 + 22, h: lines.length * 18 + 14 });
      });
    });
    relax(kids, [center, ...br], Wd, Ht);
    const labels = [];
    br.forEach(B => { if (!B.b.r) return; const lines = wrapText(B.b.r, 22); labels.push({ x: cx + (B.x - cx) * .58, y: cy + (B.y - cy) * .58, lines, w: Math.max(...lines.map(l => l.length)) * 7.0 + 16, h: lines.length * 16 + 8, cls: 'lbl', b: String(B.i) }); });
    const xs = (m.x || []).map(([a, b, t]) => {
      const A = br[a], B = br[b]; let mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      let dx = mx - cx, dy = my - cy; const d = Math.hypot(dx, dy);
      let qx, qy; if (d < 40) { const px = -(B.y - A.y), py = B.x - A.x, pl = Math.hypot(px, py); qx = cx + px / pl * 150; qy = cy + py / pl * 150; } else { qx = mx - dx / d * 30; qy = my - dy / d * 30; }
      const lx = .25 * A.x + .5 * qx + .25 * B.x, ly = .25 * A.y + .5 * qy + .25 * B.y, lines = wrapText(t, 24);
      const L = { x: lx, y: ly, lines, w: Math.max(...lines.map(l => l.length)) * 7.4 + 16, h: lines.length * 16 + 8, cls: 'lbl x', b: `${a} ${b}` };
      labels.push(L); return { A, B, qx, qy, a, b };
    });
    relax(labels, [center, ...br, ...kids], Wd, Ht);
    let s = `<svg class="mm" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Mind map: ${esc(m.title)}" data-mm="${mid}"><defs><marker id="ah-${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>`;
    xs.forEach(X => { s += `<path class="e-x" data-b="${X.a} ${X.b}" d="M${X.A.x.toFixed(1)} ${X.A.y.toFixed(1)} Q${X.qx.toFixed(1)} ${X.qy.toFixed(1)} ${X.B.x.toFixed(1)} ${X.B.y.toFixed(1)}" marker-end="url(#ah-${mid})" marker-start="url(#ah-${mid})"/>`; });
    br.forEach(B => { const qx = cx + (B.x - cx) * .5 + (B.y - cy) * .12, qy = cy + (B.y - cy) * .5 - (B.x - cx) * .12; s += `<path class="e-main" data-b="${B.i}" style="stroke:${B.c}" d="M${cx} ${cy} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}"/>`; });
    kids.forEach(K => { s += `<path class="e-kid" data-b="${K.B.i}" style="stroke:${K.B.c}" d="M${K.B.x.toFixed(1)} ${K.B.y.toFixed(1)} L${K.x.toFixed(1)} ${K.y.toFixed(1)}"/>`; });
    kids.forEach(K => { s += boxText(K, 'n-k', 18, `data-b="${K.B.i}" style="--c:${K.B.c}"`); });
    br.forEach(B => { s += boxText(B, 'n-b', 20, `data-b="${B.i}" style="--c:${B.c}" tabindex="0" role="button" aria-label="Focus branch ${esc(B.b.n)}" data-act="mmfocus"`); });
    s += boxText(center, 'n-c', 25, `data-act="mmreset" style="cursor:pointer"`);
    labels.forEach(L => { s += boxText(L, L.cls, 16, `data-b="${L.b}"`); });
    return s + '</svg>';
  }
  function mapOutline(m) {
    return `<details class="outline"><summary>Text outline of this map</summary><ul><li><b>${esc(m.c)}</b><ul>${m.b.map(b => `<li>${b.r ? `<i>${esc(b.r)}</i> → ` : ''}<b>${esc(b.n)}</b>: ${b.k.map(esc).join(' · ')}</li>`).join('')}</ul></li>${(m.x || []).length ? `<li>Cross-links: ${m.x.map(([a, b, t]) => `${esc(m.b[a].n)} ↔ ${esc(m.b[b].n)} (${esc(t)})`).join('; ')}</li>` : ''}</ul></details>`;
  }

  /* ---------- missions and guided lessons ---------- */
  function missionsOf(ch) {
    const pre = ch.id.replace('ch', 'c') + 's';

    return raw.map(m => { const secs = m.secs.map(n => ch.secById[pre + n]).filter(Boolean); const sls = secs.map(x => x.sl).join(', ').match(/\d+/g) || []; const nums = sls.map(Number); return { ...m, secs, sl: nums.length ? (Math.min(...nums) === Math.max(...nums) ? `${nums[0]}` : `${Math.min(...nums)}–${Math.max(...nums)}`) : '' }; });
  }
  const LH = (en, ar) => `<div class="ls-h">${en}<small lang="ar">${ar}</small></div>`;
  function stepper(steps, key) {
    return `<div class="stepper" data-shown="1"><ol class="steps">${steps.map((x, i) => `<li class="step" ${i ? 'hidden' : ''}>${bi(x[0], x[1])}</li>`).join('')}</ol>${steps.length > 1 ? `<div class="row step-ctl"><button type="button" class="btn small primary" data-act="lstep">Next step <span class="muted-inv">(2 of ${steps.length})</span></button><button type="button" class="btn small" data-act="lstepall">Show all steps</button></div>` : ''}</div>`;
  }
  function examLinks(ch, x) {

    if (!qs.length) return '';

  }
  function topicHTML(ch, x) {

  function mountWidgets(root) {

  function refreshProgress(ch) {

    $('[data-chprog]').textContent = `${done}/${ch.sections.length} topics complete`; $('[data-chbar]').style.width = pctOf(done, ch.sections.length) + '%';
    missionsOf(ch).forEach((m, i) => { const d = m.secs.filter(x => st.s[x.id]).length; const el = $(`[data-mprog="${i}"]`); if (el) el.textContent = `${d}/${m.secs.length}`; const card = $(`[data-mcard="${i}"]`); if (card) { card.classList.toggle('complete', d === m.secs.length); $('.mnum', card).textContent = d === m.secs.length ? '✓' : i + 1; } });

  function celebrate(ch, id) {

      <h3 class="rev-h">Important comparisons <small lang="ar">مقارنات مهمة</small></h3>${ch.compare.map(t => `<h4 style="font-size:16px;margin:12px 0 6px">${t.title}</h4><div class="tbl" style="background:var(--surface)"><table class="t"><thead><tr>${t.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}

    const qs = ch.quiz.map((q, i) => { const id = `${ch.id}-q${i}`, ch2 = st.q[id]; const answered = ch2 != null; return `<div class="mcq" id="${id}" data-ans="${q.ans}">${bi(`<div class="qq">${i + 1}. ${q.q}</div>`, q.qa)}<div class="opts">${q.opts.map((o, j) => `<button class="opt${answered && j === q.ans ? ' right' : ''}${answered && j === ch2 && j !== q.ans ? ' wrong' : ''}" type="button" data-act="opt" data-j="${j}" ${answered ? 'disabled' : ''}>${String.fromCharCode(65 + j)}. ${o}</button>`).join('')}</div><div class="why" ${answered ? '' : 'hidden'}>${bi(`<b>${answered && ch2 === q.ans ? 'Correct.' : 'Answer: ' + String.fromCharCode(65 + q.ans) + '.'}</b> ${q.why}`, q.whyAr)}${covers(ch, q.secs, 'Review')}</div></div>`; }).join('');

    updateScore(ch); mountWidgets(main);
  }

  function updateScore(ch) {
    const el = $('#score'); if (!el) return;
    const n = ch.quiz.length, a = ch.quiz.filter((q, i) => st.q[`${ch.id}-q${i}`] != null).length, c = ch.quiz.filter((q, i) => st.q[`${ch.id}-q${i}`] === q.ans).length;
    el.textContent = `${c} correct · ${a}/${n} answered`;

  /* ---------- routing ---------- */
  let route = {};
  function parse() {
    const h = (location.hash || '#home').slice(1);
    if (h === 'formulas') return { page: 'formulas' };
    const m = h.match(/^(ch\d+)(?:-(learn|map|essay|rev|test))?$/);
    if (m) { const ch = CH.find(c => c.id === m[1]); if (ch) return { page: 'ch', ch, tab: m[2] || 'learn' }; }
    return { page: 'home' };
  }
  function go(target) {
    const r = parse();
    const sameCh = route.page === 'ch' && r.page === 'ch' && route.ch === r.ch;
    route = r;
    if (r.page === 'home') renderHome(); else if (r.page === 'formulas') renderFormulas();
    else if (sameCh && $('#p-' + r.tab)) switchTab(r.tab); else renderChapter(r.ch, r.tab);
    renderSide(r); closeMenu();
    if (target) { setTimeout(() => focusTarget(target), 0); }
    else if (!sameCh) window.scrollTo(0, 0);
    document.title = r.page === 'ch' ? `${r.ch.title} · ARTI 404 Study Atlas` : 'ARTI 404 Study Atlas';
  }
  function switchTab(k) {
    $$('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k));
    $$('[role=tabpanel]').forEach(p => p.hidden = p.id !== 'p-' + k);
    route.tab = k;
  }
  function focusTarget(id) {
    const el = document.getElementById(id); if (!el) return;
    const sec = el.closest('.sec'); if (sec && sec.classList.contains('closed')) toggleSec(sec, true);
    main.classList.remove('f-must', 'f-imp', 'f-add'); $$('[data-act=filter]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'all'));
    el.scrollIntoView({ block: 'start' });
    setTimeout(() => el.scrollIntoView({ block: 'start' }), 250);
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function navTo(chId, tab, target) {
    const h = '#' + chId + (tab && tab !== 'learn' ? '-' + tab : '');
    if (location.hash === h) { go(target); } else { pendingTarget = target; location.hash = h; }
  }
  let pendingTarget = null;
  window.addEventListener('hashchange', () => { const t = pendingTarget; pendingTarget = null; go(t); });

  /* ---------- arabic toggle ---------- */
  const arBtn = $('#arBtn');
  function applyAr() {
    document.body.classList.toggle('en-only', !st.ar);
    arBtn.setAttribute('aria-pressed', String(st.ar));
    arBtn.innerHTML = st.ar ? `<span>Hide Arabic Translation</span><span class="t-ar" lang="ar">إخفاء الترجمة العربية</span>` : `<span>Show Arabic Translation</span><span class="t-ar" lang="ar">إظهار الترجمة العربية</span>`;
    $$('.bi.peeked').forEach(b => b.classList.remove('peeked'));
  }
  arBtn.addEventListener('click', () => { st.ar = !st.ar; save(); applyAr(); });

  /* ---------- menu ---------- */
  const scrim = $('#scrim'), menuBtn = $('#menuBtn');
  function closeMenu() { side.classList.remove('open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', () => { const o = !side.classList.contains('open'); side.classList.toggle('open', o); scrim.hidden = !o; menuBtn.setAttribute('aria-expanded', String(o)); });
  scrim.addEventListener('click', closeMenu);

  /* ---------- section collapse ---------- */
  function toggleSec(sec, open) {
    sec.classList.toggle('closed', !open);
    $('.sec-toggle', sec).setAttribute('aria-expanded', String(open));
    st.open[sec.id] = open; save();
  }

  /* ---------- delegated clicks ---------- */
  document.addEventListener('click', ev => {
    const g = ev.target.closest('[data-goto]');
    if (g) { ev.preventDefault(); const [c, t, id] = g.dataset.goto.split('|'); clearSearch(); navTo(c, t, id); return; }
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, ch = route.ch;
    if (act === 'peek') { el.parentElement.classList.toggle('peeked'); }
    else if (act === 'tab') { const k = el.dataset.tab; history.replaceState(null, '', '#' + ch.id + (k === 'learn' ? '' : '-' + k)); switchTab(k); }
    else if (act === 'sec') { const sec = el.closest('.sec'); toggleSec(sec, sec.classList.contains('closed')); }
    else if (act === 'expand' || act === 'collapse') { $$('#p-learn .sec').forEach(s => toggleSec(s, act === 'expand')); }
    else if (act === 'filter') { $$('[data-act=filter]').forEach(b => b.setAttribute('aria-pressed', b === el)); main.classList.remove('f-must', 'f-imp', 'f-add'); if (el.dataset.v !== 'all') main.classList.add('f-' + el.dataset.v); }
    else if (act === 'reveal') { const a = document.getElementById(el.getAttribute('aria-controls')); const open = a.hidden; a.hidden = !open; el.setAttribute('aria-expanded', String(open)); el.textContent = open ? 'Hide model answer' : 'Show model answer'; }
    else if (act === 'showall' || act === 'hideall') { const show = act === 'showall'; $$('#p-essay [data-act=reveal]').forEach(b => { document.getElementById(b.getAttribute('aria-controls')).hidden = !show; b.setAttribute('aria-expanded', String(show)); b.textContent = show ? 'Hide model answer' : 'Show model answer'; }); }
    else if (act === 'flip') { el.classList.toggle('flipped'); $('.side-l', el).textContent = el.classList.contains('flipped') ? 'Answer' : 'Question'; }
    else if (act === 'fcmark') { const fc = el.closest('.fc'), v = el.dataset.v; const cur = st.c[fc.id]; if (cur === v) delete st.c[fc.id]; else st.c[fc.id] = v; save(); fc.dataset.mark = st.c[fc.id] || 'n'; $$('.fc-act button', fc).forEach(b => b.className = st.c[fc.id] === b.dataset.v ? 'on-' + b.dataset.v : ''); renderSide(route); }
    else if (act === 'fcfilter') { $$('[data-act=fcfilter]').forEach(b => b.setAttribute('aria-pressed', b === el)); const v = el.dataset.v; $$('.fc').forEach(f => f.hidden = v !== 'all' && f.dataset.mark !== v); }
    else if (act === 'sareveal') { const a = $('.aa', el.closest('.sa')); a.hidden = !a.hidden; el.setAttribute('aria-expanded', String(!a.hidden)); el.textContent = a.hidden ? 'Show answer' : 'Hide answer'; }
    else if (act === 'opt') { const box = el.closest('.mcq'), ans = +box.dataset.ans, j = +el.dataset.j; st.q[box.id] = j; save(); $$('.opt', box).forEach((b, k) => { b.disabled = true; if (k === ans) b.classList.add('right'); if (k === j && j !== ans) b.classList.add('wrong'); }); const why = $('.why', box); why.hidden = false; $('b', why).textContent = j === ans ? 'Correct.' : 'Answer: ' + String.fromCharCode(65 + ans) + '.'; updateScore(ch); }
    else if (act === 'quizreset') { ch.quiz.forEach((q, i) => delete st.q[`${ch.id}-q${i}`]); save(); $$('.mcq').forEach(box => { $$('.opt', box).forEach(b => { b.disabled = false; b.classList.remove('right', 'wrong'); }); $('.why', box).hidden = true; }); updateScore(ch); }
    else if (act === 'maptoggle') { const card = el.closest('.mapcard'), body = $('.map-body', card); body.hidden = !body.hidden; el.textContent = body.hidden ? 'Show map' : 'Hide map'; el.setAttribute('aria-expanded', String(!body.hidden)); }
    else if (act === 'mmfocus') { const svg = el.closest('svg'), i = el.dataset.b; const same = svg.dataset.focus === i; svg.dataset.focus = same ? '' : i; $$('[data-b]', svg).forEach(n => n.classList.toggle('dim', !same && !n.dataset.b.split(' ').includes(i))); }
    else if (act === 'mmreset') { const svg = el.closest('svg') || $('svg', el.closest('.mapcard')); if (svg) { svg.dataset.focus = ''; $$('.dim', svg).forEach(n => n.classList.remove('dim')); if (!el.closest('svg')) { svg.classList.remove('touring'); $$('.tour-hide', svg).forEach(n => n.classList.remove('tour-hide')); const cap = $('.tour-cap', el.closest('.mapcard')); if (cap) cap.hidden = true; } } }
    else if (act === 'lstep') { const box = el.closest('.stepper'), steps = $$('.step', box), n = +box.dataset.shown; if (n < steps.length) { steps[n].hidden = false; steps[n].classList.add('step-in'); box.dataset.shown = n + 1; } if (n + 1 >= steps.length) $('.step-ctl', box).hidden = true; else el.innerHTML = `Next step <span class="muted-inv">(${n + 2} of ${steps.length})</span>`; }
    else if (act === 'lstepall') { const box = el.closest('.stepper'); $$('.step', box).forEach(x => x.hidden = false); box.dataset.shown = $$('.step', box).length; $('.step-ctl', box).hidden = true; }
    else if (act === 'lreveal') { const a = el.nextElementSibling; a.hidden = !a.hidden; el.textContent = a.hidden ? 'Reveal the answer' : 'Hide the answer'; }
    else if (act === 'lcopt') { const box = el.closest('.ls-check'), ans = +box.dataset.ans, j = +el.dataset.j; st.lc[box.dataset.id] = j; save(); $$('.opt', box).forEach((b, k) => { b.disabled = true; if (k === ans) b.classList.add('right'); if (k === j && j !== ans) b.classList.add('wrong'); }); const why = $('.why', box); why.hidden = false; $('b', why).textContent = j === ans ? 'Correct.' : 'Not quite.'; }
    else if (act === 'tbreveal') { const a = el.nextElementSibling; a.hidden = false; el.hidden = true; }
    else if (act === 'tbrate') { const sec = el.closest('.sec'); st.tb[sec.id] = el.dataset.v; save(); $$('[data-act=tbrate]', el.parentElement).forEach(b => b.setAttribute('aria-pressed', b === el)); }
    else if (act === 'complete') { const sec = el.closest('.sec'), id = sec.id, was = !!st.s[id]; st.s[id] = 1; save(); const cb = $('input[data-st=s]', sec); if (cb) cb.checked = true; el.textContent = 'Completed ✓ · go to next topic'; renderSide(route); refreshProgress(ch); if (!was) celebrate(ch, id); toggleSec(sec, false); const all = $$('#p-learn .sec'); const nx = all[all.indexOf(sec) + 1]; if (nx) { toggleSec(nx, true); nx.scrollIntoView({ block: 'start' }); } }
    else if (act === 'tourstart') { const card = el.closest('.mapcard'); $('.map-body', card).hidden = false; tourShow(card, 0); }
    else if (act === 'tournext') { const card = el.closest('.mapcard'), m = ch.maps[+card.id.split('-m')[1]], k = +card.dataset.tour + 1; if (k > m.b.length) { $('svg', card).classList.remove('touring'); $$('.tour-hide', card).forEach(e => e.classList.remove('tour-hide')); $('.tour-cap', card).innerHTML = `<p><b>Tour complete.</b> All ${m.b.length} branches are now visible. Try explaining the whole map out loud from the centre outwards.</p>`; } else tourShow(card, k); }
    else if (act === 'tourprev') { const card = el.closest('.mapcard'); tourShow(card, Math.max(0, +card.dataset.tour - 1)); }
    else if (act === 'tourend') { const card = el.closest('.mapcard'); $('svg', card).classList.remove('touring'); $$('.tour-hide', card).forEach(e => e.classList.remove('tour-hide')); $('.tour-cap', card).hidden = true; }
    else if (act === 'reset1') { $('#resetBox').innerHTML = `<span style="font-size:14px">This clears everything saved in this browser. Continue?</span><button class="btn small primary" type="button" data-act="reset2">Yes, reset</button><button class="btn small" type="button" data-act="reset0">Cancel</button>`; }
    else if (act === 'reset0') { renderHome(); }
    else if (act === 'reset2') { const ar = st.ar; st = { s: {}, e: {}, c: {}, k: {}, q: {}, d: {}, lc: {}, tb: {}, ar, open: {} }; save(); renderHome(); renderSide(route); }
  });
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('g[data-act], [role=button][data-act]')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  document.addEventListener('change', ev => {
    const t = ev.target; if (t.dataset && t.dataset.st) { const bucket = st[t.dataset.st]; if (t.checked) bucket[t.dataset.id] = 1; else delete bucket[t.dataset.id]; save(); renderSide(route); if (t.dataset.st === 's' && route.ch) { refreshProgress(route.ch); if (t.checked) celebrate(route.ch, t.dataset.id); const btn = $('[data-act=complete]', t.closest('.sec')); if (btn) btn.textContent = t.checked ? 'Completed ✓ · go to next topic' : 'Mark complete and continue'; } }
  });
  let draftTimer; document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.draft) { clearTimeout(draftTimer); draftTimer = setTimeout(() => { if (t.value.trim()) st.d[t.dataset.draft] = t.value; else delete st.d[t.dataset.draft]; save(); }, 400); } });

  /* ---------- search ---------- */
  const IDX = [];
  CH.forEach(c => {
    c.sections.forEach(s => {
      IDX.push({ c, tab: 'learn', id: s.id, title: s.h, kind: 'Section', text: strip(s.h + ' ' + (s.mem ? s.mem[0] : '') + ' ' + (LESSONS[s.id] ? [LESSONS[s.id].big, LESSONS[s.id].steps, LESSONS[s.id].remember].flat(2).filter((v, i) => typeof v === 'string').join(' ') : '') + ' ' + s.blocks.map(b => [b.term, b.en, b.f, b.head, b.rows, b.steps].flat(3).join(' ')).join(' ')), ar: strip(s.blocks.map(b => [b.ar].flat().join(' ')).join(' ')) });
      s.blocks.forEach((b, j) => { if (b.t === 'def') IDX.push({ c, tab: 'learn', id: `${s.id}-d${j}`, title: strip(b.term), kind: 'Definition', text: strip(b.term + ' ' + b.en), ar: strip(b.ar), boost: 3 }); });
    });
    c.essays.forEach((e, i) => IDX.push({ c, tab: 'essay', id: `${c.id}-e${i}`, title: strip(e.q), kind: 'Essay question', text: strip(e.q + ' ' + e.ans), ar: strip(e.qa) }));
    c.flashcards.forEach((f, i) => IDX.push({ c, tab: 'rev', id: `${c.id}-f${i}`, title: strip(f[0]), kind: 'Flashcard', text: strip(f[0] + ' ' + f[1]), ar: strip(f[2] + ' ' + f[3]), boost: 1 }));
    c.maps.forEach((m, i) => IDX.push({ c, tab: 'map', id: `${c.id}-m${i}`, title: m.title, kind: 'Mind map', text: strip(m.title + ' ' + m.c + ' ' + m.b.map(b => b.n + ' ' + b.k.join(' ')).join(' ')), ar: '' }));
  });
  const q = $('#q'), res = $('#results');
  let hits = [], sel = -1;
  function clearSearch() { res.hidden = true; q.value = ''; hits = []; }
  function snippet(text, words) {
    const low = text.toLowerCase(); let at = low.indexOf(words[0]); if (at < 0) at = 0;
    let s = text.slice(Math.max(0, at - 50), at + 110); if (at > 50) s = '…' + s; if (at + 110 < text.length) s += '…';
    let h = esc(s); words.forEach(w => { if (w.length > 1) h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h;
  }
  function search() {
    const v = q.value.trim().toLowerCase(); if (!v) { res.hidden = true; return; }
    const words = v.split(/\s+/);
    hits = IDX.map(e => { const hay = (e.text + ' ' + e.ar).toLowerCase(); if (!words.every(w => hay.includes(w))) return null; let sc = (e.boost || 0); if (e.title.toLowerCase().includes(v)) sc += 10; words.forEach(w => { if (e.title.toLowerCase().includes(w)) sc += 2; }); return [sc, e]; }).filter(Boolean).sort((a, b) => b[0] - a[0]).slice(0, 14).map(x => x[1]);
    sel = -1;
    res.innerHTML = hits.length ? hits.map((e, i) => { const inAr = !(e.text.toLowerCase().includes(words[0])); return `<button type="button" data-i="${i}"><span class="r-where">${e.c.week} · ${e.kind}</span><span class="r-title">${esc(e.title.length > 90 ? e.title.slice(0, 90) + '…' : e.title)}</span><span class="r-snip"${inAr ? ' dir="rtl" lang="ar"' : ''}>${snippet(inAr ? e.ar : e.text, words)}</span></button>`; }).join('') : `<div class="r-empty">No matches for “${esc(q.value)}”. Try a shorter word, such as “BPE”, “perplexity” or “softmax”.</div>`;
    res.hidden = false;
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', () => { if (q.value.trim()) search(); });
  q.addEventListener('keydown', ev => {
    const btns = $$('button', res);
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); if (!btns.length) return; sel = (sel + (ev.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle('on', i === sel)); btns[sel].scrollIntoView({ block: 'nearest' }); }
    else if (ev.key === 'Enter') { const i = sel >= 0 ? sel : 0; if (hits[i]) pick(hits[i]); }
    else if (ev.key === 'Escape') { res.hidden = true; q.blur(); }
  });
  res.addEventListener('click', ev => { const b = ev.target.closest('button[data-i]'); if (b) pick(hits[+b.dataset.i]); });
  document.addEventListener('click', ev => { if (!ev.target.closest('.search')) res.hidden = true; });
  function pick(e) { clearSearch(); q.blur(); navTo(e.c.id, e.tab, e.id); }

  const topBar = document.querySelector('.top');
  const setTopH = () => document.documentElement.style.setProperty('--top-h', topBar.offsetHeight + 'px');
  setTopH(); window.addEventListener('resize', setTopH); if (window.ResizeObserver) new ResizeObserver(setTopH).observe(topBar);
  applyAr();
  go(null);
})();


</script>
