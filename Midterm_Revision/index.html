  essays: [
    E('Define & explain', `Define tokenization. Using examples from the lecture, explain why deciding "what counts as a word" depends on the task, the language and the model.`, `عرّف الترميز (tokenization). ومستخدمًا أمثلة المحاضرة، اشرح لماذا يعتمد تحديد "ما هي الكلمة" على المهمة واللغة والنموذج.`, 10,
      `<p><b>Definition.</b> Tokenization is the process of segmenting the running input text into tokens. A token may be a word, a subword, a character or a byte. Models receive token IDs, not raw strings, so tokenization decides the units the model sees, the vocabulary size and the sequence length.</p><p><b>Why "word" is a decision.</b></p><ol><li><b>Written forms:</b> "I'm" is one orthographic word but two grammatical words (I + am). "state-of-the-art" can be one token or four, depending on hyphen handling. In "PhD." the period belongs to the abbreviation, not a sentence boundary.</li><li><b>Task:</b> in the utterance "I do uh main- mainly business data processing", the filler <i>uh</i> and the fragment <i>main-</i> are dropped in a clean transcript but kept for speech recognition, because fillers signal a restart and help identify the speaker. Punctuation is noise for retrieval but a token for parsing. "data processing" may be two words or one concept.</li><li><b>Language:</b> whitespace is not a universal boundary. French attaches clitics (L'ensemble), German forms long compounds, Chinese and Japanese have no spaces, and Arabic attaches clitics such as و، ب، ال. The Chinese sentence 姚明进入总决赛 has 3, 5 or 7 words depending on the segmentation standard.</li><li><b>Model:</b> modern models use subword tokenizers, so a word may be split into several pieces, and outputs differ between tokenizers.</li></ol><p><b>Conclusion.</b> Every reported count must state its tokenization assumption, because changing the decision changes N and |V|.</p>`,
      `<p><b>التعريف.</b> الترميز هو عملية تقسيم النص المُدخل إلى رموز (tokens)، وقد يكون الرمز كلمة أو وحدة فرعية أو حرفًا أو بايتًا. يستقبل النموذج أرقامًا تعريفية لا نصوصًا خامًا، لذا يحدد الترميز الوحدات التي يراها النموذج وحجم المفردات وطول السلسلة.</p><p><b>لماذا "الكلمة" قرار.</b></p><ol><li><b>الأشكال المكتوبة:</b> "I'm" كلمة إملائية واحدة لكنها كلمتان نحويًّا. و"state-of-the-art" رمز واحد أو أربعة حسب معالجة الشرطة. وفي "PhD." النقطة جزء من الاختصار.</li><li><b>المهمة:</b> في المنطوق "I do uh main- mainly..." تُحذف كلمة الحشو <i>uh</i> والجزء المقطوع <i>main-</i> في النص المنظّف، لكنهما يُحتفظ بهما في التعرّف على الكلام لأن الحشو يدل على إعادة البدء ويساعد على تمييز المتحدث. وعلامات الترقيم ضوضاء في الاسترجاع لكنها رمز في التحليل النحوي.</li><li><b>اللغة:</b> المسافة ليست حدًّا عامًّا للكلمات. الفرنسية تلحق الزوائد، والألمانية تكوّن مركبات طويلة، والصينية واليابانية بلا مسافات، والعربية تلحق و، ب، ال. والجملة الصينية في المحاضرة فيها 3 أو 5 أو 7 كلمات حسب المعيار.</li><li><b>النموذج:</b> النماذج الحديثة تستخدم وحدات فرعية، فقد تنقسم الكلمة إلى عدة قطع، وتختلف المخرجات بين الأدوات.</li></ol><p><b>الخلاصة.</b> يجب أن يذكر كل عدّ افتراض الترميز، لأن تغيير القرار يغيّر N و|V|.</p>`,
      [[`Correct definition of tokenization + token types`, `تعريف صحيح وأنواع الرموز`], [`Examples: I'm, state-of-the-art, PhD.`, `أمثلة I'm وstate-of-the-art وPhD.`], [`Task dependence: disfluencies, punctuation`, `الاعتماد على المهمة: التعثرات وعلامات الترقيم`], [`Language dependence: Chinese/Arabic/French/German`, `الاعتماد على اللغة`], [`Conclusion: counts state assumptions`, `الخلاصة: ذكر افتراض الترميز`]],
      `Definition 2 · Written-form examples 2 · Task 2 · Language 3 · Conclusion 1`),
    E('Compare & contrast', `Distinguish between word instance, word type, wordform and lemma. For "the cat saw the dog and the bird", give N and |V|, and explain how tokenization decisions change counts.`, `ميّز بين ورود الكلمة ونوعها وشكلها وأصلها المعجمي. أعطِ N و|V| للجملة "the cat saw the dog and the bird"، واشرح كيف تغيّر قرارات الترميز العدّ.`, 8,
      `<ul><li><b>Word instance (N):</b> one occurrence of a word in running text (traditionally "word tokens").</li><li><b>Word type (|V|):</b> one unique vocabulary item; the number of types is the vocabulary size.</li><li><b>Wordform:</b> the surface form as written: cat, cats, cat's are different wordforms.</li><li><b>Lemma:</b> the dictionary headword: am, is, are → be; cat and cats share the lemma cat.</li></ul><p><b>Calculation.</b> "the cat saw the dog and the bird" has <b>N = 8</b> instances and <b>|V| = 6</b> types; "the" occurs 3 times but counts as one type.</p><p><b>Tokenization changes counts.</b> For "they lay back on the San Francisco grass and looked at the stars and their stars": a whitespace split gives N = 16 and |V| = 13 (the, and, stars each repeat). Treating "San Francisco" as one unit gives N = 15, |V| = 12. Lemmatizing stars → star changes nothing here, because both "stars" were already one type. Therefore every count must state its tokenization assumption.</p>`,
      `<ul><li><b>ورود الكلمة (N):</b> ظهور واحد للكلمة في النص.</li><li><b>نوع الكلمة (|V|):</b> عنصر مفردات فريد، وعدد الأنواع هو حجم المفردات.</li><li><b>الشكل:</b> الكتابة كما تظهر: cat وcats وcat's أشكال مختلفة.</li><li><b>الأصل المعجمي:</b> صيغة القاموس: am وis وare ← be.</li></ul><p><b>الحساب.</b> الجملة فيها <b>N = 8</b> و<b>|V| = 6</b>؛ "the" تظهر 3 مرات لكنها نوع واحد.</p><p><b>الترميز يغيّر العدّ.</b> في جملة San Francisco: التقسيم بالمسافات يعطي N = 16 و|V| = 13، واعتبار San Francisco وحدة واحدة يعطي 15 و12، والإرجاع المعجمي stars ← star لا يغيّر شيئًا هنا. لذلك يجب ذكر افتراض الترميز مع كل عدّ.</p>`,
      [[`Four correct definitions`, `أربعة تعريفات صحيحة`], [`N = 8, |V| = 6`, `N = 8 و|V| = 6`], [`San Francisco example 16/13 → 15/12`, `مثال San Francisco`], [`Counts must state assumptions`, `ذكر افتراض الترميز`]],
      `Definitions 4 · Calculation 2 · Tokenization effect 2`),
    E('Explain how & why', `State Heaps' Law and explain what it tells us about vocabulary growth. Why does it motivate subword tokenization?`, `اذكر قانون Heaps واشرح ما يخبرنا به عن نمو المفردات. ولماذا يدفع نحو الترميز بالوحدات الفرعية؟`, 8,
      `<p><b>Statement.</b> Heaps' Law (also Herdan's Law) is an empirical relationship between corpus size and vocabulary size: <b>|V| = k · N^β</b>, where N is the number of word instances, |V| the number of word types, k a positive corpus-dependent constant and 0 &lt; β &lt; 1 controls the growth rate. Reported β values are about 0.44 to 0.56 or higher.</p><p><b>Meaning.</b> As the corpus grows, vocabulary keeps growing, but much more slowly than the corpus (sublinear, often near the square-root rate). With β = 0.5, text × 4 → vocabulary × 2; text × 100 → vocabulary × 10. Example corpora: Shakespeare 884K instances/29K types; Brown 1M/38K; Google n-grams 1T/13M+.</p><p><b>Why it never stops.</b> Function words (a, of, the) are a small closed set and stop adding types early. Content words, especially names, numbers, typos, technical terms and new morphology, keep adding new types without end.</p><p><b>Consequence.</b> No fixed word-level vocabulary can cover every wordform in open-domain text, so unknown (OOV) words will always appear. Subword tokenization solves this by keeping frequent words whole and representing rare or unknown words with smaller known units, down to characters or bytes in the worst case.</p>`,
      `<p><b>الصيغة.</b> قانون Heaps (أو Herdan) علاقة تجريبية بين حجم المدونة وحجم المفردات: <b>|V| = k · N^β</b>، حيث N عدد الكلمات و|V| عدد الأنواع وk ثابت موجب يعتمد على المدونة و0 &lt; β &lt; 1 يتحكم في معدل النمو، وقيمه نحو 0.44 إلى 0.56.</p><p><b>المعنى.</b> كلما كبرت المدونة استمرت المفردات في النمو لكن أبطأ بكثير (قرب الجذر التربيعي). مع β = 0.5: النص × 4 ← المفردات × 2. أمثلة: Shakespeare 884 ألف/29 ألف، Brown مليون/38 ألف.</p><p><b>لماذا لا يتوقف.</b> كلمات الوظيفة مجموعة مغلقة صغيرة تتوقف مبكرًا، أما كلمات المحتوى خاصة الأسماء والأرقام والأخطاء والمصطلحات فتضيف أنواعًا بلا نهاية.</p><p><b>النتيجة.</b> لا توجد مفردات ثابتة تغطي كل الأشكال، فستظهر كلمات مجهولة دائمًا. والترميز بالوحدات الفرعية يحل ذلك بإبقاء الكلمات المتكررة كاملة وتمثيل النادرة بوحدات أصغر معروفة حتى الحروف أو البايتات.</p>`,
      [[`Formula with symbols and β range`, `الصيغة والرموز ومدى β`], [`Sublinear growth with a numeric example`, `النمو الأبطأ مع مثال رقمي`], [`Function vs content words`, `كلمات الوظيفة مقابل المحتوى`], [`Link to OOV and subwords`, `الربط بالكلمات المجهولة والوحدات الفرعية`]],
      `Formula 2 · Interpretation 2 · Word kinds 2 · Subword motivation 2`),
    E('Explain how & why', `Explain how regular expressions are written using brackets, counters, grouping and anchors. Use the task "find the word the" to explain false positives, false negatives, precision and recall.`, `اشرح كيف تُكتب التعابير النمطية باستخدام الأقواس والعدادات والتجميع والمرابط. واستخدم مهمة "إيجاد كلمة the" لشرح الإيجابيات والسلبيات الخاطئة والدقة والاستدعاء.`, 12,
      `<p><b>Regex</b> is a formal language for specifying text strings; a pattern either matches or not, decided by an algorithm, not meaning.</p><ol><li><b>Brackets</b> match one character: [wW]ood matches wood/Wood; [^Ss] means any character except S or s.</li><li><b>Counters</b> act on the item before them: ? (0 or 1, colou?r), * (0 or more, o*h), + (1 or more, o+h), {3} (exactly 3).</li><li><b>Grouping</b> with parentheses: (the)* repeats the word; gupp(y|ies) matches guppy and guppies.</li><li><b>Anchors</b> match positions: ^ start, $ end, \\b word boundary.</li><li><b>Escaping</b>: \\. matches a real period. Matching is <b>greedy</b>: &lt;.*&gt; takes the longest match, &lt;.*?&gt; the shortest.</li></ol><p><b>Finding "the".</b> Pattern <code>the</code> misses "The" at the start of a sentence: a <b>false negative</b> (missed something that should match), which lowers <b>recall</b>. Pattern <code>[tT]he</code> also matches inside other, there and theology: <b>false positives</b> (matched something that should not), which lower <b>precision</b>. Pattern <code>(^|[^A-Za-z])[tT]he([^A-Za-z]|$)</code> or the shorter <code>\\b[tT]he\\b</code> fixes both.</p><p><b>Calculation.</b> Precision = correct retrieved / all retrieved; recall = correct retrieved / all correct items. If a text has 10 occurrences of "the" and [tT]he returns 14 matches, 9 correct: precision = 9/14 = 0.64, recall = 9/10 = 0.90. Adding \\b removes false positives, raising precision. Reducing one error type often increases the other, so the pattern is tuned to the error the task can tolerate.</p>`,
      `<p><b>التعبير النمطي</b> لغة رسمية لتحديد السلاسل النصية؛ النمط يطابق أو لا يطابق بخوارزم لا بالمعنى.</p><ol><li><b>الأقواس المربعة</b> تطابق حرفًا واحدًا: [wW]ood، و[^Ss] أي حرف عدا S أو s.</li><li><b>العدّادات</b> تعمل على ما قبلها: ? (0 أو 1)، * (0 أو أكثر)، + (1 أو أكثر)، {3}.</li><li><b>التجميع</b> بالأقواس: (the)* يكرر الكلمة، وgupp(y|ies).</li><li><b>المرابط</b> تطابق مواضع: ^ البداية، $ النهاية، \\b حد الكلمة.</li><li><b>الهروب</b>: \\. نقطة حقيقية. والمطابقة <b>جشعة</b>: &lt;.*&gt; أطول تطابق و&lt;.*?&gt; أقصره.</li></ol><p><b>إيجاد "the".</b> النمط <code>the</code> يفوّت "The" في البداية: <b>سلبي خاطئ</b> يخفض <b>الاستدعاء</b>. والنمط <code>[tT]he</code> يطابق داخل other وtheology: <b>إيجابيات خاطئة</b> تخفض <b>الدقة</b>. والنمط <code>\\b[tT]he\\b</code> يصلح الأمرين.</p><p><b>الحساب.</b> الدقة = الصحيح المسترجع / كل المسترجع، والاستدعاء = الصحيح المسترجع / كل الصحيح. مع 10 مرات "the" و14 تطابقًا منها 9 صحيحة: الدقة 0.64 والاستدعاء 0.90. إضافة \\b ترفع الدقة، وتقليل نوع من الخطأ يزيد الآخر غالبًا.</p>`,
      [[`Brackets, counters, grouping, anchors with examples`, `الأقواس والعدادات والتجميع والمرابط مع أمثلة`], [`FN = missed "The", lowers recall`, `السلبي الخاطئ يخفض الاستدعاء`], [`FP = theology/other, lowers precision`, `الإيجابي الخاطئ يخفض الدقة`], [`Correct pattern \\b[tT]he\\b`, `النمط الصحيح`], [`Precision 0.64, recall 0.90 calculation`, `حساب الدقة والاستدعاء`]],
      `Operators 5 · FP/FN 3 · Correct pattern 1 · Precision/recall calculation 3`),
    E('Compare & contrast', `Compare stemming, lemmatization and stop-word removal. Discuss why normalization is a trade-off, using case folding as an example.`, `قارن بين التجذيع والإرجاع المعجمي وحذف كلمات التوقف، وناقش لماذا يُعد التوحيد مقايضة مستخدمًا تحويل حالة الأحرف مثالًا.`, 10,
      `<table><tr><th></th><th>Stemming</th><th>Lemmatization</th><th>Stop-word removal</th></tr><tr><td>Definition</td><td>Heuristic reduction of words to stems by removing affixes</td><td>Reducing a word to its dictionary form (lemma) using vocabulary and morphological analysis</td><td>Deleting the most frequent function words</td></tr><tr><td>Example</td><td>automates, automatic → automat</td><td>am, are, is → be; cars, car's → car</td><td>the, of, and</td></tr><tr><td>Strength / risk</td><td>Fast; output may not be a real word</td><td>Real word but needs more linguistic analysis; depends on POS (saw → see as verb, saw as noun)</td><td>Can delete essential meaning: "not good" → "good"</td></tr></table><p><b>Normalization as a trade-off.</b> Text normalization converts text to a standard form to reduce irrelevant variation. It maps several forms to one equivalence class, and after that the distinction is no longer available to the model. So the question is "does this task need the distinction?"</p><p><b>Case folding</b> maps all characters to one case, usually lower case. It reduces vocabulary size and helps information retrieval, spelling correction and topic classification (a user typing "window" also finds "Window"). But it destroys a distinction that matters for named entity recognition, information extraction and sentiment clues: US (the country) and us (the pronoun) become the same string; Apple ≠ apple. Other examples: deleting periods (U.S.A. → USA) helps retrieval but loses the original form; mapping colour → color loses an authorship signal; removing ال in Arabic loses definiteness.</p><p><b>Conclusion.</b> Normalize only the distinctions the task can safely ignore; modern neural models usually keep stop words and learn what to ignore.</p>`,
      `<table><tr><th></th><th>التجذيع</th><th>الإرجاع المعجمي</th><th>حذف كلمات التوقف</th></tr><tr><td>التعريف</td><td>اختزال تقريبي للكلمات بإزالة اللواحق</td><td>إرجاع الكلمة إلى صيغتها المعجمية بالقاموس والتحليل الصرفي</td><td>حذف كلمات الوظيفة الأكثر تكرارًا</td></tr><tr><td>مثال</td><td>automates ← automat</td><td>am, are, is ← be</td><td>the, of, and</td></tr><tr><td>الميزة/الخطر</td><td>سريع وقد ينتج كلمة غير حقيقية</td><td>كلمة حقيقية لكنه يحتاج تحليلًا أكثر ويعتمد على قسم الكلام</td><td>قد يحذف معنى أساسيًّا: "not good" ← "good"</td></tr></table><p><b>التوحيد مقايضة.</b> يحوّل التوحيد النص إلى صيغة قياسية لتقليل الاختلافات غير المهمة، ويربط عدة أشكال بفئة تكافؤ واحدة، فيختفي التمييز عن النموذج. لذا السؤال: "هل تحتاج المهمة هذا التمييز؟"</p><p><b>تحويل حالة الأحرف</b> يقلل حجم المفردات ويفيد الاسترجاع وتصحيح الإملاء وتصنيف المواضيع، لكنه يزيل تمييزًا مهمًّا للتعرف على الكيانات واستخراج المعلومات: US (الدولة) وus (الضمير) تصبحان سلسلة واحدة. وأمثلة أخرى: حذف النقاط في U.S.A.، وتوحيد colour/color، وحذف "ال" في العربية يفقد التعريف.</p><p><b>الخلاصة.</b> وحّد فقط ما يمكن للمهمة تجاهله بأمان، والنماذج العصبية الحديثة تحتفظ بكلمات التوقف وتتعلم ما تتجاهله.</p>`,
      [[`Correct definition + example for each of the three`, `تعريف ومثال لكل من الثلاثة`], [`Strength/risk of each (non-word, POS, "not good")`, `ميزة وخطر كل منها`], [`Equivalence class idea`, `فكرة فئة التكافؤ`], [`Case folding: helps IR, hurts NER (US/us)`, `تحويل الحالة: يفيد الاسترجاع ويضر NER`], [`Conclusion: depends on the task`, `الخلاصة: يعتمد على المهمة`]],
      `Comparison 6 · Trade-off discussion 3 · Conclusion 1`),
    E('Describe & discuss', `Describe text cleaning and sentence segmentation. What problems can each step cause, and how should they be handled?`, `صف تنظيف النصوص وتقسيم الجمل. ما المشكلات التي قد تسببها كل خطوة، وكيف نتعامل معها؟`, 8,
      `<p><b>Text cleaning</b> removes non-linguistic material from raw text before further processing: markup, boilerplate, control characters and encoding artifacts. The rule is <b>remove artifacts, not signal</b>.</p><ul><li>HTML/XML tags: strip the markup, keep the text; but tags may mark useful structure.</li><li>URLs and emails: replace with a placeholder such as &lt;URL&gt;; the presence of a link can be a feature.</li><li>Emoji/emoticons: normalise or map to a token; do not delete them for sentiment analysis.</li><li>Repeated characters: reduce to a fixed length (sooooo → soo keeps the emphasis; soo → so removes it).</li><li>Encoding artifacts: fix the encoding.</li></ul><p>Typical order: fix encoding, strip markup, replace URLs/emails, shorten repeated characters. Keep a copy of the raw text to rerun the pipeline if a rule deletes signal. Example of damage: removing all non-letters turns "Great, another update :(" into "Great another update", deleting the only sign of sarcasm.</p><p><b>Sentence segmentation</b> decides, for each candidate boundary marker, whether it ends a sentence: a binary decision. "?" and "!" are fairly unambiguous, but the <b>period is ambiguous</b>: a sentence boundary, an abbreviation (Dr., Inc.) or part of a number (4.3). In "went to Acme Inc." the period marks both. Systems use deterministic rules (a period ends a sentence unless the token before it is a known abbreviation or it is inside a number), learned classifiers that look at abbreviation, capitalization and the next word, or both.</p>`,
      `<p><b>تنظيف النص</b> يزيل المواد غير اللغوية: الوسوم والنصوص المتكررة ورموز التحكم وأخطاء الترميز. القاعدة: <b>أزل الشوائب لا الإشارة المفيدة</b>.</p><ul><li>وسوم HTML: أزل الوسوم واحتفظ بالنص، مع أنها قد تدل على بنية مفيدة.</li><li>الروابط: استبدلها بـ &lt;URL&gt; لأن وجود الرابط قد يكون مفيدًا.</li><li>الرموز التعبيرية: لا تحذفها في تحليل المشاعر.</li><li>الحروف المكررة: قصّرها لطول ثابت (sooooo ← soo يحفظ التأكيد).</li><li>أخطاء الترميز: أصلحها.</li></ul><p>الترتيب: إصلاح الترميز، إزالة الوسوم، استبدال الروابط، تقصير الحروف. واحتفظ بنسخة خام. مثال على الضرر: حذف غير الحروف يحوّل "Great, another update :(" إلى نص يفقد دليل السخرية.</p><p><b>تقسيم الجمل</b> يقرر لكل علامة محتملة هل تنهي الجملة (قرار ثنائي). "?" و"!" واضحتان، أما <b>النقطة فغامضة</b>: نهاية جملة أو اختصار (Dr.) أو رقم (4.3)، وفي "Acme Inc." تدل على الاثنين. وتستخدم الأنظمة قواعد ثابتة أو مصنفات تنظر إلى الاختصار والحرف الكبير والكلمة التالية، أو كليهما.</p>`,
      [[`Definition of text cleaning`, `تعريف تنظيف النص`], [`At least 3 artifacts with action + caution`, `ثلاث شوائب مع الإجراء والتحذير`], [`Sarcasm example / keep raw copy`, `مثال السخرية والاحتفاظ بنسخة خام`], [`Sentence segmentation = binary decision`, `تقسيم الجمل قرار ثنائي`], [`Period ambiguity + rules/classifier`, `غموض النقطة والقواعد/المصنف`]],
      `Cleaning 4 · Segmentation 4`),
    E('List & explain', `Explain the four limitations of fixed word vocabularies and how subword tokenization addresses them.`, `اشرح القيود الأربعة للمفردات الثابتة على مستوى الكلمة، وكيف يعالجها الترميز بالوحدات الفرعية.`, 8,
      `<ol><li><b>Unknown words (OOV):</b> words such as "neuroplasticity" or "COVID" that are not in the fixed vocabulary become UNK, so their lexical identity is lost.</li><li><b>Large vocabulary:</b> covering everything needs about 1M word types, giving a large embedding matrix and a costly output softmax.</li><li><b>No shared structure:</b> play, played and playing are represented separately, so related forms share nothing.</li><li><b>Poor multilingual scaling:</b> many languages lead to a huge word vocabulary that grows rapidly.</li></ol><p><b>Subword solution.</b> Keep frequent words whole and build rare words from smaller pieces. "the" stays one token; "neuroplasticity" → neuro + plastic + ity. If training saw low, new and newer but not lower, a subword tokenizer that learned "low" and "er" can segment lower = low + er. In the worst case a rare string such as "GRPO" is split into single letters (or bytes), so no input is unknown. Pieces such as play and -ed are shared across related words, and the vocabulary stays at a fixed, manageable size.</p><p><b>Caution.</b> Subwords improve representation and sharing, but they do not guarantee meaningful linguistic units (Spanish hondo → h + ondo).</p>`,
      `<ol><li><b>الكلمات المجهولة:</b> كلمات مثل "neuroplasticity" أو "COVID" غير الموجودة تصبح UNK فتضيع هويتها.</li><li><b>مفردات كبيرة:</b> تغطية كل شيء تحتاج نحو مليون نوع، فتكبر مصفوفة التضمين ويغلو حساب softmax.</li><li><b>لا بنية مشتركة:</b> play وplayed وplaying تُمثَّل منفصلة.</li><li><b>ضعف التوسع متعدد اللغات:</b> اللغات الكثيرة تعطي مفردات ضخمة.</li></ol><p><b>الحل.</b> إبقاء الكلمات المتكررة كاملة وبناء النادرة من قطع أصغر: "the" رمز واحد و"neuroplasticity" ← neuro + plastic + ity. وإذا رأى التدريب low وnew وnewer دون lower، تقسمها الأداة low + er. وفي أسوأ الحالات تُقسَّم "GRPO" إلى حروف أو بايتات فلا يوجد مجهول. وتُشارك القطع مثل play و-ed بين الكلمات المرتبطة، وتبقى المفردات بحجم ثابت.</p><p><b>تنبيه.</b> لا تضمن الوحدات الفرعية وحدات لغوية ذات معنى (hondo ← h + ondo).</p>`,
      [[`Four failures named with examples`, `القيود الأربعة مع أمثلة`], [`Why each matters`, `أهمية كل منها`], [`Core subword idea + low+er example`, `الفكرة الأساسية ومثال low + er`], [`Worst case: characters/bytes`, `أسوأ حالة: حروف/بايتات`]],
      `Failures 4 · Subword solution 3 · Caution 1`),
    E('Explain how & why', `Describe the BPE algorithm, distinguishing the token learner from the token segmenter. Apply the first four merges to the corpus "set new new renew reset renew", then segment the new word "retest".`, `صف خوارزم BPE مميزًا بين المتعلّم والمقسِّم. طبّق الدمجات الأربع الأولى على المدونة "set new new renew reset renew" ثم قسّم الكلمة الجديدة "retest".`, 14,
      `<p><b>BPE</b> begins with a vocabulary of individual characters and iteratively merges the most frequent pair of adjacent tokens.</p><p><b>Token learner (training phase):</b> (1) V ← all unique characters in the corpus; (2) for i = 1 to k: count every adjacent pair weighted by word frequency, take the most frequent pair tL, tR; (3) create tNEW = tL + tR and add it to V; (4) replace every adjacent tL, tR in the corpus with tNEW; (5) recount and repeat. It returns the vocabulary and the ordered merge list. Final |V| = |V₀| + k.</p><p><b>Token segmenter (encoder phase):</b> applies the learned merges to new text in the order they were learned. It does not recount frequencies.</p><p><b>Worked example.</b> Corpus with word-start marker ▁: 2 × ▁ n e w, 2 × ▁ r e n e w, 1 × ▁ s e t, 1 × ▁ r e s e t. Initial vocabulary {▁, e, n, r, s, t, w}, |V| = 7.</p><ol><li>Pair counts: n e 4, e w 4, ▁ r 3, r e 3, … Tie broken by the first listed pair: <b>n + e → ne</b>, |V| = 8.</li><li>Recount (e w is now 0; ne w = 4): <b>ne + w → new</b>, |V| = 9.</li><li>▁ r = 3 and r e = 3 (tie): <b>▁ + r → ▁r</b>, |V| = 10.</li><li><b>▁r + e → ▁re</b> (3), |V| = 11.</li></ol><p>Corpus now: 2 ▁ new · 2 ▁re new · 1 ▁ s e t · 1 ▁re s e t. BPE discovered the prefix re- from frequency alone.</p><p><b>Segmenting "retest":</b> start ▁ r e t e s t. Rules 1 and 2 (n+e, ne+w) do not apply. Rule 3: ▁ r → ▁r. Rule 4: ▁r e → ▁re. Result: <b>▁re + t + e + s + t</b>. The unseen part stays as separate characters.</p>`,
      `<p><b>BPE</b> يبدأ بمفردات من الحروف ويدمج بشكل متكرر أكثر زوج متجاور تكرارًا.</p><p><b>المتعلّم (التدريب):</b> (1) V ← كل الحروف الفريدة، (2) كرر k مرة: عدّ كل زوج متجاور مضروبًا في تكرار الكلمة وخذ الأكثر تكرارًا، (3) كوّن الرمز الجديد وأضفه إلى V، (4) استبدل كل ظهور للزوج في المدونة، (5) أعد العدّ وكرر. يعيد المفردات وقائمة الدمج المرتبة. |V| النهائي = |V₀| + k.</p><p><b>المقسِّم (الترميز):</b> يطبّق الدمجات على النص الجديد بالترتيب نفسه دون إعادة العدّ.</p><p><b>المثال.</b> المدونة: 2 × ▁ n e w، 2 × ▁ r e n e w، 1 × ▁ s e t، 1 × ▁ r e s e t، والمفردات الأولية 7.</p><ol><li>n e = 4 وe w = 4 (تعادل يُكسر بالأول): <b>ne</b>، |V| = 8.</li><li>إعادة العدّ (e w أصبح 0 وne w = 4): <b>new</b>، |V| = 9.</li><li>▁ r = 3 وr e = 3: <b>▁r</b>، |V| = 10.</li><li><b>▁re</b>، |V| = 11.</li></ol><p>اكتشف BPE البادئة re- من التكرار وحده.</p><p><b>تقسيم "retest":</b> ▁ r e t e s t، القاعدتان 1 و2 لا تنطبقان، ثم ▁r ثم ▁re، والنتيجة <b>▁re + t + e + s + t</b>.</p>`,
      [[`Learner steps (count → merge → rewrite → recount, k times)`, `خطوات المتعلّم`], [`Segmenter replays merges in order, no recount`, `المقسِّم يعيد التطبيق بالترتيب دون عدّ`], [`Correct merges ne, new, ▁r, ▁re with |V| 8→11`, `الدمجات الصحيحة و|V|`], [`Recount explanation (e w → 0)`, `شرح إعادة العدّ`], [`retest → ▁re t e s t`, `نتيجة retest`]],
      `Algorithm 4 · Learner vs segmenter 2 · Four merges 6 · Segmentation 2`),
    E('Compare & contrast', `Compare BPE, WordPiece, Unigram LM and SentencePiece. Use the hug/pug/pun/bun/hugs corpus to show how BPE and WordPiece choose different first merges.`, `قارن بين BPE وWordPiece وUnigram LM وSentencePiece، واستخدم مدونة hug/pug/pun/bun/hugs لتوضيح اختلاف أول دمج بين BPE وWordPiece.`, 10,
      `<table><tr><th>Name</th><th>What it is</th><th>Core idea</th></tr><tr><td>BPE</td><td>Learning algorithm</td><td>Merge the most frequent adjacent pair (GPT-2 uses byte-level BPE)</td></tr><tr><td>WordPiece</td><td>Learning/tokenization method (BERT)</td><td>Merge the pair that most increases training-data likelihood; common score = count(pair) / (count(first) × count(second)); ## marks a continuation piece</td></tr><tr><td>Unigram LM</td><td>Learning algorithm (Kudo, 2018)</td><td>Start from a large set of candidates and prune pieces whose removal lowers likelihood least</td></tr><tr><td>SentencePiece</td><td>Toolkit/library</td><td>Implements BPE or Unigram; treats space as the symbol ▁, so no language-specific pre-splitting</td></tr></table><p>Summary: <b>BPE merges, WordPiece scores, Unigram prunes, SentencePiece runs algorithms.</b> BPE and WordPiece grow a vocabulary by merging; Unigram shrinks a large vocabulary.</p><p><b>Worked example.</b> Corpus: hug ×10, pug ×5, pun ×12, bun ×4, hugs ×5, split as h ##u ##g, etc. Symbol counts: ##u 36, ##g 20, p 17, ##n 16, h 15, ##s 5, b 4.</p><ul><li><b>BPE</b> picks the highest pair count: ##u ##g = 20 → merges ##u + ##g.</li><li><b>WordPiece</b> picks the highest score. ##u ##g = 20/(36×20) = 1/36 ≈ 0.028, while ##g ##s = 5/(20×5) = 1/20 = 0.050 → merges ##g + ##s.</li></ul><p>Because ##u appears in every word, every pair containing it is divided by 36. WordPiece favours pairs whose parts are rare on their own, while BPE lets frequent parts win even when they appear everywhere. For encoding, WordPiece takes the longest vocabulary piece matching the start of the word and repeats on the remainder.</p>`,
      `<table><tr><th>الاسم</th><th>ما هو</th><th>الفكرة</th></tr><tr><td>BPE</td><td>خوارزم تعلّم</td><td>دمج الزوج المتجاور الأكثر تكرارًا (GPT-2 يستخدمه على مستوى البايت)</td></tr><tr><td>WordPiece</td><td>طريقة تعلّم/ترميز (BERT)</td><td>دمج الزوج الذي يزيد الاحتمالية أكثر؛ النتيجة = عدد الزوج / (عدد الأول × عدد الثاني)؛ و## تعني قطعة مكمّلة</td></tr><tr><td>Unigram LM</td><td>خوارزم تعلّم</td><td>البدء بمجموعة كبيرة وتقليم القطع الأقل تأثيرًا على الاحتمالية</td></tr><tr><td>SentencePiece</td><td>مكتبة</td><td>تطبّق BPE أو Unigram وتعامل المسافة كرمز ▁</td></tr></table><p>الخلاصة: <b>BPE يدمج، WordPiece يقيّم، Unigram يقلّم، SentencePiece يشغّل الخوارزميات.</b></p><p><b>المثال.</b> أعداد الرموز: ##u 36، ##g 20، p 17، ##n 16، h 15، ##s 5، b 4.</p><ul><li><b>BPE</b> يختار أعلى عدد: ##u ##g = 20.</li><li><b>WordPiece</b> يختار أعلى نتيجة: ##u ##g = 1/36 ≈ 0.028، و##g ##s = 1/20 = 0.050، فيدمج ##g + ##s.</li></ul><p>لأن ##u في كل كلمة، تُقسم كل أزواجها على 36. WordPiece يفضّل الأزواج ذات الأجزاء النادرة، وBPE يترك الأجزاء المتكررة تفوز.</p>`,
      [[`Correct "what it is" for all four`, `تحديد ماهية الأربعة`], [`Core idea of each (merge/score/prune/toolkit)`, `الفكرة الأساسية لكل منها`], [`BPE picks ##u ##g (20)`, `BPE يختار ##u ##g`], [`WordPiece picks ##g ##s (1/20 > 1/36)`, `WordPiece يختار ##g ##s`], [`BERT = WordPiece, GPT-2 = byte-level BPE`, `BERT وGPT-2`]],
      `Comparison 5 · Worked example 4 · Models 1`),
    E('Explain how & why', `Explain byte-level BPE. Why does it remove unknown tokens? Show how ñ (U+00F1) is encoded in UTF-8, and discuss the multilingual cost.`, `اشرح BPE على مستوى البايت. لماذا يزيل الرموز المجهولة؟ وضّح كيف يُرمَّز ñ (U+00F1) بـ UTF-8، وناقش التكلفة متعددة اللغات.`, 8,
      `<p><b>Background.</b> Unicode gives every character in every script a unique code point (U+ hexadecimal; a = U+0061, ب = U+0628). UTF-8, the most frequent encoding, stores each code point in 1 to 4 bytes; ASCII characters take 1 byte.</p><p><b>Byte-level BPE</b> runs BPE on the individual bytes of UTF-8-encoded text (GPT-2, GPT-4o). A byte has only 256 possible values, so a starting vocabulary of all 256 values can represent any text in any script: there are no unknown tokens. BPE then merges frequent byte pairs and quickly rebuilds the byte sequences of common characters.</p><p><b>Encoding ñ:</b></p><ol><li>ñ = U+00F1 lies in U+0080–U+07FF, so it needs 2 bytes with pattern 110yyyyy 10xxxxxx.</li><li>00F1 in 11 bits: 000 1111 0001 → yyyyy = 00011, xxxxxx = 110001.</li><li>Byte 1 = 110 + 00011 = 11000011 = <b>C3</b>; Byte 2 = 10 + 110001 = 10110001 = <b>B1</b>.</li></ol><p>So ñ → C3 B1 (len("ñ") = 1 code point, len("ñ".encode()) = 2 bytes). The first byte's leading bits (110) mark a 2-byte sequence; continuation bytes begin with 10. Check: ب U+0628 → D8 A8.</p><p><b>Multilingual cost.</b> In a tokenizer trained on English-heavy data, many learned merges favour English patterns, so underrepresented languages need more tokens for the same text (oversegmentation): a recipe needs 19 tokens in English and 33 in the Spanish original. Longer sequences cost more computation.</p>`,
      `<p><b>خلفية.</b> يعطي Unicode كل حرف نقطة ترميز فريدة (a = U+0061، ب = U+0628)، ويخزّن UTF-8 كل نقطة في 1 إلى 4 بايتات.</p><p><b>BPE على مستوى البايت</b> يعمل على بايتات النص المرمّز (GPT-2 وGPT-4o). للبايت 256 قيمة فقط، فمفردات أولية من 256 قيمة تمثل أي نص بأي لغة، فلا توجد رموز مجهولة، ثم يدمج BPE الأزواج المتكررة.</p><p><b>ترميز ñ:</b></p><ol><li>ñ = U+00F1 في المدى U+0080–U+07FF فتحتاج بايتين بالنمط 110yyyyy 10xxxxxx.</li><li>00F1 في 11 بتًا: yyyyy = 00011 وxxxxxx = 110001.</li><li>البايت 1 = 11000011 = <b>C3</b>، والبايت 2 = 10110001 = <b>B1</b>.</li></ol><p>إذن ñ ← C3 B1. البتات 110 في البداية تدل على سلسلة من بايتين، وبايتات الاستمرار تبدأ بـ 10. والتحقق: ب ← D8 A8.</p><p><b>التكلفة متعددة اللغات.</b> في أداة مدربة على بيانات إنجليزية غالبة، تفضّل الدمجات أنماط الإنجليزية، فتحتاج اللغات الأقل تمثيلًا رموزًا أكثر: وصفة تحتاج 19 رمزًا بالإنجليزية و33 بالإسبانية.</p>`,
      [[`Unicode, code point, UTF-8 1–4 bytes`, `Unicode ونقطة الترميز وUTF-8`], [`256 byte values → no UNK`, `256 قيمة ← لا مجهول`], [`Correct steps C3 B1`, `خطوات C3 B1 الصحيحة`], [`Oversegmentation 19 vs 33 tokens`, `الإفراط في التقسيم 19 مقابل 33`]],
      `Background 2 · No UNK 2 · Encoding 3 · Multilingual cost 1`),
    E('Explain how & why', `Explain minimum edit distance and the dynamic-programming recurrence. Compute MED(flaw, lawn) with unit costs, give the backtrace, and explain how the cost scheme affects intention → execution.`, `اشرح مسافة التحرير الدنيا وعلاقة البرمجة الديناميكية. احسب MED(flaw, lawn) بتكلفة 1، وأعطِ التتبع الخلفي، واشرح كيف يؤثر نظام التكاليف في intention ← execution.`, 14,
      `<p><b>Definition.</b> Minimum edit distance is the minimum total cost of a sequence of edit operations (insertion, deletion, substitution) needed to transform one string into another. With unit costs it is the minimum number of edits (Levenshtein distance).</p><p><b>Recurrence.</b> D[i, j] is the distance between the first i letters of the source and the first j of the target:</p><p>D[i, j] = min( D[i−1, j] + 1 (delete), D[i, j−1] + 1 (insert), D[i−1, j−1] + 0 if letters match else 1 (substitute) ).</p><p>Row 0 and column 0 are 0, 1, 2, … (comparing with the empty string). Fill row by row, left to right; the answer is D[n, m]. A table is used because many edit sequences pass through the same intermediate strings; each prefix pair is solved once (dynamic programming).</p><p><b>flaw → lawn.</b></p><table><tr><th></th><th>∅</th><th>l</th><th>a</th><th>w</th><th>n</th></tr><tr><td>∅</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><td>f</td><td>1</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><td>l</td><td>2</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><td>a</td><td>3</td><td>2</td><td>1</td><td>2</td><td>3</td></tr><tr><td>w</td><td>4</td><td>3</td><td>2</td><td>1</td><td>2</td></tr></table><p>Sample cells: D[f, l] = min(1+1, 1+1, 0+1) = 1; D[a, a] = D[l, l] + 0 = 1; D[w, n] = min(3+1, 1+1, 2+1) = 2. <b>MED = 2.</b></p><p><b>Backtrace</b> (store backpointers while filling, start at D[4,4]): D[4,4] ← left (insert n); D[4,3] ← diagonal (match w); D[3,2] ← diagonal (match a); D[2,1] ← diagonal (match l); D[1,0] ← above (delete f). Alignment: f l a w * / * l a w n, i.e. flaw → law → lawn.</p><p><b>Cost scheme.</b> intention → execution uses d s s i s. With Levenshtein unit costs the distance is 5; if substitution costs 2 (a deletion plus an insertion) it is (3 × 2) + 1 + 1 = 8. So the cost scheme must always be stated.</p>`,
      `<p><b>التعريف.</b> أقل تكلفة لسلسلة عمليات (إدراج، حذف، استبدال) تحوّل سلسلة إلى أخرى. ومع تكلفة 1 هي أقل عدد تعديلات (مسافة ليفنشتاين).</p><p><b>العلاقة.</b> D[i, j] هي المسافة بين أول i حروف من المصدر وأول j من الهدف: أقل قيمة من (الأعلى + 1 حذف، اليسار + 1 إدراج، القطر + 0 عند التطابق أو 1 عند الاختلاف). الصف والعمود الأولان 0، 1، 2... ونملأ صفًّا صفًّا، والإجابة D[n, m]. نستخدم الجدول لأن تسلسلات كثيرة تمر بالسلاسل الوسيطة نفسها فنحل كل زوج مرة واحدة.</p><p><b>flaw ← lawn:</b> (الجدول في الإجابة الإنجليزية). D[f, l] = 1، D[a, a] = 1، D[w, n] = min(4, 2, 3) = 2. <b>المسافة = 2.</b></p><p><b>التتبع الخلفي:</b> D[4,4] من اليسار (إدراج n)، ثم تطابق w وa وl قطريًّا، ثم D[1,0] من الأعلى (حذف f). المحاذاة: flaw ← law ← lawn.</p><p><b>نظام التكاليف.</b> intention ← execution بالعمليات d s s i s: بتكلفة 1 للجميع = 5، وإذا كلف الاستبدال 2 = (3×2)+1+1 = 8. لذا يجب ذكر نظام التكاليف دائمًا.</p>`,
      [[`Definition + three operations`, `التعريف والعمليات الثلاث`], [`Recurrence with three neighbours and initialization`, `العلاقة والتهيئة`], [`Correct table, MED = 2`, `جدول صحيح والمسافة 2`], [`Backtrace: delete f, insert n`, `التتبع: حذف f وإدراج n`], [`5 vs 8 under different costs`, `5 مقابل 8`]],
      `Definition 2 · Recurrence 3 · Table 4 · Backtrace 3 · Cost scheme 2`),
    E('Scenario', `You are building a sentiment classifier for Arabic and English tweets. Design the preprocessing pipeline: which normalization and cleaning steps would you apply, which would you avoid, and how would you tokenize?`, `تبني مصنِّفًا للمشاعر في تغريدات عربية وإنجليزية. صمّم مسار المعالجة المسبقة: ما خطوات التوحيد والتنظيف التي تطبقها، وما التي تتجنبها، وكيف ترمّز النص؟`, 10,
      `<p><b>Guiding rule.</b> Normalize only the distinctions the task can safely ignore, and remove artifacts, not signal. Keep a copy of the raw tweets.</p><p><b>Cleaning (apply):</b> fix encoding; strip any HTML; replace URLs and user emails with a placeholder such as &lt;URL&gt; (keeping that a link was present); shorten repeated characters to a fixed length (sooooo → soo) so emphasis is kept.</p><p><b>Keep (avoid deleting):</b> emoji and emoticons, because they carry strong sentiment signal ("Great, another update :(" loses its sarcasm if ":(" is removed); negation and stop words such as "not", because stop-word removal turns "not good" into "good"; punctuation such as "!" that may express emotion.</p><p><b>Case folding:</b> lowercasing reduces vocabulary, but capital letters can be sentiment or context clues, so it should be tested on the development set rather than applied blindly.</p><p><b>Arabic:</b> clitics attach to words (و، ب، ال), so وبالكتاب = و + ب + ال + كتاب. Without splitting, every combination is a separate type. Removing ال helps matching but loses definiteness.</p><p><b>Tokenization:</b> use a subword tokenizer (BPE, WordPiece, or byte-level BPE) so new slang, names and misspellings are built from known pieces and no input is unknown; be aware that Arabic may be oversegmented if the tokenizer was trained mostly on English. Use regex pretokenization to split punctuation and clitics such as 're.</p>`,
      `<p><b>القاعدة.</b> وحّد فقط ما يمكن للمهمة تجاهله، وأزل الشوائب لا الإشارة المفيدة، واحتفظ بنسخة خام من التغريدات.</p><p><b>التنظيف (يُطبَّق):</b> إصلاح الترميز، إزالة HTML، استبدال الروابط بـ &lt;URL&gt;، تقصير الحروف المكررة (sooooo ← soo) لحفظ التأكيد.</p><p><b>الاحتفاظ (عدم الحذف):</b> الرموز التعبيرية لأنها إشارة قوية للمشاعر، وكلمات النفي وكلمات التوقف مثل "not" لأن حذفها يحوّل "not good" إلى "good"، وعلامات مثل "!".</p><p><b>تحويل حالة الأحرف:</b> يقلل المفردات لكن الأحرف الكبيرة قد تكون دليلًا، فيُختبر على مجموعة التطوير.</p><p><b>العربية:</b> الزوائد تلتصق بالكلمات (و، ب، ال)، فبدون فصلها تصبح كل تركيبة نوعًا مستقلًا، وحذف "ال" يفقد التعريف.</p><p><b>الترميز:</b> استخدم ترميزًا بالوحدات الفرعية (BPE أو WordPiece أو BPE بالبايت) لتُبنى الكلمات العامية والأسماء والأخطاء من قطع معروفة، مع الانتباه لاحتمال الإفراط في تقسيم العربية، واستخدم التعابير النمطية للترميز المسبق.</p>`,
      [[`Cleaning steps in a sensible order`, `خطوات تنظيف بترتيب منطقي`], [`Keep emoji and negation (with lecture examples)`, `الاحتفاظ بالرموز التعبيرية والنفي`], [`Case folding as a trade-off`, `تحويل الحالة كمقايضة`], [`Arabic clitics issue`, `مشكلة الزوائد العربية`], [`Subword tokenization + oversegmentation risk`, `الترميز الفرعي وخطر الإفراط في التقسيم`]],
      `Cleaning 2 · What to keep 3 · Case 1 · Arabic 2 · Tokenization 2`),
    E('Scenario', `A speech recognizer outputs "the cat sit on mat" for the reference "the cat sat on the mat". Compute the word error rate and explain how it is related to minimum edit distance.`, `يُخرج نظام تعرّف على الكلام "the cat sit on mat" للمرجع "the cat sat on the mat". احسب معدل خطأ الكلمات واشرح علاقته بمسافة التحرير الدنيا.`, 5,
      `<p><b>WER</b> is the standard speech-recognition metric. It applies minimum edit distance to <b>words instead of characters</b>: the reference and system transcripts are aligned with the minimum-edit-distance alignment, and the errors are counted.</p><p>WER = (S + D + I) / N_reference.</p><p>Alignment: the = the, cat = cat, sat → sit (<b>substitution</b>), on = on, the → (missing) (<b>deletion</b>), mat = mat. So S = 1, D = 1, I = 0, N = 6.</p><p>WER = (1 + 1 + 0) / 6 = 2/6 = <b>0.33 (33%)</b>.</p><p>The denominator is the number of words in the reference, not in the system output.</p>`,
      `<p><b>WER</b> هو المقياس المعياري للتعرف على الكلام، ويطبق مسافة التحرير الدنيا على <b>الكلمات بدل الحروف</b>: نحاذي المرجع ومخرج النظام بأقل مسافة ونعدّ الأخطاء.</p><p>WER = (S + D + I) / N_المرجع.</p><p>المحاذاة: sat ← sit (<b>استبدال</b>)، وthe الثانية محذوفة (<b>حذف</b>). S = 1 وD = 1 وI = 0 وN = 6.</p><p>WER = 2/6 = <b>0.33 (33%)</b>. والمقام عدد كلمات المرجع لا مخرج النظام.</p>`,
      [[`WER formula`, `صيغة WER`], [`Edit distance on words`, `مسافة التحرير على الكلمات`], [`S = 1, D = 1, I = 0, N = 6`, `القيم الصحيحة`], [`WER = 0.33`, `النتيجة 0.33`]],
      `Formula 1 · Relation to MED 1 · Alignment 2 · Result 1`)

    E('Define & explain', `What is a language model? Explain the two quantities it estimates and give three applications of next-word prediction.`, `ما النموذج اللغوي؟ اشرح الكميتين اللتين يقدرهما، واذكر ثلاثة تطبيقات للتنبؤ بالكلمة التالية.`, 8,
      `<p><b>Definition.</b> A language model assigns probabilities to next words or to complete sequences. A model that predicts words learns useful facts about language.</p><p><b>Quantities.</b></p><ol><li><b>Next-word probability P(w | h)</b>: w is the candidate next word and h the history. Example: P(help | thank you for your). For "The water of Walden Pond is so beautifully …", blue/clear/green are likely and refrigerator is unlikely.</li><li><b>Sentence probability P(w₁, …, wₙ)</b>: the probability of a whole sequence, used to compare candidate sentences or score a test set.</li></ol><p><b>Applications.</b></p><ul><li><b>Speech recognition:</b> choose "back soonish" over "bassoon dish" when acoustics are ambiguous.</li><li><b>Spelling/grammar correction:</b> prefer "There are" over "Their are" using sentence probability.</li><li><b>Autocomplete / AAC:</b> suggest likely words to reduce typing effort.</li><li>Modern autoregressive LMs generate text by predicting the next token repeatedly.</li></ul>`,
      `<p><b>التعريف.</b> النموذج اللغوي يُسند احتمالات للكلمات التالية أو للسلاسل الكاملة، والنموذج الذي يتنبأ بالكلمات يتعلم حقائق مفيدة عن اللغة.</p><p><b>الكميتان.</b></p><ol><li><b>احتمال الكلمة التالية P(w | h)</b>: w الكلمة المرشحة وh التاريخ. مثال: P(help | thank you for your).</li><li><b>احتمال الجملة P(w₁, …, wₙ)</b>: احتمال سلسلة كاملة لمقارنة الجمل أو تقييم مجموعة اختبار.</li></ol><p><b>التطبيقات.</b></p><ul><li><b>التعرّف على الكلام:</b> اختيار "back soonish" بدل "bassoon dish".</li><li><b>تصحيح الإملاء والقواعد:</b> تفضيل "There are" على "Their are".</li><li><b>الإكمال التلقائي:</b> اقتراح كلمات محتملة لتقليل الكتابة.</li><li>النماذج الحديثة تولّد النص بالتنبؤ المتكرر بالرمز التالي.</li></ul>`,
      [[`Definition of LM`, `تعريف النموذج اللغوي`], [`P(w|h) with symbols explained`, `P(w|h) مع شرح الرموز`], [`Sentence probability and its use`, `احتمال الجملة واستخدامه`], [`Three applications with examples`, `ثلاثة تطبيقات مع أمثلة`]],
      `Definition 2 · Two quantities 3 · Applications 3`),
    E('Explain how & why', `Explain the chain rule and the Markov assumption. Show how they lead to the bigram approximation, and discuss one limitation.`, `اشرح قاعدة السلسلة وافتراض ماركوف، وبيّن كيف يؤديان إلى التقريب الثنائي، وناقش قيدًا واحدًا.`, 10,
      `<p><b>Chain rule.</b> The exact probability of a sentence is P(w₁:ₙ) = Πᵢ P(wᵢ | w₁:ᵢ₋₁): multiply the probability of each word given all previous words.</p><p><b>Problem with the full history.</b> A long history such as "The water of Walden Pond is so beautifully" may never appear in a corpus, and one observed occurrence is not enough for a stable estimate.</p><p><b>Markov assumption.</b> Approximate the full history with the recent context: P(wₙ | w₁, …, wₙ₋₁) ≈ P(wₙ | wₙ₋ₙ₊₁, …, wₙ₋₁). Unigram uses no history, bigram the previous word, trigram the previous two words. It is an approximation, not a claim that older words never matter.</p><p><b>Bigram approximation.</b> Applying the assumption with n = 2 to the chain rule gives P(w₁:ₙ) ≈ Πᵢ P(wᵢ | wᵢ₋₁). Each factor is estimated by MLE: C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁).</p><p><b>Limitation.</b> Long-distance dependencies are lost. In "The computer … on the fifth floor crashed", <i>crashed</i> depends on <i>computer</i>, which is outside a short window. Increasing n helps but creates many more zero counts (sparsity).</p>`,
      `<p><b>قاعدة السلسلة.</b> الاحتمال الدقيق للجملة P(w₁:ₙ) = Πᵢ P(wᵢ | w₁:ᵢ₋₁): نضرب احتمال كل كلمة بشرط كل الكلمات السابقة.</p><p><b>مشكلة التاريخ الكامل.</b> التاريخ الطويل قد لا يظهر أبدًا في المدونة، وظهور واحد لا يكفي لتقدير مستقر.</p><p><b>افتراض ماركوف.</b> نقرّب التاريخ الكامل بالسياق القريب. الأحادي بلا تاريخ، والثنائي بكلمة سابقة، والثلاثي بكلمتين. وهو تقريب لا ادعاء بأن الكلمات الأقدم لا تهم.</p><p><b>التقريب الثنائي.</b> بتطبيق الافتراض مع n = 2: P(w₁:ₙ) ≈ Πᵢ P(wᵢ | wᵢ₋₁)، ويُقدَّر كل عامل بـ C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁).</p><p><b>القيد.</b> تضيع الاعتماديات البعيدة: في "The computer … on the fifth floor crashed" تعتمد <i>crashed</i> على <i>computer</i> البعيدة. وزيادة n تساعد لكنها تزيد الأعداد الصفرية.</p>`,
      [[`Chain rule formula`, `صيغة قاعدة السلسلة`], [`Why full history fails (data problem)`, `لماذا يفشل التاريخ الكامل`], [`Markov assumption formula + meaning`, `صيغة افتراض ماركوف ومعناه`], [`Bigram product formula`, `صيغة الضرب الثنائي`], [`Long-distance limitation example`, `مثال القيد البعيد`]],
      `Chain rule 2 · Data problem 2 · Markov 2 · Bigram 2 · Limitation 2`),
    E('Compare & contrast', `Compare unigram, bigram and trigram models. Explain the trade-off involved in choosing N.`, `قارن بين النماذج الأحادية والثنائية والثلاثية، واشرح المقايضة في اختيار N.`, 8,
      `<table><tr><th>Model</th><th>Uses</th><th>Approximation</th><th>Trade-off</th></tr><tr><td>Unigram</td><td>No history</td><td>P(w₁)P(w₂)…P(wₙ)</td><td>Robust counts, weak coherence</td></tr><tr><td>Bigram</td><td>Previous word</td><td>Π P(wᵢ | wᵢ₋₁)</td><td>Better local fluency</td></tr><tr><td>Trigram</td><td>Previous two words</td><td>Π P(wᵢ | wᵢ₋₂, wᵢ₋₁)</td><td>More context, more sparsity</td></tr></table><p><b>Evidence.</b> On one test set, perplexity was 962 (unigram), 170 (bigram) and 109 (trigram). Generated text shows the same pattern: a unigram model produces "food want the to Chinese I …" (plausible words, poor order), while a trigram model can produce "I want to eat Chinese food." but still lacks long-range meaning.</p><p><b>Trade-off.</b> More context (higher N) gives better local fluency, but the number of possible contexts grows, so many n-grams are never seen in training and get zero counts. Higher N is not automatically better unless there is enough data and smoothing.</p>`,
      `<table><tr><th>النموذج</th><th>يستخدم</th><th>التقريب</th><th>المقايضة</th></tr><tr><td>أحادي</td><td>بلا تاريخ</td><td>P(w₁)P(w₂)…</td><td>عدّ مستقر وترابط ضعيف</td></tr><tr><td>ثنائي</td><td>الكلمة السابقة</td><td>Π P(wᵢ | wᵢ₋₁)</td><td>سلاسة محلية أفضل</td></tr><tr><td>ثلاثي</td><td>كلمتان سابقتان</td><td>Π P(wᵢ | wᵢ₋₂, wᵢ₋₁)</td><td>سياق أكثر وتشتت أكثر</td></tr></table><p><b>الدليل.</b> كانت الحيرة 962 للأحادي و170 للثنائي و109 للثلاثي. والنص المولَّد بالأحادي "food want the to Chinese I …" بترتيب ضعيف، والثلاثي يولّد "I want to eat Chinese food." لكنه يفتقد المعنى البعيد.</p><p><b>المقايضة.</b> سياق أكثر يعني سلاسة محلية أفضل، لكن عدد السياقات يتزايد فلا تظهر كثير من n-grams في التدريب وتحصل على صفر. لذا N الأعلى ليس أفضل تلقائيًّا إلا مع بيانات كافية وتنعيم.</p>`,
      [[`Correct history used by each`, `التاريخ المستخدم في كل نموذج`], [`Approximation formulas`, `صيغ التقريب`], [`Perplexity 962/170/109 or generation examples`, `أرقام الحيرة أو أمثلة التوليد`], [`Context vs sparsity trade-off`, `مقايضة السياق والتشتت`]],
      `Comparison 4 · Evidence 2 · Trade-off 2`),
    E('Explain how & why', `Explain maximum likelihood estimation for bigrams. Using the corpus "<s> I like NLP </s>", "<s> I like AI </s>", "<s> AI is useful </s>", compute P(like | I), P(AI | like), P(NLP | AI) and P(<s> I like NLP </s>).`, `اشرح تقدير أقصى احتمالية للنماذج الثنائية، واحسب باستخدام المدونة المعطاة P(like | I) وP(AI | like) وP(NLP | AI) واحتمال الجملة "<s> I like NLP </s>".`, 10,
      `<p><b>MLE.</b> Probabilities are estimated from counts by normalizing: P(wᵢ | wᵢ₋₁) = C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁). The numerator is how often the bigram occurred; the denominator is how often the history occurred (not the whole sentence and not the candidate word). The result lies between 0 and 1. &lt;s&gt; and &lt;/s&gt; mark sentence boundaries so that the first and last words also have a context.</p><p><b>Calculations.</b></p><ul><li>P(like | I) = C(I like) / C(I) = 2/2 = <b>1</b>.</li><li>P(AI | like) = C(like AI) / C(like) = 1/2 = <b>0.5</b>.</li><li>P(NLP | AI) = C(AI NLP) / C(AI) = 0/2 = <b>0</b>, because "AI NLP" never occurs in training.</li></ul><p><b>Sentence probability (bigram).</b> P = P(I | &lt;s&gt;) × P(like | I) × P(NLP | like) × P(&lt;/s&gt; | NLP) = (2/3) × 1 × (1/2) × 1 = <b>1/3 ≈ 0.333</b>.</p><p><b>Comment.</b> The zero for P(NLP | AI) shows the zero-count problem: any sentence containing "AI NLP" would get probability 0. Smoothing should change this zero into a small non-zero probability. In practice we add log probabilities to avoid underflow.</p>`,
      `<p><b>التقدير.</b> نحسب الاحتمال من العدّ بالتطبيع: P(wᵢ | wᵢ₋₁) = C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁). البسط عدد مرات الثنائي والمقام عدد مرات التاريخ. و&lt;s&gt; و&lt;/s&gt; تحددان حدود الجملة.</p><p><b>الحسابات.</b></p><ul><li>P(like | I) = 2/2 = <b>1</b>.</li><li>P(AI | like) = 1/2 = <b>0.5</b>.</li><li>P(NLP | AI) = 0/2 = <b>0</b> لأن "AI NLP" لم تظهر.</li></ul><p><b>احتمال الجملة.</b> (2/3) × 1 × (1/2) × 1 = <b>1/3 ≈ 0.333</b>.</p><p><b>تعليق.</b> الصفر في P(NLP | AI) يوضح مشكلة العدّ الصفري، والتنعيم يحوّله إلى احتمال صغير غير صفري. وعمليًّا نجمع اللوغاريتمات لتجنب التجاوز السفلي.</p>`,
      [[`MLE formula; denominator = history count`, `صيغة التقدير والمقام`], [`1, 0.5, 0`, `القيم 1 و0.5 و0`], [`Sentence probability 1/3 with steps`, `احتمال الجملة 1/3 بالخطوات`], [`Zero → smoothing comment`, `التعليق على الصفر والتنعيم`]],
      `MLE 2 · Three values 3 · Sentence probability 3 · Comment 2`),
    E('Define & explain', `Define perplexity. Explain its formula and interpretation, compute it for token probabilities 0.50, 0.25 and 0.25, and state the conditions for comparing two models.`, `عرّف الحيرة (perplexity). اشرح صيغتها وتفسيرها، واحسبها لاحتمالات 0.50 و0.25 و0.25، واذكر شروط مقارنة نموذجين.`, 10,
      `<p><b>Definition.</b> Perplexity is the standard intrinsic metric for language models: the inverse probability of the test set, normalized by its length.</p><p><b>Formula.</b> PP(W) = P(w₁, …, w_N)^(−1/N), where W is the test sequence and N the number of predicted tokens.</p><p><b>Interpretation.</b> A lower perplexity means the model assigned a higher probability to the real test text, so it predicts better and is "less surprised". Intuitively, perplexity is the average number of plausible choices per word.</p><p><b>Calculation.</b> Step 1: P(W) = 0.50 × 0.25 × 0.25 = 0.03125. Step 2: PP = P(W)^(−1/3). Step 3: 0.03125^(−1/3) ≈ <b>3.17</b>, about 3.17 plausible choices per word. (Do not forget the negative reciprocal power.)</p><p><b>Example from practice.</b> Unigram 962, bigram 170, trigram 109 on the same test set.</p><p><b>Comparison rules.</b> If Model A has lower perplexity than Model B on the same test set, A is better under this metric. Compare only when the test set and tokenisation are the same, and never train on the test set.</p>`,
      `<p><b>التعريف.</b> الحيرة هي المقياس الداخلي المعياري للنماذج اللغوية: مقلوب احتمال مجموعة الاختبار مطبَّعًا بطولها.</p><p><b>الصيغة.</b> PP(W) = P(w₁, …, w_N)^(−1/N)، حيث W سلسلة الاختبار وN عدد الرموز المتنبأ بها.</p><p><b>التفسير.</b> الحيرة الأقل تعني احتمالًا أعلى للنص الحقيقي، أي تنبؤًا أفضل وتفاجؤًا أقل، وهي متوسط عدد الخيارات المعقولة لكل كلمة.</p><p><b>الحساب.</b> P(W) = 0.03125، ثم PP = 0.03125^(−1/3) ≈ <b>3.17</b>.</p><p><b>مثال.</b> أحادي 962، ثنائي 170، ثلاثي 109.</p><p><b>شروط المقارنة.</b> النموذج ذو الحيرة الأقل على مجموعة الاختبار نفسها أفضل. قارن فقط مع نفس مجموعة الاختبار ونفس الترميز، ولا تدرب على الاختبار.</p>`,
      [[`Definition (intrinsic, inverse normalized probability)`, `التعريف`], [`Formula with symbols`, `الصيغة والرموز`], [`Lower = better; average choices per word`, `الأقل أفضل؛ متوسط الخيارات`], [`3.17 with steps`, `3.17 مع الخطوات`], [`Same test set and tokenisation`, `نفس مجموعة الاختبار والترميز`]],
      `Definition 2 · Formula 2 · Interpretation 2 · Calculation 3 · Conditions 1`),
    E('Compare & contrast', `Compare intrinsic and extrinsic evaluation of language models. Explain the role of the training, development and test sets.`, `قارن بين التقييم الداخلي والخارجي للنماذج اللغوية، واشرح دور مجموعات التدريب والتطوير والاختبار.`, 8,
      `<p><b>Intrinsic evaluation</b> measures the model directly, independent of any application. The classic metric is perplexity. It is fast, cheap and reusable.</p><p><b>Extrinsic evaluation</b> puts the model inside a real task and measures the task's improvement, for example speech recognition accuracy. It is more realistic but expensive.</p><p><b>Data splits.</b></p><ul><li><b>Training set (≈80%)</b>: estimate the n-gram counts.</li><li><b>Development set (≈10%)</b>: tune model choices and smoothing parameters, such as k in add-k or the λ weights in interpolation.</li><li><b>Test set (≈10%)</b>: final evaluation on unseen data.</li></ul><p>Never train or tune on the test set: it makes the model look artificially good. The training data should also match the test domain (SMS → train on SMS; Shakespeare training gives poor probabilities on news).</p>`,
      `<p><b>التقييم الداخلي</b> يقيس النموذج مباشرة بمعزل عن التطبيقات، ومقياسه الكلاسيكي الحيرة، وهو سريع ورخيص وقابل لإعادة الاستخدام.</p><p><b>التقييم الخارجي</b> يضع النموذج في مهمة حقيقية ويقيس تحسّنها، مثل دقة التعرف على الكلام، وهو أكثر واقعية لكنه مكلف.</p><p><b>تقسيم البيانات.</b></p><ul><li><b>التدريب (≈80%)</b>: تقدير أعداد n-gram.</li><li><b>التطوير (≈10%)</b>: ضبط الخيارات ومعاملات التنعيم مثل k وλ.</li><li><b>الاختبار (≈10%)</b>: التقييم النهائي على بيانات غير مرئية.</li></ul><p>لا تدرب ولا تضبط على مجموعة الاختبار لأنها تجعل النموذج يبدو أفضل زيفًا. ويجب أن تطابق بيانات التدريب مجال الاختبار.</p>`,
      [[`Intrinsic definition + perplexity + pros`, `الداخلي مع الحيرة والمزايا`], [`Extrinsic definition + example + pros/cons`, `الخارجي مع مثال`], [`Three splits with purposes and %`, `المجموعات الثلاث وأغراضها`], [`Never train on test`, `عدم التدريب على الاختبار`]],
      `Intrinsic 2 · Extrinsic 2 · Splits 3 · Rule 1`),
    E('Describe & discuss', `Discuss the zero-count problem and the unknown-word problem in n-gram models. How is each handled?`, `ناقش مشكلة العدّ الصفري ومشكلة الكلمات المجهولة في نماذج n-gram، وكيف تُعالَج كل منهما؟`, 10,
      `<p><b>Zero-count problem.</b> Training contains "denied the allegations / reports / claims / request", but the test set contains "denied the offer" and "denied the loan". Under MLE, P(offer | denied the) = 0. One zero makes the whole sentence probability zero, and perplexity cannot be computed. A good model should assign a small probability, not zero. The problem becomes worse as N grows (more possible contexts, more sparsity).</p><p><b>Handling it: smoothing.</b> Reduce overconfidence in seen events to reserve probability for unseen ones, keeping the total at 1. Methods: Laplace (add-one), add-k, Good–Turing, absolute discounting, backoff and interpolation, and Kneser–Ney.</p><p><b>Unknown-word problem.</b> A word may not be in the vocabulary at all. In a <b>closed vocabulary</b> setting all test words are known in advance, so there are no OOV words; this suits constrained tasks. In an <b>open vocabulary</b> setting new words may appear at test time. The OOV rate is the percentage of test tokens outside the vocabulary.</p><p><b>Handling it: &lt;UNK&gt;.</b> Choose a vocabulary, replace rare or out-of-vocabulary training words with &lt;UNK&gt;, and estimate the probability of &lt;UNK&gt; like any other token. At test time, unknown words are mapped to &lt;UNK&gt;.</p>`,
      `<p><b>مشكلة العدّ الصفري.</b> التدريب يحتوي "denied the allegations / reports …" والاختبار يحتوي "denied the offer"، فيكون P(offer | denied the) = 0. صفر واحد يجعل احتمال الجملة صفرًا ولا يمكن حساب الحيرة. والنموذج الجيد يعطي احتمالًا صغيرًا لا صفرًا، وتزداد المشكلة مع زيادة N.</p><p><b>المعالجة: التنعيم.</b> تقليل الثقة الزائدة في المرئي لحجز احتمال لغير المرئي مع بقاء المجموع 1: لابلاس، add-k، Good–Turing، الخصم المطلق، الرجوع والاستيفاء، Kneser–Ney.</p><p><b>مشكلة الكلمة المجهولة.</b> قد لا تكون الكلمة في المفردات أصلًا. في <b>المفردات المغلقة</b> كل كلمات الاختبار معروفة مسبقًا، وفي <b>المفردات المفتوحة</b> قد تظهر كلمات جديدة. ونسبة OOV هي نسبة رموز الاختبار خارج المفردات.</p><p><b>المعالجة: &lt;UNK&gt;.</b> نختار المفردات، ونستبدل الكلمات النادرة في التدريب بـ &lt;UNK&gt;، ونقدّر احتماله كأي رمز، ثم نحوّل الكلمات المجهولة في الاختبار إليه.</p>`,
      [[`"denied the offer" example; one zero kills the sentence`, `مثال denied the offer`], [`Smoothing idea + methods`, `فكرة التنعيم وطرقه`], [`Closed vs open vocabulary, OOV rate`, `المغلقة والمفتوحة ونسبة OOV`], [`<UNK> procedure`, `طريقة <UNK>`]],
      `Zero problem 3 · Smoothing 2 · Unknown words 3 · <UNK> 2`),
    E('Explain how & why', `Explain Laplace (add-one) smoothing with its formula. Compute the smoothed P(NLP | AI) given V = 6, C(AI) = 2 and C(AI, NLP) = 0. Then describe other smoothing families.`, `اشرح تنعيم لابلاس مع صيغته، واحسب P(NLP | AI) بعد التنعيم إذا كان V = 6 وC(AI) = 2 وC(AI, NLP) = 0، ثم صف عائلات التنعيم الأخرى.`, 10,
      `<p><b>Idea.</b> Smoothing reduces overconfidence in seen events to reserve probability for unseen events. Laplace smoothing pretends every possible next word appeared once more than it did.</p><p><b>Formula.</b> P_add1(wᵢ | h) = (C(h, wᵢ) + 1) / (C(h) + V), where C(h, wᵢ) is the count of history + word, C(h) the count of the history and V the vocabulary size. V is added to the denominator because 1 is added to each of the V possible next words, so the probabilities still sum to 1.</p><p><b>Calculation.</b> Unsmoothed: P(NLP | AI) = 0/2 = 0. Add-one: (0 + 1) / (2 + 6) = 1/8 = <b>0.125</b>. The unseen bigram now has a non-zero probability, and seen bigrams get slightly lower probabilities.</p><p><b>Limitation.</b> Add-one is simple and useful for teaching but often too aggressive when V is large, because it moves too much probability mass to unseen events.</p><p><b>Other families.</b></p><ul><li><b>Add-k:</b> add a fractional count k instead of 1, chosen on the dev set.</li><li><b>Good–Turing:</b> use counts of rare events, especially singletons, to estimate unseen probability.</li><li><b>Absolute discounting:</b> subtract a fixed D from non-zero counts to free probability mass.</li><li><b>Backoff / interpolation:</b> use lower-order models when higher-order evidence is weak.</li><li><b>Kneser–Ney:</b> rewards words that appear in many different contexts.</li></ul>`,
      `<p><b>الفكرة.</b> التنعيم يقلل الثقة في المرئي ليحجز احتمالًا لغير المرئي. وتنعيم لابلاس يتظاهر بأن كل كلمة تالية ممكنة ظهرت مرة إضافية.</p><p><b>الصيغة.</b> P_add1 = (C(h, wᵢ) + 1) / (C(h) + V). نضيف V للمقام لأننا أضفنا 1 لكل من الكلمات V الممكنة، فيبقى المجموع 1.</p><p><b>الحساب.</b> دون تنعيم = 0. مع add-one: (0+1)/(2+6) = 1/8 = <b>0.125</b>. يصبح للثنائي غير المرئي احتمال غير صفري، وتنخفض احتمالات المرئي قليلًا.</p><p><b>القيد.</b> بسيط ومفيد تعليميًّا لكنه عنيف جدًّا مع V كبيرة.</p><p><b>عائلات أخرى.</b></p><ul><li><b>Add-k:</b> إضافة كسر k يُختار على مجموعة التطوير.</li><li><b>Good–Turing:</b> استخدام عدد الأحداث النادرة خاصة المفردة لتقدير غير المرئي.</li><li><b>الخصم المطلق:</b> طرح قيمة ثابتة D من الأعداد غير الصفرية.</li><li><b>الرجوع والاستيفاء:</b> استخدام النماذج الأدنى عند ضعف دليل الأعلى.</li><li><b>Kneser–Ney:</b> يكافئ الكلمات الظاهرة في سياقات كثيرة.</li></ul>`,
      [[`Smoothing idea; add-one = count +1`, `فكرة التنعيم`], [`Formula and why +V`, `الصيغة وسبب +V`], [`0 → 1/8 = 0.125`, `من 0 إلى 0.125`], [`Too aggressive for large V`, `عنيف مع V كبيرة`], [`At least three other families`, `ثلاث عائلات أخرى`]],
      `Idea 1 · Formula 2 · Calculation 3 · Limitation 1 · Other methods 3`),
    E('Compare & contrast', `Compare backoff and interpolation. Then explain the intuition behind Kneser–Ney smoothing.`, `قارن بين الرجوع (backoff) والاستيفاء (interpolation)، ثم اشرح الحدس وراء تنعيم Kneser–Ney.`, 8,
      `<p>Both methods use <b>shorter histories</b> (lower-order models) when higher-order evidence is weak.</p><table><tr><th></th><th>Backoff</th><th>Interpolation</th></tr><tr><td>How</td><td>Use the trigram if available; if not, the bigram; if not, the unigram</td><td>Weighted mix of all orders: P = λ₁P_uni + λ₂P_bi + λ₃P_tri</td></tr><tr><td>Models used</td><td>One model at a time</td><td>All models contribute</td></tr><tr><td>Parameters</td><td>—</td><td>λ values learned on held-out (dev) data; they sum to 1</td></tr><tr><td>Keyword</td><td>Fallback</td><td>Mixture</td></tr></table><p><b>Kneser–Ney intuition.</b> Frequency is not the same as usefulness as a continuation. "Francisco" may be frequent, but it appears mostly after "San", so it is not a generally likely continuation of a new context. "of" appears after many different words, so it is a good lower-order continuation. Kneser–Ney therefore rewards words that appear in many different contexts rather than words that are simply frequent.</p>`,
      `<p>كلتا الطريقتين تستخدم <b>تواريخ أقصر</b> عندما يكون دليل الرتبة الأعلى ضعيفًا.</p><table><tr><th></th><th>الرجوع</th><th>الاستيفاء</th></tr><tr><td>الطريقة</td><td>الثلاثي إن وُجد، وإلا الثنائي، وإلا الأحادي</td><td>مزيج موزون: λ₁P_uni + λ₂P_bi + λ₃P_tri</td></tr><tr><td>النماذج</td><td>نموذج واحد في كل مرة</td><td>كل النماذج تساهم</td></tr><tr><td>المعاملات</td><td>—</td><td>λ تُتعلَّم على بيانات التطوير ومجموعها 1</td></tr><tr><td>الكلمة المفتاحية</td><td>البديل الاحتياطي</td><td>المزج</td></tr></table><p><b>حدس Kneser–Ney.</b> التكرار ليس كالفائدة كتكملة. "Francisco" متكررة لكنها تأتي غالبًا بعد "San"، أما "of" فتظهر بعد كلمات كثيرة. لذلك يكافئ Kneser–Ney الكلمات التي تظهر في سياقات مختلفة كثيرة لا الكلمات المتكررة فقط.</p>`,
      [[`Backoff: fallback, one model at a time`, `الرجوع: نموذج واحد`], [`Interpolation formula; all contribute`, `صيغة الاستيفاء`], [`λ learned on dev data, sum to 1`, `λ من التطوير ومجموعها 1`], [`Kneser–Ney: Francisco vs of`, `Kneser–Ney: Francisco مقابل of`]],
      `Backoff 2 · Interpolation 3 · Kneser–Ney 3`),
    E('Explain how & why', `Explain how an n-gram language model generates text. Compare sampling with greedy choice, and describe how the order n affects the generated text.`, `اشرح كيف يولّد نموذج n-gram النص، وقارن بين المعاينة والاختيار الجشع، وصف أثر الرتبة n على النص المولَّد.`, 8,
      `<p><b>Generation loop.</b> (1) Start with the sentence-start token &lt;s&gt;. (2) Use the model to produce probabilities for possible next tokens. (3) Sample one token according to its probability. (4) Append it to the context. (5) Repeat until &lt;/s&gt; is generated. Prediction becomes generation.</p><p><b>Example.</b> From the mini corpus, P(I | &lt;s&gt;) = 2/3 and P(AI | &lt;s&gt;) = 1/3. If I is sampled, P(like | I) = 1. After like, P(NLP | like) = P(AI | like) = 1/2, so NLP or AI is chosen with equal probability.</p><p><b>Sampling vs greedy.</b> Sampling chooses according to probability, allows variation and may sometimes choose a less likely word; it is useful for generation. Greedy choice always chooses the highest-probability word; it is more predictable but can become repetitive or get stuck in common phrases.</p><p><b>Effect of n.</b> A unigram model has weak structure ("food want the to Chinese I …"); words are plausible but the order is poor. Bigrams give local coherence and trigrams stronger local coherence ("I want to eat Chinese food."), but long-range meaning is still limited.</p>`,
      `<p><b>حلقة التوليد.</b> (1) نبدأ بـ &lt;s&gt;. (2) يعطي النموذج احتمالات الرموز التالية. (3) نختار رمزًا عشوائيًّا حسب احتماله. (4) نضيفه للسياق. (5) نكرر حتى &lt;/s&gt;.</p><p><b>مثال.</b> P(I | &lt;s&gt;) = 2/3 وP(AI | &lt;s&gt;) = 1/3. إذا اختيرت I فـ P(like | I) = 1، وبعد like يُختار NLP أو AI باحتمال متساوٍ.</p><p><b>المعاينة مقابل الجشع.</b> المعاينة تختار حسب الاحتمال وتسمح بالتنوع وقد تختار كلمة أقل احتمالًا. والجشع يختار دائمًا الأعلى احتمالًا؛ أكثر قابلية للتوقع لكنه قد يتكرر أو يعلق في عبارات شائعة.</p><p><b>أثر n.</b> الأحادي بنية ضعيفة ("food want the to Chinese I …")، والثنائي ترابط محلي، والثلاثي ترابط محلي أقوى ("I want to eat Chinese food.") مع بقاء المعنى البعيد محدودًا.</p>`,
      [[`Five-step loop`, `الحلقة بخطواتها الخمس`], [`Worked bigram example`, `المثال الثنائي`], [`Sampling vs greedy comparison`, `المقارنة بين المعاينة والجشع`], [`Unigram vs trigram text`, `نص الأحادي مقابل الثلاثي`]],
      `Loop 3 · Example 1 · Comparison 2 · Effect of n 2`),
    E('Scenario', `A company wants an autocomplete feature for its customer-support SMS messages. Describe, step by step, how you would build and evaluate an n-gram language model for it.`, `تريد شركة ميزة إكمال تلقائي لرسائل SMS الخاصة بدعم العملاء. صف خطوة بخطوة كيف تبني نموذج n-gram وتقيّمه لهذا الغرض.`, 10,
      `<ol><li><b>Collect matching data.</b> A model can only sound like its data, so train on SMS support messages, not Shakespeare or news.</li><li><b>Normalise.</b> Case, tokenise, handle punctuation (Week 2 decisions).</li><li><b>Add markers.</b> Add &lt;s&gt; and &lt;/s&gt; to each message.</li><li><b>Split the data.</b> Training ≈80% (counts), development ≈10% (tuning), test ≈10% (final evaluation). Never train on the test set.</li><li><b>Handle unknown words.</b> Use an open vocabulary: replace rare training words with &lt;UNK&gt; and estimate its probability.</li><li><b>Count.</b> Collect unigram, bigram and trigram counts; estimate P(wᵢ | history) by MLE. Choose N considering the context-vs-sparsity trade-off.</li><li><b>Smooth.</b> Avoid zeros, for example interpolation with λ weights tuned on the dev set (or add-k with k chosen on dev).</li><li><b>Evaluate.</b> Intrinsic: perplexity on the test set (lower is better; same test set and tokenisation for comparisons). Extrinsic: measure how much typing effort the suggestions save for real users.</li><li><b>Suggest.</b> For autocomplete, show the most probable next words given the typed context; store log probabilities to avoid underflow.</li></ol>`,
      `<ol><li><b>جمع بيانات مطابقة.</b> النموذج يشبه بياناته، فندرب على رسائل الدعم لا على شكسبير أو الأخبار.</li><li><b>التوحيد.</b> حالة الأحرف والترميز وعلامات الترقيم.</li><li><b>إضافة العلامات.</b> &lt;s&gt; و&lt;/s&gt; لكل رسالة.</li><li><b>تقسيم البيانات.</b> تدريب ≈80% وتطوير ≈10% واختبار ≈10%، دون التدريب على الاختبار.</li><li><b>الكلمات المجهولة.</b> مفردات مفتوحة واستبدال النادر بـ &lt;UNK&gt;.</li><li><b>العدّ.</b> أعداد الأحادي والثنائي والثلاثي والتقدير بأقصى احتمالية، واختيار N حسب مقايضة السياق والتشتت.</li><li><b>التنعيم.</b> تجنب الأصفار، مثل الاستيفاء مع ضبط λ على التطوير.</li><li><b>التقييم.</b> داخليًّا بالحيرة على الاختبار، وخارجيًّا بقياس الجهد الذي توفره الاقتراحات للمستخدمين.</li><li><b>الاقتراح.</b> عرض الكلمات الأكثر احتمالًا بعد السياق المكتوب، مع تخزين اللوغاريتمات.</li></ol>`,
      [[`Domain-matched data`, `بيانات من المجال نفسه`], [`Normalise + <s></s> + split`, `التوحيد والعلامات والتقسيم`], [`<UNK> handling`, `معالجة <UNK>`], [`Counting/MLE + choice of N`, `العدّ واختيار N`], [`Smoothing tuned on dev`, `التنعيم المضبوط على التطوير`], [`Intrinsic + extrinsic evaluation`, `التقييم الداخلي والخارجي`]],
