  essays: [
    E('Define & explain', `Define machine learning. Compare hand-written rules with machine learning, and explain why machine learning is needed for NLP.`, `عرّف تعلّم الآلة، وقارن بين القواعد المكتوبة يدويًّا وتعلّم الآلة، واشرح لماذا نحتاج تعلّم الآلة في NLP.`, 10,
      `<p><b>Definition.</b> In machine learning, a computer learns a pattern from examples instead of following only hand-written rules. The input is examples represented as features (word counts, TF-IDF); the output is a prediction (spam/not spam, positive/negative, a topic). The goal is to generalize to new texts not seen during training.</p><p><b>Rules vs ML.</b></p><table><tr><th></th><th>Hand-written rules</th><th>Machine learning</th></tr><tr><td>How</td><td>Explicit if–then patterns</td><td>Learns patterns from data</td></tr><tr><td>Strength</td><td>Clear for small cases</td><td>Handles interacting features</td></tr><tr><td>Weakness</td><td>Fragile when language changes</td><td>Needs labeled data and evaluation</td></tr><tr><td>Example</td><td>IF email contains "free credit" → spam</td><td>Learn from labeled spam/not-spam emails</td></tr></table><p><b>Why ML for NLP.</b> Language is too variable for fixed rules alone: (1) <b>variation</b>: people express the same meaning with different words and structures; (2) <b>sparse features</b>: each document uses only a small part of a very large vocabulary; (3) <b>hidden patterns</b>: words, phrases and combinations can signal sentiment or topic; (4) <b>adaptation</b>: the model can be retrained when new data changes the pattern.</p>`,
      `<p><b>التعريف.</b> في تعلّم الآلة يتعلم الحاسوب نمطًا من الأمثلة بدل اتباع قواعد مكتوبة يدويًّا فقط. المدخل أمثلة ممثلة كخصائص، والمخرج تنبؤ، والهدف التعميم على نصوص جديدة.</p><p><b>القواعد مقابل تعلّم الآلة.</b> القواعد: أنماط "إذا–فإن" صريحة، واضحة للحالات الصغيرة لكنها هشة عند تغيّر اللغة (مثال: إذا احتوت الرسالة "free credit" فهي مزعجة). تعلّم الآلة: يتعلم الأنماط من البيانات ويتعامل مع الخصائص المتداخلة، لكنه يحتاج بيانات موسومة وتقييمًا.</p><p><b>لماذا في NLP.</b> اللغة متغيرة جدًّا: (1) <b>التنوع</b> في التعبير عن المعنى نفسه، (2) <b>الخصائص المتناثرة</b>، (3) <b>الأنماط الخفية</b> في الكلمات وتركيباتها، (4) <b>التكيّف</b> بإعادة التدريب عند تغيّر البيانات.</p>`,
      [[`Definition + input/output/goal`, `التعريف والمدخل والمخرج والهدف`], [`Rules vs ML with spam example`, `المقارنة مع مثال المزعج`], [`Four reasons: variation, sparsity, hidden patterns, adaptation`, `الأسباب الأربعة`]],
      `Definition 3 · Comparison 3 · Reasons 4`),
    E('Describe & discuss', `Describe the supervised learning setup and the six-step workflow for building a text classifier.`, `صف إعداد التعلّم الموجَّه والخطوات الست لبناء مصنف نصوص.`, 10,
      `<p><b>Supervised setup.</b> The model learns from labeled examples: a training set of input/output pairs (x₁, y₁), …, (xₙ, yₙ). The input x is a text (review, email, tweet, article); the label y is its correct class (positive, spam, business). The classifier is a learned function mapping a new text x to a predicted label ŷ. During training both x and y are known; during prediction only x is given. Classification assigns one label from a fixed set C = {c₁, …, cₖ}; the output is categorical, not a continuous number.</p><p><b>Workflow.</b></p><ol><li><b>Define the task</b>: what do we want to predict?</li><li><b>Collect and label data</b>: create labeled examples.</li><li><b>Represent text</b>: convert text into features (words, n-grams, counts, TF-IDF).</li><li><b>Choose a classifier</b>: Naive Bayes or Logistic Regression.</li><li><b>Train and tune</b>: using training and development data.</li><li><b>Evaluate</b>: on unseen test data with precision, recall and F1.</li></ol><p>The test set is never used for training or tuning.</p>`,
      `<p><b>الإعداد.</b> يتعلم النموذج من أمثلة موسومة: أزواج (x, y). x نص وy فئته الصحيحة، والمصنف دالة متعلَّمة تحوّل نصًّا جديدًا إلى وسم متوقع ŷ. أثناء التدريب x وy معروفان، وأثناء التنبؤ x فقط. والتصنيف يختار وسمًا من مجموعة ثابتة، والمخرج فئوي.</p><p><b>الخطوات.</b></p><ol><li><b>تحديد المهمة</b>.</li><li><b>جمع البيانات ووسمها</b>.</li><li><b>تمثيل النص</b> بخصائص.</li><li><b>اختيار المصنف</b>: Naive Bayes أو الانحدار اللوجستي.</li><li><b>التدريب والضبط</b> ببيانات التدريب والتطوير.</li><li><b>التقييم</b> على بيانات اختبار غير مرئية.</li></ol><p>لا تُستخدم مجموعة الاختبار للتدريب أو الضبط.</p>`,
      [[`(x, y) pairs, classifier maps x → ŷ`, `الأزواج والمصنف`], [`Training vs prediction`, `التدريب مقابل التنبؤ`], [`Classification ≠ regression`, `التصنيف ليس انحدارًا`], [`Six steps in order`, `الخطوات الست بالترتيب`], [`Test set not used for training/tuning`, `عدم استخدام الاختبار`]],
      `Setup 4 · Workflow 5 · Rule 1`),
    E('Explain how & why', `Explain how text is converted into features for a classifier. Use the three-review document-term matrix as an example.`, `اشرح كيف يُحوَّل النص إلى خصائص للمصنف مستخدمًا مثال مصفوفة المراجعات الثلاث.`, 6,
      `<p>Classical classifiers operate on <b>numerical features</b>, so text is converted into a vector of measurable values. Common features are words, n-grams, word counts or TF-IDF values. Examples: awesome/love for sentiment; merger/earnings for topic classification. These features are what the classifier actually learns from.</p><p><b>Example.</b> Vocabulary of six words: great, movie, cast, boring, plot, script.</p><ul><li>R1 "great movie, great cast" → [2, 1, 1, 0, 0, 0], label +</li><li>R2 "boring plot, boring script" → [0, 0, 0, 2, 1, 1], label −</li><li>R3 "great plot, boring script" → [1, 0, 0, 1, 1, 1], label ?</li></ul><p>Each review is one row of counts with one column per vocabulary word. Every vector has the same number of dimensions (the vocabulary size) regardless of review length. The same matrix can feed both Naive Bayes and Logistic Regression. R3 contains evidence for both classes (great vs boring), which is what the classifier must weigh.</p>`,
      `<p>المصنفات التقليدية تعمل على <b>خصائص رقمية</b>، فيُحوَّل النص إلى متجه قيم قابلة للقياس: الكلمات أو n-grams أو الأعداد أو TF-IDF. وهذه الخصائص هي ما يتعلم منه المصنف.</p><p><b>المثال.</b> المفردات: great, movie, cast, boring, plot, script.</p><ul><li>R1 ← [2, 1, 1, 0, 0, 0] إيجابي</li><li>R2 ← [0, 0, 0, 2, 1, 1] سلبي</li><li>R3 ← [1, 0, 0, 1, 1, 1] غير معروف</li></ul><p>كل مراجعة صف من الأعداد، ولكل المتجهات طول واحد يساوي حجم المفردات. والمصفوفة نفسها تغذي المصنفين. وR3 فيها دليل على الفئتين، وهذا ما يجب أن يوازنه المصنف.</p>`,
      [[`Numerical features idea`, `فكرة الخصائص الرقمية`], [`Correct vectors for R1–R3`, `المتجهات الصحيحة`], [`Fixed length = |V|`, `الطول الثابت`], [`R3 mixed evidence`, `الدليل المختلط في R3`]],
      `Idea 2 · Matrix 2 · Properties 2`),
    E('Explain how & why', `Explain the Naive Bayes classifier: its decision rule, the roles of the prior and the likelihood, the naive assumption, and why P(d) can be dropped.`, `اشرح مصنف Naive Bayes: قاعدة القرار، ودور الاحتمال القبلي والاحتمالية، والافتراض الساذج، ولماذا يمكن حذف P(d).`, 10,
      `<p><b>Idea.</b> Naive Bayes chooses the most probable class given the document: ĉ = argmax_c P(c | d).</p><p><b>Bayes' rule.</b> P(c | d) = P(c) P(d | c) / P(d). Since P(d) is the same for all classes, it does not affect the argmax and is dropped: ĉ = argmax_c P(c) P(d | c).</p><p><b>Prior P(c)</b>: how common the class is in the training data (docs in c / total docs). <b>Likelihood P(d | c)</b>: how likely the document's words are if the class is c.</p><p><b>Naive assumption.</b> Word features are conditionally independent given the class, so P(d | c) = Π P(wᵢ | c), and ĉ = argmax_c P(c) Π P(wᵢ | c). In practice we use the log version, ĉ = argmax_c [log P(c) + Σ log P(wᵢ | c)], to add instead of multiply small numbers.</p><p><b>Learning</b> is mostly counting: P(w | c) = count(w, c) / total tokens in c. Because one unseen word gives a zero that makes the whole score zero, add-1 smoothing is used: (count(w, c) + 1) / (total tokens in c + |V|). OOV words are dropped from the test document. Naive Bayes is a <b>generative</b> model because it models P(words | class).</p>`,
      `<p><b>الفكرة.</b> يختار Naive Bayes الفئة الأكثر احتمالًا بشرط المستند.</p><p><b>قاعدة بايز.</b> P(c | d) = P(c) P(d | c) / P(d)، ولأن P(d) متساوٍ لكل الفئات لا يؤثر في argmax فيُحذف.</p><p><b>القبلي P(c)</b>: مدى شيوع الفئة. <b>الاحتمالية P(d | c)</b>: احتمال كلمات المستند إذا كانت الفئة c.</p><p><b>الافتراض الساذج.</b> الكلمات مستقلة شرطيًّا بمعلومية الفئة، فـ P(d | c) = Π P(wᵢ | c). وعمليًّا نستخدم اللوغاريتمات للجمع بدل الضرب.</p><p><b>التعلّم</b> عدّ في معظمه، ونستخدم add-1 لأن صفرًا واحدًا يجعل النتيجة صفرًا، وتُحذف الكلمات خارج المفردات. والنموذج <b>توليدي</b> لأنه ينمذج P(الكلمات | الفئة).</p>`,
      [[`argmax P(c|d) → P(c)P(d|c)`, `قاعدة القرار`], [`Why P(d) dropped`, `سبب حذف P(d)`], [`Prior and likelihood meaning`, `معنى القبلي والاحتمالية`], [`Naive independence → product`, `الاستقلال والضرب`], [`Log version, counting, add-1`, `اللوغاريتم والعدّ والتنعيم`]],
      `Decision rule 2 · P(d) 1 · Prior/likelihood 2 · Assumption 2 · Learning 3`),
    E('Explain how & why', `Using the lecture's training summary (3 NEG, 2 POS; NEG tokens 14, POS tokens 9, |V| = 20; counts predictable NEG 1/POS 0, no NEG 1/POS 0, fun NEG 0/POS 1), classify "predictable with no fun" with add-1 smoothing. Explain each step.`, `باستخدام ملخص التدريب في المحاضرة، صنّف "predictable with no fun" مع تنعيم add-1، واشرح كل خطوة.`, 10,
      `<ol><li><b>Priors:</b> P(NEG) = 3/5 = 0.6; P(POS) = 2/5 = 0.4.</li><li><b>OOV handling:</b> "with" is not in the training vocabulary, so it is dropped. We use predictable, no, fun.</li><li><b>Add-1 denominators:</b> NEG = 14 + 20 = 34; POS = 9 + 20 = 29.</li><li><b>Smoothed likelihoods:</b> NEG: predictable (1+1)/34 = 2/34, no 2/34, fun (0+1)/34 = 1/34. POS: predictable (0+1)/29 = 1/29, no 1/29, fun (1+1)/29 = 2/29.</li><li><b>Scores:</b> P(−)P(S|−) = 0.6 × 2/34 × 2/34 × 1/34 ≈ 6.1 × 10⁻⁵. P(+)P(S|+) = 0.4 × 1/29 × 1/29 × 2/29 ≈ 3.3 × 10⁻⁵.</li><li><b>Decision:</b> the negative score is larger, so the predicted class is <b>negative</b>.</li></ol><p><b>Why smoothing matters:</b> without add-1, P(fun | negative) = 0/14 = 0, and the whole negative score would collapse to zero, even though "predictable" and "no" support negative. Smoothing handles vocabulary words unseen in a class; OOV words are handled separately by dropping them.</p>`,
      `<ol><li><b>القبلي:</b> P(NEG) = 0.6 وP(POS) = 0.4.</li><li><b>الكلمات المجهولة:</b> "with" ليست في المفردات فتُحذف، ونستخدم predictable وno وfun.</li><li><b>المقامات:</b> السلبي 14+20 = 34، والإيجابي 9+20 = 29.</li><li><b>الاحتمالات:</b> السلبي: 2/34 و2/34 و1/34. الإيجابي: 1/29 و1/29 و2/29.</li><li><b>النتائج:</b> السلبي ≈ 6.1 × 10⁻⁵ والإيجابي ≈ 3.3 × 10⁻⁵.</li><li><b>القرار:</b> <b>سلبي</b>.</li></ol><p><b>أهمية التنعيم:</b> دون add-1 يكون P(fun | negative) = 0 وتنهار النتيجة السلبية كلها. التنعيم يعالج كلمات المفردات غير المرئية في فئة، أما الكلمات خارج المفردات فتُحذف.</p>`,
      [[`Priors 0.6 / 0.4`, `القبلي`], [`Drop OOV "with"`, `حذف with`], [`Denominators 34 / 29`, `المقامات`], [`Correct smoothed likelihoods`, `الاحتمالات الصحيحة`], [`Scores and NEG decision`, `النتائج والقرار`], [`Why smoothing (zero collapse)`, `سبب التنعيم`]],
      `Priors 1 · OOV 1 · Denominators 2 · Likelihoods 2 · Scores/decision 3 · Smoothing 1`),
    E('Explain how & why', `Explain logistic regression for binary sentiment classification, including the score z, the sigmoid and the decision rule. Work through the lecture's example with six features.`, `اشرح الانحدار اللوجستي لتصنيف المشاعر الثنائي بما في ذلك النتيجة z والدالة السينية وقاعدة القرار، واحسب مثال المحاضرة بالخصائص الست.`, 10,
      `<p><b>Idea.</b> Logistic regression learns how strongly each feature supports a class. Each feature gets a positive or negative weight.</p><p><b>Score.</b> z = w · x + b combines the feature values x with weights w and bias b.</p><p><b>Sigmoid.</b> P(y = 1 | x) = σ(z) = 1/(1 + e⁻ᶻ) maps any score to a probability between 0 and 1: large negative z → near 0; z = 0 → 0.5 (the decision boundary); large positive z → near 1. The curve is steep in the middle, where the classifier is least certain.</p><p><b>Decision.</b> Predict class 1 when P(y = 1 | x) ≥ 0.5.</p><p><b>Example</b> (y = 1 = positive): x = [3 positive lexicon words, 2 negative lexicon words, contains "no" = 1, 3 pronouns, "!" = 0, ln(66) = 4.19], w = [2.5, −5.0, −1.2, 0.5, 2.0, 0.7], b = 0.1.</p><p>z = 2.5(3) − 5.0(2) − 1.2(1) + 0.5(3) + 2.0(0) + 0.7(4.19) + 0.1 = 7.5 − 10 − 1.2 + 1.5 + 0 + 2.93 + 0.1 = <b>0.833</b>.</p><p>P(positive | x) = σ(0.833) ≈ <b>0.70</b>; P(negative | x) = 0.30. Prediction: <b>positive</b>. The two negative words pull the score down by 10, but the other evidence still wins.</p>`,
      `<p><b>الفكرة.</b> يتعلم الانحدار اللوجستي مدى دعم كل خاصية لفئة، ولكل خاصية وزن موجب أو سالب.</p><p><b>النتيجة.</b> z = w · x + b.</p><p><b>السينية.</b> σ(z) = 1/(1 + e⁻ᶻ) تحوّل النتيجة إلى احتمال بين 0 و1: z سالبة كبيرة ← قرب 0، z = 0 ← 0.5 (حد القرار)، z موجبة كبيرة ← قرب 1.</p><p><b>القرار.</b> نتنبأ بالفئة 1 عندما يكون الاحتمال ≥ 0.5.</p><p><b>المثال.</b> z = 7.5 − 10 − 1.2 + 1.5 + 0 + 2.93 + 0.1 = <b>0.833</b>، فالاحتمال ≈ <b>0.70</b> إيجابي و0.30 سلبي. التنبؤ: <b>إيجابي</b>. الكلمتان السلبيتان تخفضان النتيجة بـ 10 لكن الدليل الآخر يفوز.</p>`,
      [[`Weights per feature`, `الأوزان`], [`z = w·x + b`, `صيغة z`], [`Sigmoid behaviour and 0.5 boundary`, `السينية وحد 0.5`], [`z = 0.833 with working`, `حساب z`], [`P = 0.70 → positive`, `الاحتمال والقرار`]],
      `Idea 1 · Score 1 · Sigmoid 3 · Calculation 4 · Decision 1`),
    E('Describe & discuss', `Describe how logistic regression is trained. Include the cross-entropy loss and gradient descent.`, `صف كيف يُدرَّب الانحدار اللوجستي، متضمنًا خسارة الإنتروبيا المتقاطعة والانحدار التدريجي.`, 6,
      `<p>Logistic regression learns its weights from labeled examples in a loop:</p><ol><li><b>Predict:</b> with the current weights, compute p = P(y = 1 | x) = σ(w · x + b).</li><li><b>Measure the error:</b> cross-entropy loss L = −[y log p + (1 − y) log(1 − p)]. If y = 1 the loss is −log p, small when p is close to 1 and large when p is close to 0; if y = 0 the loss is −log(1 − p).</li><li><b>Update the weights:</b> gradient descent changes w and b in the direction that reduces the loss.</li><li><b>Repeat</b> over the training examples.</li></ol><p>So training is predict → compute loss → update weights → repeat. Unlike Naive Bayes, which mostly counts, logistic regression learns its feature weights directly by optimization. (Cross-entropy and gradient descent return in Week 6.)</p>`,
      `<p>يتعلم الانحدار اللوجستي أوزانه من الأمثلة الموسومة في حلقة:</p><ol><li><b>التنبؤ:</b> حساب p بالأوزان الحالية.</li><li><b>قياس الخطأ:</b> خسارة الإنتروبيا المتقاطعة L = −[y log p + (1 − y) log(1 − p)]. إذا y = 1 فالخسارة −log p، صغيرة عندما p قريبة من 1 وكبيرة عندما تقترب من 0.</li><li><b>تحديث الأوزان:</b> الانحدار التدريجي يغيّر w وb في الاتجاه الذي يقلل الخسارة.</li><li><b>التكرار</b> على أمثلة التدريب.</li></ol><p>بخلاف Naive Bayes الذي يعدّ، يتعلم الانحدار اللوجستي الأوزان مباشرة بالتحسين.</p>`,
      [[`Four-step loop`, `الحلقة الرباعية`], [`Cross-entropy formula + behaviour`, `صيغة الخسارة وسلوكها`], [`Gradient descent updates w, b`, `الانحدار التدريجي`]],
      `Loop 2 · Loss 2 · Gradient descent 2`),
    E('Explain how & why', `Explain why topic classification needs multiclass logistic regression. Describe the softmax function and state its key properties.`, `اشرح لماذا يحتاج تصنيف المواضيع الانحدار اللوجستي متعدد الفئات، وصف دالة softmax واذكر خصائصها الأساسية.`, 8,
      `<p><b>Topic classification</b> assigns a news article, abstract or web page to one of several classes (business, sports, health, technology). Features are word counts, n-grams or TF-IDF, and logistic regression learns which words are evidence for each topic. Example: "Liebert Corp shareholders approved a merger with Emerson Electric…" → Business, because merger, shareholders, shares and stock are strong cues.</p><p><b>Why multiclass.</b> The sigmoid handles binary classification (two classes). Topic classification usually has more than two, so we need one probability distribution over all classes.</p><p><b>Softmax.</b> For each class k compute a score zₖ = wₖ · x + bₖ (each class has its own weights). Then P(y = k | x) = exp(zₖ) / Σⱼ exp(zⱼ). Decision: choose the class with the highest probability.</p><p><b>Properties.</b> The outputs are positive and sum to 1 across all classes. They are not computed independently, because they share the denominator. The largest probability is not always above 0.5 (with many classes it can be, for example, 0.4).</p>`,
      `<p><b>تصنيف المواضيع</b> يسند مقالًا إلى إحدى فئات متعددة (أعمال، رياضة، صحة، تقنية). مثال: مقال Liebert Corp ← أعمال لأن merger وshareholders وstock إشارات قوية.</p><p><b>لماذا متعدد.</b> السينية للتصنيف الثنائي، والمواضيع عادة أكثر من فئتين، فنحتاج توزيعًا احتماليًّا واحدًا على كل الفئات.</p><p><b>Softmax.</b> لكل فئة نتيجة zₖ = wₖ · x + bₖ، ثم P(y = k | x) = exp(zₖ) / Σⱼ exp(zⱼ)، ونختار الفئة الأعلى.</p><p><b>الخصائص.</b> المخرجات موجبة ومجموعها 1، ولا تُحسب مستقلة لأنها تشترك في المقام، وأكبر احتمال ليس دائمًا فوق 0.5.</p>`,
      [[`Topic classification + Liebert example`, `تصنيف المواضيع ومثاله`], [`Sigmoid binary vs softmax multiclass`, `السينية مقابل softmax`], [`Softmax formula with per-class scores`, `صيغة softmax`], [`Positive, sum to 1, shared denominator`, `الخصائص`]],
      `Topic task 2 · Why multiclass 2 · Softmax 2 · Properties 2`),
    E('Compare & contrast', `Compare Naive Bayes and logistic regression.`, `قارن بين Naive Bayes والانحدار اللوجستي.`, 8,
      `<table><tr><th></th><th>Naive Bayes</th><th>Logistic Regression</th></tr><tr><td>Model type</td><td>Generative: models P(words | class)</td><td>Discriminative: models P(class | text) directly</td></tr><tr><td>What is learned</td><td>Class priors and word probabilities</td><td>Feature weights (and bias)</td></tr><tr><td>Training</td><td>Mostly counting + add-1 smoothing</td><td>Cross-entropy loss minimized by gradient descent</td></tr><tr><td>Assumption</td><td>Features are conditionally independent given the class</td><td>No conditional-independence assumption</td></tr><tr><td>Correlated features</td><td>Weaker</td><td>Handles overlapping or correlated features better</td></tr><tr><td>Output</td><td>argmax P(c)ΠP(w|c)</td><td>σ(w·x + b), or softmax for many classes</td></tr></table><p><b>Similarities.</b> Both are supervised text classifiers that can take the same document-term features, and both choose the most probable class. <b>Lecture summary:</b> Naive Bayes learns class and word probabilities from counts; logistic regression learns feature weights.</p>`,
      `<table><tr><th></th><th>Naive Bayes</th><th>الانحدار اللوجستي</th></tr><tr><td>النوع</td><td>توليدي: P(الكلمات | الفئة)</td><td>تمييزي: P(الفئة | النص)</td></tr><tr><td>ما يُتعلَّم</td><td>احتمالات الفئات والكلمات</td><td>أوزان الخصائص</td></tr><tr><td>التدريب</td><td>عدّ وتنعيم</td><td>تقليل الخسارة بالانحدار التدريجي</td></tr><tr><td>الافتراض</td><td>الاستقلال الشرطي</td><td>بلا افتراض استقلال</td></tr><tr><td>الخصائص المترابطة</td><td>أضعف</td><td>أفضل</td></tr></table><p><b>التشابه.</b> كلاهما مصنف موجَّه يستخدم الخصائص نفسها ويختار الفئة الأكثر احتمالًا.</p>`,
      [[`Generative vs discriminative`, `توليدي مقابل تمييزي`], [`Counts vs learned weights`, `العدّ مقابل الأوزان`], [`Independence assumption`, `افتراض الاستقلال`], [`Correlated features`, `الخصائص المترابطة`], [`One similarity`, `تشابه واحد`]],
      `2 marks each for 4 differences`),
    E('Explain how & why', `Explain why accuracy is not enough for evaluating classifiers. Define precision, recall and F1 using the confusion matrix, and compute them for spam detection with TP = 8, FP = 2, FN = 4.`, `اشرح لماذا لا تكفي الدقة الإجمالية (accuracy) لتقييم المصنفات، وعرّف الدقة والاستدعاء وF1 بمصفوفة الالتباس، واحسبها لكشف المزعج مع TP = 8 وFP = 2 وFN = 4.`, 10,
      `<p><b>Problem with accuracy.</b> Accuracy counts how many predictions were correct overall. With imbalanced classes, a weak model can look accurate: if 95% of emails are not spam, a model that always predicts "not spam" gets 95% accuracy but finds no spam at all.</p><p><b>Confusion matrix.</b> Actual + / predicted + = TP; actual + / predicted − = FN (missed positive); actual − / predicted + = FP (false alarm); actual − / predicted − = TN.</p><ul><li><b>Precision</b> = TP / (TP + FP): of the predicted positives, how many were correct? High precision = few false alarms.</li><li><b>Recall</b> = TP / (TP + FN): of the actual positives, how many did the model find? High recall = few missed positives.</li><li><b>F1</b> = 2PR / (P + R): one balance score between precision and recall.</li></ul><p><b>Calculation (target class: spam).</b> Precision = 8 / (8 + 2) = <b>0.80</b>: 80% of predicted spam was spam. Recall = 8 / (8 + 4) = <b>0.67</b>: about 67% of real spam was found. F1 = 2(0.80)(0.67) / (0.80 + 0.67) ≈ <b>0.73</b>.</p><p>For multiclass tasks, compute the metrics per class and then summarize.</p>`,
      `<p><b>مشكلة الدقة الإجمالية.</b> مع عدم توازن الفئات قد يبدو نموذج ضعيف دقيقًا: إذا كانت 95% من الرسائل ليست مزعجة فإن النموذج الذي يتنبأ دائمًا بذلك يحصل على 95% دون أن يجد أي رسالة مزعجة.</p><p><b>مصفوفة الالتباس.</b> TP إيجابي صحيح، FN إيجابي فائت، FP إنذار كاذب، TN سلبي صحيح.</p><ul><li><b>الدقة</b> = TP / (TP + FP): من التنبؤات الإيجابية كم كان صحيحًا.</li><li><b>الاستدعاء</b> = TP / (TP + FN): من الإيجابيات الفعلية كم وُجد.</li><li><b>F1</b> = 2PR / (P + R): توازن بينهما.</li></ul><p><b>الحساب.</b> الدقة = 8/10 = <b>0.80</b>، الاستدعاء = 8/12 = <b>0.67</b>، F1 ≈ <b>0.73</b>.</p><p>وفي المتعدد نحسب لكل فئة ثم نلخّص.</p>`,
      [[`95% not-spam example`, `مثال 95%`], [`Confusion matrix cells`, `خلايا المصفوفة`], [`Three formulas + meanings`, `الصيغ الثلاث ومعانيها`], [`0.80 / 0.67 / 0.73`, `النتائج`]],
      `Accuracy problem 2 · Matrix 2 · Definitions 3 · Calculation 3`),
    E('Scenario', `You are building a spam filter where only 5% of emails are spam. Explain how you would split the data, train and evaluate the classifier, and handle the class imbalance.`, `تبني مرشحًا للرسائل المزعجة و5% فقط من الرسائل مزعجة. اشرح كيف تقسّم البيانات وتدرّب المصنف وتقيّمه وتعالج عدم التوازن.`, 10,
      `<p><b>Detect the imbalance.</b> Check label counts before training and after splitting: 95% not-spam vs 5% spam. The risk is that the model favours the majority class; always predicting "not spam" would give 95% accuracy and be useless.</p><p><b>Split.</b> Training set to learn parameters, development set to tune features and hyperparameters, test set held out for final evaluation. Use <b>stratified splitting</b> so each set keeps the 5% spam ratio. Do not train or tune on the test set.</p><p><b>Features and model.</b> Represent each email as word counts or TF-IDF; train Naive Bayes (with add-1 smoothing) or logistic regression (which handles correlated features better).</p><p><b>Mitigate during training.</b> Use class weighting (errors on spam cost more) or resampling of the training data. Resampling changes training data only; never resample the final test set.</p><p><b>Evaluate.</b> Use precision, recall and F1 for the spam class, not accuracy. Precision tells how many flagged emails were really spam (false alarms hurt users); recall tells how much spam was caught. Choose the balance on the development set according to which error the application can tolerate.</p>`,
      `<p><b>كشف عدم التوازن.</b> تحقق من أعداد الوسوم قبل التدريب وبعد التقسيم. الخطر أن يفضّل النموذج الفئة الغالبة، فالتنبؤ الدائم بـ "ليست مزعجة" يعطي 95% دون فائدة.</p><p><b>التقسيم.</b> تدريب للمعاملات، وتطوير للضبط، واختبار للتقييم النهائي، مع <b>تقسيم طبقي</b> يحافظ على نسبة 5%، ودون التدريب أو الضبط على الاختبار.</p><p><b>الخصائص والنموذج.</b> أعداد الكلمات أو TF-IDF مع Naive Bayes أو الانحدار اللوجستي.</p><p><b>المعالجة أثناء التدريب.</b> أوزان الفئات أو إعادة معاينة بيانات التدريب فقط، ولا تُعاد معاينة الاختبار أبدًا.</p><p><b>التقييم.</b> الدقة والاستدعاء وF1 لفئة المزعج بدل الدقة الإجمالية، واختيار التوازن على مجموعة التطوير حسب الخطأ المقبول.</p>`,
      [[`Detect imbalance; accuracy trap`, `كشف عدم التوازن وفخ الدقة`], [`Train/dev/test + stratified`, `التقسيم الطبقي`], [`Class weighting / resampling (train only)`, `الأوزان وإعادة المعاينة`], [`Precision/recall/F1 for spam`, `المقاييس لفئة المزعج`]],
      `Detection 2 · Splitting 3 · Mitigation 2 · Evaluation 3`)
  ],

  essays: [
    E('Define & explain', `Explain why text representation matters in NLP. Distinguish between word vectors and document vectors, giving examples of each.`, `اشرح أهمية تمثيل النصوص في NLP، وميّز بين متجهات الكلمات ومتجهات المستندات مع أمثلة.`, 8,
      `<p><b>Why it matters.</b> Raw text is symbolic: models cannot multiply words, so words and documents must be mapped into numeric vectors. The representation controls what the model can learn: if it discards word order, frequency or meaning, downstream performance is limited. Different tasks need different signals: search often needs term matching, semantic similarity needs dense embeddings. Classifiers from Week 4 (Naive Bayes, logistic regression) need these feature vectors.</p><p><b>Word vectors</b> describe one word type. One-hot vectors record identity only; PPMI vectors record word–context association; Word2Vec and GloVe give learned distributional (dense) representations.</p><p><b>Document vectors</b> describe a whole document. Bag-of-Words holds term counts; TF-IDF holds weighted term counts. Their length is fixed by the vocabulary, not the document length.</p><p><b>Cosine similarity</b> is not a representation; it compares vectors after they are built (word with word, document with document). None of these representations encode word order by themselves, and static embeddings give one vector per word type regardless of the sentence.</p>`,
      `<p><b>الأهمية.</b> النص رمزي ولا يمكن للنماذج ضرب الكلمات، فيجب تحويلها إلى متجهات رقمية. والتمثيل يتحكم فيما يتعلمه النموذج؛ فإذا أهمل الترتيب أو التكرار أو المعنى يتأثر الأداء. والمهام المختلفة تحتاج إشارات مختلفة: البحث يحتاج المطابقة والتشابه الدلالي يحتاج تضمينات كثيفة. ومصنفات الأسبوع 4 تحتاج هذه المتجهات.</p><p><b>متجهات الكلمات</b> تصف كلمة واحدة: one-hot للهوية فقط، وPPMI لارتباط الكلمة بالسياق، وWord2Vec وGloVe لتمثيلات توزيعية كثيفة.</p><p><b>متجهات المستندات</b> تصف مستندًا كاملًا: BoW للأعداد وTF-IDF للأعداد الموزونة، وطولها يحدده حجم المفردات.</p><p><b>تشابه جيب التمام</b> ليس تمثيلًا بل أداة مقارنة. ولا يرمّز أي تمثيل هنا الترتيب، والتضمينات الثابتة متجه واحد لكل كلمة.</p>`,
      [[`Symbolic text → numeric vectors`, `النص الرمزي إلى متجهات`], [`Representation limits what is learned`, `التمثيل يحدّ من التعلم`], [`Word vectors with examples`, `متجهات الكلمات مع أمثلة`], [`Document vectors with examples`, `متجهات المستندات مع أمثلة`], [`Cosine is not a representation`, `جيب التمام ليس تمثيلًا`]],
      `Importance 3 · Word vectors 2 · Document vectors 2 · Cosine/order note 1`),
    E('Describe & discuss', `Describe one-hot encoding and Bag-of-Words. Show how a BoW vector is built from one-hot vectors, and discuss what BoW keeps and loses.`, `صف ترميز one-hot وحقيبة الكلمات، ووضّح كيف يُبنى متجه BoW من متجهات one-hot، وناقش ما يحتفظ به BoW وما يفقده.`, 10,
      `<p><b>One-hot encoding</b> represents a word as a vector of length |V| with 1 in that word's position and 0 elsewhere. With vocabulary [good, movie, boring, plot, bad], good = [1,0,0,0,0]. It is simple and unambiguous and useful as an internal index (token IDs select embedding rows), but it is very high dimensional (50,000 words → 50,000 dimensions) and has no semantic similarity: every dot product between different words is 0, so cat is as unrelated to dog as to movie.</p><p><b>Bag-of-Words</b> represents a document as a vector of length |V| whose entries count how often each vocabulary word occurs. A BoW vector is the sum of the one-hot vectors of its tokens: "good plot good movie" = good + plot + good + movie = [2, 1, 0, 1, 0].</p><p><b>Keeps:</b> which terms occur and how often; works well with linear classifiers and retrieval baselines; fast for large corpora.</p><p><b>Loses:</b> word order and syntax, long-distance context, semantic similarity between different words, and word-sense differences (bank in finance vs river). Example: "dog bites man" and "man bites dog" both give [1, 1, 1] over [dog, bites, man].</p><p>Also, the vector length is fixed by the vocabulary, and out-of-vocabulary words are simply lost.</p>`,
      `<p><b>One-hot</b> يمثل الكلمة بمتجه طوله |V| فيه 1 في موضعها و0 في الباقي، مثل good = [1,0,0,0,0]. بسيط وواضح ومفيد كفهرس داخلي، لكنه عالي الأبعاد ولا يرمّز التشابه: حاصل الضرب بين كلمتين مختلفتين = 0.</p><p><b>حقيبة الكلمات</b> تمثل المستند بمتجه يعدّ مرات ظهور كل كلمة، وهي مجموع متجهات one-hot لرموزه: "good plot good movie" ← [2, 1, 0, 1, 0].</p><p><b>تحتفظ بـ:</b> المصطلحات الموجودة وتكرارها، وتعمل جيدًا مع المصنفات الخطية وأنظمة الاسترجاع، وسريعة.</p><p><b>تفقد:</b> الترتيب والنحو، والسياق البعيد، والتشابه الدلالي، والفروق بين المعاني (bank). مثال: "dog bites man" و"man bites dog" ← [1, 1, 1].</p><p>وطول المتجه ثابت بالمفردات والكلمات خارجها تضيع.</p>`,
      [[`One-hot definition + example`, `تعريف one-hot مع مثال`], [`One-hot strengths/limits (orthogonal)`, `مزايا وقيود one-hot`], [`BoW definition`, `تعريف BoW`], [`BoW = sum of one-hots, [2,1,0,1,0]`, `BoW مجموع one-hot`], [`Keeps vs loses + dog bites man`, `ما يُحفظ وما يُفقد`]],
      `One-hot 4 · BoW construction 3 · Keeps/loses 3`),
    E('Explain how & why', `Explain TF, DF, IDF and TF-IDF with their formulas. Using the collection D1 "cats chase mice", D2 "cats chase birds", D3 "cats eat fish", D4 "mice eat cheese", compute the IDF values and the TF-IDF vector of D4.`, `اشرح TF وDF وIDF وTF-IDF بصيغها، واحسب قيم IDF ومتجه TF-IDF للمستند D4 في المجموعة المعطاة.`, 12,
      `<p><b>Motivation.</b> Raw counts treat every word the same, so a word found in every document ("the") can dominate a vector though it distinguishes nothing. TF-IDF keeps the count inside the document and lowers the weight of terms spread across the collection.</p><p><b>TF</b> (inside one document, log-scaled): TF(t, d) = 1 + log₁₀ count(t, d) if count &gt; 0, else 0. Count 1 → 1, 10 → 2, 100 → 3. The log damps counts: 100 occurrences are not 100 times more important.</p><p><b>DF</b>: the number of documents containing t at least once (documents, not occurrences).</p><p><b>IDF</b> (across the collection): IDF(t) = log₁₀(N / DF(t)). Rare terms get high weight; a term in every document gets log₁₀1 = 0.</p><p><b>TF-IDF</b> = TF × IDF: high when a term is frequent in this document and rare elsewhere; zero for terms in every document.</p><p><b>Calculation (N = 4).</b> DF: cats 3, chase 2, mice 2, birds 1, eat 2, fish 1, cheese 1. IDF: cats log₁₀(4/3) = 0.12; chase, mice, eat log₁₀2 = 0.30; birds, fish, cheese log₁₀4 = 0.60.</p><p>D4 = "mice eat cheese": every term appears once, so TF = 1 + log₁₀1 = 1. TF-IDF(mice) = 0.30, TF-IDF(eat) = 0.30, TF-IDF(cheese) = 1 × 0.60 = 0.60. Over [cats, chase, mice, birds, eat, fish, cheese], D4 = <b>[0, 0, 0.30, 0, 0.30, 0, 0.60]</b>. cheese, which appears only in D4, gets the largest weight; the same TF can give different TF-IDF because IDF depends on how common the term is.</p>`,
      `<p><b>الدافع.</b> الأعداد الخام تعامل كل الكلمات بالتساوي فتسيطر كلمة مثل "the". TF-IDF يحتفظ بالعدد داخل المستند ويخفض وزن المصطلحات المنتشرة.</p><p><b>TF</b>: 1 + log₁₀ العدد إذا كان أكبر من صفر وإلا 0؛ العدد 1 ← 1، و10 ← 2.</p><p><b>DF</b>: عدد المستندات التي تحتوي المصطلح.</p><p><b>IDF</b> = log₁₀(N / DF): النادر وزنه عالٍ والموجود في كل المستندات وزنه 0.</p><p><b>TF-IDF</b> = TF × IDF.</p><p><b>الحساب (N = 4).</b> DF: cats 3، chase 2، mice 2، birds 1، eat 2، fish 1، cheese 1. IDF: cats 0.12، chase وmice وeat 0.30، birds وfish وcheese 0.60.</p><p>D4: كل مصطلح يظهر مرة فـ TF = 1، فيكون mice = 0.30 وeat = 0.30 وcheese = 0.60، والمتجه <b>[0, 0, 0.30, 0, 0.30, 0, 0.60]</b>. cheese الأعلى وزنًا لأنه في D4 فقط.</p>`,
      [[`Motivation ("the" dominates)`, `الدافع`], [`TF formula with log and zero case`, `صيغة TF`], [`DF counts documents`, `DF يعدّ المستندات`], [`IDF formula; everywhere → 0`, `صيغة IDF`], [`Correct IDFs 0.12/0.30/0.60`, `قيم IDF الصحيحة`], [`D4 vector [0,0,0.30,0,0.30,0,0.60]`, `متجه D4`]],
      `Motivation 1 · TF 2 · DF 1 · IDF 2 · TF-IDF 1 · IDF values 2 · D4 vector 3`),
    E('Explain how & why', `Define cosine similarity and explain why NLP uses it. Compute cos(D1, D2) for D1 = [0.125, 0.301, 0.301, 0, 0, 0, 0] and D2 = [0.125, 0.301, 0, 0.602, 0, 0, 0], and compare with the raw-count result.`, `عرّف تشابه جيب التمام واشرح سبب استخدامه في NLP، واحسب cos(D1, D2) للمتجهين المعطيين، وقارن النتيجة بنتيجة الأعداد الخام.`, 10,
      `<p><b>Definition.</b> cos(x, y) = (x · y) / (‖x‖ ‖y‖), where x · y multiplies matching components and sums them, and ‖x‖ = √Σxᵢ² is the Euclidean length. It depends on the angle between the vectors, not their lengths.</p><p><b>Range.</b> −1 to 1 for arbitrary real vectors; 0 to 1 for non-negative BoW/TF-IDF vectors. 1 = same direction ([1,2] and [2,4]); 0 = orthogonal (no shared term in the sparse case, not "opposite"); −1 = opposite (needs negative components, as in dense embeddings).</p><p><b>Why NLP uses it.</b> Dividing by both norms removes length effects: cos(cx, y) = cos(x, y), so a long and a short document on the same topic still score as similar. It supports document search, nearest neighbours and embedding similarity.</p><p><b>Calculation.</b> D1 · D2 = 0.125×0.125 + 0.301×0.301 = 0.0156 + 0.0906 = 0.1062 (shared terms cats, chase). ‖D1‖ = √(0.0156 + 0.0906 + 0.0906) = 0.444. ‖D2‖ = √(0.0156 + 0.0906 + 0.3625) = 0.685. cos = 0.1062 / (0.444 × 0.685) = 0.1062 / 0.304 ≈ <b>0.35</b>.</p><p><b>Raw counts.</b> D1 = [1,1,1,0,0,0,0], D2 = [1,1,0,1,0,0,0]: dot = 2, norms √3, cos = 2/3 = 0.67. TF-IDF lowers the similarity from 0.67 to 0.35 because the shared term <i>cats</i> appears in 3 of 4 documents and gets a small weight. (cos(D1, D4) = 0.28 and cos(D2, D4) = 0, so D1 is still closest to D2.)</p>`,
      `<p><b>التعريف.</b> cos(x, y) = حاصل الضرب النقطي ÷ (حاصل ضرب الطولين)، ويعتمد على الزاوية لا على الطول.</p><p><b>المدى.</b> من −1 إلى 1 عمومًا ومن 0 إلى 1 لمتجهات BoW/TF-IDF. 1 = نفس الاتجاه، 0 = متعامدان (لا مصطلح مشترك وليس تعاكسًا)، −1 = متعاكسان.</p><p><b>سبب الاستخدام.</b> القسمة على الطولين تزيل أثر الطول، فالمستند الطويل والقصير في الموضوع نفسه يبدوان متشابهين. ويُستخدم في البحث والجيران الأقرب.</p><p><b>الحساب.</b> الضرب النقطي = 0.1062، ‖D1‖ = 0.444، ‖D2‖ = 0.685، cos ≈ <b>0.35</b>.</p><p><b>الأعداد الخام.</b> cos = 2/3 = 0.67. يخفض TF-IDF التشابه لأن cats المشتركة شائعة فوزنها صغير.</p>`,
      [[`Formula and symbols`, `الصيغة والرموز`], [`Range and special cases (0 ≠ opposite)`, `المدى والحالات الخاصة`], [`Length independence`, `الاستقلال عن الطول`], [`Correct dot product, norms, 0.35`, `الحساب الصحيح 0.35`], [`0.67 raw vs 0.35 TF-IDF explained`, `المقارنة وتفسيرها`]],
      `Definition 2 · Range 2 · Why 1 · Calculation 3 · Comparison 2`),
    E('Define & explain', `State the distributional hypothesis. Explain how a word–word co-occurrence matrix turns it into word vectors, and how cosine shows that digital is closer to information than cherry is.`, `اذكر الفرضية التوزيعية، واشرح كيف تحوّلها مصفوفة التواجد المشترك إلى متجهات كلمات، وكيف يبيّن جيب التمام أن digital أقرب إلى information من cherry.`, 8,
      `<p><b>Distributional hypothesis.</b> Words that occur in similar contexts tend to have similar meanings. So meaning can be learned from co-occurrence patterns across a corpus.</p><p><b>Why we need it.</b> One-hot vectors treat cat and dog as unrelated labels; we need vectors in which related words are near each other.</p><p><b>Co-occurrence matrix.</b> Count how often each context word appears near each target word. Rows = target words, columns = context words, so each row is a word vector. From a Wikipedia corpus: cherry has 442 counts under pie and 25 under sugar; digital has 1,670 under computer and 1,683 under data; information has 3,325 under computer and 3,982 under data.</p><p><b>Cosine.</b> With dimensions [pie, data, computer]: cherry = [442, 8, 2], digital = [5, 1683, 1670], information = [5, 3982, 3325]. cos(cherry, information) = 40,716 / (442.1 × 5,187.7) ≈ 0.018 (different directions). cos(digital, information) = 12,254,481 / (2,371.0 × 5,187.7) ≈ 0.996 (almost the same direction). So digital and information, which share contexts, are similar, as the hypothesis predicts. The same cosine formula used for documents works for word rows.</p>`,
      `<p><b>الفرضية التوزيعية.</b> الكلمات التي تظهر في سياقات متشابهة تميل إلى معانٍ متشابهة، فيمكن تعلّم المعنى من أنماط التواجد المشترك.</p><p><b>الحاجة.</b> one-hot يعامل cat وdog كتسميات غير مترابطة.</p><p><b>المصفوفة.</b> نعدّ كم مرة تظهر كل كلمة سياق قرب كل كلمة هدف؛ كل صف متجه كلمة. cherry لها 442 تحت pie، وdigital وinformation لهما أعداد كبيرة تحت computer وdata.</p><p><b>جيب التمام.</b> cos(cherry, information) ≈ 0.018 وcos(digital, information) ≈ 0.996، فالكلمتان المشتركتان في السياق متشابهتان كما تتوقع الفرضية.</p>`,
      [[`Hypothesis statement`, `نص الفرضية`], [`Rows = target, columns = context`, `الصفوف والأعمدة`], [`Counts example from table`, `أمثلة الأعداد`], [`0.018 vs 0.996 interpretation`, `تفسير 0.018 مقابل 0.996`]],
      `Hypothesis 2 · Matrix 2 · Cosine 4`),
    E('Explain how & why', `Define PMI and PPMI. Compute PMI(cherry, pie) from the co-occurrence table (count 442, row total 486, column total 512, N = 11,716). Why are negative values clipped, and what limitation remains?`, `عرّف PMI وPPMI، واحسب PMI(cherry, pie) من جدول التواجد. لماذا تُقص القيم السالبة، وما القيد المتبقي؟`, 10,
      `<p><b>Motivation.</b> Raw co-occurrence counts ask how often w and c occur together, but frequent context words co-occur with many words, so counts overstate their importance.</p><p><b>PMI</b> asks whether w and c occur together more often than they would if they were independent: PMI(w, c) = log₂ [P(w, c) / (P(w) P(c))]. The denominator is the expected rate under independence. PMI &gt; 0: more than expected (cherry, pie); PMI = 0: independent; PMI &lt; 0: less than expected (cherry, computer).</p><p><b>Calculation.</b> P(cherry, pie) = 442 / 11,716 = 0.0377. P(cherry) = 486 / 11,716 = 0.0415. P(pie) = 512 / 11,716 = 0.0437. PMI = log₂(0.0377 / (0.0415 × 0.0437)) = log₂(20.8) ≈ <b>4.38</b>: the pair occurs about 21 times as often as chance predicts.</p><p><b>PPMI</b> keeps positive PMI values and replaces negative values with 0: PPMI = max(PMI, 0). cherry–computer has PMI = −6.70 → PPMI 0; digital–computer 0.18 is kept.</p><p><b>Why clip.</b> A reliable negative association claims that two words avoid each other, which needs enormous amounts of text; such estimates are unstable.</p><p><b>Remaining limitation.</b> PPMI vectors are still sparse: one dimension per context word (10,000–50,000), nearly all zeros. PPMI improves the values but not the size; dense embeddings (Word2Vec, GloVe) solve the size and sparsity problem.</p>`,
      `<p><b>الدافع.</b> الأعداد الخام تبالغ في أهمية كلمات السياق الشائعة.</p><p><b>PMI</b> يسأل هل تظهر w وc معًا أكثر من حالة الاستقلال: log₂ [P(w,c) / (P(w)P(c))]. موجب = أكثر من المتوقع، صفر = مستقلان، سالب = أقل.</p><p><b>الحساب.</b> P(cherry, pie) = 0.0377، P(cherry) = 0.0415، P(pie) = 0.0437، PMI = log₂(20.8) ≈ <b>4.38</b>، أي نحو 21 مرة أكثر من الصدفة.</p><p><b>PPMI</b> = max(PMI, 0): cherry–computer = −6.70 ← 0.</p><p><b>سبب القص.</b> الارتباط السلبي الموثوق يحتاج نصوصًا هائلة فتقديره غير مستقر.</p><p><b>القيد المتبقي.</b> متجهات PPMI متناثرة وطويلة، والتضمينات الكثيفة تحل ذلك.</p>`,
      [[`PMI definition + formula`, `تعريف PMI وصيغته`], [`Interpret >0, =0, <0`, `تفسير القيم`], [`4.38 with steps`, `حساب 4.38`], [`PPMI = max(PMI, 0)`, `PPMI`], [`Why clip; sparsity remains`, `سبب القص والتناثر`]],
      `Definition 2 · Interpretation 1 · Calculation 3 · PPMI 1 · Clipping 1 · Limitation 2`),
    E('Compare & contrast', `Compare sparse and dense word representations. Then explain Word2Vec's skip-gram and CBOW models and skip-gram with negative sampling.`, `قارن بين تمثيلات الكلمات المتناثرة والكثيفة، ثم اشرح نموذجي skip-gram وCBOW في Word2Vec وskip-gram مع العينات السالبة.`, 12,
      `<p><b>Sparse vs dense.</b></p><table><tr><th></th><th>Sparse (PPMI)</th><th>Dense embedding</th></tr><tr><td>Dimensions</td><td>one per context word, 10,000–50,000</td><td>50–1,000 learned</td></tr><tr><td>Values</td><td>mostly zero</td><td>mostly non-zero real numbers</td></tr><tr><td>Parameters</td><td>a weight per dimension</td><td>far fewer; may help generalization, reduce overfitting</td></tr><tr><td>Synonyms</td><td>car and automobile are unrelated dimensions</td><td>similar contexts place them close</td></tr></table><p>A dense embedding is a short real-valued vector learned so that words used in similar contexts get similar vectors. Its dimensions have no readable meaning.</p><p><b>Word2Vec</b> learns a dense vector for each word by training a small neural network to predict nearby words; the prediction task is only the training objective and the learned vectors are the embeddings. A context window (e.g. ±2) defines the nearby words: in "I ate fresh cherry pie today", the context of cherry is {ate, fresh, pie, today}.</p><ul><li><b>Skip-gram:</b> input = centre word; predicts the surrounding context words (cherry → pie, sugar).</li><li><b>CBOW:</b> input = context words; predicts the centre word (pie, sugar, tart → cherry). Often faster because the context words are combined into one representation.</li></ul><p><b>SGNS.</b> The most common skip-gram training method. A binary classifier learns to tell observed word–context pairs from random pairs. Positive: (cherry, pie), label 1. Negatives: (cherry, orchestra), (cherry, algebra), label 0. Each positive pair is matched with several negatives; a large dot product between word and context vectors gives a probability near 1.</p>`,
      `<p><b>المتناثر مقابل الكثيف.</b> المتناثر (PPMI): بُعد لكل كلمة سياق (10–50 ألفًا) ومعظم القيم أصفار ويحتاج وزنًا لكل بُعد، وcar وautomobile بُعدان غير مترابطين. الكثيف: 50–1000 بُعد متعلَّم، قيم غير صفرية، أوزان أقل وتعميم أفضل، والمترادفات متقاربة.</p><p><b>Word2Vec</b> يتعلم متجهًا لكل كلمة بتدريب شبكة صغيرة على التنبؤ بالكلمات المجاورة؛ والتنبؤ هدف تدريب فقط. ونافذة السياق ±2: سياق cherry هو {ate, fresh, pie, today}.</p><ul><li><b>Skip-gram:</b> المدخل الكلمة المركزية ويتنبأ بالسياق.</li><li><b>CBOW:</b> المدخل كلمات السياق ويتنبأ بالمركزية، وغالبًا أسرع.</li></ul><p><b>SGNS.</b> مصنف ثنائي يميّز الأزواج الحقيقية (cherry, pie) بوسم 1 من العشوائية (cherry, orchestra) بوسم 0، مع عدة سالبة لكل موجب، والضرب النقطي الكبير يعطي احتمالًا قرب 1.</p>`,
      [[`Sparse vs dense table (4 rows)`, `جدول المقارنة`], [`Word2Vec definition; objective vs embeddings`, `تعريف Word2Vec`], [`Context window example`, `مثال نافذة السياق`], [`Skip-gram vs CBOW`, `skip-gram مقابل CBOW`], [`SGNS positive/negative pairs`, `الأزواج الموجبة والسالبة`]],
      `Sparse/dense 4 · Word2Vec 2 · Skip-gram/CBOW 3 · SGNS 3`),
    E('Compare & contrast', `Compare Word2Vec and GloVe.`, `قارن بين Word2Vec وGloVe.`, 6,
      `<table><tr><th></th><th>Word2Vec</th><th>GloVe</th></tr><tr><td>Model type</td><td>Predictive: learns by predicting a word from its context, or the reverse</td><td>Count-based: learns by fitting observed co-occurrence statistics</td></tr><tr><td>Training signal</td><td>Word–context pairs in local context windows</td><td>A corpus-wide word–context co-occurrence matrix</td></tr><tr><td>Objective</td><td>Skip-gram or CBOW (often with negative sampling)</td><td>Word·context dot product + biases ≈ ln Xᵢⱼ for observed pairs</td></tr><tr><td>Statistics</td><td>One window at a time, many examples</td><td>Global; built on ratios of co-occurrence probabilities</td></tr><tr><td>Output</td><td>Dense, static word embeddings</td><td>Dense, static word embeddings</td></tr></table><p><b>Similarity.</b> Both learn dense, static embeddings (one vector per word type), so both share the static limitation: <i>bank</i> gets one vector for both senses. They differ mainly in the training signal and objective: Word2Vec learns from many local prediction examples, while GloVe first summarises those observations in a global matrix and combines matrix-factorization intuition with dense vector learning.</p>`,
      `<table><tr><th></th><th>Word2Vec</th><th>GloVe</th></tr><tr><td>النوع</td><td>تنبؤي</td><td>قائم على العدّ</td></tr><tr><td>إشارة التدريب</td><td>أزواج في نوافذ محلية</td><td>مصفوفة تواجد على المدونة كلها</td></tr><tr><td>الهدف</td><td>skip-gram أو CBOW</td><td>الضرب النقطي + الانحيازات ≈ ln Xᵢⱼ</td></tr><tr><td>الإحصاءات</td><td>نافذة في كل مرة</td><td>شاملة، مبنية على نسب الاحتمالات</td></tr><tr><td>المخرج</td><td>تضمينات كثيفة ثابتة</td><td>تضمينات كثيفة ثابتة</td></tr></table><p><b>التشابه.</b> كلاهما ينتج تضمينات كثيفة ثابتة ويعاني القيد نفسه (bank متجه واحد)، ويختلفان في إشارة التدريب والهدف.</p>`,
      [[`Predictive vs count-based`, `تنبؤي مقابل عدّي`], [`Local windows vs global matrix`, `محلي مقابل شامل`], [`Objectives (skip-gram/CBOW vs ln Xij)`, `الأهداف`], [`Both dense static; static limitation`, `كلاهما كثيف ثابت`]],
      `Differences 4 · Similarity 2`),
    E('Describe & discuss', `Discuss how word embeddings should be evaluated and why they must be checked for bias.`, `ناقش كيف تُقيَّم تضمينات الكلمات ولماذا يجب فحصها من التحيز.`, 8,
      `<p><b>Intrinsic evaluation</b> measures the representation directly: word similarity, relatedness, analogy and bias tests. It is fast and useful for diagnosis, but may not predict downstream performance. Datasets: <b>SimLex-999</b> targets similarity (vanish/disappear 9.8, muscle/bone 3.65, hole/agreement 0.3 on a 0–10 scale); <b>WordSim-353</b> is often used for relatedness. Similarity is not relatedness: car/automobile are similar; car/road are related.</p><p><b>Extrinsic evaluation</b> uses the representation inside an NLP system and measures classification F1, retrieval quality or NER performance. It is the best evidence for the target task but slower and dependent on the full system design.</p><p><b>Semantic properties and their limits.</b> Similar words have nearby vectors and some relations appear as consistent offsets (gender, country–capital), but analogies work only for some relations; it is a geometric regularity, not understanding. 2D projections (PCA, t-SNE, UMAP) can distort distances.</p><p><b>Bias.</b> Bias in embeddings is a systematic association between words and a social group, learned from training text. Source: repeated associations in the corpus. Mechanism: co-occurrence becomes vector-space association. Effect: a classifier or retrieval system inherits (or amplifies) it. Example from Word2Vec trained on news: computer programmer − man + woman ≈ homemaker. Therefore embeddings must be inspected before being used in sensitive systems.</p>`,
      `<p><b>التقييم الداخلي</b> يقيس التمثيل مباشرة: التشابه والترابط والتناظر واختبارات التحيز. سريع ومفيد للتشخيص لكنه قد لا يتنبأ بالأداء النهائي. SimLex-999 للتشابه وWordSim-353 للترابط؛ والتشابه ليس الترابط (car/automobile مقابل car/road).</p><p><b>التقييم الخارجي</b> يستخدم التمثيل داخل نظام ويقيس F1 أو جودة الاسترجاع أو أداء NER، وهو أفضل دليل لكنه أبطأ.</p><p><b>الخصائص الدلالية وحدودها.</b> التناظر ينجح لبعض العلاقات فقط وهو انتظام هندسي لا فهم، والإسقاط ثنائي الأبعاد قد يشوّه.</p><p><b>التحيز.</b> ارتباط منهجي بين الكلمات وفئة اجتماعية يُتعلَّم من النص: المصدر المدونة، والآلية هندسة المتجهات، والأثر وراثة النموذج له. مثال: computer programmer − man + woman ≈ homemaker. لذا يجب الفحص قبل الاستخدام في الأنظمة الحساسة.</p>`,
      [[`Intrinsic: examples, pros, cons`, `الداخلي`], [`SimLex vs WordSim; similarity ≠ relatedness`, `SimLex وWordSim`], [`Extrinsic: examples, pros, cons`, `الخارجي`], [`Bias definition + source/mechanism/effect`, `تعريف التحيز ومراحله`], [`Programmer/homemaker example`, `المثال`]],
      `Intrinsic 2 · Datasets 1 · Extrinsic 2 · Bias 3`),
    E('Scenario', `For each task, choose a starting representation and justify it: (a) keyword search over university documents; (b) classifying student feedback as positive or negative; (c) finding words similar to "lecture"; (d) a quick prototype to test an idea.`, `لكل مهمة اختر تمثيلًا مبدئيًّا وبرّر اختيارك: (أ) البحث بالكلمات المفتاحية في وثائق الجامعة؛ (ب) تصنيف آراء الطلاب إيجابية أو سلبية؛ (ج) إيجاد كلمات مشابهة لـ "lecture"؛ (د) نموذج أولي سريع لاختبار فكرة.`, 8,
      `<p><b>Principle.</b> Start with the simplest representation that keeps the signal the task needs; move to a heavier one only if results require it.</p><ol><li><b>Keyword search → TF-IDF.</b> A strong sparse term-matching baseline. It rewards terms frequent in a document and rare in the collection, and cosine similarity ranks documents by direction regardless of length.</li><li><b>Feedback sentiment → TF-IDF + logistic regression.</b> A simple, interpretable, competitive baseline that is easy to inspect when something goes wrong. Note that BoW/TF-IDF lose word order, so negation such as "not good" may need care.</li><li><b>Similar words → Word2Vec or GloVe.</b> Dense vectors encode semantic neighbourhoods; nearest neighbours by cosine give similar words. One-hot cannot do this (all words orthogonal). Remember static vectors give one vector per word and may carry bias.</li><li><b>Quick prototype → Bag-of-Words.</b> Fast and easy to debug.</li></ol><p>Finally, evaluate the chosen representation extrinsically (F1, retrieval quality) on the real task.</p>`,
      `<p><b>المبدأ.</b> ابدأ بأبسط تمثيل يحفظ إشارة المهمة.</p><ol><li><b>البحث ← TF-IDF.</b> أساس قوي للمطابقة، ويكافئ المصطلحات المميزة، ويرتّب جيب التمام المستندات بغض النظر عن الطول.</li><li><b>مشاعر الطلاب ← TF-IDF + انحدار لوجستي.</b> بسيط وقابل للتفسير وتنافسي، مع الانتباه لفقدان الترتيب في النفي.</li><li><b>الكلمات المشابهة ← Word2Vec أو GloVe.</b> المتجهات الكثيفة ترمّز الجوار الدلالي، وone-hot لا يستطيع ذلك.</li><li><b>نموذج أولي ← حقيبة الكلمات.</b> سريع وسهل التصحيح.</li></ol><p>ثم قيّم التمثيل خارجيًّا على المهمة الحقيقية.</p>`,
      [[`States simplest-representation principle`, `ذكر المبدأ`], [`(a) TF-IDF with reason`, `(أ) TF-IDF`], [`(b) TF-IDF + LR with reason`, `(ب) TF-IDF + LR`], [`(c) Word2Vec/GloVe with reason`, `(ج) Word2Vec/GloVe`], [`(d) BoW with reason`, `(د) BoW`]],
      `Principle 1 · Tasks (a)–(d) about 2 marks each (7 in total)`),
    E('Describe & discuss', `The lecture summary gives six takeaways: sparse representations, weight and compare, count-based association, dense embeddings, evaluate behaviour, and choose by the task. Explain each one briefly.`, `يقدّم ملخص المحاضرة ست نقاط: التمثيلات المتناثرة، الوزن والمقارنة، الارتباط القائم على العدّ، التضمينات الكثيفة، تقييم السلوك، والاختيار حسب المهمة. اشرح كل نقطة باختصار.`, 12,
      `<ol><li><b>Sparse representations.</b> One-hot identifies a word (1 at its position, 0 elsewhere; all words orthogonal). Bag-of-Words represents a document by counting vocabulary terms (sum of one-hots). Both are |V| long and lose word order ("dog bites man" = "man bites dog").</li><li><b>Weight and compare.</b> TF-IDF highlights distinctive document terms: TF = 1 + log₁₀ count, IDF = log₁₀(N/DF), weight = TF × IDF, so a term in every document gets 0. Cosine similarity compares vector direction rather than raw length: x·y / (‖x‖‖y‖).</li><li><b>Count-based association.</b> Co-occurrence counts and PMI/PPMI turn context counts into word–context association values: PMI = log₂ P(w,c)/(P(w)P(c)); PPMI clips negatives to 0. These vectors stay sparse.</li><li><b>Dense embeddings.</b> Word2Vec (predictive: skip-gram/CBOW from local windows) and GloVe (count-based: fits ln Xᵢⱼ from global co-occurrence) learn compact, static word vectors (50–1,000 dimensions) from distributional context.</li><li><b>Evaluate behaviour.</b> Use intrinsic diagnostics (similarity, relatedness, analogy, bias tests) and extrinsic task results (F1, retrieval quality); inspect bias before sensitive use (programmer − man + woman ≈ homemaker).</li><li><b>Choose by the task.</b> No method here keeps word order. Start with the simplest representation that preserves the task signal: TF-IDF for search, TF-IDF + logistic regression for classification, Word2Vec/GloVe for word similarity, BoW for a quick prototype.</li></ol>`,
      `<ol><li><b>التمثيلات المتناثرة.</b> one-hot يحدد هوية الكلمة، وحقيبة الكلمات تعدّ مصطلحات المستند (مجموع one-hot)، وكلاهما بطول |V| ويفقد الترتيب.</li><li><b>الوزن والمقارنة.</b> TF-IDF يبرز المصطلحات المميزة (TF × IDF، والمصطلح الموجود في كل المستندات وزنه 0)، وجيب التمام يقارن الاتجاه لا الطول.</li><li><b>الارتباط القائم على العدّ.</b> التواجد المشترك وPMI/PPMI تحوّل أعداد السياق إلى قيم ارتباط، وتبقى المتجهات متناثرة.</li><li><b>التضمينات الكثيفة.</b> Word2Vec (تنبؤي من نوافذ محلية) وGloVe (عدّي من إحصاءات شاملة) يتعلمان متجهات كثيفة ثابتة.</li><li><b>تقييم السلوك.</b> تقييم داخلي (التشابه والترابط والتناظر والتحيز) وخارجي (F1 وجودة الاسترجاع)، وفحص التحيز قبل الاستخدام الحساس.</li><li><b>الاختيار حسب المهمة.</b> لا تمثيل هنا يحفظ الترتيب؛ ابدأ بأبسط تمثيل يحفظ إشارة المهمة.</li></ol>`,
