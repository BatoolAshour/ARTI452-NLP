<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTI 404 Study Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky top bar (search + Arabic toggle), chapter rail on the left, one reading column; chapters split into five tabs. */
:root {
  --bg: #F2F5F5; --surface: #FFFFFF; --surface-2: #E8EEEE; --ink: #13232A; --muted: #56676E; --line: #D3DDDE;
  --accent: #0D676C; --accent-ink: #FFFFFF; --accent-soft: #D7EBEA;
  --must: #A93630; --must-soft: #F6E0DD; --imp: #8F5C06; --imp-soft: #F5E8CF; --add: #4A5E7D; --add-soft: #E1E7F0;
  --good: #26774A; --good-soft: #DDF0E4; --bad: #A93630; --bad-soft: #F6E0DD;
  --ar-tint: #ECF1F6; --ar-ink: #22394A; --hl: #FFE9A8;
  --m1: #0D676C; --m2: #4150A3; --m3: #87397A; --m4: #9A6208; --m5: #36773F; --m6: #A9472F; --on-m: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px; --shadow: 0 1px 2px rgb(19 35 42 / .06), 0 6px 18px rgb(19 35 42 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1618; --surface: #152125; --surface-2: #1C2B30; --ink: #E2ECEE; --muted: #98ACB2; --line: #2A3C41;
  --accent: #5BC1C2; --accent-ink: #0B1B1D; --accent-soft: #163A3C;
  --must: #F0897F; --must-soft: #3A201E; --imp: #E5B35A; --imp-soft: #392D16; --add: #A2B5D8; --add-soft: #212B3B;
  --good: #6FD39A; --good-soft: #17352A; --bad: #F0897F; --bad-soft: #3A201E;
  --ar-tint: #18252D; --ar-ink: #CFE0EA; --hl: #5B4A12;
  --m1: #5BC1C2; --m2: #98A6F2; --m3: #E092D3; --m4: #E5B35A; --m5: #82CF8C; --m6: #F29A80; --on-m: #0B1B1D;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1618; --surface: #152125; --surface-2: #1C2B30; --ink: #E2ECEE; --muted: #98ACB2; --line: #2A3C41;
  --accent: #5BC1C2; --accent-ink: #0B1B1D; --accent-soft: #163A3C;
  --must: #F0897F; --must-soft: #3A201E; --imp: #E5B35A; --imp-soft: #392D16; --add: #A2B5D8; --add-soft: #212B3B;
  --good: #6FD39A; --good-soft: #17352A; --bad: #F0897F; --bad-soft: #3A201E;
  --ar-tint: #18252D; --ar-ink: #CFE0EA; --hl: #5B4A12;
  --m1: #5BC1C2; --m2: #98A6F2; --m3: #E092D3; --m4: #E5B35A; --m5: #82CF8C; --m6: #F29A80; --on-m: #0B1B1D;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25); color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 6px 10px; z-index: 50; }
.skip:focus { left: 8px; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 500; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.icon-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); }
.search { position: relative; flex: 0 1 380px; min-width: 0; }
.search input { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px 0 36px; font: inherit; font-size: 15px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; stroke: var(--muted); pointer-events: none; }
.results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: min(70vh, 520px); overflow: auto; z-index: 40; min-width: 280px; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 14px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.r-where { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.r-title { font-weight: 600; display: block; }
.r-snip { font-size: 13px; color: var(--muted); display: block; }
.r-snip mark { background: var(--hl); color: inherit; padding: 0 1px; }
.r-empty { padding: 14px; color: var(--muted); font-size: 14px; }
.ar-toggle { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 4px 12px; cursor: pointer; line-height: 1.25; font-size: 13px; font-weight: 600; text-align: left; }
.ar-toggle .t-ar { font-family: var(--f-ar); font-weight: 500; }
.ar-toggle[aria-pressed="false"] { background: var(--surface); color: var(--accent); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 61px; align-self: start; height: calc(100vh - 61px); overflow: auto; padding: 20px 12px 40px 16px; border-right: 1px solid var(--line); }
.side h2 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 18px 8px 8px; }
.side a { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: center; text-decoration: none; color: var(--ink); padding: 8px; border-radius: 8px; }
.side a:hover { background: var(--surface-2); }
.side a.on { background: var(--accent-soft); }
.side .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); grid-row: span 2; }
.side .t { font-weight: 500; font-size: 14.5px; line-height: 1.3; }
.side .mini { height: 4px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.side .mini i { display: block; height: 100%; background: var(--accent); }
main { padding-block: 28px 80px; padding-inline: 32px; min-width: 0; outline: none; }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 24; }

/* ---------- generic ---------- */
.wrap { max-width: 860px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.lede { font-size: 17px; color: var(--ink); max-width: 68ch; }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ar, [lang="ar"] { font-family: var(--f-ar); }
.ar { direction: rtl; text-align: right; color: var(--ar-ink); background: var(--ar-tint); border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 15.5px; line-height: 1.8; }
.ar b { font-weight: 600; }
body.en-only .ar { display: none; }
body.en-only .bi.peeked > .ar { display: block; }
.bi { position: relative; min-width: 0; }
.bi > .en { min-width: 0; }
.peek { display: none; margin-top: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; font-family: var(--f-ar); font-size: 12px; padding: 0 10px; cursor: pointer; line-height: 1.9; }
body.en-only .peek { display: inline-block; }
.bi.peeked > .peek { color: var(--accent); border-color: var(--accent); }
.pri { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-weight: 500; }
.pri-must { background: var(--must-soft); color: var(--must); }
.pri-imp { background: var(--imp-soft); color: var(--imp); }
.pri-add { background: var(--add-soft); color: var(--add); }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px var(--hl); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 3px solid var(--hl); } .card-in { transition: none !important; } }

/* ---------- dashboard ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(30px, 4.4vw, 46px); margin: 6px 0 10px; }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .rv b { font-family: var(--f-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .rv span { font-size: 12px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; display: block; }
.stat span { font-size: 13px; color: var(--muted); }
.grid-ch { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
.chcard { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.chcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.chcard .wk { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.chcard h3 { font-size: 21px; }
.chcard .tar { font-family: var(--f-ar); color: var(--muted); font-size: 14px; direction: rtl; text-align: right; }
body.en-only .chcard .tar { display: none; }
.chcard .meta { font-size: 13px; color: var(--muted); }
.bars { display: grid; gap: 5px; margin-top: auto; }
.bar { display: grid; grid-template-columns: 74px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar .tr { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.dash-h { font-size: 22px; margin: 34px 0 4px; }
.legend { display: grid; gap: 10px; }
.legend div { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: start; }
.srcs { width: 100%; border-collapse: collapse; font-size: 14px; }
.srcs td, .srcs th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- chapter ---------- */
.ch-head { display: grid; gap: 8px; padding-bottom: 18px; }
.ch-head h1 { font-size: clamp(28px, 4vw, 40px); }
.ch-head .tar { font-family: var(--f-ar); font-size: 19px; color: var(--muted); direction: rtl; text-align: right; }
body.en-only .ch-head .tar { display: none; }
.src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tabs { position: sticky; top: 61px; z-index: 20; background: var(--bg); display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin: 0 -4px 22px; padding: 6px 4px 0; }
.tabs button { border: 0; background: none; padding: 10px 14px 11px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: grid; justify-items: center; line-height: 1.2; }
.tabs button small { font-family: var(--f-ar); font-size: 12px; font-weight: 400; }
body.en-only .tabs button small { display: none; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; scroll-margin-top: 130px; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.sec-title { flex: 1 1 260px; min-width: 0; font-size: 20px; }
.sec-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; text-align: left; padding: 0; font: inherit; width: 100%; }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; flex: none; margin-top: -4px; }
.sec.closed .chev { transform: rotate(-45deg); margin-top: 0; }
.sec.closed .sec-body { display: none; }
.done { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.done input { width: 17px; height: 17px; accent-color: var(--good); }
.sec-body { padding: 0 18px 18px; display: grid; gap: 14px; }
.main.f-must .sec:not([data-pri="must"]), .main.f-imp .sec:not([data-pri="imp"]), .main.f-add .sec:not([data-pri="add"]) { display: none; }
.def { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.def-term { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 16.5px; }
.blist { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.blist li::marker { color: var(--accent); }
.callout { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; border: 1px solid transparent; }
.callout-l { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.callout.ex { background: var(--accent-soft); } .callout.ex .callout-l { color: var(--accent); }
.callout.xa { border: 1px dashed var(--add); background: var(--surface); } .callout.xa .callout-l { color: var(--add); }
.callout.warn { background: var(--imp-soft); } .callout.warn .callout-l { color: var(--imp); }
.callout.key { background: var(--must-soft); } .callout.key .callout-l { color: var(--must); }
.formula { border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 10px 14px; display: grid; gap: 6px; }
.formula .f { font-family: var(--f-mono); font-size: 15px; white-space: pre-wrap; overflow-x: auto; color: var(--ink); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
table.t th { background: var(--surface-2); text-align: left; font-weight: 600; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px 0; }
.flow .st { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500; display: grid; align-content: center; min-width: 0; }
.flow .st .s-ar { font-family: var(--f-ar); font-weight: 400; color: var(--muted); font-size: 13px; direction: rtl; }
body.en-only .flow .s-ar { display: none; }
.flow .ar-r { align-self: center; color: var(--accent); padding: 0 6px; font-size: 18px; }

/* ---------- mind maps ---------- */
.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 16px; margin-bottom: 18px; }
.mapcard h3 { font-size: 19px; }
.map-wrap { overflow-x: auto; margin-top: 10px; border-radius: 8px; background: var(--bg); }
svg.mm { display: block; width: 100%; min-width: 780px; height: auto; font-family: var(--f-body); }
.mm .e-main { fill: none; stroke-width: 2.5; }
.mm .e-kid { fill: none; stroke-width: 1.4; opacity: .75; }
.mm .e-x { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
.mm .n-c rect { fill: var(--ink); } .mm .n-c text { fill: var(--bg); font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.mm .n-b { cursor: pointer; } .mm .n-b rect { fill: var(--c); } .mm .n-b text { fill: var(--on-m); font-weight: 600; font-size: 16.5px; }
.mm .n-k rect { fill: var(--surface); stroke: var(--c); stroke-width: 1.4; } .mm .n-k text { fill: var(--ink); font-size: 14.5px; }
.mm .lbl rect { fill: var(--bg); stroke: var(--line); } .mm .lbl text { fill: var(--muted); font-size: 13px; font-style: italic; }
.mm .lbl.x text { fill: var(--ink); font-style: normal; font-weight: 500; }
.mm .dim { opacity: .14; transition: opacity .2s; }
.mm .n-b:hover rect { filter: brightness(1.08); }
.map-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
.outline { margin-top: 8px; font-size: 14px; }
.outline summary { cursor: pointer; color: var(--accent); }
.outline ul { margin: 6px 0; }

/* ---------- essays ---------- */
.essay { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin-bottom: 16px; display: grid; gap: 10px; scroll-margin-top: 130px; }
.essay-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qtype { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); border-radius: 999px; padding: 2px 9px; }
.marks { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.essay-meta .done { margin-left: auto; }
.essay .q { font-family: var(--f-body); font-size: 17.5px; font-weight: 600; line-height: 1.45; letter-spacing: 0; }
.essay textarea { width: 100%; min-height: 92px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; padding: 10px 12px; resize: vertical; }
.answer { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 12px; }
.answer h5 { margin: 0; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.answer .en p, .answer .ar p { margin: 0 0 8px; }
.answer ol, .answer ul { margin: 0 0 8px; padding-inline-start: 22px; display: grid; gap: 4px; }
.answer table { border-collapse: collapse; width: 100%; font-size: 14px; margin-bottom: 8px; }
.answer table td, .answer table th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: start; }
.answer table th { background: var(--surface-2); }
.ans-x { overflow-x: auto; }
.alloc { font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }

  essays: [
    E('Define & explain', `Define Natural Language Processing (NLP). Which fields does it combine, and what is its main goal?`, `عرّف معالجة اللغة الطبيعية (NLP). ما المجالات التي تجمعها، وما هدفها الرئيسي؟`, 6,
      `<p><b>Definition.</b> Natural Language Processing (NLP) is a subfield of linguistics, computer science and information engineering. It is concerned with the interactions between computers and human (natural) languages.</p><p><b>Main goal.</b> Its goal is to program computers to process and analyze large amounts of natural language data, so that computers can work with text and speech produced by people.</p><p><b>Why three fields.</b> Linguistics supplies knowledge of how language is structured (sounds, words, sentences, meaning). Computer science supplies the algorithms and programs. Information engineering supplies the methods to store, process and manage large amounts of data.</p><p><b>Examples.</b> NLP powers applications such as spell checking, machine translation, question answering and speech recognition.</p>`,
      `<p><b>التعريف.</b> معالجة اللغة الطبيعية (NLP) مجال فرعي من علم اللغة وعلوم الحاسب وهندسة المعلومات، يهتم بالتفاعل بين الحواسيب واللغات البشرية (الطبيعية).</p><p><b>الهدف الرئيسي.</b> برمجة الحواسيب لمعالجة وتحليل كميات كبيرة من بيانات اللغة الطبيعية، حتى تتمكن من التعامل مع النصوص والكلام الذي ينتجه البشر.</p><p><b>لماذا ثلاثة مجالات.</b> يقدّم علم اللغة المعرفة ببنية اللغة (الأصوات والكلمات والجمل والمعنى)، وتقدّم علوم الحاسب الخوارزميات والبرامج، وتقدّم هندسة المعلومات طرق تخزين البيانات الكبيرة ومعالجتها وإدارتها.</p><p><b>أمثلة.</b> تعتمد على NLP تطبيقات مثل التدقيق الإملائي والترجمة الآلية والإجابة عن الأسئلة والتعرّف على الكلام.</p>`,
      [[`States the three fields: linguistics, computer science, information engineering`, `ذكر المجالات الثلاثة`], [`Interaction between computers and human languages`, `التفاعل بين الحاسوب واللغات البشرية`], [`Goal: process and analyze large amounts of natural-language data`, `الهدف: معالجة وتحليل كميات كبيرة من بيانات اللغة`], [`At least one application example`, `مثال تطبيقي واحد على الأقل`]],
      `Definition 2 · Three fields 2 · Goal 1 · Example 1`),
    E('Define & explain', `Explain the relationship between vocabulary, text and language. Then distinguish between natural and artificial languages.`, `اشرح العلاقة بين المفردات والنص واللغة، ثم ميّز بين اللغات الطبيعية والاصطناعية.`, 6,
      `<p><b>Vocabulary, text and language.</b></p><ol><li>A <b>vocabulary</b> consists of a set of words, written wᵢ.</li><li>A <b>text</b> is composed of a sequence of words taken from the vocabulary.</li><li>A <b>language</b> is constructed of the set of all possible texts.</li></ol><p>So each level is built from the one below it: words form texts, and all possible texts form the language.</p><p><b>Natural vs artificial language.</b> A natural language is a human language that people use to communicate, such as English, Arabic or Japanese. An artificial language is designed by people for a specific purpose, such as a programming language. NLP focuses on natural language, which is harder to process because it is flexible and ambiguous.</p>`,
      `<p><b>المفردات والنص واللغة.</b></p><ol><li>تتكون <b>المفردات</b> من مجموعة كلمات تُكتب wᵢ.</li><li>يتكون <b>النص</b> من سلسلة كلمات مأخوذة من المفردات.</li><li>تتكوّن <b>اللغة</b> من مجموعة كل النصوص الممكنة.</li></ol><p>إذن كل مستوى مبني على ما تحته: الكلمات تكوّن النصوص، وكل النصوص الممكنة تكوّن اللغة.</p><p><b>اللغة الطبيعية مقابل الاصطناعية.</b> اللغة الطبيعية لغة بشرية يتواصل بها الناس مثل الإنجليزية والعربية واليابانية. أما اللغة الاصطناعية فيصممها البشر لغرض محدد مثل لغات البرمجة. تركّز NLP على اللغة الطبيعية، وهي أصعب في المعالجة لأنها مرنة وغامضة.</p>`,
      [[`Vocabulary = set of words`, `المفردات = مجموعة كلمات`], [`Text = sequence of words from the vocabulary`, `النص = سلسلة كلمات`], [`Language = set of all possible texts`, `اللغة = كل النصوص الممكنة`], [`Natural = human; artificial = designed (e.g. programming)`, `طبيعية = بشرية؛ اصطناعية = مصممة`]],
      `Three definitions 3 · Natural vs artificial 3`),
    E('List & explain', `List and explain six NLP applications. Give an example for each.`, `اذكر واشرح ستة من تطبيقات NLP مع مثال لكل منها.`, 12,
      `<ol><li><b>Spell and grammar checking</b>: checks spelling and grammar and suggests alternatives for the errors (for example, a word processor underlines a misspelled word and offers corrections).</li><li><b>Word prediction</b>: predicts the next word that is highly probable to be typed by the user (for example, a phone keyboard suggesting the next word).</li><li><b>Information retrieval</b>: finds information relevant to the user's query (for example, a search engine).</li><li><b>Question answering</b>: answers questions with a short answer. The lecture shows a biomedical QA system that answers "which drugs can be used to treat lung cancer?" with Amifostine.</li><li><b>Information extraction</b>: extracts important concepts from texts and assigns them to slots in a template. It includes named-entity recognition. The Lancet system extracts medication, dosage, manner, frequency, duration and reason from clinical text.</li><li><b>Speech recognition</b>: recognizes spoken language and transforms it into text (for example, voice dictation).</li></ol><p>Other valid choices: text categorization, summarization, machine translation, sentiment analysis, OCR, speech synthesis.</p>`,
      `<ol><li><b>التدقيق الإملائي والنحوي</b>: يفحص الإملاء والقواعد ويقترح بدائل للأخطاء (مثل معالج النصوص الذي يضع خطًّا تحت الكلمة الخاطئة ويقترح تصحيحها).</li><li><b>التنبؤ بالكلمة</b>: يتوقع الكلمة التالية الأكثر احتمالًا (مثل اقتراحات لوحة مفاتيح الهاتف).</li><li><b>استرجاع المعلومات</b>: يجد المعلومات ذات الصلة باستعلام المستخدم (مثل محرك البحث).</li><li><b>الإجابة عن الأسئلة</b>: يجيب بإجابة قصيرة. تعرض المحاضرة نظامًا طبيًّا يجيب عن "ما الأدوية التي تعالج سرطان الرئة؟" بـ Amifostine.</li><li><b>استخراج المعلومات</b>: يستخرج المفاهيم المهمة ويضعها في خانات قالب، ويشمل التعرّف على الكيانات المسماة. يستخرج نظام Lancet الدواء والجرعة والطريقة والتكرار والمدة والسبب من النصوص الطبية.</li><li><b>التعرّف على الكلام</b>: يتعرف على الكلام المنطوق ويحوله إلى نص (مثل الإملاء الصوتي).</li></ol><p>اختيارات صحيحة أخرى: تصنيف النصوص، التلخيص، الترجمة الآلية، تحليل المشاعر، OCR، توليد الكلام.</p>`,
      [[`Six distinct applications named correctly`, `ستة تطبيقات مختلفة بأسماء صحيحة`], [`A correct one-line definition for each`, `تعريف صحيح لكل تطبيق`], [`A relevant example for each`, `مثال مناسب لكل تطبيق`]],
      `2 marks per application (1 definition + 1 example)`),
    E('Describe & discuss', `Classify NLP applications according to their level of difficulty. Discuss why some applications are still considered difficult.`, `صنّف تطبيقات NLP حسب مستوى صعوبتها، وناقش لماذا لا تزال بعض التطبيقات تُعد صعبة.`, 8,
      `<p><b>Classification (from the lecture).</b></p><ul><li><b>Easy (mostly solved):</b> spell and grammar checking, some text categorization tasks, some named-entity recognition tasks.</li><li><b>Intermediate (good progress):</b> information retrieval, sentiment analysis, machine translation.</li><li><b>Difficult (still hard):</b> information extraction, question answering, summarization, dialog systems.</li></ul><p><b>Discussion.</b> The easy tasks can often be solved by looking at single words or short patterns. The difficult tasks require the system to understand the meaning of whole texts, follow references between sentences (discourse), use context and world knowledge (pragmatics), and in some cases generate new text. These tasks are affected by the challenges of language: ambiguity (one form, many meanings) and paraphrasing (many forms, one meaning). For example, a question-answering system must recognize that "When will my book arrive?" and "When will I receive my book?" ask the same thing.</p>`,
      `<p><b>التصنيف (من المحاضرة).</b></p><ul><li><b>سهلة (محلولة غالبًا):</b> التدقيق الإملائي والنحوي، بعض مهام تصنيف النصوص، بعض مهام التعرّف على الكيانات المسماة.</li><li><b>متوسطة (تقدم جيد):</b> استرجاع المعلومات، تحليل المشاعر، الترجمة الآلية.</li><li><b>صعبة (لا تزال صعبة):</b> استخراج المعلومات، الإجابة عن الأسئلة، التلخيص، أنظمة الحوار.</li></ul><p><b>المناقشة.</b> يمكن غالبًا حل المهام السهلة بالنظر إلى كلمات منفردة أو أنماط قصيرة. أما المهام الصعبة فتتطلب فهم معنى نصوص كاملة، وتتبع الإحالات بين الجمل (الخطاب)، واستخدام السياق والمعرفة بالعالم (التداولية)، وأحيانًا توليد نص جديد. وتتأثر هذه المهام بتحديات اللغة: الغموض (شكل واحد بمعانٍ كثيرة) وإعادة الصياغة (أشكال كثيرة بمعنى واحد). مثلًا، يجب أن يدرك نظام الإجابة عن الأسئلة أن "متى سيصل كتابي؟" و"متى سأستلم كتابي؟" سؤال واحد.</p>`,
      [[`Correct three groups with the right applications`, `المجموعات الثلاث بتطبيقاتها الصحيحة`], [`Mentions "some" for categorization/NER`, `ذكر كلمة "بعض"`], [`Links difficulty to meaning, context, discourse, generation`, `ربط الصعوبة بالمعنى والسياق والخطاب والتوليد`], [`Mentions ambiguity/paraphrasing with an example`, `ذكر الغموض/إعادة الصياغة مع مثال`]],
      `Classification 5 · Discussion 3`),
    E('Compare & contrast', `Compare information retrieval, information extraction and question answering.`, `قارن بين استرجاع المعلومات واستخراج المعلومات والإجابة عن الأسئلة.`, 6,
      `<table><tr><th></th><th>Information retrieval</th><th>Information extraction</th><th>Question answering</th></tr><tr><td>Goal</td><td>Find information relevant to the user's query</td><td>Extract important concepts and assign them to slots in a template</td><td>Answer a question with a short answer</td></tr><tr><td>Output</td><td>Relevant documents/information</td><td>A filled template (e.g. medication, dosage, frequency); includes named entities</td><td>A short answer (e.g. a drug name)</td></tr><tr><td>Difficulty (lecture)</td><td>Intermediate</td><td>Difficult</td><td>Difficult</td></tr></table><p><b>Similarity:</b> all three find useful information in text. <b>Difference:</b> IR returns relevant material and the user still reads it; IE turns free text into structured data; QA returns the answer directly.</p>`,
      `<table><tr><th></th><th>استرجاع المعلومات</th><th>استخراج المعلومات</th><th>الإجابة عن الأسئلة</th></tr><tr><td>الهدف</td><td>إيجاد معلومات ذات صلة بالاستعلام</td><td>استخراج المفاهيم المهمة ووضعها في خانات قالب</td><td>الإجابة عن سؤال بإجابة قصيرة</td></tr><tr><td>المخرج</td><td>مستندات/معلومات ذات صلة</td><td>قالب مملوء (الدواء، الجرعة، التكرار) ويشمل الكيانات المسماة</td><td>إجابة قصيرة (مثل اسم دواء)</td></tr><tr><td>الصعوبة</td><td>متوسطة</td><td>صعبة</td><td>صعبة</td></tr></table><p><b>التشابه:</b> الثلاثة تجد معلومات مفيدة في النص. <b>الاختلاف:</b> الاسترجاع يعيد مادة ذات صلة وعلى المستخدم قراءتها، والاستخراج يحوّل النص الحر إلى بيانات منظمة، والإجابة عن الأسئلة تعيد الإجابة مباشرة.</p>`,
      [[`Correct goal of each`, `الهدف الصحيح لكل منها`], [`Correct output of each`, `المخرج الصحيح لكل منها`], [`At least one similarity and one difference`, `تشابه واختلاف واحد على الأقل`]],
      `2 marks per application`),
    E('List & explain', `Explain the levels of linguistic knowledge needed in NLP. Give an example for each.`, `اشرح مستويات المعرفة اللغوية اللازمة في NLP مع مثال لكل مستوى.`, 10,
      `<ol><li><b>Phonetics and phonology</b>: the study of linguistic sounds and their relations to words. Example: <i>there/their</i> and <i>ice cream/I scream</i> sound the same.</li><li><b>Morphology</b>: the study of the internal structure of words and how they can be modified, parsing complex words into their components. Example: a complex word split into its parts.</li><li><b>Syntax</b>: the study of the structural relationships between words in a sentence (parsing). Example: "I saw the man with a telescope" has two structures.</li><li><b>Pragmatics</b>: the social use of language; how language is used to accomplish goals and how context and world knowledge affect meaning. Example: "Give me the salt!" vs "Could you please give me the salt?"</li><li><b>Discourse</b>: the study of linguistic units larger than a single statement. Example: "John reads a book. He borrowed it from his friend." (He = John, it = the book).</li></ol><p>Semantics (meaning) is also named in the lecture's challenges: "The astronomer loves the star" (star in the sky or celebrity).</p>`,
      `<ol><li><b>الصوتيات والفونولوجيا</b>: دراسة الأصوات اللغوية وعلاقتها بالكلمات. مثال: <i>there/their</i> و<i>ice cream/I scream</i> متشابهة النطق.</li><li><b>الصرف</b>: دراسة البنية الداخلية للكلمات وكيفية تعديلها، وتحليل الكلمات المركبة إلى مكوناتها.</li><li><b>النحو</b>: دراسة العلاقات البنيوية بين الكلمات في الجملة (التحليل النحوي). مثال: "I saw the man with a telescope" لها بنيتان.</li><li><b>التداولية</b>: الاستخدام الاجتماعي للغة، وكيف يؤثر السياق والمعرفة بالعالم في المعنى. مثال: "أعطني الملح!" مقابل "هل يمكنك من فضلك أن تعطيني الملح؟"</li><li><b>الخطاب</b>: دراسة الوحدات اللغوية الأكبر من جملة واحدة. مثال: "John reads a book. He borrowed it from his friend."</li></ol><p>الدلالة (المعنى) مذكورة أيضًا في التحديات: "The astronomer loves the star" (نجم في السماء أم شخص مشهور).</p>`,
      [[`Five levels named with correct definitions`, `خمسة مستويات بتعريفات صحيحة`], [`A suitable example for each level`, `مثال مناسب لكل مستوى`], [`Order from sounds to discourse`, `الترتيب من الأصوات إلى الخطاب`]],
      `2 marks per level (definition + example)`),
    E('Describe & discuss', `Discuss paraphrasing and ambiguity as challenges for NLP, using examples at different linguistic levels.`, `ناقش إعادة الصياغة والغموض بوصفهما تحديين في NLP، مستخدمًا أمثلة من مستويات لغوية مختلفة.`, 10,
      `<p><b>Paraphrasing</b> means that different words or sentences express the same meaning. Examples: <i>Fall</i> and <i>Autumn</i> both mean the season; "When will my book arrive?" and "When will I receive my book?" ask the same question. A system must recognize that these different forms are equivalent.</p><p><b>Ambiguity</b> means that one word or sentence can have different meanings. Examples by level:</p><ul><li><b>Word level:</b> <i>Fall</i> = the third season, or moving down toward the ground.</li><li><b>Phonetics/phonology:</b> words that sound alike, such as there/their, weekend/weak end, ice cream/I scream.</li><li><b>Syntax:</b> "I saw the man with a telescope." Who had the telescope?</li><li><b>Semantics:</b> "The astronomer loves the star." A star in the sky or a celebrity?</li><li><b>Discourse:</b> "Sara said she talked to your sister, but she …" Does <i>she</i> refer to Sara or your sister?</li><li><b>Pragmatics:</b> "The door is open" can express a fact or a request to close the door.</li></ul><p><b>Conclusion.</b> Paraphrasing is many forms → one meaning; ambiguity is one form → many meanings. Both force NLP systems to use context, and they explain why tasks such as question answering and summarization remain difficult.</p>`,
      `<p><b>إعادة الصياغة</b> تعني أن كلمات أو جملًا مختلفة تعبّر عن المعنى نفسه. أمثلة: <i>Fall</i> و<i>Autumn</i> تعنيان الخريف، و"متى سيصل كتابي؟" و"متى سأستلم كتابي؟" سؤال واحد. يجب أن يدرك النظام أن هذه الأشكال متكافئة.</p><p><b>الغموض</b> يعني أن الكلمة أو الجملة الواحدة قد يكون لها معانٍ مختلفة. أمثلة حسب المستوى:</p><ul><li><b>مستوى الكلمة:</b> <i>Fall</i> = الخريف أو السقوط.</li><li><b>الصوتيات:</b> كلمات متشابهة النطق مثل there/their وice cream/I scream.</li><li><b>النحو:</b> "I saw the man with a telescope" — من كان يحمل المنظار؟</li><li><b>الدلالة:</b> "The astronomer loves the star" — نجم في السماء أم مشهور؟</li><li><b>الخطاب:</b> "Sara said she talked to your sister, but she …" — هل تعود <i>she</i> على سارة أم أختك؟</li><li><b>التداولية:</b> "الباب مفتوح" قد تكون تقريرًا لحقيقة أو طلبًا لإغلاق الباب.</li></ul><p><b>الخلاصة.</b> إعادة الصياغة: أشكال كثيرة ← معنى واحد، والغموض: شكل واحد ← معانٍ كثيرة. كلاهما يجبر أنظمة NLP على استخدام السياق، ويفسّران صعوبة مهام مثل الإجابة عن الأسئلة والتلخيص.</p>`,
      [[`Definition of paraphrasing + example`, `تعريف إعادة الصياغة مع مثال`], [`Definition of ambiguity + example`, `تعريف الغموض مع مثال`], [`Examples at 3+ levels (syntax, semantics, discourse…)`, `أمثلة من 3 مستويات أو أكثر`], [`Contrast: many→one vs one→many`, `المقارنة: كثير←واحد مقابل واحد←كثير`]],
      `Paraphrasing 3 · Ambiguity 2 · Levels 4 · Conclusion 1`),
    E('Explain how & why', `Explain part-of-speech tagging, parsing and word sense disambiguation. How does each help an NLP system?`, `اشرح وسم أقسام الكلام والتحليل النحوي وإزالة غموض معنى الكلمة. كيف تساعد كل تقنية نظام NLP؟`, 9,
      `<ol><li><b>Part-of-speech (POS) tagging</b> assigns a syntactic tag to each word in a sentence. Example: The/DT boy/NN went/VBD to/TO the/DT school/NN yesterday/NN. It tells the system the grammatical role of each word (noun, verb, determiner).</li><li><b>Parsing</b> builds the syntactic tree of a sentence. The lecture shows a phrase-structure tree (S, NP, VP, PP) and dependency relations such as nsubj(went, boy) and root(went). It shows how words relate to each other, which helps resolve structural ambiguity such as "I saw the man with a telescope".</li><li><b>Word sense disambiguation (WSD)</b> chooses the correct meaning of a word in its context. Example: the noun <i>interest</i> has six senses in LDOCE (readiness to give attention, a share in a company, money paid for the use of money, …). In "a 10% interest in Lager's technology" it means a share; in "interest rates" it means money paid for the use of money.</li></ol><p>Together these techniques move from word labels (POS) to sentence structure (parsing) to word meaning (WSD), giving applications such as translation and question answering the information they need.</p>`,
      `<ol><li><b>وسم أقسام الكلام</b> يسند وسمًا نحويًّا لكل كلمة في الجملة. مثال: The/DT boy/NN went/VBD ... ويخبر النظام بالدور النحوي لكل كلمة (اسم، فعل، أداة تعريف).</li><li><b>التحليل النحوي</b> يبني الشجرة النحوية للجملة. تعرض المحاضرة شجرة بنيوية (S وNP وVP وPP) وعلاقات اعتماد مثل nsubj(went, boy). ويوضح كيف ترتبط الكلمات ببعضها، مما يساعد في حل الغموض البنيوي مثل "I saw the man with a telescope".</li><li><b>إزالة غموض معنى الكلمة</b> تختار المعنى الصحيح للكلمة حسب سياقها. مثال: الاسم <i>interest</i> له ستة معانٍ في LDOCE (الاستعداد للانتباه، حصة في شركة، المال المدفوع مقابل استخدام المال...). في "a 10% interest" تعني حصة، وفي "interest rates" تعني الفائدة المالية.</li></ol><p>تنتقل هذه التقنيات معًا من وسوم الكلمات إلى بنية الجملة إلى معنى الكلمة، فتوفر لتطبيقات مثل الترجمة والإجابة عن الأسئلة المعلومات التي تحتاجها.</p>`,
      [[`POS tagging definition + tagged example`, `تعريف وسم أقسام الكلام مع مثال`], [`Parsing definition + tree/dependency`, `تعريف التحليل النحوي مع شجرة`], [`WSD definition + "interest" example`, `تعريف WSD مع مثال interest`], [`How each helps a system`, `كيف تساعد كل تقنية`]],
      `3 marks per technique`),
    E('Scenario', `A hospital wants a system that reads doctors' discharge notes and automatically fills a table with each patient's medication, dosage, frequency and duration. Which NLP application is this? Which challenges might the system face?`, `يريد مستشفى نظامًا يقرأ ملاحظات خروج المرضى ويملأ تلقائيًّا جدولًا بالدواء والجرعة والتكرار والمدة لكل مريض. ما تطبيق NLP المناسب؟ وما التحديات التي قد يواجهها النظام؟`, 8,
      `<p><b>Application.</b> This is <b>information extraction</b>: extracting important concepts from texts and assigning them to slots in a certain template. The lecture's Lancet example does exactly this, labelling medication, dosage, manner, frequency, duration and reason in clinical text. Named-entity recognition is part of it, because drug names must be recognized.</p><p><b>Difficulty.</b> The lecture classifies information extraction as <b>difficult (still hard)</b>.</p><p><b>Challenges.</b></p><ul><li><b>Paraphrasing:</b> the same instruction can be written in many ways (for example "twice a day" and "b.i.d."), and all must fill the same slot.</li><li><b>Ambiguity:</b> a word may have several meanings, so the system needs word sense disambiguation.</li><li><b>Discourse:</b> a drug may be named in one sentence and referred to as "it" in the next.</li><li><b>Preprocessing:</b> the notes must be split into sections and sentences before analysis.</li></ul>`,
      `<p><b>التطبيق.</b> هذا <b>استخراج المعلومات</b>: استخراج المفاهيم المهمة من النصوص ووضعها في خانات قالب محدد. ومثال Lancet في المحاضرة يفعل ذلك تمامًا، إذ يحدد الدواء والجرعة والطريقة والتكرار والمدة والسبب في النصوص الطبية. والتعرّف على الكيانات المسماة جزء منه، لأن أسماء الأدوية يجب التعرف عليها.</p><p><b>الصعوبة.</b> تصنّف المحاضرة استخراج المعلومات ضمن <b>المهام الصعبة</b>.</p><p><b>التحديات.</b></p><ul><li><b>إعادة الصياغة:</b> قد تُكتب التعليمة نفسها بطرق كثيرة (مثل "twice a day" و"b.i.d.") ويجب أن تملأ الخانة نفسها.</li><li><b>الغموض:</b> قد يكون للكلمة عدة معانٍ، فيحتاج النظام إلى إزالة غموض المعنى.</li><li><b>الخطاب:</b> قد يُذكر الدواء في جملة ويُشار إليه بـ "it" في الجملة التالية.</li><li><b>المعالجة المسبقة:</b> يجب تقسيم الملاحظات إلى أقسام وجمل قبل التحليل.</li></ul>`,
      [[`Identifies information extraction (+ NER)`, `تحديد استخراج المعلومات`], [`Template/slot idea and Lancet link`, `فكرة القالب والخانات`], [`States it is "difficult"`, `ذكر أنه من المهام الصعبة`], [`Two or more relevant challenges explained`, `شرح تحديين أو أكثر`]],
      `Application 3 · Difficulty 1 · Challenges 4`),
    E('Scenario', `A voice assistant hears the sentence "The door is open" from a user who is sitting near an open door on a cold day. Explain, using linguistic knowledge levels, why understanding this sentence is difficult.`, `يسمع مساعد صوتي جملة "الباب مفتوح" من مستخدم يجلس قرب باب مفتوح في يوم بارد. اشرح باستخدام مستويات المعرفة اللغوية لماذا يصعب فهم هذه الجملة.`, 6,
      `<p>The voice assistant must first convert the audio into text (speech recognition), which relies on <b>phonetics and phonology</b>. Then <b>syntax</b> shows that the sentence is a simple statement.</p><p>However, the meaning depends on <b>pragmatics</b>, the social use of language and the influence of context on meaning. The lecture states that "The door is open" can be expressing a fact or a request to close the door. On a cold day the user most likely means "please close the door". The words alone do not give the intended meaning; the assistant needs situation and world knowledge. This is an example of <b>ambiguity</b>: one sentence with different meanings, similar to "Give me the salt!" vs "Could you please give me the salt?", where the social use changes how the sentence is understood.</p>`,
      `<p>يجب على المساعد أولًا تحويل الصوت إلى نص (التعرف على الكلام) وهذا يعتمد على <b>الصوتيات والفونولوجيا</b>. ثم يبيّن <b>النحو</b> أن الجملة خبرية بسيطة.</p><p>لكن المعنى يعتمد على <b>التداولية</b>، أي الاستخدام الاجتماعي للغة وتأثير السياق على المعنى. تذكر المحاضرة أن "الباب مفتوح" قد تعبّر عن حقيقة أو عن طلب لإغلاق الباب. وفي يوم بارد يقصد المستخدم غالبًا "من فضلك أغلق الباب". الكلمات وحدها لا تعطي المعنى المقصود، بل يحتاج المساعد إلى معرفة الموقف والعالم. وهذا مثال على <b>الغموض</b>: جملة واحدة بمعانٍ مختلفة، كما في "أعطني الملح!" مقابل "هل يمكنك من فضلك أن تعطيني الملح؟".</p>`,
      [[`Identifies pragmatics as the key level`, `تحديد التداولية كمستوى أساسي`], [`Fact vs request interpretation`, `تفسير الحقيقة مقابل الطلب`], [`Context / world knowledge needed`, `الحاجة إلى السياق والمعرفة بالعالم`], [`Mentions speech recognition / phonology step`, `ذكر خطوة التعرف على الكلام`]],
      `Pragmatics 3 · Ambiguity 2 · Other levels 1`)
  ],
