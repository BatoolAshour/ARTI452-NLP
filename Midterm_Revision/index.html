LESSONS.c3s1 = {
  big: [`A language model is a word predictor. Given what has been said so far, it says how likely each possible next word is. That one skill, predicting the next word, turns out to teach a model a lot about language.`, `النموذج اللغوي متنبئ بالكلمات: بمعلومية ما قيل حتى الآن، يقول ما احتمال كل كلمة تالية ممكنة. وهذه المهارة الواحدة تعلّم النموذج الكثير عن اللغة.`],
  think: [`"The water of Walden Pond is so beautifully …" Rank these next words from most to least likely: refrigerator, blue, clear, green.`, `"The water of Walden Pond is so beautifully …" رتّب الكلمات التالية من الأكثر للأقل احتمالًا: refrigerator وblue وclear وgreen.`, `blue, clear and green are all likely; refrigerator is very unlikely. You just acted as a language model: you assigned higher probability to words that fit the context.`, `blue وclear وgreen محتملة وrefrigerator غير محتملة. لقد تصرفت كنموذج لغوي: أعطيت احتمالًا أعلى للكلمات المناسبة للسياق.`],
  steps: [
    [`<b>Speech recognition:</b> prefer "back soonish" over "bassoon dish" when the audio is unclear.`, `<b>التعرف على الكلام:</b> تفضيل "back soonish" على "bassoon dish".`],
    [`<b>Spelling and grammar:</b> prefer "There are" over "Their are", because the sentence probability is higher.`, `<b>الإملاء والقواعد:</b> تفضيل "There are" على "Their are".`],
    [`<b>Autocomplete / AAC:</b> suggest likely words to reduce typing or support communication.`, `<b>الإكمال التلقائي:</b> اقتراح كلمات محتملة.`],
    [`<b>Modern LMs:</b> generate text by predicting the next token again and again (Week 7).`, `<b>النماذج الحديثة:</b> تولّد النص بالتنبؤ المتكرر بالرمز التالي.`]
  ],
  remember: [`An LM predicts P(next word | previous context). That helps speech recognition, spelling correction, autocomplete and modern text generation.`, `النموذج اللغوي يتنبأ بـ P(الكلمة التالية | السياق)، وهذا يفيد التعرف على الكلام والتصحيح والإكمال والتوليد.`]
};

LESSONS.c3s2 = {
  big: [`A language model estimates two connected things: the probability of the <b>next word given a history</b>, P(w | h), and the probability of a <b>whole sentence</b>, P(w₁, …, wₙ). The second is built from the first.`, `يقدّر النموذج اللغوي أمرين مترابطين: احتمال <b>الكلمة التالية بمعلومية التاريخ</b> P(w | h)، واحتمال <b>الجملة كاملة</b> P(w₁…wₙ)، والثاني مبني من الأول.`],
  steps: [
    [`<b>P(w | h):</b> w is a candidate next word, h is the history. Example: P(help | thank you for your).`, `<b>P(w | h):</b> w الكلمة المرشحة وh التاريخ، مثل P(help | thank you for your).`],
    [`<b>P(w₁, …, wₙ):</b> the probability of a complete sequence, used to compare candidate sentences or to score a test set.`, `<b>P(w₁…wₙ):</b> احتمال سلسلة كاملة لمقارنة الجمل أو تقييم مجموعة اختبار.`]
  ],
  check: [`Comparing "There are" with "Their are" uses which quantity?`, `مقارنة "There are" مع "Their are" تستخدم أي كمية؟`, [`Next-word probability only`, `Sentence probability`, `Vocabulary size`, `Perplexity of the training set`], 1, `We score each complete candidate sentence and pick the more probable one.`, `نقيّم كل جملة مرشحة كاملة ونختار الأكثر احتمالًا.`],
  remember: [`LM = probabilities for next words P(w | h) or whole sequences P(w₁…wₙ).`, `النموذج اللغوي = احتمال الكلمة التالية أو السلسلة كاملة.`]
};

LESSONS.c3s3 = {
  big: [`Why not just count how often "blue" followed the <i>whole</i> phrase "The water of Walden Pond is so beautifully"? Because long phrases are rare: that exact phrase may never appear, even in a huge corpus. Counts on long histories are zero or unreliable.`, `لماذا لا نعدّ كم مرة جاءت blue بعد العبارة <i>كاملة</i>؟ لأن العبارات الطويلة نادرة وقد لا تظهر أبدًا حتى في مدونة ضخمة، فتكون أعداد التواريخ الطويلة صفرًا أو غير موثوقة.`],
  steps: [
    [`The exact long phrase may never appear in the corpus.`, `قد لا تظهر العبارة الطويلة نفسها أبدًا.`],
    [`Even if it appears once, one observation is not a stable estimate.`, `وحتى إن ظهرت مرة، فظهور واحد لا يعطي تقديرًا مستقرًّا.`],
    [`<b>Solution:</b> approximate the history with only the last n − 1 words. That is what n-grams do (next topics).`, `<b>الحل:</b> تقريب التاريخ بآخر n − 1 كلمات فقط، وهذا ما تفعله n-grams.`]
  ],
  remember: [`Full histories are too sparse to count reliably, so we keep only the last n − 1 words.`, `التواريخ الكاملة نادرة جدًّا، فنحتفظ بآخر n − 1 كلمات فقط.`]
};

LESSONS.c3s4 = {
  big: [`An <b>n-gram</b> is simply a run of n consecutive tokens. An n-gram model predicts the next token from the previous n − 1 tokens.`, `<b>n-gram</b> سلسلة من n رموز متتالية، ونموذج n-gram يتنبأ بالرمز التالي من آخر n − 1 رموز.`],
  steps: [
    [`<b>Unigram (n = 1):</b> "homework": no history at all.`, `<b>أحادي:</b> "homework" بلا تاريخ.`],
    [`<b>Bigram (n = 2):</b> "your homework": uses the previous 1 word.`, `<b>ثنائي:</b> "your homework" يستخدم كلمة واحدة سابقة.`],
    [`<b>Trigram (n = 3):</b> "turn your homework": uses the previous 2 words.`, `<b>ثلاثي:</b> "turn your homework" يستخدم كلمتين.`],
    [`Tokens can be words, punctuation or subword pieces, depending on the tokenizer (Week 2).`, `الرموز قد تكون كلمات أو علامات ترقيم أو وحدات فرعية.`]
  ],
  check: [`A trigram model predicts the next word using:`, `نموذج الثلاثي يتنبأ بالكلمة التالية باستخدام:`, [`No history`, `The previous 1 word`, `The previous 2 words`, `The previous 3 words`], 2, `n = 3, so it uses n − 1 = 2 previous words.`, `n = 3 فيستخدم n − 1 = 2.`],
  remember: [`n-gram = n consecutive tokens; the model uses the previous n − 1.`, `n-gram = n رموز متتالية، والنموذج يستخدم آخر n − 1.`]
};

LESSONS.c3s5 = {
  big: [`The <b>Markov assumption</b> is the trick that makes n-grams work: pretend that only the recent words matter for predicting the next one. P(wₙ | w₁…wₙ₋₁) ≈ P(wₙ | wₙ₋ₙ₊₁…wₙ₋₁).`, `<b>افتراض ماركوف</b> هو الحيلة التي تجعل n-grams تعمل: نفترض أن الكلمات القريبة فقط تهم في التنبؤ بالتالية.`],
  analogy: [`Like a forgetful friend who finishes your sentences using only your last word or two. Usually they are right, but they miss a joke that depended on something you said a minute ago.`, `مثل صديق كثير النسيان يكمل جملك من آخر كلمة أو كلمتين؛ غالبًا يصيب، لكنه يفوّت نكتة اعتمدت على شيء قلته قبل دقيقة.`],
  steps: [
    [`Unigram: no history. Bigram: the previous word. Trigram: the previous two words.`, `أحادي بلا تاريخ، وثنائي كلمة سابقة، وثلاثي كلمتان.`],
    [`It is an <b>approximation</b>, not a claim that older words never matter.`, `إنه <b>تقريب</b> وليس ادعاءً بأن الكلمات الأقدم لا تهم.`],
    [`<b>Its weakness:</b> long-distance dependencies. In "The computer … on the fifth floor crashed", <i>crashed</i> depends on <i>computer</i>, which is far outside a short window.`, `<b>نقطة ضعفه:</b> الاعتماديات البعيدة: crashed تعتمد على computer البعيدة.`]
  ],
  check: [`Why does the Markov assumption struggle with "The computer … on the fifth floor crashed"?`, `لماذا يتعثر افتراض ماركوف مع هذه الجملة؟`, [`The sentence has no verb`, `"crashed" depends on a word far outside the short history`, `The sentence is too short`, `It has unknown words`], 1, `A bigram or trigram only sees "floor" before "crashed".`, `الثنائي أو الثلاثي يرى floor فقط قبل crashed.`],
  remember: [`Markov: only the last n − 1 words matter. It is an approximation that misses long-distance dependencies.`, `ماركوف: آخر n − 1 كلمات فقط، وهو تقريب يفوّت الاعتماديات البعيدة.`],
  teach: [`State the Markov assumption and give its main limitation with the lecture's example.`, `اذكر افتراض ماركوف وقيده الرئيسي مع مثال المحاضرة.`, `The Markov assumption approximates the full history by the recent context: P(wₙ | w₁…wₙ₋₁) ≈ P(wₙ | wₙ₋ₙ₊₁…wₙ₋₁), so a bigram uses only the previous word and a trigram the previous two. It is an approximation, not a claim that older words never matter. Its limitation is long-distance dependencies: in "The computer … on the fifth floor crashed", the verb depends on "computer", which a short window cannot see.`, `يقرّب افتراض ماركوف التاريخ بالسياق القريب، فالثنائي يستخدم كلمة واحدة. وهو تقريب، وقيده الاعتماديات البعيدة كما في مثال computer … crashed.`]
};

LESSONS.c3s6 = {
  big: [`How do we get the probability of a whole sentence? The <b>chain rule</b> says: multiply the probability of each word given everything before it. The Markov assumption then shortens each "everything before it" to just the previous word (bigram).`, `كيف نحصل على احتمال جملة كاملة؟ <b>قاعدة السلسلة</b> تقول: اضرب احتمال كل كلمة بمعلومية كل ما قبلها، ثم يختصر افتراض ماركوف "كل ما قبلها" إلى الكلمة السابقة فقط.`],
  links: ['c3s5'],
  steps: [
    [`<b>Exact (chain rule):</b> P(w₁:ₙ) = Πᵢ P(wᵢ | w₁:ᵢ₋₁).`, `<b>الدقيق:</b> P(w₁:ₙ) = Πᵢ P(wᵢ | w₁:ᵢ₋₁).`],
    [`<b>Bigram approximation:</b> P(w₁:ₙ) ≈ Πᵢ P(wᵢ | wᵢ₋₁).`, `<b>التقريب الثنائي:</b> P(w₁:ₙ) ≈ Πᵢ P(wᵢ | wᵢ₋₁).`],
    [`<b>Unigram:</b> P(w₁)P(w₂)…: robust counts, weak coherence. <b>Bigram:</b> better local fluency. <b>Trigram:</b> more context, more sparsity.`, `<b>الأحادي:</b> عدّ مستقر وترابط ضعيف. <b>الثنائي:</b> سلاسة محلية أفضل. <b>الثلاثي:</b> سياق أكثر وتشتت أكثر.`]
  ],
  check: [`In the bigram approximation, each factor is:`, `في التقريب الثنائي، كل عامل هو:`, [`P(wᵢ)`, `P(wᵢ | wᵢ₋₁)`, `P(wᵢ | w₁:ᵢ₋₁)`, `P(wᵢ₋₁ | wᵢ)`], 1, `Each word is conditioned only on the previous word.`, `كل كلمة مشروطة بالكلمة السابقة فقط.`],
  remember: [`Sentence probability = multiply each word's probability given its allowed context. Bigram: Π P(wᵢ | wᵢ₋₁).`, `احتمال الجملة = حاصل ضرب احتمال كل كلمة بمعلومية سياقها المسموح.`]
};

LESSONS.c3s7 = {
  big: [`Where do the probabilities come from? <b>Counting.</b> To estimate P(am | I), count how often "I am" occurs and divide by how often "I" occurs. This is <b>maximum likelihood estimation (MLE)</b>.`, `من أين تأتي الاحتمالات؟ <b>من العدّ.</b> لتقدير P(am | I) نعدّ "I am" ونقسم على عدد مرات "I". هذا <b>التقدير بأقصى احتمالية</b>.`],
  steps: [
    [`From conditional probability, P(A | B) = C(B, A) / C(B).`, `من الاحتمال الشرطي: P(A | B) = C(B, A) / C(B).`],
    [`With words: <b>P(wᵢ | wᵢ₋₁) = C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁)</b>.`, `مع الكلمات: <b>P(wᵢ | wᵢ₋₁) = C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁)</b>.`],
    [`The numerator counts the bigram; the <b>denominator counts the history word</b>, not the whole sentence and not the candidate word.`, `البسط يعدّ الثنائي، و<b>المقام يعدّ كلمة التاريخ</b> وليس الجملة ولا الكلمة المرشحة.`],
    [`&lt;s&gt; and &lt;/s&gt; mark the start and end of each sentence, so the first word has a history and the end of a sentence can be predicted.`, `&lt;s&gt; و&lt;/s&gt; تحددان بداية الجملة ونهايتها.`]
  ],
  analogy: [`Imagine you note what your friend orders after saying "I'll have…". Out of 10 times, 7 were coffee. Your best guess for P(coffee | I'll have) is 7/10: the count of the pair divided by the count of the history.`, `تخيّل أنك تسجّل ماذا يطلب صديقك بعد قوله "I'll have…": من 10 مرات طلب القهوة 7، فأفضل تقدير 7/10: عدد الزوج ÷ عدد التاريخ.`],
  confuse: { a: [`Right denominator`, `C(history), e.g. C(I) = 3 for P(am | I).`, `عدد التاريخ مثل C(I) = 3.`], b: [`Wrong denominators`, `Total words in the corpus, or the count of the candidate word "am".`, `عدد كلمات المدونة أو عدد الكلمة المرشحة.`], why: [`The probability answers "of all the times we saw the history, how often did this word follow?", so the history count goes underneath.`, `الاحتمال يجيب: "من كل مرات رؤية التاريخ، كم مرة تلته هذه الكلمة؟"، لذا يكون عدد التاريخ في المقام.`] },
  check: [`In the "I am Sam" corpus, "I" occurs 3 times and "I am" occurs 2 times. P(am | I) = ?`, `في مدونة "I am Sam" تظهر I ثلاث مرات وI am مرتين. P(am | I) = ؟`, [`2/3`, `1/3`, `2/11`, `3/2`], 0, `C(I am) / C(I) = 2/3.`, `2/3.`],
  remember: [`MLE bigram: P(wᵢ | wᵢ₋₁) = C(wᵢ₋₁ wᵢ) / C(wᵢ₋₁). The denominator is the history count.`, `تقدير الثنائي: عدد الثنائي ÷ عدد التاريخ.`]
};

LESSONS.c3s8 = {
  big: [`Put it together on the lecture's practice corpus. Every number here is a count divided by a count, and a sentence's probability is the product of its bigram probabilities.`, `لنطبّق ذلك على مدونة التمرين: كل رقم عدّ مقسوم على عدّ، واحتمال الجملة حاصل ضرب احتمالات ثنائياتها.`],
  links: ['c3s7'],
  action: { w: 'bigram', cfg: { corpus: 'I like NLP\nI like AI\nAI is useful', sentence: 'I like NLP', add1: false }, cap: [`Slides 15–16. The table shows each factor; the sentence probability should be 1/3. Then try "I like AI NLP" to meet a zero.`, `الشريحتان 15–16: احتمال الجملة يجب أن يكون 1/3، ثم جرّب "I like AI NLP" لترى الصفر.`] },
  steps: [
    [`P(I | &lt;s&gt;) = 2/3, because 2 of the 3 sentences start with I.`, `P(I | &lt;s&gt;) = 2/3.`],
    [`P(like | I) = 2/2 = 1. P(AI | like) = 1/2. P(NLP | AI) = 0/2 = 0, because "AI NLP" never occurs.`, `P(like | I) = 1، وP(AI | like) = 1/2، وP(NLP | AI) = 0.`],
    [`P(&lt;s&gt; I like NLP &lt;/s&gt;) = 2/3 × 1 × 1/2 × 1 = <b>1/3 ≈ 0.333</b>.`, `احتمال الجملة = 1/3.`]
  ],
  check: [`What is P(AI | like) in the practice corpus?`, `ما P(AI | like) في مدونة التمرين؟`, [`1`, `1/2`, `1/3`, `0`], 1, `"like" occurs 2 times, followed once by "AI".`, `like تظهر مرتين وتليها AI مرة واحدة.`],
  remember: [`P(like | I) = 1, P(AI | like) = 1/2, P(NLP | AI) = 0; P(&lt;s&gt; I like NLP &lt;/s&gt;) = 1/3.`, `القيم 1 و1/2 و0، واحتمال الجملة 1/3.`]
};

LESSONS.c3s9 = {
  big: [`Multiplying many small probabilities gives numbers so tiny that a computer rounds them to zero (<b>underflow</b>). The fix: add <b>log probabilities</b> instead of multiplying probabilities. log(p₁ × p₂ × …) = log p₁ + log p₂ + …`, `ضرب احتمالات صغيرة كثيرة يعطي أرقامًا صغيرة جدًّا يقرّبها الحاسوب إلى صفر (<b>تجاوز سفلي</b>). الحل: جمع <b>لوغاريتمات الاحتمالات</b> بدل الضرب.`],
  check: [`Why do language models store log probabilities?`, `لماذا تخزّن النماذج لوغاريتمات الاحتمالات؟`, [`To make probabilities larger than 1`, `To avoid numerical underflow by adding instead of multiplying`, `To remove zeros`, `To compute perplexity faster only`], 1, `The product of many small numbers underflows; a sum of logs does not.`, `حاصل ضرب أرقام صغيرة كثيرة يتجاوز سفليًّا، ومجموع اللوغاريتمات لا يفعل.`],
  remember: [`Multiply many small probabilities → underflow. Use logs: add instead of multiply.`, `الضرب يسبب تجاوزًا سفليًّا، فنجمع اللوغاريتمات.`]
};

LESSONS.c3s10 = {
  big: [`Should we use bigrams, trigrams or 5-grams? More context gives more fluent local predictions, but the number of possible contexts explodes, so more of them are never seen in training: more <b>zero counts</b>. Higher n is better only with enough data and smoothing.`, `هل نستخدم الثنائي أم الثلاثي أم أكثر؟ السياق الأكثر يعطي سلاسة محلية أفضل، لكن عدد السياقات الممكنة ينفجر فلا يُرى كثير منها: <b>أصفار</b> أكثر. N الأعلى أفضل فقط مع بيانات كافية وتنعيم.`],
  analogy: [`Like predicting traffic: knowing the hour helps a lot; also knowing the exact street, weather and day helps more, but you will rarely have past data for that exact combination.`, `مثل التنبؤ بالزحام: معرفة الساعة تساعد، ومعرفة الشارع والطقس واليوم تساعد أكثر، لكن نادرًا ما تملك بيانات سابقة لهذه التركيبة بالضبط.`],
  remember: [`Higher n → better local fluency but more zero counts (sparsity).`, `N أعلى ← سلاسة أفضل وأصفار أكثر.`]
};

LESSONS.c3s11 = {
  big: [`To judge a model fairly, it must be tested on text it has never seen. So the data is split: <b>training</b> (≈80%) to count n-grams, <b>development</b> (≈10%) to tune choices such as smoothing, and <b>test</b> (≈10%) for the final evaluation.`, `لتقييم النموذج بعدل يجب اختباره على نص لم يره، لذا تُقسم البيانات: <b>تدريب</b> (≈80%) للعدّ، و<b>تطوير</b> (≈10%) لضبط الخيارات، و<b>اختبار</b> (≈10%) للتقييم النهائي.`],
  analogy: [`It is like studying with past papers but keeping one exam paper sealed. If you peek at the sealed paper while studying, your score on it no longer tells you how well you really know the material.`, `مثل المذاكرة بأسئلة سابقة مع إبقاء ورقة امتحان مغلقة؛ إذا نظرت إليها أثناء المذاكرة فلن تخبرك درجتك فيها بمستواك الحقيقي.`],
  remember: [`Train ≈80% (counts), dev ≈10% (tuning), test ≈10% (final). Never train on the test set.`, `تدريب وتطوير واختبار، ولا تدرب على الاختبار أبدًا.`]
};

LESSONS.c3s12 = {
  big: [`There are two ways to check whether a language model is good. <b>Intrinsic</b>: measure the model directly (perplexity), which is fast and cheap. <b>Extrinsic</b>: plug it into a real task and see whether the task improves (e.g. speech recognition accuracy), which is realistic but expensive.`, `هناك طريقتان للتحقق من جودة النموذج: <b>داخلي</b> بقياس النموذج مباشرة (الحيرة) وهو سريع ورخيص، و<b>خارجي</b> بوضعه في مهمة حقيقية ورؤية تحسّنها، وهو واقعي لكنه مكلف.`],
  confuse: { a: [`Intrinsic`, `Measures the model on its own. Classic metric: perplexity. Fast, cheap, reusable.`, `يقيس النموذج وحده بالحيرة؛ سريع ورخيص.`], b: [`Extrinsic`, `Measures improvement in a real task, e.g. speech recognition accuracy. Realistic but expensive.`, `يقيس تحسّن مهمة حقيقية؛ واقعي لكنه مكلف.`], why: [`"In" = inside the model itself; "ex" = outside, in an application.`, `"داخلي" داخل النموذج نفسه، و"خارجي" في تطبيق.`] },
  check: [`Measuring how much a new LM improves a speech recognizer's word accuracy is:`, `قياس تحسّن دقة نظام التعرف على الكلام بنموذج جديد هو تقييم:`, [`Intrinsic`, `Extrinsic`, `Smoothing`, `Perplexity`], 1, `The model is evaluated inside a real application.`, `يُقيَّم النموذج داخل تطبيق حقيقي.`],
  remember: [`Intrinsic = model alone (perplexity, cheap). Extrinsic = inside a task (realistic, expensive).`, `الداخلي = النموذج وحده، والخارجي = داخل مهمة.`]
};

LESSONS.c3s13 = {
  big: [`<b>Perplexity</b> turns "how probable is the test text?" into an easy-to-read number: roughly <b>how many words the model is choosing between</b> at each step. A perplexity of 3 means the model is about as unsure as if it were picking among 3 equally likely words. <b>Lower is better.</b>`, `<b>الحيرة</b> تحوّل "ما احتمال نص الاختبار؟" إلى رقم سهل القراءة: تقريبًا <b>بين كم كلمة يختار النموذج</b> في كل خطوة. حيرة 3 تعني أنه متردد كأنه يختار بين 3 كلمات متساوية. <b>الأقل أفضل.</b>`],
  links: ['c3s12'],
  steps: [
    [`<b>Formula:</b> PP(W) = P(w₁…w_N)^(−1/N): the inverse probability of the test set, normalized by its length N.`, `<b>الصيغة:</b> PP(W) = P(W)^(−1/N): مقلوب الاحتمال مطبَّعًا بالطول.`],
    [`<b>Why inverse?</b> A higher probability for real text means a better model, and inverting makes "better" a smaller number.`, `<b>لماذا المقلوب؟</b> الاحتمال الأعلى يعني نموذجًا أفضل، والمقلوب يجعل "الأفضل" رقمًا أصغر.`],
    [`<b>Why the 1/N power?</b> It averages per word, so long and short texts can be compared.`, `<b>لماذا الأس 1/N؟</b> يحسب المتوسط لكل كلمة فيمكن مقارنة النصوص الطويلة والقصيرة.`],
    [`<b>Example:</b> 0.50 × 0.25 × 0.25 = 0.03125; 0.03125^(−1/3) ≈ <b>3.17</b> choices per word.`, `<b>مثال:</b> 0.03125^(−1/3) ≈ 3.17.`],
    [`<b>In practice:</b> unigram 962, bigram 170, trigram 109 on one test set. Compare only on the same test set and tokenisation.`, `<b>عمليًّا:</b> 962 و170 و109، وقارن فقط على مجموعة الاختبار والترميز نفسيهما.`]
  ],
  action: { w: 'ppl', cfg: { p: '0.5, 0.25, 0.25', presets: ['0.5, 0.25, 0.25', '0.9, 0.9, 0.9', '0.1, 0.1, 0.1', '0.8, 0.2'] }, cap: [`Change the probabilities and watch perplexity. Confident, correct predictions push it toward 1.`, `غيّر الاحتمالات وراقب الحيرة؛ التنبؤات الواثقة الصحيحة تقربها من 1.`] },
  analogy: [`Like a quiz-show contestant: perplexity 2 is like always narrowing it to two answers; perplexity 100 is like guessing among a hundred.`, `مثل متسابق في مسابقة: حيرة 2 كأنه يحصر الإجابة دائمًا في خيارين، وحيرة 100 كأنه يخمن بين مئة.`],
  check: [`Model A has perplexity 120 and model B 150 on the same test set. Which is better?`, `النموذج A حيرته 120 وB حيرته 150 على الاختبار نفسه. أيهما أفضل؟`, [`A`, `B`, `They are equal`, `Cannot compare perplexities`], 0, `Lower perplexity = higher probability on the real test text.`, `الحيرة الأقل = احتمال أعلى للنص الحقيقي.`],
  remember: [`PP(W) = P(W)^(−1/N) ≈ average number of choices per word. Lower is better; compare on the same test set and tokenisation.`, `الحيرة = متوسط عدد الخيارات لكل كلمة؛ الأقل أفضل.`],
  teach: [`Explain perplexity to a classmate without using the formula first, then give the formula and the 3.17 example.`, `اشرح الحيرة لزميل دون الصيغة أولًا، ثم أعطِ الصيغة ومثال 3.17.`, `Perplexity measures how surprised a model is by real test text: roughly the average number of plausible choices it is choosing between at each word. Lower means better predictions. Formally PP(W) = P(w₁…w_N)^(−1/N), the inverse probability of the test set normalized by length. If the model gives the three test words probabilities 0.5, 0.25 and 0.25, P(W) = 0.03125 and PP = 0.03125^(−1/3) ≈ 3.17. Models must be compared on the same test set and tokenisation.`, `الحيرة تقيس مدى تفاجؤ النموذج بالنص الحقيقي: متوسط عدد الخيارات المعقولة لكل كلمة، والأقل أفضل. وصيغتها P(W)^(−1/N)، ومثالها ≈ 3.17، وتُقارن على نفس الاختبار والترميز.`]
};

LESSONS.c3s14 = {
  big: [`A model can only sound like its data. Train on SMS messages to model SMS; train on legal documents to model legal text. Training on Shakespeare and testing on news gives poor probabilities, because genre, dialect and topic coverage shape the model.`, `النموذج لا يشبه إلا بياناته: درّب على الرسائل لنمذجة الرسائل، وعلى الوثائق القانونية للنصوص القانونية. التدريب على شكسبير والاختبار على الأخبار يعطي احتمالات ضعيفة.`],
  remember: [`Match the training domain to the test domain (SMS → SMS).`, `طابق مجال التدريب مع مجال الاختبار.`]
};

LESSONS.c3s15 = {
  big: [`Here is the biggest weakness of counting: anything never seen gets probability <b>zero</b>. And because sentence probability is a product, <b>one zero makes the whole sentence impossible</b>, even if every other word fits perfectly.`, `أكبر نقطة ضعف للعدّ: أي شيء لم يُرَ يحصل على <b>صفر</b>. ولأن احتمال الجملة حاصل ضرب، <b>صفر واحد يجعل الجملة كلها مستحيلة</b>.`],
  think: [`Training has "denied the allegations / reports / claims / request". Under raw MLE, what is P(offer | denied the)? Is that reasonable?`, `التدريب فيه "denied the allegations / reports / claims / request". ما P(offer | denied the) بالتقدير الخام؟ وهل هذا معقول؟`, `It is 0, because "denied the offer" never appeared. That is not reasonable: "denied the offer" is a perfectly normal phrase. A good model should give it a small probability, not zero.`, `صفر لأن "denied the offer" لم تظهر، وهذا غير معقول فالعبارة طبيعية، والنموذج الجيد يعطيها احتمالًا صغيرًا لا صفرًا.`],
  action: { w: 'bigram', cfg: { corpus: 'I like NLP\nI like AI\nAI is useful', sentence: 'I like AI NLP', add1: false }, cap: [`"AI NLP" never occurs in training, so this sentence gets probability 0 and perplexity cannot be computed. Keep this in mind for smoothing.`, `"AI NLP" لم تظهر في التدريب فاحتمال الجملة صفر ولا تُحسب الحيرة.`] },
  remember: [`Unseen n-gram → P = 0 → whole sentence P = 0. A good model gives small, not zero, probability.`, `n-gram غير مرئي ← صفر ← الجملة كلها صفر.`]
};

LESSONS.c3s16 = {
  big: [`Zero counts are about known words in a new combination. <b>Unknown words</b> are a different problem: the word itself is not in the vocabulary at all. The standard trick is a special token, <b>&lt;UNK&gt;</b>, that stands for "any word we don't know".`, `مشكلة الأصفار تخص كلمات معروفة في تركيبة جديدة. أما <b>الكلمات المجهولة</b> فمشكلة مختلفة: الكلمة نفسها ليست في المفردات. والحل رمز خاص <b>&lt;UNK&gt;</b> يعني "أي كلمة لا نعرفها".`],
  steps: [
    [`<b>Closed vocabulary:</b> all test words are known in advance, so there are no OOV words. Useful in constrained tasks.`, `<b>المفردات المغلقة:</b> كل كلمات الاختبار معروفة مسبقًا.`],
    [`<b>Open vocabulary:</b> new words may appear at test time. The <b>OOV rate</b> = the percentage of test tokens outside the vocabulary.`, `<b>المفردات المفتوحة:</b> قد تظهر كلمات جديدة، و<b>نسبة OOV</b> = نسبة رموز الاختبار خارج المفردات.`],
    [`<b>&lt;UNK&gt; recipe:</b> choose a vocabulary → replace rare / out-of-vocabulary training words with &lt;UNK&gt; → estimate &lt;UNK&gt;'s probability like any other token.`, `<b>طريقة &lt;UNK&gt;:</b> اختر المفردات ← استبدل الكلمات النادرة بـ &lt;UNK&gt; ← قدّر احتماله كأي رمز.`]
  ],
  confuse: { a: [`Zero-count problem`, `The <b>n-gram</b> is new ("denied the offer"); the words are known. Fixed by <b>smoothing</b>.`, `الـ <b>n-gram</b> جديد والكلمات معروفة، ويحله <b>التنعيم</b>.`], b: [`Unknown-word problem`, `The <b>word</b> itself is not in the vocabulary. Handled with <b>&lt;UNK&gt;</b>.`, `<b>الكلمة</b> نفسها غير موجودة، ويعالجها <b>&lt;UNK&gt;</b>.`], why: [`Both produce missing probabilities, so they get mixed up, but they need different fixes.`, `كلاهما يسبب احتمالات مفقودة فيُخلط بينهما، لكن لكل منهما حل مختلف.`] },
  check: [`What does the OOV rate measure?`, `ماذا تقيس نسبة OOV؟`, [`The share of zero bigrams`, `The percentage of test tokens outside the vocabulary`, `The perplexity of unknown words`, `How many words appear once`], 1, `Slide 26: OOV rate = percentage of test tokens outside the vocabulary.`, `الشريحة 26: نسبة رموز الاختبار خارج المفردات.`],
  remember: [`Closed vocab: no OOV. Open vocab: use &lt;UNK&gt; (replace rare training words, estimate it like any token). OOV rate = % of test tokens outside the vocabulary.`, `المغلقة بلا OOV، والمفتوحة تستخدم &lt;UNK&gt;.`]
};

LESSONS.c3s17 = {
  big: [`<b>Smoothing</b> takes a little probability away from things we have seen and gives it to things we haven't, so nothing gets exactly zero and the total still sums to 1. The simplest version, <b>add-one (Laplace)</b>, pretends every possible next word was seen one extra time.`, `<b>التنعيم</b> يأخذ قليلًا من احتمال ما رأيناه ويعطيه لما لم نره، فلا يصبح شيء صفرًا ويبقى المجموع 1. أبسط نسخة، <b>add-one (لابلاس)</b>، تتظاهر بأن كل كلمة تالية ممكنة ظهرت مرة إضافية.`],
  links: ['c3s15'],
  steps: [
    [`<b>Formula:</b> P_add1(wᵢ | h) = (C(h, wᵢ) + 1) / (C(h) + V).`, `<b>الصيغة:</b> (C(h, wᵢ) + 1) / (C(h) + V).`],
    [`<b>Why + V in the denominator?</b> We added 1 to each of the V possible next words, so the history's total grows by V. That keeps the probabilities summing to 1.`, `<b>لماذا + V؟</b> أضفنا 1 لكل من الكلمات V الممكنة، فيكبر المجموع بـ V ويبقى مجموع الاحتمالات 1.`],
    [`<b>Worked example:</b> V = 6, C(AI) = 2, C(AI NLP) = 0. Unsmoothed 0/2 = 0; add-one (0 + 1)/(2 + 6) = <b>1/8 = 0.125</b>.`, `<b>مثال:</b> بلا تنعيم 0، ومع add-one = 1/8 = 0.125.`],
    [`<b>Limitation:</b> with a large V it is too aggressive: it moves too much probability to unseen events. Better options follow: add-k, Good–Turing, absolute discounting, backoff, interpolation.`, `<b>القيد:</b> مع V كبيرة ينقل احتمالًا كبيرًا جدًّا لغير المرئي، والبدائل: add-k وGood–Turing والخصم والرجوع والاستيفاء.`]
  ],
  action: { w: 'bigram', cfg: { corpus: 'I like NLP\nI like AI\nAI is useful', sentence: 'I like AI NLP', add1: true }, cap: [`The same "impossible" sentence with add-one smoothing on. Check that P(NLP | AI) = (0 + 1) / (2 + 6) = 0.125, then switch smoothing off and on again.`, `الجملة "المستحيلة" نفسها مع التنعيم: تحقق أن P(NLP | AI) = 0.125.`] },
  analogy: [`Like a teacher who gives every student one bonus point before grading, so nobody ends up with an impossible zero. Fair, but if the class is huge, those bonus points add up to a lot.`, `مثل معلم يعطي كل طالب درجة إضافية قبل التصحيح حتى لا يحصل أحد على صفر؛ عادل، لكن مع فصل ضخم تتراكم الدرجات الإضافية كثيرًا.`],
  check: [`With V = 6, C(AI) = 2 and C(AI NLP) = 0, add-one gives P(NLP | AI) =`, `مع V = 6 وC(AI) = 2 وC(AI NLP) = 0، قيمة add-one:`, [`0`, `1/6`, `1/8`, `1/2`], 2, `(0 + 1) / (2 + 6) = 1/8.`, `(0 + 1) / (2 + 6) = 1/8.`],
  remember: [`Add-one: (C(h,w) + 1) / (C(h) + V). AI → NLP: 0 → 1/8. Too aggressive when V is large.`, `لابلاس: (C + 1) / (C(h) + V)، والمثال 1/8، وعنيف مع V كبيرة.`],
  teach: [`Explain add-one smoothing, why V is added to the denominator, and one weakness.`, `اشرح تنعيم لابلاس ولماذا نضيف V للمقام وعيبًا واحدًا.`, `Add-one smoothing pretends every possible next word appeared once more than it did: P = (C(h, w) + 1) / (C(h) + V). Because 1 is added for each of the V possible words, the denominator must grow by V so the probabilities still sum to 1. In the lecture example, P(NLP | AI) goes from 0/2 = 0 to (0 + 1)/(2 + 6) = 1/8. Its weakness is that with a large vocabulary it moves too much probability mass to unseen events.`, `لابلاس يتظاهر بأن كل كلمة ممكنة ظهرت مرة إضافية، ونضيف V للمقام ليبقى المجموع 1. في المثال يصبح الاحتمال 1/8 بدل صفر. وعيبه أنه ينقل كتلة كبيرة لغير المرئي مع مفردات كبيرة.`]
};

LESSONS.c3s19 = {
  big: [`When a trigram has never been seen, we can still use shorter histories. <b>Backoff</b> falls back: trigram if available, else bigram, else unigram (one model at a time). <b>Interpolation</b> always blends all three with weights λ that sum to 1.`, `عندما لا يُرى الثلاثي يمكننا استخدام تواريخ أقصر. <b>الرجوع</b> يتراجع: الثلاثي إن وُجد وإلا الثنائي وإلا الأحادي (نموذج واحد). <b>الاستيفاء</b> يمزج الثلاثة دائمًا بأوزان λ مجموعها 1.`],
  action: { steps: [[`Suppose for some word: P_tri = 0 (unseen), P_bi = 0.2, P_uni = 0.01. (Illustrative numbers, not from the slides.)`, `افترض: P_tri = 0 وP_bi = 0.2 وP_uni = 0.01 (أرقام توضيحية).`], [`<b>Backoff:</b> the trigram has no evidence, so fall back to the bigram: use 0.2.`, `<b>الرجوع:</b> لا دليل للثلاثي فنستخدم الثنائي 0.2.`], [`<b>Interpolation</b> with λ₁ = 0.1, λ₂ = 0.3, λ₃ = 0.6: 0.1(0.01) + 0.3(0.2) + 0.6(0) = 0.001 + 0.06 + 0 = <b>0.061</b>. Not zero.`, `<b>الاستيفاء:</b> 0.001 + 0.06 + 0 = 0.061، وليس صفرًا.`], [`The λ values are learned on held-out (development) data and must sum to 1.`, `تُتعلَّم λ على بيانات التطوير ومجموعها 1.`]], cap: [`A worked illustration of the two strategies.`, `مثال توضيحي للطريقتين.`] },
  confuse: { a: [`Backoff`, `<b>Fallback</b>: use one model at a time, the highest order that has evidence.`, `<b>احتياطي</b>: نموذج واحد، الأعلى رتبة الذي له دليل.`], b: [`Interpolation`, `<b>Mixture</b>: all orders contribute, P = λ₁P_uni + λ₂P_bi + λ₃P_tri.`, `<b>مزيج</b>: كل الرتب تساهم.`], why: [`Both use shorter histories, so they sound alike. Ask: "one model at a time, or a weighted blend of all of them?"`, `كلاهما يستخدم تواريخ أقصر. اسأل: نموذج واحد في كل مرة أم مزيج موزون للجميع؟`] },
  check: [`Which statement is true of interpolation?`, `أي عبارة صحيحة عن الاستيفاء؟`, [`It uses only the trigram when available`, `All orders contribute with λ weights that sum to 1`, `λ values are chosen on the test set`, `It never uses the unigram`], 1, `λ weights are learned on dev data and sum to 1.`, `أوزان λ من بيانات التطوير ومجموعها 1.`],
  remember: [`Backoff = fallback, one model at a time. Interpolation = λ₁P_uni + λ₂P_bi + λ₃P_tri, λ sum to 1, learned on dev data.`, `الرجوع احتياطي، والاستيفاء مزيج موزون مجموعه 1.`]
};

LESSONS.c3s20 = {
  big: [`(Additional depth.) For a lower-order model, being frequent isn't the same as being a good continuation. "Francisco" is frequent but almost always follows "San"; "of" follows many different words. <b>Kneser–Ney</b> rewards words that appear in many different contexts.`, `(تعمّق إضافي) في النموذج الأدنى، التكرار ليس كالفائدة كتكملة: Francisco متكررة لكنها تأتي غالبًا بعد San، أما of فتأتي بعد كلمات كثيرة. <b>Kneser–Ney</b> يكافئ الكلمات الظاهرة في سياقات كثيرة.`],
  remember: [`Kneser–Ney: reward words seen after many different words (of), not merely frequent ones (Francisco).`, `Kneser–Ney يكافئ تنوع السياقات لا التكرار وحده.`]
};

LESSONS.c3s21 = {
  big: [`Once a model can predict the next word, it can <b>write</b>: pick a word, add it to the context, predict again. The rule for picking matters: <b>sampling</b> picks according to probability (varied text), <b>greedy</b> always picks the top word (predictable, can repeat).`, `ما دام النموذج يتنبأ بالكلمة التالية فهو يستطيع <b>الكتابة</b>: اختر كلمة وأضفها للسياق وتنبأ مجددًا. وقاعدة الاختيار مهمة: <b>المعاينة</b> تختار حسب الاحتمال (نص متنوع)، و<b>الجشع</b> يختار الأعلى دائمًا (متوقع وقد يتكرر).`],
  steps: [
    [`Start with &lt;s&gt;. The model gives P(I | &lt;s&gt;) = 2/3, P(AI | &lt;s&gt;) = 1/3.`, `نبدأ بـ &lt;s&gt;: P(I) = 2/3 وP(AI) = 1/3.`],
    [`Sample "I" (it will be picked about 2 times out of 3). Append it.`, `نختار I (نحو مرتين من ثلاث) ونضيفها.`],
    [`P(like | I) = 1, so "like" is certain. Append it.`, `P(like | I) = 1 فتأتي like حتمًا.`],
    [`After "like": P(NLP | like) = P(AI | like) = 1/2. Either can appear.`, `بعد like: NLP أو AI باحتمال متساوٍ.`],
    [`Repeat until &lt;/s&gt; is generated.`, `كرر حتى توليد &lt;/s&gt;.`]
  ],
  confuse: { a: [`Sampling`, `Chooses <b>according to probability</b>; allows variation; sometimes picks a less likely word.`, `يختار <b>حسب الاحتمال</b>؛ يسمح بالتنوع.`], b: [`Greedy`, `<b>Always</b> the highest-probability word; predictable; can get repetitive or stuck in common phrases.`, `الأعلى احتمالًا <b>دائمًا</b>؛ متوقع وقد يتكرر.`], why: [`Week 7 builds on this with beam search, temperature, top-k and top-p.`, `يبني الأسبوع 7 على هذا بالبحث الحزمي والحرارة وtop-k وtop-p.`] },
  check: [`Text generated by a unigram model typically looks like:`, `النص المولَّد بنموذج أحادي يبدو عادة:`, [`"I want to eat Chinese food."`, `"food want the to Chinese I …"`, `Perfectly coherent paragraphs`, `Only the most frequent word repeated`], 1, `Plausible words, poor order, because a unigram model uses no history.`, `كلمات معقولة بترتيب ضعيف لأن الأحادي بلا تاريخ.`],
  remember: [`Generate: &lt;s&gt; → probabilities → sample → append → repeat until &lt;/s&gt;. Higher n = more local coherence.`, `التوليد: معاينة وإضافة وتكرار، وn الأعلى أكثر ترابطًا.`]
};

/* Guided lessons – Week 4: Machine Learning for NLP */
MISSIONS.ch4 = [
  { t: [`Learning from examples`, `التعلّم من الأمثلة`], goal: [`Explain machine learning, supervised learning and the six-step workflow for a text classifier.`, `اشرح تعلّم الآلة والتعلّم الموجَّه وخطوات بناء المصنف الست.`], secs: ['1', '2', '3', '4', '5', '6'] },
  { t: [`Turning text into features`, `تحويل النص إلى خصائص`], goal: [`Build a document-term matrix and say what a classifier learns from it.`, `ابنِ مصفوفة مستند-مصطلح وقل ماذا يتعلم المصنف منها.`], secs: ['7', '8'] },
  { t: [`Naive Bayes`, `Naive Bayes`], goal: [`Explain the decision rule, train by counting with add-1 smoothing, and classify the lecture example.`, `اشرح قاعدة القرار ودرّب بالعدّ مع add-1 وصنّف مثال المحاضرة.`], secs: ['9', '10', '11'] },
  { t: [`Logistic regression`, `الانحدار اللوجستي`], goal: [`Compute z and the sigmoid, describe training, extend to softmax and compare with Naive Bayes.`, `احسب z والسينية، وصف التدريب، ووسّع إلى softmax، وقارن مع NB.`], secs: ['12', '13', '14', '15', '16'] },
  { t: [`Evaluating classifiers`, `تقييم المصنفات`], goal: [`Explain why accuracy misleads, compute precision, recall and F1, and handle class imbalance.`, `اشرح لماذا تضلل الدقة الإجمالية، واحسب الدقة والاستدعاء وF1، وعالج عدم التوازن.`], secs: ['17', '18', '19'] }

LESSONS.c4s1 = {
  big: [`Instead of writing rules like "IF the email contains 'free credit' THEN spam", we show the computer many labelled examples and let it <b>learn the pattern</b>. The goal is not to memorize the examples but to <b>generalize</b> to new texts it has never seen.`, `بدل كتابة قواعد مثل "إذا احتوت الرسالة free credit فهي مزعجة"، نعرض على الحاسوب أمثلة موسومة كثيرة ونتركه <b>يتعلم النمط</b>. والهدف ليس حفظ الأمثلة بل <b>التعميم</b> على نصوص جديدة.`],
  steps: [
    [`<b>Input:</b> examples represented as features, such as word counts or TF-IDF values.`, `<b>المدخل:</b> أمثلة ممثلة كخصائص مثل أعداد الكلمات أو TF-IDF.`],
    [`<b>Output:</b> a prediction: spam / not spam, positive / negative, or a topic.`, `<b>المخرج:</b> تنبؤ: مزعج/غير مزعج، إيجابي/سلبي، أو موضوع.`],
    [`<b>Rules vs ML:</b> rules are explicit and clear for small cases but fragile when language changes; ML learns from data and handles interacting features but needs labelled data and evaluation.`, `<b>القواعد مقابل تعلّم الآلة:</b> القواعد واضحة لكنها هشة، وتعلّم الآلة يتعلم من البيانات لكنه يحتاج وسومًا وتقييمًا.`],
    [`<b>Why NLP needs it:</b> variation (many ways to say the same thing), sparse features (each text uses a tiny part of the vocabulary), hidden patterns (word combinations), adaptation (retrain when data changes).`, `<b>لماذا تحتاجه NLP:</b> التنوع، والخصائص المتناثرة، والأنماط الخفية، والتكيّف.`]
  ],
  analogy: [`Teaching a child to recognise dogs: you don't give a rulebook ("four legs, fur, barks"), which would fail for a sleeping hairless puppy; you show many dogs and non-dogs, and the child generalizes.`, `تعليم طفل التعرف على الكلاب: لا تعطيه كتاب قواعد يفشل مع جرو نائم بلا شعر، بل تريه كلابًا كثيرة وغيرها فيُعمّم.`],
  check: [`What is the goal of a machine-learning classifier?`, `ما هدف مصنف تعلّم الآلة؟`, [`Memorize the training texts`, `Generalize to new texts not seen in training`, `Replace all features with rules`, `Maximize the size of the vocabulary`], 1, `Slide 3: "Generalize to new texts that were not seen during training."`, `الشريحة 3: التعميم على نصوص لم تُرَ في التدريب.`],
  remember: [`ML = learn patterns from examples (features in, prediction out), goal = generalize. Rules are clear but fragile; ML needs labelled data.`, `تعلّم الآلة يتعلم من الأمثلة وهدفه التعميم؛ القواعد هشة وتعلّم الآلة يحتاج وسومًا.`],
  teach: [`Compare hand-written rules with machine learning using the spam example, and give two reasons NLP needs ML.`, `قارن القواعد بتعلّم الآلة بمثال المزعج واذكر سببين لحاجة NLP إليه.`, `A rule-based spam filter uses explicit if–then patterns, such as "IF the email contains 'free credit' THEN spam"; it is clear for small cases but fragile when language changes. A machine-learning filter learns from labelled spam and not-spam emails, handles interacting features, but needs labelled data and evaluation. NLP needs ML because language varies (the same meaning in many forms) and features are sparse; ML also adapts by retraining when patterns change.`, `القواعد صريحة وهشة، وتعلّم الآلة يتعلم من أمثلة موسومة ويتعامل مع الخصائص المتداخلة. وتحتاجه NLP بسبب تنوع اللغة وتناثر الخصائص وإمكانية إعادة التدريب.`]
};

LESSONS.c4s4 = {
  big: [`<b>Supervised</b> learning means learning with an answer key. Each training example is a pair (x, y): a text x and its correct label y. The classifier is a function learned from those pairs that maps a new text x to a predicted label ŷ.`, `<b>التعلّم الموجَّه</b> تعلّم بمفتاح إجابات: كل مثال زوج (x, y) نص ووسمه الصحيح، والمصنف دالة متعلَّمة تحوّل نصًّا جديدًا إلى وسم متوقع ŷ.`],
  steps: [
    [`<b>Training:</b> both x and y are known: (x₁, y₁), (x₂, y₂), …`, `<b>التدريب:</b> x وy معروفان.`],
    [`<b>Prediction:</b> only x is given; the model outputs ŷ.`, `<b>التنبؤ:</b> x فقط ويخرج النموذج ŷ.`],
    [`<b>Classification:</b> one label from a fixed set C = {c₁ … cₖ}. The output is a category, not a number, so it is not regression.`, `<b>التصنيف:</b> وسم من مجموعة ثابتة، والمخرج فئة لا رقم.`],
    [`<b>Typical tasks:</b> sentiment analysis, topic classification, spam detection, language identification.`, `<b>مهام معتادة:</b> المشاعر، المواضيع، المزعج، تحديد اللغة.`]
  ],
  check: [`Predicting tomorrow's temperature in degrees is NOT classification because:`, `التنبؤ بدرجة حرارة الغد ليس تصنيفًا لأن:`, [`It uses no features`, `The output is a continuous number, not a category`, `It has no training data`, `It has only two classes`], 1, `Classification outputs a category from a fixed set; a continuous number is regression.`, `التصنيف يخرج فئة، والرقم المتصل انحدار.`],
  remember: [`Supervised: learn from (x, y) pairs; classifier maps new x → ŷ; classification = categorical output.`, `الموجَّه: أزواج (x, y)، والتصنيف مخرج فئوي.`]
};

LESSONS.c4s6 = {
  big: [`Building a text classifier always follows the same six steps. Learn them as a story: decide what to predict, get labelled examples, turn text into numbers, pick a model, train and tune it, and finally test it on unseen data.`, `بناء مصنف النصوص يتبع دائمًا ست خطوات. احفظها كقصة: قرر ماذا تتنبأ، واجمع أمثلة موسومة، وحوّل النص إلى أرقام، واختر نموذجًا، ودرّبه واضبطه، ثم اختبره على بيانات جديدة.`],
  steps: [
    [`<b>1. Define the task:</b> what do we want to predict?`, `<b>1. حدد المهمة:</b> ماذا نريد أن نتنبأ؟`],
    [`<b>2. Collect and label data:</b> create labelled examples.`, `<b>2. اجمع البيانات ووسمها.</b>`],
    [`<b>3. Represent text:</b> convert text into features.`, `<b>3. مثّل النص</b> بخصائص.`],
    [`<b>4. Choose a classifier:</b> Naive Bayes or logistic regression.`, `<b>4. اختر المصنف:</b> NB أو LR.`],
    [`<b>5. Train and tune:</b> on training and development data.`, `<b>5. درّب واضبط</b> ببيانات التدريب والتطوير.`],
    [`<b>6. Evaluate:</b> on unseen test data. The test set is never used for training or tuning.`, `<b>6. قيّم</b> على بيانات اختبار جديدة، ولا تُستخدم للتدريب أو الضبط.`]
  ],
  check: [`At which step is the test set used?`, `في أي خطوة تُستخدم مجموعة الاختبار؟`, [`Train and tune`, `Choose a classifier`, `Evaluate`, `Represent text`], 2, `Only for the final evaluation; using it earlier makes results look artificially good.`, `فقط للتقييم النهائي.`],
  remember: [`Task → labelled data → features → classifier → train & tune → evaluate on unseen test data.`, `مهمة ← بيانات موسومة ← خصائص ← مصنف ← تدريب وضبط ← تقييم.`]
};

LESSONS.c4s7 = {
  big: [`Classifiers can't read words; they read <b>numbers</b>. The simplest conversion: pick a vocabulary, then describe each document by how often each vocabulary word appears. Stack the rows and you have a <b>document-term matrix</b>.`, `المصنفات لا تقرأ الكلمات بل <b>الأرقام</b>. أبسط تحويل: اختر مفردات ثم صف كل مستند بعدد مرات ظهور كل كلمة، وبتكديس الصفوف تحصل على <b>مصفوفة مستند-مصطلح</b>.`],
  action: { w: 'bow', cfg: { a: 'great movie great cast', b: 'great plot boring script' }, cap: [`Reviews R1 and R3 from slide 11 as count vectors. Each one-hot row adds into the review's vector.`, `المراجعتان R1 وR3 من الشريحة 11 كمتجهات أعداد.`] },
  steps: [
    [`R1 "great movie, great cast" → [great 2, movie 1, cast 1, boring 0, plot 0, script 0], label +.`, `R1 ← [2, 1, 1, 0, 0, 0] إيجابي.`],
    [`R2 "boring plot, boring script" → [0, 0, 0, 2, 1, 1], label −.`, `R2 ← [0, 0, 0, 2, 1, 1] سلبي.`],
    [`R3 "great plot, boring script" → [1, 0, 0, 1, 1, 1], label ?: it has evidence for <b>both</b> classes, which the classifier must weigh.`, `R3 فيها دليل على الفئتين ويجب أن يوازنه المصنف.`],
    [`Every vector has the same length (= vocabulary size), however long the review is. The same matrix can feed Naive Bayes and logistic regression.`, `لكل المتجهات الطول نفسه، والمصفوفة نفسها تغذي المصنفين.`]
  ],
  remember: [`Text → feature vector (counts, n-grams, TF-IDF); fixed length = |V|; these numbers are what the classifier learns from.`, `النص ← متجه خصائص بطول |V|، وهذه الأرقام ما يتعلم منه المصنف.`]
};

LESSONS.c4s9 = {
  big: [`Naive Bayes asks: <b>which class makes this document most probable?</b> It combines how common each class is (the <b>prior</b>) with how likely the document's words are in that class (the <b>likelihood</b>), and picks the class with the highest score.`, `يسأل Naive Bayes: <b>أي فئة تجعل هذا المستند الأكثر احتمالًا؟</b> يجمع شيوع الفئة (<b>القبلي</b>) مع احتمال كلمات المستند فيها (<b>الاحتمالية</b>) ويختار الأعلى.`],
  steps: [
    [`Goal: ĉ = argmax over classes of P(c | d).`, `الهدف: ĉ = argmax P(c | d).`],
    [`Bayes' rule: P(c | d) = P(c) P(d | c) / P(d). <b>P(d) is the same for every class</b>, so it cannot change which class wins: drop it.`, `قاعدة بايز، و<b>P(d) واحد لكل الفئات</b> فلا يغيّر الفائز: نحذفه.`],
    [`<b>The naive assumption:</b> words are conditionally independent given the class, so P(d | c) = Π P(wᵢ | c).`, `<b>الافتراض الساذج:</b> الكلمات مستقلة بمعلومية الفئة.`],
    [`Decision rule: <b>ĉ = argmax P(c) Π P(wᵢ | c)</b>, or with logs, argmax [log P(c) + Σ log P(wᵢ | c)].`, `قاعدة القرار: <b>argmax P(c) Π P(wᵢ | c)</b> أو باللوغاريتمات.`]
  ],
  analogy: [`A doctor guessing an illness: how common is the illness in general (prior) × how typical each symptom is for that illness (likelihood). "Naive" means treating every symptom as independent evidence, even if some usually come together.`, `طبيب يخمّن المرض: مدى شيوع المرض (القبلي) × مدى ارتباط كل عرض به (الاحتمالية). و"ساذج" يعني معاملة كل عرض كدليل مستقل حتى لو اجتمعت الأعراض عادة.`],
  check: [`Why can Naive Bayes ignore P(d)?`, `لماذا يتجاهل NB قيمة P(d)؟`, [`It is always 1`, `It is the same for all classes, so it doesn't change the argmax`, `It is unknown`, `It equals the prior`], 1, `Dividing every class's score by the same number doesn't change which is largest.`, `قسمة كل النتائج على الرقم نفسه لا يغيّر الأكبر.`],
  remember: [`ĉ = argmax P(c) Π P(wᵢ | c). Drop P(d); naive = words independent given the class; use logs.`, `ĉ = argmax P(c) Π P(wᵢ | c)، ونحذف P(d).`]
};

LESSONS.c4s10 = {
  big: [`Training Naive Bayes is mostly <b>counting</b>. Count documents per class for the prior; count words per class for the likelihoods. One problem appears immediately: a word never seen in a class gets probability 0, and one zero wipes out the whole score. Add-1 smoothing (from Week 3) fixes it.`, `تدريب NB في معظمه <b>عدّ</b>: نعدّ المستندات لكل فئة للقبلي والكلمات لكل فئة للاحتمالية. وتظهر مشكلة فورًا: الكلمة غير المرئية في فئة احتمالها 0 فتمحو النتيجة كلها، ويحلها add-1.`],
  links: ['c3s17'],
  steps: [
    [`<b>Prior:</b> P(c) = documents in class c / total documents.`, `<b>القبلي:</b> مستندات الفئة ÷ كل المستندات.`],
    [`<b>Likelihood (raw):</b> P(w | c) = count(w, c) / total tokens in c.`, `<b>الاحتمالية الخام:</b> عدد الكلمة في الفئة ÷ رموز الفئة.`],
    [`<b>The zero problem:</b> a vocabulary word never seen in class c → P(w | c) = 0 → the whole product is 0.`, `<b>مشكلة الصفر:</b> كلمة غير مرئية في الفئة ← صفر ← النتيجة كلها صفر.`],
    [`<b>Add-1:</b> P(w | c) = (count(w, c) + 1) / (tokens in c + |V|).`, `<b>add-1:</b> (العدد + 1) / (رموز الفئة + |V|).`],
    [`<b>OOV words</b> (not in the training vocabulary at all) are handled separately: they are dropped from the test document.`, `<b>الكلمات خارج المفردات</b> تُحذف من مستند الاختبار.`]
  ],
  confuse: { a: [`Word unseen in a class`, `In the vocabulary, but never in this class ("fun" in NEG) → <b>add-1 smoothing</b>.`, `في المفردات لكن ليس في هذه الفئة ← <b>التنعيم</b>.`], b: [`OOV word`, `Not in the training vocabulary at all ("with") → <b>drop it</b>.`, `ليست في المفردات أصلًا ← <b>احذفها</b>.`], why: [`Both are "missing", but smoothing only covers vocabulary words. An OOV word has no row in any class, so it is removed.`, `كلاهما "مفقود"، لكن التنعيم يغطي كلمات المفردات فقط، والكلمة المجهولة تُحذف.`] },
  check: [`Without add-1, P(fun | negative) when "fun" never appears in negative documents is:`, `دون add-1، ما P(fun | negative) إذا لم تظهر fun في السلبي؟`, [`1/34`, `0, and the whole negative score collapses`, `1/14`, `It is skipped automatically`], 1, `This is slide 17's "Your turn": option B.`, `هذا سؤال الشريحة 17: الخيار B.`],
  remember: [`P(c) = docs ratio; P(w | c) = (count + 1) / (tokens in c + |V|). Smoothing for words unseen in a class; drop OOV words.`, `صيغ القبلي والاحتمالية مع add-1، وحذف الكلمات المجهولة.`]
};

LESSONS.c4s11 = {
  big: [`Let's classify slide 16's sentence <b>"predictable with no fun"</b> step by step. Training summary: 3 negative and 2 positive documents; 14 negative tokens, 9 positive tokens; |V| = 20.`, `لنصنّف جملة الشريحة 16 <b>"predictable with no fun"</b> خطوة بخطوة: 3 مستندات سلبية و2 إيجابية؛ 14 رمزًا سلبيًّا و9 إيجابية؛ |V| = 20.`],
  links: ['c4s10'],
  action: { steps: [[`<b>Priors:</b> P(NEG) = 3/5 = 0.6, P(POS) = 2/5 = 0.4.`, `<b>القبلي:</b> 0.6 و0.4.`], [`<b>Drop OOV:</b> "with" is not in the training vocabulary → use predictable, no, fun.`, `<b>حذف المجهول:</b> with ليست في المفردات.`], [`<b>Denominators:</b> NEG 14 + 20 = 34; POS 9 + 20 = 29.`, `<b>المقامات:</b> 34 و29.`], [`<b>Smoothed likelihoods:</b> NEG predictable (1+1)/34, no (1+1)/34, fun (0+1)/34. POS predictable (0+1)/29, no (0+1)/29, fun (1+1)/29.`, `<b>الاحتمالات:</b> السلبي 2/34 و2/34 و1/34، والإيجابي 1/29 و1/29 و2/29.`], [`<b>Scores:</b> NEG 0.6 × 2/34 × 2/34 × 1/34 ≈ 6.1 × 10⁻⁵. POS 0.4 × 1/29 × 1/29 × 2/29 ≈ 3.3 × 10⁻⁵.`, `<b>النتائج:</b> السلبي ≈ 6.1 × 10⁻⁵ والإيجابي ≈ 3.3 × 10⁻⁵.`], [`<b>Decision:</b> the negative score is larger → <b>negative</b>.`, `<b>القرار:</b> سلبي.`]], cap: [`Reveal one step at a time and try to compute the next number before you reveal it.`, `اكشف خطوة واحدة في كل مرة وحاول حساب الرقم التالي قبل كشفه.`] },
  check: [`What is the add-1 denominator for the positive class?`, `ما مقام add-1 للفئة الإيجابية؟`, [`9`, `20`, `29`, `34`], 2, `Tokens in POS (9) + |V| (20) = 29.`, `9 + 20 = 29.`],
  remember: [`"predictable with no fun": drop "with"; denominators 34 / 29; 6.1e-5 (NEG) > 3.3e-5 (POS) → negative.`, `حذف with؛ المقامان 34 و29؛ النتيجة سلبي.`]
};

LESSONS.c4s12 = {
  big: [`Logistic regression gives every feature a <b>weight</b>: positive weights push toward class 1, negative weights push away. Add up weight × value plus a bias to get a score z, then squash z into a probability with the <b>sigmoid</b>.`, `يعطي الانحدار اللوجستي كل خاصية <b>وزنًا</b>: الموجب يدفع نحو الفئة 1 والسالب بعيدًا. نجمع الوزن × القيمة مع الانحياز لنحصل على z، ثم نحوّلها إلى احتمال بالدالة <b>السينية</b>.`],
  steps: [
    [`<b>Score:</b> z = w · x + b (weights × feature values + bias).`, `<b>النتيجة:</b> z = w · x + b.`],
    [`<b>Sigmoid:</b> P(y = 1 | x) = σ(z) = 1 / (1 + e⁻ᶻ), always between 0 and 1.`, `<b>السينية:</b> σ(z) = 1 / (1 + e⁻ᶻ) بين 0 و1.`],
    [`Large negative z → near 0; <b>z = 0 → exactly 0.5</b> (the decision boundary); large positive z → near 1.`, `z سالبة كبيرة ← قرب 0، و<b>z = 0 ← 0.5</b>، وz موجبة كبيرة ← قرب 1.`],
    [`<b>Decision:</b> predict class 1 when P ≥ 0.5. The steep middle is where the classifier is least certain.`, `<b>القرار:</b> الفئة 1 إذا الاحتمال ≥ 0.5.`]
  ],
  action: { w: 'activation', cfg: { z: 0.833, marks: [-3, 0, 0.833, 3] }, cap: [`Drag z and watch the probability. Try the lecture's z = 0.833.`, `حرّك z وراقب الاحتمال، وجرّب z = 0.833.`] },
  confuse: { a: [`Naive Bayes`, `Estimates <b>probabilities from counts</b>.`, `يقدّر <b>الاحتمالات بالعدّ</b>.`], b: [`Logistic regression`, `Learns <b>feature weights</b> directly.`, `يتعلم <b>أوزان الخصائص</b> مباشرة.`], why: [`Slide 18's bridge: "from counted probabilities to learned weights".`, `جسر الشريحة 18: "من الاحتمالات المعدودة إلى الأوزان المتعلَّمة".`] },
  check: [`What is σ(0)?`, `ما قيمة σ(0)؟`, [`0`, `0.5`, `1`, `It depends on the weights`], 1, `1 / (1 + e⁰) = 1/2: the decision boundary.`, `1/2 وهو حد القرار.`],
  remember: [`z = w·x + b → σ(z) = 1/(1 + e⁻ᶻ); σ(0) = 0.5 is the boundary; predict 1 if ≥ 0.5.`, `z ← σ(z)، وσ(0) = 0.5 حد القرار.`]
};

  big: [`Slide 21 scores a review with six features, with y = 1 meaning positive. Watch how the weights turn evidence into a single score.`, `الشريحة 21 تقيّم مراجعة بست خصائص، وy = 1 تعني إيجابي. لاحظ كيف تحوّل الأوزان الأدلة إلى نتيجة واحدة.`],

  check: [`Which feature pulls z down the most in this example?`, `أي خاصية تخفض z أكثر في المثال؟`, [`Positive lexicon words`, `Negative lexicon words`, `Pronouns`, `ln(word count)`], 1, `−5.0 × 2 = −10.`, `−5.0 × 2 = −10.`],

LESSONS.c4s14 = {
  big: [`Where do the weights come from? A loop: <b>predict</b> with the current weights, <b>measure the error</b> with cross-entropy loss, <b>nudge the weights</b> with gradient descent to reduce that loss, and repeat.`, `من أين تأتي الأوزان؟ من حلقة: <b>تنبأ</b> بالأوزان الحالية، و<b>قِس الخطأ</b> بخسارة الإنتروبيا المتقاطعة، و<b>عدّل الأوزان</b> بالانحدار التدريجي لتقليلها، ثم كرر.`],
  steps: [
    [`<b>Predict:</b> p = P(y = 1 | x) with the current w and b.`, `<b>التنبؤ:</b> p بالأوزان الحالية.`],
    [`<b>Loss:</b> L = −[y log p + (1 − y) log(1 − p)]. If y = 1 and p is near 1, L is small; if p is near 0, L is large.`, `<b>الخسارة:</b> صغيرة إذا اقتربت p من الصواب وكبيرة إذا ابتعدت.`],
    [`<b>Update:</b> gradient descent changes w and b in the direction that reduces L.`, `<b>التحديث:</b> الانحدار التدريجي يغيّر w وb لتقليل الخسارة.`],
    [`<b>Repeat</b> over the training examples. (Cross-entropy returns in Week 6.)`, `<b>التكرار</b> على أمثلة التدريب.`]
  ],
  analogy: [`Like tuning a guitar: play a note (predict), hear how far off it is (loss), turn the peg a little in the right direction (gradient step), and repeat until it sounds right.`, `مثل ضبط الغيتار: اعزف نغمة، واسمع مدى انحرافها، وأدر المفتاح قليلًا في الاتجاه الصحيح، وكرر.`],
  remember: [`Predict → cross-entropy loss → gradient descent → repeat.`, `تنبؤ ← خسارة ← انحدار تدريجي ← تكرار.`]
};

LESSONS.c4s15 = {
  big: [`Topics have more than two classes (business, sports, health…). The sigmoid only handles two, so we use <b>softmax</b>: give each class its own score zₖ = wₖ · x + bₖ, then turn all the scores into one probability distribution that sums to 1.`, `المواضيع لها أكثر من فئتين، والسينية تتعامل مع فئتين فقط، فنستخدم <b>softmax</b>: لكل فئة نتيجتها zₖ، ثم نحوّل كل النتائج إلى توزيع احتمالي واحد مجموعه 1.`],
  links: ['c4s12'],
  action: { w: 'softmax', cfg: { labels: ['business', 'sports', 'health'], z: [2.0, 0.5, -0.5] }, cap: [`Imagine these are the scores for "Liebert Corp shareholders approved a merger…". Raise or lower one score and watch every probability change. (Illustrative scores.)`, `تخيّل أنها نتائج مقال Liebert Corp؛ غيّر نتيجة وراقب تغيّر كل الاحتمالات (أرقام توضيحية).`] },
  steps: [
    [`Each class k has its own weights: zₖ = wₖ · x + bₖ.`, `لكل فئة أوزانها: zₖ = wₖ · x + bₖ.`],
    [`P(y = k | x) = exp(zₖ) / Σⱼ exp(zⱼ).`, `P(y = k | x) = exp(zₖ) / Σ exp(zⱼ).`],
    [`Choose the class with the highest probability. merger, shareholders, shares and stock are strong cues for <b>Business</b>.`, `نختار الفئة الأعلى، وكلمات مثل merger وstock تشير إلى <b>الأعمال</b>.`]
  ],
  confuse: { a: [`Sigmoid`, `<b>Binary</b>: one score → P(y = 1); P(y = 0) = 1 − P.`, `<b>ثنائي</b>: نتيجة واحدة.`], b: [`Softmax`, `<b>Multiclass</b>: one score per class → a distribution that sums to 1.`, `<b>متعدد</b>: نتيجة لكل فئة.`], why: [`Slide 25 trap: softmax outputs are NOT independent (they share one denominator), and the top probability is NOT always above 0.5.`, `فخ الشريحة 25: مخرجات softmax ليست مستقلة، وأعلى احتمال ليس دائمًا فوق 0.5.`] },
  check: [`Which statement about softmax outputs is true?`, `أي عبارة عن مخرجات softmax صحيحة؟`, [`Each class probability is computed independently`, `They are positive and sum to 1 across all classes`, `The largest is always above 0.5`, `They can be negative`], 1, `Slide 25's answer is B.`, `إجابة الشريحة 25 هي B.`],
  remember: [`Sigmoid → binary; softmax → multiclass: exp(zₖ) / Σ exp(zⱼ), positive, sums to 1.`, `السينية للثنائي وsoftmax للمتعدد ومجموعه 1.`]

LESSONS.c4s16 = {
  big: [`Both classifiers can use the same features and both pick the most probable class, but they think differently. Naive Bayes asks "how would each class <i>generate</i> these words?"; logistic regression asks directly "given these features, which class?"`, `المصنفان يستخدمان الخصائص نفسها ويختاران الفئة الأكثر احتمالًا، لكن طريقة التفكير مختلفة: NB يسأل "كيف <i>تولّد</i> كل فئة هذه الكلمات؟" وLR يسأل مباشرة "بمعلومية الخصائص، أي فئة؟"`],
  confuse: { a: [`Naive Bayes`, `<b>Generative</b>: models P(words | class). Learns probabilities by counting. Assumes conditional independence.`, `<b>توليدي</b>: P(الكلمات | الفئة)، بالعدّ، مع افتراض الاستقلال.`], b: [`Logistic regression`, `<b>Discriminative</b>: models P(class | text). Learns weights by gradient descent. No independence assumption; handles overlapping or correlated features better.`, `<b>تمييزي</b>: P(الفئة | النص)، يتعلم الأوزان، بلا افتراض استقلال، وأفضل مع الخصائص المترابطة.`], why: [`Memory hook: Generative = how the data is Generated; Discriminative = Discriminate between classes directly.`, `للحفظ: التوليدي = كيف تتولد البيانات، والتمييزي = التمييز بين الفئات مباشرة.`] },
  check: [`Which classifier is discriminative?`, `أي المصنفين تمييزي؟`, [`Naive Bayes`, `Logistic regression`, `Both`, `Neither`], 1, `It models P(class | text) directly.`, `ينمذج P(الفئة | النص) مباشرة.`],
  remember: [`NB = generative, counts, independence. LR = discriminative, weights, handles correlated features.`, `NB توليدي بالعدّ، وLR تمييزي بالأوزان.`],
  teach: [`Explain the difference between Naive Bayes and logistic regression in your own words.`, `اشرح الفرق بين المصنفين بأسلوبك.`, `Naive Bayes is generative: it models how likely the words are under each class, P(words | class), estimates class and word probabilities mostly by counting, and assumes words are conditionally independent given the class. Logistic regression is discriminative: it models P(class | text) directly by learning a weight for each feature with gradient descent on cross-entropy loss. It makes no independence assumption, so it handles overlapping or correlated features better.`, `NB توليدي ينمذج P(الكلمات | الفئة) بالعدّ ويفترض الاستقلال، وLR تمييزي ينمذج P(الفئة | النص) بتعلم الأوزان ولا يفترض الاستقلال فيتعامل أفضل مع الخصائص المترابطة.`]
};

LESSONS.c4s17 = {
  big: [`A spam filter that never flags anything can still score 95% accuracy, if 95% of emails are normal. <b>Accuracy hides mistakes on the class you care about</b> when the data is imbalanced.`, `مرشح مزعج لا يحدد شيئًا قد يحقق دقة 95% إذا كانت 95% من الرسائل عادية. <b>الدقة الإجمالية تخفي الأخطاء في الفئة المهمة</b> عند عدم التوازن.`],
  action: { w: 'prf', cfg: { tp: 0, fp: 0, fn: 50, tn: 950 }, cap: [`The "lazy model" that always says "not spam". Look at accuracy, then at recall. Then load the lecture example.`, `"النموذج الكسول" الذي يقول دائمًا "ليست مزعجة": انظر إلى الدقة ثم الاستدعاء، ثم حمّل مثال المحاضرة.`] },
  steps: [
    [`<b>Confusion matrix:</b> TP (spam caught), FN (spam missed), FP (false alarm), TN (normal passed).`, `<b>مصفوفة الالتباس:</b> TP وFN وFP وTN.`],
    [`Accuracy counts all correct predictions, so 950 correct "not spam" answers hide 50 missed spam emails.`, `الدقة الإجمالية تعدّ كل الصحيح، فتخفي 950 إجابة صحيحة 50 رسالة فائتة.`],
    [`<b>Solution:</b> use precision, recall and F1 for the target class.`, `<b>الحل:</b> الدقة والاستدعاء وF1 للفئة المستهدفة.`]
  ],
  remember: [`With imbalanced classes, accuracy misleads (always "not spam" = 95%). Use P/R/F1 for the target class.`, `مع عدم التوازن تضلل الدقة الإجمالية، فاستخدم الدقة والاستدعاء وF1.`]
};

LESSONS.c4s18 = {
  big: [`Two questions about the positive class. <b>Precision:</b> when the model says "spam", how often is it right? <b>Recall:</b> of all the real spam, how much did it catch? <b>F1</b> combines them into one balanced score.`, `سؤالان عن الفئة الإيجابية: <b>الدقة:</b> عندما يقول النموذج "مزعج" كم مرة يصيب؟ <b>الاستدعاء:</b> من كل المزعج الحقيقي كم أمسك؟ و<b>F1</b> يجمعهما.`],
  action: { w: 'prf', cfg: { tp: 8, fp: 2, fn: 4, tn: 86 }, cap: [`Slide 29: TP = 8, FP = 2, FN = 4. Precision 0.80, recall 0.67, F1 0.73. Raise FP and watch only precision fall; raise FN and watch only recall fall. (The slide gives no TN, so the 86 here, and therefore the accuracy, is illustrative.)`, `الشريحة 29: الدقة 0.80 والاستدعاء 0.67 وF1 0.73. ارفع FP ثم FN ولاحظ أثر كل منهما.`] },
  steps: [
    [`<b>Precision = TP / (TP + FP)</b> = 8/10 = 0.80: few false alarms when high.`, `<b>الدقة = TP / (TP + FP)</b> = 0.80.`],
    [`<b>Recall = TP / (TP + FN)</b> = 8/12 = 0.67: few missed positives when high.`, `<b>الاستدعاء = TP / (TP + FN)</b> = 0.67.`],
    [`<b>F1 = 2PR / (P + R)</b> = 2(0.80)(0.67) / 1.47 ≈ 0.73.`, `<b>F1 = 2PR / (P + R)</b> ≈ 0.73.`],
    [`For multiclass tasks, compute the metrics per class, then summarize.`, `في المتعدد نحسب لكل فئة ثم نلخّص.`]
  ],
  analogy: [`A fishing net: precision is how much of your catch is actually fish (not boots); recall is how many of the fish in the lake you caught.`, `شبكة صيد: الدقة كم من صيدك سمك فعلًا لا أحذية، والاستدعاء كم من أسماك البحيرة أمسكت.`],
  confuse: { a: [`Precision`, `TP / (TP + <b>FP</b>): hurt by <b>false alarms</b>.`, `يتأثر بـ <b>الإنذارات الكاذبة</b>.`], b: [`Recall`, `TP / (TP + <b>FN</b>): hurt by <b>missed positives</b>.`, `يتأثر بـ <b>الإيجابيات الفائتة</b>.`], why: [`Both have TP on top; only the second term in the denominator differs. Precision looks at what you predicted; recall looks at what was really there.`, `كلاهما بسطه TP ويختلف الحد الثاني في المقام: الدقة تنظر لما تنبأت به، والاستدعاء لما كان موجودًا فعلًا.`] },
  check: [`TP = 8, FN = 4. Recall = ?`, `TP = 8 وFN = 4. الاستدعاء = ؟`, [`0.80`, `0.67`, `0.50`, `0.33`], 1, `8 / (8 + 4) = 0.67.`, `8 / 12 = 0.67.`],
  remember: [`P = TP/(TP+FP), R = TP/(TP+FN), F1 = 2PR/(P+R). Spam: 0.80 / 0.67 / 0.73.`, `الصيغ الثلاث ومثال 0.80/0.67/0.73.`],
  teach: [`Explain precision and recall using the spam example and say which error type hurts each.`, `اشرح الدقة والاستدعاء بمثال المزعج وأي خطأ يضر كلًّا منهما.`, `Precision is the fraction of predicted spam that really is spam: TP / (TP + FP) = 8/10 = 0.80, so false alarms (FP) lower it. Recall is the fraction of real spam that the model found: TP / (TP + FN) = 8/12 = 0.67, so missed spam (FN) lowers it. F1 = 2PR / (P + R) ≈ 0.73 balances the two. Accuracy alone can hide these errors when classes are imbalanced.`, `الدقة نسبة ما تنبأ أنه مزعج وهو مزعج فعلًا (0.80) وتخفضها الإنذارات الكاذبة، والاستدعاء نسبة المزعج الحقيقي الذي وُجد (0.67) ويخفضه الفوات، وF1 ≈ 0.73.`]
};

LESSONS.c4s19 = {
  big: [`Two practical habits keep evaluation honest: keep a <b>clean train / dev / test split</b>, and watch for <b>class imbalance</b>, where the model may simply favour the majority class.`, `عادتان عمليتان تحفظان نزاهة التقييم: <b>تقسيم نظيف</b> للبيانات، ومراقبة <b>عدم توازن الفئات</b> حيث قد يفضّل النموذج الفئة الغالبة.`],
  steps: [
    [`<b>Training set:</b> learn parameters. <b>Development set:</b> tune features or hyperparameters. <b>Test set:</b> final evaluation only.`, `<b>التدريب:</b> المعاملات. <b>التطوير:</b> الضبط. <b>الاختبار:</b> التقييم النهائي فقط.`],
    [`<b>Detect imbalance:</b> check label counts before training and after splitting.`, `<b>اكشف عدم التوازن:</b> تحقق من أعداد الوسوم.`],
    [`<b>Evaluate</b> with precision, recall and F1; <b>split</b> with stratified splitting when possible.`, `<b>قيّم</b> بالدقة والاستدعاء وF1، و<b>قسّم</b> تقسيمًا طبقيًّا.`],
    [`<b>Mitigate during training:</b> class weighting or resampling. Resampling changes training data only; <b>never resample the test set</b>.`, `<b>عالج أثناء التدريب:</b> أوزان الفئات أو إعادة المعاينة، و<b>لا تُعِد معاينة الاختبار أبدًا</b>.`]
  ],
  check: [`Which of these must never be resampled?`, `أيها لا تجب إعادة معاينته أبدًا؟`, [`The training set`, `The minority class in training`, `The final test set`, `The majority class in training`], 2, `The test set must reflect real data to give an honest score.`, `يجب أن يعكس الاختبار البيانات الحقيقية.`],
  remember: [`Train / dev / test with no leakage. Imbalance: check counts, use P/R/F1, stratify, weight or resample the training data only.`, `تقسيم بلا تسرب، ومعالجة عدم التوازن على التدريب فقط.`]
};

LESSONS.c5s1 = {
  big: [`Last week's classifiers needed numbers. This lecture answers one question: <b>how does text become a vector that keeps the signal a task needs?</b> Whatever a representation throws away (order, frequency, meaning), the model can never learn from.`, `مصنفات الأسبوع الماضي احتاجت أرقامًا. تجيب هذه المحاضرة عن سؤال واحد: <b>كيف يصبح النص متجهًا يحتفظ بالإشارة التي تحتاجها المهمة؟</b> وما يرميه التمثيل لا يمكن للنموذج تعلّمه.`],
  links: ['c4s7'],
  steps: [
    [`<b>Raw text is symbolic:</b> you cannot multiply words, so they must become numbers.`, `<b>النص رمزي:</b> لا يمكن ضرب الكلمات فيجب تحويلها لأرقام.`],
    [`<b>The representation limits learning:</b> if it drops order, frequency or meaning, so does the model.`, `<b>التمثيل يحدّ التعلّم:</b> ما يُسقطه لا يتعلمه النموذج.`],
    [`<b>Different tasks need different signals:</b> search needs term matching; semantic similarity needs dense embeddings.`, `<b>مهام مختلفة لإشارات مختلفة:</b> البحث يحتاج المطابقة، والتشابه الدلالي يحتاج التضمينات.`],
    [`<b>Pipeline:</b> "I love this movie" → tokens → numeric vector [v₁ … v_d] → model → positive.`, `<b>المسار:</b> نص ← رموز ← متجه ← نموذج ← إيجابي.`]
  ],
  remember: [`Every method here answers: how does text become a vector that keeps the signal the task needs?`, `كل طريقة هنا تجيب: كيف يصبح النص متجهًا يحفظ إشارة المهمة؟`]
};

LESSONS.c5s2 = {
  big: [`Before reading any vector, ask the lecture's <b>reading rule</b>: <i>does this vector represent a word or a document?</i> One-hot, PPMI, Word2Vec and GloVe describe <b>words</b>. Bag-of-Words and TF-IDF describe <b>documents</b>. Cosine is not a representation at all: it only <b>compares</b> vectors.`, `قبل قراءة أي متجه اسأل <b>قاعدة القراءة</b>: <i>هل يمثل كلمة أم مستندًا؟</i> one-hot وPPMI وWord2Vec وGloVe للكلمات، وBoW وTF-IDF للمستندات، وجيب التمام ليس تمثيلًا بل أداة <b>مقارنة</b>.`],
  steps: [
    [`<b>Track A (documents):</b> count each vocabulary term (BoW), then optionally reweight by document frequency (TF-IDF). Ready for classification, retrieval or cosine.`, `<b>المسار A (المستندات):</b> عدّ المصطلحات (BoW) ثم إعادة الوزن (TF-IDF).`],
    [`<b>Track B (words):</b> count nearby context words (co-occurrence), optionally reweight against chance (PPMI): still sparse.`, `<b>المسار B (الكلمات):</b> عدّ كلمات السياق ثم إعادة الوزن (PPMI)، ويبقى متناثرًا.`],
    [`<b>Dense route:</b> Word2Vec learns from local context pairs, GloVe from global co-occurrence counts. No PPMI step is needed before them.`, `<b>المسار الكثيف:</b> Word2Vec من أزواج محلية وGloVe من أعداد شاملة، دون الحاجة إلى PPMI.`],
    [`<b>Limits shared by all of them:</b> none encodes word order by itself, and static embeddings give one fixed vector per word type.`, `<b>قيود مشتركة:</b> لا يرمّز أي منها الترتيب، والتضمينات الثابتة متجه واحد لكل كلمة.`]
  ],
  confuse: { a: [`Representation`, `Builds a vector: one-hot, BoW, TF-IDF, PPMI, Word2Vec, GloVe.`, `يبني متجهًا.`], b: [`Cosine similarity`, `<b>Compares</b> two already-built vectors (word with word, document with document).`, `<b>يقارن</b> متجهين مبنيين.`], why: [`Cosine appears next to the representations, so it is often listed as one. It is a measuring tool, not a way to represent text.`, `يظهر جيب التمام بجانب التمثيلات فيُعدّ منها خطأً، وهو أداة قياس.`] },
  check: [`TF-IDF vectors represent:`, `متجهات TF-IDF تمثل:`, [`Words`, `Documents`, `Context windows`, `Similarity scores`], 1, `TF-IDF reweights Bag-of-Words counts for a whole document.`, `TF-IDF يعيد وزن أعداد مستند كامل.`],
  remember: [`Ask first: word or document? Word: one-hot, PPMI, Word2Vec, GloVe. Document: BoW, TF-IDF. Cosine compares; it is not a representation.`, `اسأل أولًا: كلمة أم مستند؟ وجيب التمام للمقارنة فقط.`]
};

LESSONS.c5s3 = {
  big: [`Every sparse vector depends on a <b>fixed vocabulary with a fixed order</b>. Position 1 must mean the same word in every vector, and the vocabulary size sets the length of every vector.`, `كل متجه متناثر يعتمد على <b>مفردات ثابتة بترتيب ثابت</b>: الموضع 1 يعني الكلمة نفسها في كل متجه، وحجم المفردات يحدد طول كل متجه.`],
  think: [`What does the vector [2, 1, 0, 1, 0] mean on its own?`, `ماذا يعني المتجه [2, 1, 0, 1, 0] وحده؟`, `Nothing. It only means something together with the vocabulary that produced it. With [good, movie, boring, plot, bad] it means "good ×2, movie ×1, plot ×1".`, `لا شيء؛ له معنى فقط مع المفردات التي أنتجته، ومع [good, movie, boring, plot, bad] يعني good مرتين وmovie وplot مرة.`],
  remember: [`Fixed vocabulary + fixed order → fixed length. Document length never changes vector length; out-of-vocabulary words are lost.`, `مفردات وترتيب ثابتان ← طول ثابت، والكلمات خارجها تضيع.`]
};

LESSONS.c5s4 = {
  big: [`<b>One-hot encoding</b> gives each word its own slot: a vector of length |V| with a single 1 at that word's position and 0 everywhere else. It says <i>which</i> word it is, and nothing about what it means.`, `<b>one-hot</b> يعطي كل كلمة خانة خاصة: متجه طوله |V| فيه 1 واحد في موضع الكلمة و0 في الباقي. يقول <i>أي</i> كلمة هي ولا شيء عن معناها.`],
  steps: [
    [`Vocabulary [cat, dog, movie]: cat = [1,0,0], dog = [0,1,0], movie = [0,0,1].`, `cat = [1,0,0] وdog = [0,1,0] وmovie = [0,0,1].`],
    [`<b>Strength:</b> simple and unambiguous; works as an internal index (a token ID selects a row of an embedding matrix, Week 6).`, `<b>الميزة:</b> بسيط وواضح ويعمل كفهرس داخلي.`],
    [`<b>Weakness 1:</b> very high dimensional: 50,000 words → 50,000 dimensions.`, `<b>العيب 1:</b> أبعاد كثيرة جدًّا.`],
    [`<b>Weakness 2:</b> no similarity. Every dot product between different words is 0, so cat is exactly as unrelated to dog as to movie.`, `<b>العيب 2:</b> لا تشابه: حاصل الضرب بين أي كلمتين = 0.`]
  ],
  analogy: [`Like giving every student a locker number: the number identifies the student perfectly, but lockers 12 and 13 tell you nothing about whether those students are friends.`, `مثل رقم خزانة لكل طالب: يحدد الطالب بدقة، لكن الخزانتين 12 و13 لا تخبرانك إن كان الطالبان صديقين.`],
  check: [`Why can't one-hot vectors show that cat and dog are related?`, `لماذا لا تُظهر متجهات one-hot أن cat وdog مترابطتان؟`, [`They are too short`, `All different words are orthogonal (dot product 0)`, `They contain negative numbers`, `They depend on document length`], 1, `Every pair of different one-hot vectors has dot product 0.`, `كل متجهين مختلفين حاصل ضربهما 0.`],
  remember: [`One-hot = identity only; |V| dimensions; all words equally unrelated.`, `one-hot = هوية فقط، وكل الكلمات غير مترابطة بالتساوي.`]
};

LESSONS.c5s5 = {
  big: [`A <b>Bag-of-Words</b> vector describes a document by how often each vocabulary word appears in it. It is literally the <b>sum of the one-hot vectors</b> of its words. Imagine pouring the words into a bag and counting them: the order falls out.`, `متجه <b>حقيبة الكلمات</b> يصف المستند بعدد مرات ظهور كل كلمة فيه، وهو حرفيًّا <b>مجموع متجهات one-hot</b> لكلماته. تخيّل سكب الكلمات في كيس وعدّها: يضيع الترتيب.`],
  links: ['c5s4'],
  action: { w: 'bow', cfg: { a: 'dog bites man', b: 'man bites dog' }, cap: [`Slide 13's example. Both sentences get the same vector. Then try "good plot good movie" to see a count of 2.`, `مثال الشريحة 13: الجملتان بالمتجه نفسه. جرّب "good plot good movie" لترى العدد 2.`] },
  steps: [
    [`"good plot good movie" = good + plot + good + movie = <b>[2, 1, 0, 1, 0]</b> over [good, movie, boring, plot, bad].`, `"good plot good movie" ← [2, 1, 0, 1, 0].`],
    [`<b>Keeps:</b> which terms occur and how often. Fast; works well with linear classifiers and retrieval baselines.`, `<b>يحفظ:</b> المصطلحات وتكرارها، وهو سريع.`],
    [`<b>Loses:</b> word order and syntax, long-distance context, similarity between different words, and word senses (bank: money or river).`, `<b>يفقد:</b> الترتيب والنحو والسياق البعيد والتشابه ومعاني الكلمة.`]
  ],
  check: [`BoW vector of "good plot good movie" over [good, movie, boring, plot, bad]:`, `متجه BoW لـ "good plot good movie":`, [`[1, 1, 0, 1, 0]`, `[2, 1, 0, 1, 0]`, `[2, 0, 0, 1, 1]`, `[1, 2, 0, 1, 0]`], 1, `good appears twice, movie once, plot once.`, `good مرتين وmovie وplot مرة.`],
  remember: [`BoW = sum of one-hots = counts; keeps terms and frequency, loses order ("dog bites man" = "man bites dog").`, `BoW = مجموع one-hot، يحفظ التكرار ويفقد الترتيب.`]
};

LESSONS.c5s6 = {
  big: [`Raw counts treat every word the same. "the" appears in every document, so it dominates the vectors while telling them apart not at all. We want to keep a word's count <i>inside</i> a document but lower its weight if it is <b>spread across the whole collection</b>. That is the idea behind TF-IDF.`, `الأعداد الخام تعامل كل الكلمات بالتساوي، فتسيطر the الموجودة في كل المستندات دون أن تميّز بينها. نريد الاحتفاظ بالعدد <i>داخل</i> المستند مع خفض الوزن إذا كانت الكلمة <b>منتشرة في المجموعة كلها</b>.`],
  remember: [`Common-everywhere words separate nothing → keep the count, lower the weight of widespread words.`, `الكلمات الشائعة في كل مكان لا تميّز ← نخفض وزنها.`]
};

LESSONS.c5s7 = {
  big: [`TF-IDF has two ingredients. <b>TF</b> (term frequency) asks "how much does this document use the word?" on a log scale. <b>DF</b> (document frequency) asks "in how many documents does the word appear at all?"`, `لـ TF-IDF مكونان: <b>TF</b> يسأل "كم يستخدم هذا المستند الكلمة؟" على مقياس لوغاريتمي، و<b>DF</b> يسأل "في كم مستندًا تظهر الكلمة أصلًا؟"`],
  steps: [
    [`<b>TF(t, d) = 1 + log₁₀ count(t, d)</b> if the count is above 0, otherwise 0 (log of 0 is undefined).`, `<b>TF = 1 + log₁₀ العدد</b> إذا كان أكبر من 0 وإلا 0.`],
    [`Counts 1, 10, 100, 1,000 → TF 1, 2, 3, 4. A word used 100 times matters more than once, but not 100 times more.`, `الأعداد 1، 10، 100، 1000 ← 1، 2، 3، 4.`],
    [`<b>DF(t)</b> = the number of documents containing t at least once.`, `<b>DF</b> = عدد المستندات التي تحتوي المصطلح مرة على الأقل.`],
    [`D1 "cat cat cat", D2 "cat dog", D3 "dog": TF(cat, D1) = 1 + log₁₀3 ≈ 1.48; DF(cat) = <b>2</b>, not 3 + 1 + 0 = 4.`, `TF(cat, D1) ≈ 1.48 وDF(cat) = 2 وليس 4.`]
  ],
  confuse: { a: [`TF`, `Measured <b>inside one document</b>, from the raw count, log-scaled.`, `يُقاس <b>داخل مستند واحد</b>.`], b: [`DF`, `Measured <b>over the collection</b>: counts documents, not occurrences.`, `يُقاس <b>على المجموعة</b> ويعدّ المستندات لا مرات الظهور.`], why: [`The most common mistake is adding up occurrences for DF. DF(cat) is 2 because cat is in two documents, however many times it appears in each.`, `الخطأ الأشهر جمع مرات الظهور في DF؛ DF(cat) = 2 لأنها في مستندين.`] },
  check: [`TF for a word that appears 100 times in a document:`, `TF لكلمة تظهر 100 مرة:`, [`100`, `3`, `2`, `1`], 1, `1 + log₁₀100 = 1 + 2 = 3.`, `1 + 2 = 3.`],
  remember: [`TF = 1 + log₁₀ count (0 if absent), inside a document. DF = number of documents containing the term.`, `TF داخل المستند، وDF عدد المستندات.`]
};

LESSONS.c5s8 = {
  big: [`<b>IDF</b> turns document frequency into a weight: rare words get high weight, words in every document get zero. Multiply by TF and you get <b>TF-IDF</b>: high only when a word is frequent <i>here</i> and rare <i>elsewhere</i>.`, `<b>IDF</b> يحوّل DF إلى وزن: النادرة وزنها عالٍ والموجودة في كل المستندات صفر. وبضربه في TF نحصل على <b>TF-IDF</b>: عالٍ فقط عندما تكون الكلمة متكررة <i>هنا</i> ونادرة <i>في غيره</i>.`],
  links: ['c5s7'],
  steps: [
    [`<b>IDF(t) = log₁₀(N / DF(t))</b>, where N is the number of documents.`, `<b>IDF = log₁₀(N / DF)</b>.`],
    [`With N = 4: DF 1 → log₁₀4 = 0.60 (rare); DF 2 → 0.30; DF 4 → log₁₀1 = <b>0</b> (in every document, no weight).`, `مع N = 4: DF 1 ← 0.60، DF 2 ← 0.30، DF 4 ← 0.`],
    [`<b>TF-IDF(t, d) = TF(t, d) × IDF(t).</b> Both factors are log-damped; raw counts are never used directly.`, `<b>TF-IDF = TF × IDF</b>.`],
    [`Used for search, document classification, clustering and keyword-retrieval baselines.`, `يُستخدم في البحث والتصنيف والتجميع.`]
  ],
  analogy: [`In a class where everyone wears glasses, "wears glasses" is useless for describing one student; "plays the oud" describes one student well. IDF is how rare the trait is; TF is how strongly this student shows it.`, `في فصل كل طلابه يرتدون نظارات، "يرتدي نظارة" لا يصف طالبًا بعينه، أما "يعزف العود" فيصفه جيدًا. IDF ندرة الصفة وTF مدى ظهورها عند الطالب.`],
  check: [`A term appears in all 4 of 4 documents. Its TF-IDF in any document is:`, `مصطلح في كل المستندات الأربعة. وزن TF-IDF له:`, [`0`, `0.30`, `0.60`, `Its count`], 0, `IDF = log₁₀(4/4) = 0, so TF × 0 = 0.`, `IDF = 0 فالوزن 0.`],
  remember: [`IDF = log₁₀(N/DF); TF-IDF = TF × IDF; a term in every document → 0.`, `IDF = log₁₀(N/DF) وTF-IDF = TF × IDF.`]
};

LESSONS.c5s9 = {
  big: [`Now compute a whole collection. The demo uses slide 20's four documents. Check its numbers against the lecture: cats IDF 0.12; chase, mice, eat 0.30; birds, fish, cheese 0.60.`, `لنحسب مجموعة كاملة: العرض يستخدم مستندات الشريحة 20 الأربعة. قارن أرقامه بالمحاضرة.`],
  links: ['c5s8'],
  action: { w: 'tfidf', cfg: { docs: 'cats chase mice\ncats chase birds\ncats eat fish\nmice eat cheese' }, cap: [`Edit the documents (add a word everywhere, repeat a word) and watch DF, IDF and TF-IDF update.`, `عدّل المستندات وراقب تحديث القيم.`] },
